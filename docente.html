<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 96%;
    max-width: 1400px;
    margin: 25px auto;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    color: #1557a6;
    margin-top: 0;
}

h3 {
    margin-top: 0;
}

.usuario {
    color: #666;
    margin-bottom: 25px;
}


/* =====================================================
   FILTROS
===================================================== */

.filtros {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtro {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.info {
    margin-top: 15px;
    padding: 12px;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
}


/* =====================================================
   MODAL NUEVA ACTIVIDAD
===================================================== */

.modal-fondo {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 9999;
}

.modal-fondo.oculto {
    display: none !important;
}

.modal-actividad {
    width: 100%;
    max-width: 560px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,.30);
    overflow: hidden;
    animation: aparecerModal .18s ease-out;
}

@keyframes aparecerModal {

    from {
        opacity: 0;
        transform: scale(.94);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

.modal-cabecera {
    background: #1557a6;
    color: white;
    padding: 15px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-cabecera h3 {
    margin: 0;
    font-size: 18px;
}

.boton-cerrar-modal {
    width: 34px;
    height: 34px;
    padding: 0;
    background: rgba(255,255,255,.18);
    color: white;
    font-size: 23px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
}

.boton-cerrar-modal:hover {
    background: rgba(255,255,255,.30);
}

.modal-cuerpo {
    padding: 20px;
}

.modal-cuerpo .campo {
    margin-bottom: 17px;
}

.modal-cuerpo label {
    margin-bottom: 7px;
}


/* =====================================================
   CATEGORÍAS RADIO
===================================================== */

.categorias-radio {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 15px;
    margin-top: 10px;
}

.radio-categoria {
    position: relative;
    flex: 1;
    max-width: 110px;
}

.radio-categoria input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.radio-categoria label {
    width: 100%;
    margin: 0;
    cursor: pointer;
    text-align: center;
}

.icono-categoria {
    width: 58px;
    height: 58px;
    margin: 0 auto;
    border-radius: 50%;
    background: #e8e8e8;
    color: #777;
    opacity: .55;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    transition: all .2s ease;
    border: 3px solid transparent;
}

.nombre-categoria {
    display: none;
    margin-top: 7px;
    font-weight: bold;
    font-size: 14px;
}


/* SER */

.radio-categoria.ser input:checked + label .icono-categoria {
    background: #7b1fa2;
    color: white;
    opacity: 1;
    border-color: #4a1262;
    transform: scale(1.08);
}


/* SABER */

.radio-categoria.saber input:checked + label .icono-categoria {
    background: #1565c0;
    color: white;
    opacity: 1;
    border-color: #0d3f78;
    transform: scale(1.08);
}


/* HACER */

.radio-categoria.hacer input:checked + label .icono-categoria {
    background: #ef6c00;
    color: white;
    opacity: 1;
    border-color: #a94800;
    transform: scale(1.08);
}


/* AUTO */

.radio-categoria.auto input:checked + label .icono-categoria {
    background: #00838f;
    color: white;
    opacity: 1;
    border-color: #00545b;
    transform: scale(1.08);
}


.radio-categoria input:checked + label .nombre-categoria {
    display: block;
}


/* =====================================================
   BOTONES DEL MODAL
===================================================== */

.modal-acciones {
    display: flex;
    flex-direction: row;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
}

.modal-acciones button {
    flex: 0 0 auto;
    width: auto;
    min-width: 120px;
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 15px;
}

.boton-cancelar {
    background: #777;
    color: white;
}

.boton-crear-modal {
    background: #16803c;
    color: white;
}


/* =====================================================
   CATEGORÍAS ACTIVIDADES
===================================================== */

.categoria {
    margin-top: 25px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-categoria {
    color: white;
    padding: 13px 15px;
    font-size: 17px;
    font-weight: bold;
}

.ser {
    background: #7b1fa2;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00838f;
}


/* =====================================================
   ACTIVIDAD
===================================================== */

.actividad {
    margin: 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
}


/* =====================================================
   ENCABEZADO ACTIVIDAD
===================================================== */

.encabezado-actividad {
    background: #f4f6f8;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.izquierda-actividad {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
}

.derecha-actividad {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.nombre-actividad {
    font-weight: bold;
    font-size: 16px;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
}

.puntaje-actividad {
    font-weight: normal;
    color: #555;
    font-size: 14px;
}


/* =====================================================
   BOTONES ACTIVIDAD
===================================================== */

.boton-ocultar,
.boton-editar,
.boton-bloquear,
.boton-eliminar {

    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.boton-editar {
    background: #1565c0;
}

.boton-eliminar {
    background: #c62828;
}

.boton-ocultar {
    background: #555;
}

.boton-bloquear {
    background: #ef6c00;
}


/* =====================================================
   CONTENIDO
===================================================== */

.contenido-actividad {
    padding: 0;
}


/* =====================================================
   TABLAS
===================================================== */

.tabla-contenedor {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
}

th,
td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: #f0f0f0;
}

td.nombre {
    text-align: left;
    white-space: normal;
    overflow-wrap: break-word;
    word-break: normal;

    width: 330px;
    min-width:330px;
    max-width: 330px;

    line-height: 1.2;
    vertical-align: middle;
}

th:first-child,
td:first-child {
    width: 45px;
    min-width: 45px;
}


/* =====================================================
   INPUT NOTAS
===================================================== */

.nota-input {
    width: 65px;
    max-width: 100%;
    text-align: center;
    padding: 7px;
    transition: .2s;
}

.nota-input:disabled {
    background: #eeeeee;
    color: #555;
    cursor: not-allowed;
    border-color: #ddd;
}

.nota-input.editable {
    background: #fffde7;
    border: 2px solid #ef6c00;
}


/* =====================================================
   TABLA GENERAL
===================================================== */

.tabla-general {
    margin-top: 30px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-general {
    background: #1557a6;
    color: white;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: bold;
}

.acciones-general {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
}

.boton-nueva-actividad {
    background: rgba(255,255,255,.20);
    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    border: none;
    border-radius: 7px;
    font-size: 21px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.boton-general {
    background: rgba(255,255,255,.20);
    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    border: none;
    border-radius: 7px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}


/* =====================================================
   ASISTENCIA
===================================================== */

.panel-asistencia {
    margin-top: 25px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-asistencia {
    background: #37474f;
    color: white;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 17px;
    font-weight: bold;
}

.acciones-asistencia {
    display: flex;
    align-items: center;
    gap: 7px;
}

.lista-fechas-asistencia {
    width: 145px;
    padding: 7px 8px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    background: white;
    color: #222;
    cursor: pointer;
}

.fecha-asistencia {
    width: 145px;
    padding: 7px 8px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    background: white;
    color: #222;
}

.boton-eliminar-fecha-asistencia {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 7px;
    background: #c62828;
    color: white;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.boton-eliminar-fecha-asistencia:hover {
    background: #a91f1f;
}


/* BOTÓN GUARDAR ASISTENCIA */

.boton-guardar-asistencia {
    border: none;
    border-radius: 7px;
    background: #16803c;
    color: white;
    height: 34px;
    padding: 0 13px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
}

.boton-guardar-asistencia:hover {
    background: #11652f;
}


/* BOTÓN + */

.boton-asistencia {
    width: 38px;
    height: 34px;
    border: none;
    border-radius: 7px;
    background: rgba(255,255,255,.18);
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.boton-asistencia:hover {
    background: rgba(255,255,255,.30);
}


/* CONTENIDO */

.contenido-asistencia {
    background: white;
}

.contenido-asistencia.oculto {
    display: none;
}


/* TABLA ASISTENCIA */

.tabla-asistencia {
    width: 100%;
}

.tabla-asistencia th {
    background: #f0f2f3;
    font-size: 13px;
}

.tabla-asistencia td {
    padding: 7px 5px;
}


/* =====================================================
   BOTONES DE ESTADO DE ASISTENCIA
===================================================== */

.estados-asistencia {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
}

.radio-asistencia {
    position: relative;
}

.radio-asistencia input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.boton-estado {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    opacity: .28;
    filter: grayscale(100%);
    transition: all .18s ease;
    border: 2px solid transparent;
}


/* ASISTENCIA */

.estado-asistio {
    background: #2e7d32;
    color: white;
}


/* ATRASO */

.estado-atraso {
    background: #f9a825;
    color: white;
}


/* LICENCIA */

.estado-licencia {
    background: #1565c0;
    color: white;
}


/* FALTA */

.estado-falta {
    background: #c62828;
    color: white;
}


/* SELECCIONADO */

.radio-asistencia input:checked + label .boton-estado {
    opacity: 1;
    filter: grayscale(0);
    transform: scale(1.08);
    border-color: #222;
    box-shadow: 0 2px 7px rgba(0,0,0,.25);
}


/* =====================================================
   OBSERVACIÓN
===================================================== */

.observacion-asistencia {
    width: 100%;
    min-width: 150px;
    padding: 7px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 13px;
}


/* =====================================================
   NOTAS FINALES
===================================================== */

.nota-3t,
.nota-final {
    font-weight: bold;
    font-size: 18px;
}


/* =====================================================
   BOTONES INFERIORES
===================================================== */

.botones {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.botones button {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 15px;
}

.guardar {
    background: #16803c;
    color: white;
}

.exportar {
    background: #1565c0;
    color: white;
}

.salir {
    background: #c62828;
    color: white;
}


/* =====================================================
   MENSAJES
===================================================== */

.mensaje {
    margin-top: 15px;
    font-weight: bold;
}

.oculto {
    display: none !important;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 800px) {

    .panel {
        padding: 15px;
    }

    .encabezado-actividad {
        align-items: stretch;
    }

    .izquierda-actividad {
        flex: 1;
        min-width: 0;
    }

    .derecha-actividad {
        margin-left: auto;
    }

    .nombre-actividad {
        font-size: 15px;
    }

}


/* =====================================================
   CELULARES
===================================================== */

@media (max-width: 600px) {

.titulo-asistencia {
    flex-wrap: wrap;
    align-items: flex-start;
}

.acciones-asistencia {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 7px;
    align-items: center;
}

.lista-fechas-asistencia {
    grid-column: 1 / -1;
    grid-row: 1;
    width: 100%;
}

.fecha-asistencia {
    grid-column: 1;
    grid-row: 2;
    width: 100%;
    min-width: 0;
}

.boton-eliminar-fecha-asistencia {
    grid-column: 2;
    grid-row: 2;
}

.boton-guardar-asistencia {
    grid-column: 3;
    grid-row: 2;
    padding: 0 9px;
    font-size: 13px;
}

.boton-asistencia {
    grid-column: 1 / -1;
    grid-row: 3;
    width: 100%;
}

    .contenedor {
        width: 100%;
        margin: 10px auto;
    }

    .panel {
        padding: 10px;
        border-radius: 10px;
    }

    h1 {
        font-size: 24px;
    }

    .encabezado-actividad {
        flex-wrap: wrap;
    }

    .izquierda-actividad {
        width: 100%;
    }

    .derecha-actividad {
        width: 100%;
        justify-content: flex-end;
    }

    .modal-actividad {
        max-width: 100%;
    }

    .modal-cuerpo {
        padding: 16px;
    }

    .categorias-radio {
        gap: 8px;
    }

    .icono-categoria {
        width: 52px;
        height: 52px;
        font-size: 24px;
    }

    .nombre-categoria {
        font-size: 12px;
    }

    .tabla-contenedor {
        width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 600px;
        table-layout: auto;
    }

    td.nombre {
        text-align: left;
        white-space: normal;
        overflow-wrap: break-word;
        word-break: normal;

        width: 130px;
        min-width: 130px;
        max-width: 130px;

        line-height: 1.2;
        vertical-align: middle;

        display: table-cell;
        overflow: visible;
    }

    .nota-input {
        width: 58px;
        max-width: 100%;
        padding: 6px 2px;
        font-size: 14px;
    }

    .titulo-asistencia {
        flex-wrap: wrap;
    }

    .acciones-asistencia {
        width: 100%;
        justify-content: flex-end;
    }

    .fecha-asistencia {
        width: 135px;
    }

    .boton-guardar-asistencia {
        padding: 0 9px;
        font-size: 13px;
    }

    .estados-asistencia {
        gap: 3px;
    }

    .boton-estado {
        width: 27px;
        height: 27px;
        font-size: 14px;
    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media (max-width: 400px) {

    .panel {
        padding: 8px;
    }

    .actividad {
        margin: 10px;
    }

    .categorias-radio {
        gap: 4px;
    }

    .icono-categoria {
        width: 46px;
        height: 46px;
        font-size: 21px;
    }

    .nombre-categoria {
        font-size: 11px;
    }

    .boton-estado {
        width: 25px;
        height: 25px;
        font-size: 13px;
    }

    .fecha-asistencia {
        width: 120px;
    }

}


/* =====================================================
   EVITAR DESBORDAMIENTO
===================================================== */

th,
td,
.nombre-actividad,
.titulo-categoria,
.titulo-general {
    overflow-wrap: normal;
}


/* =====================================================
   AJUSTE SOLO TABLAS DE ACTIVIDADES
   Nº | Nombre | Nota
===================================================== */

#contenedorActividades table {
    width: 100%;
    table-layout: fixed;
}

#contenedorActividades table th:first-child,
#contenedorActividades table td:first-child {
    width: 45px;
    min-width: 45px;
    max-width: 45px;
    white-space: nowrap;
}

#contenedorActividades table th:nth-child(2),
#contenedorActividades table td:nth-child(2) {
    width: 130px;
    min-width: 130px;
    max-width: 130px;
}

/* =====================================================
   CORRECCIÓN: NOMBRE EN MÁXIMO 2 LÍNEAS
===================================================== */

#contenedorActividades table td.nombre {
    text-align: left;
    width: 130px;
    min-width: 130px;
    max-width: 130px;
    padding: 6px 8px;
    vertical-align: middle;
}

#contenedorActividades table td.nombre .nombre-dos-lineas {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: normal;
    overflow-wrap: anywhere;
    line-height: 1.2;
    max-height: 2.4em;
}


/* =====================================================
   COLUMNA NOTA
===================================================== */

#contenedorActividades table th:nth-child(3),
#contenedorActividades table td:nth-child(3) {
    width: 85px;
    min-width: 85px;
    max-width: 85px;
    white-space: nowrap;
}

#contenedorActividades table .nota-input {
    width: 58px;
    max-width: 58px;
}

</style>

</head>


<body>

<div class="contenedor">

<div class="panel">

<h1>Panel Docente</h1>

<div class="usuario">
Usuario: <span id="usuario"></span>
</div>


<!-- =====================================================
     FILTROS
===================================================== -->

<div class="filtros">

<div class="filtro">

<label>Curso</label>

<select id="buscarCurso">

<option value="">
Selecciona un curso
</option>

</select>

</div>


<div class="filtro">

<label>Buscar estudiante</label>

<input
    type="text"
    id="buscarNombre"
    placeholder="Buscar por nombre o Nº de lista..."
>

</div>

</div>


<!-- =====================================================
     ACTIVIDADES
===================================================== -->

<div id="contenedorActividades">
</div>


<!-- =====================================================
     TABLA GENERAL
===================================================== -->

/* =====================================================

function cargarCursos() {

    const select =

        "buscarCurso"

    const valorAnterior =
    select.value;


    select.innerHTML = `

        <option value="">
            Selecciona un curso
        </option>

    `;


    const cursos =
    [...new Set(

        estudiantes
        .map(e => e.curso)
        .filter(Boolean)

    )].sort();


    cursos.forEach(
    curso => {

        const opcion =
        document.createElement(
            "option"
        );


        opcion.value =
        curso;


        opcion.textContent =
        curso;


        select.appendChild(
            opcion
        );

    });

        valorAnterior &&
        cursos.includes(
            valorAnterior

    }

/* =====================================================
   FECHAS DE ASISTENCIA DEL CURSO
===================================================== */

async function cargarFechasAsistencia() {

    const select =
    document.getElementById(
        "listaFechasAsistencia"
    );

    if (!select) {
        return;
    }

    select.innerHTML = `
        <option value="">Fechas guardadas</option>
    `;

    if (!cursoSeleccionado) {
        return;
    }

    const estudiantesCurso =
    estudiantes.filter(
        e => e.curso === cursoSeleccionado
    );

    const ids = estudiantesCurso.map(
        e => e.id
    );

    if (ids.length === 0) {
        return;
    }

    const {
        data,
        error
    } =
    await supabaseClient
    .from("asistencia")
    .select("fecha")
    .in("estudiante_id", ids)
    .order("fecha", { ascending: false });

    if (error) {
        console.error(error);
        alert(
            "Error al cargar las fechas de asistencia: " +
            error.message,
            true
        );
        return;
    }

    const fechas = [...new Set(
        (data || []).map(r => r.fecha).filter(Boolean)
    )];

    fechas.forEach(fecha => {
        const opcion =
        document.createElement("option");

        opcion.value = fecha;
        opcion.textContent = fecha;
        select.appendChild(opcion);
    });

}

function seleccionarFechaAsistencia() {

    const select =
    document.getElementById(
        "listaFechasAsistencia"
    );

    const fecha =
    document.getElementById(
        "fechaAsistencia"
    );

    if (!select.value) {
        return;
    }

    fecha.value = select.value;
    cargarAsistencia();

}

async function eliminarFechaAsistencia() {

    if (!cursoSeleccionado) {
        alert("Primero selecciona un curso.");
        return;
    }

    const fecha =
    document.getElementById(
        "fechaAsistencia"
    ).value;

    if (!fecha) {
        alert("Selecciona una fecha de asistencia.");
        return;
    }

    const confirmar = confirm(
        `¿Deseas eliminar toda la asistencia del curso "${cursoSeleccionado}" correspondiente al ${fecha}?\n\nEsta acción eliminará los registros de todos los estudiantes de esa fecha.`
    );

    if (!confirmar) {
        return;
    }

    const estudiantesCurso =
    estudiantes.filter(
        e => e.curso === cursoSeleccionado
    );

    const ids = estudiantesCurso.map(
        e => e.id
    );

    if (ids.length === 0) {
        return;
    }

    mostrarMensaje("Eliminando asistencia...");

    const { error } =
    await supabaseClient
    .from("asistencia")
    .delete()
    .eq("fecha", fecha)
    .in("estudiante_id", ids);

    if (error) {
        console.error(error);
        alert(
            "Error al eliminar asistencia: " +
            error.message,
            true
        );
        return;
    }

    establecerFechaActual();
    await cargarFechasAsistencia();
    await cargarAsistencia();

    alert(
        "✓ Asistencia de la fecha eliminada correctamente."
    );

}

/* =====================================================
   CARGAR ASISTENCIA
===================================================== */

async function cargarAsistencia() {

    registrosAsistencia = {};


    if (!cursoSeleccionado) {

        return;

    }


    const fecha =
    document.getElementById(
        "fechaAsistencia"
    ).value;


    if (!fecha) {

        return;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    const ids =
    estudiantesCurso.map(
        e => e.id
    );


    if (
        ids.length === 0
    ) {

        mostrarTablaAsistencia();

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("asistencia")
    .select(
        "id,estudiante_id,fecha,estado,observacion"
    )
    .eq(
        "fecha",
        fecha
    )
    .in(
        "estudiante_id",
        ids
    );


    if (error) {

        console.error(error);

        alert(
            "Error al cargar asistencia: " +
            error.message,
            true
        );

        mostrarTablaAsistencia();

        return;

    }


    (data || []).forEach(
    registro => {

        registrosAsistencia[
            registro.estudiante_id
        ] = {

            estado:
            registro.estado,

            observacion:
            registro.observacion || ""

        };

    });


    mostrarTablaAsistencia();

}

/* =====================================================
   GUARDAR ASISTENCIA
===================================================== */

async function guardarAsistencia() {

    if (!cursoSeleccionado) {

        alert(
            "Primero selecciona un curso."
        );

        return false;

    }


    const fecha =
    document.getElementById(
        "fechaAsistencia"
    ).value;


    if (!fecha) {

        alert(
            "Selecciona una fecha."
        );

        return false;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    if (
        estudiantesCurso.length === 0
    ) {

        alert(
            "No existen estudiantes en este curso."
        );

        return false;

    }


    mostrarMensaje(
        "Guardando asistencia..."
    );


    const registros = [];


    estudiantesCurso.forEach(
    estudiante => {

        const seleccionado =
        document.querySelector(
            `input[name="asistencia-${estudiante.id}"]:checked`
        );


        const observacion =
        document.querySelector(
            `.observacion-asistencia[data-estudiante="${estudiante.id}"]`
        );


        let estado =
        null;


        if (seleccionado) {

            estado =
            seleccionado.value;

        }


        registros.push({

            estudiante_id:
            estudiante.id,

            fecha:
            fecha,

            estado:
            estado || "asistio",

            observacion:
            observacion
            ? observacion.value.trim()
            : null

        });

    });


    const {
        error
    } =
    await supabaseClient
    .from("asistencia")
    .upsert(
        registros,
        {
            onConflict:
            "estudiante_id,fecha"
        }
    );


    if (error) {

        console.error(error);

        alert(
            "Error al guardar asistencia: " +
            error.message,
            true
        );

        return false;

    }


    alert(
        "✓ Asistencia guardada correctamente."
    );


    await cargarFechasAsistencia();
    document.getElementById("listaFechasAsistencia").value = fecha;


    await cargarAsistencia();


    return true;

}

/* =====================================================
   CARGAR ACTIVIDADES
===================================================== */

async function cargarActividades() {

    const {
        data,
        error
    } =
    await supabaseClient
    .from("actividades")
    .select(
        "id,curso,trimestre,categoria,nombre,fecha,orden,puntaje_maximo"
    )
    .eq(
        "curso",
        cursoSeleccionado
    )
    .eq(
        "trimestre",
        3
    )
    .order(
        "orden"
    );


    if (error) {

        console.error(error);

        alert(
            "Error al cargar actividades: " +
            error.message,
            true
        );

        return;

    }


    actividades =
    data || [];


    await cargarCalificaciones();


    mostrarActividades();

}


/* =====================================================
   CARGAR CALIFICACIONES
===================================================== */

async function cargarCalificaciones() {

    calificaciones = {};


    if (
        actividades.length === 0
    ) {

        return;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    const idsEstudiantes =
    estudiantesCurso.map(
        e => e.id
    );


    const idsActividades =
    actividades.map(
        a => a.id
    );


    if (
        idsEstudiantes.length === 0 ||
        idsActividades.length === 0
    ) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("calificaciones")
    .select(
        "id,actividad_id,estudiante_id,nota"
    )
    .in(
        "actividad_id",
        idsActividades
    )
    .in(
        "estudiante_id",
        idsEstudiantes
    );


    if (error) {

        console.error(error);

        alert(
            "Error al cargar calificaciones: " +
            error.message,
            true
        );

        return;

    }


    (data || []).forEach(
    cal => {

        if (
            !calificaciones[
                cal.estudiante_id
            ]
        ) {

            calificaciones[
                cal.estudiante_id
            ] = {};

        }


        calificaciones[
            cal.estudiante_id
        ][
            cal.actividad_id
        ] =
        cal.nota;

    });

}

/* =====================================================
   FORMATEAR FECHA DE ACTIVIDAD
===================================================== */

function formatearFechaActividad(fecha) {

    if (!fecha) {

        return "Fecha no registrada";

    }


    const partes =
    String(fecha).split("-");


    if (partes.length === 3) {

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return fecha;

}

/* =====================================================
   EDITAR NOMBRE Y FECHA
===================================================== */

async function editarNombreActividad(
    actividad
) {

    const nuevoNombre =
    prompt(
        "Escribe el nuevo nombre de la actividad:",
        actividad.nombre
    );


    if (
        nuevoNombre === null
    ) {

        return;

    }


    const nombre =
    nuevoNombre.trim();


    if (!nombre) {

        alert(
            "El nombre no puede estar vacío."
        );

        return;

    }


    const fechaActual =
    actividad.fecha || "";


    const nuevaFecha =
    prompt(
        "Escribe la nueva fecha de la actividad (AAAA-MM-DD):",
        fechaActual
    );


    if (
        nuevaFecha === null
    ) {

        return;

    }


    const fecha =
    nuevaFecha.trim();


    if (!fecha) {

        alert(
            "La fecha no puede estar vacía."
        );

        return;

    }


    /* =================================================
       VALIDAR FORMATO
    ================================================= */

    const fechaValida =
    /^\d{4}-\d{2}-\d{2}$/.test(
        fecha
    );


    if (!fechaValida) {

        alert(
            "La fecha debe tener el formato AAAA-MM-DD.\n\nEjemplo: 28/08/2026 se escribe como 2026-08-28."
        );

        return;

    }


    if (
        nombre === actividad.nombre &&
        fecha === fechaActual
    ) {

        return;

    }


    mostrarMensaje(
        "Actualizando actividad..."
    );


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .update({

        nombre:
        nombre,

        fecha:
        fecha

    })
    .eq(
        "id",
        actividad.id
    );


    if (error) {

        console.error(error);

        alert(
            "Error al actualizar la actividad: " +
            error.message,
            true
        );

        return;

    }


    actividad.nombre =
    nombre;


    actividad.fecha =
    fecha;


    /* =================================================
       ACTUALIZAR NOMBRE
    ================================================= */

    const elementoNombre =
    document.getElementById(
        "nombre-actividad-" +
        actividad.id
    );


    if (elementoNombre) {

        elementoNombre.textContent =
        nombre;

    }


    /* =================================================
       ACTUALIZAR FECHA
    ================================================= */

    const elementoFecha =
    document.getElementById(
        "fecha-actividad-" +
        actividad.id
    );


    if (elementoFecha) {

        elementoFecha.textContent =
        "— " +
        formatearFechaActividad(
            fecha
        );

    }


    mostrarMensaje(
        "✓ Actividad actualizada correctamente."
    );

}


/* =====================================================
   VALIDAR NOTA
===================================================== */

function validarNota(input) {

    if (
        input.value === ""
    ) {

        return true;

    }


    const valor =
    Number(
        input.value
    );


    const maximo =
    Number(
        input.dataset.maximo
    );


    if (
        valor < 0
    ) {

        alert(
            "La nota no puede ser menor que 0."
        );


        input.value = "";


        return false;

    }


    if (
        valor > maximo
    ) {

        alert(

            "⚠️ NOTA NO VÁLIDA\n\n" +

            "La actividad \"" +

            obtenerNombreActividad(
                input.dataset.actividad
            ) +

            "\" tiene un máximo de " +

            maximo +

            " puntos."

        );


        input.value = "";


        input.focus();


        return false;

    }


    return true;

}


/* =====================================================
   OBTENER NOMBRE ACTIVIDAD
===================================================== */

function obtenerNombreActividad(
    id
) {

    const actividad =
    actividades.find(
        a =>
        String(a.id) ===
        String(id)
    );


    return actividad
        ? actividad.nombre
        : "esta actividad";

}


/* =====================================================
   CREAR ACTIVIDAD
===================================================== */

async function crearActividad() {

    if (
        !cursoSeleccionado
    ) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const nombre =
    document.getElementById(
        "nombreActividad"
    ).value.trim();


    const fechaActividad =
    document.getElementById(
        "fechaActividad"
    ).value;


    const radioCategoria =
    document.querySelector(
        'input[name="categoriaActividad"]:checked'
    );


    if (!nombre) {

        alert(
            "Escribe el nombre de la actividad."
        );


        document.getElementById(
            "nombreActividad"
        ).focus();


        return;

    }


    if (!fechaActividad) {

        alert(
            "Selecciona la fecha de la actividad."
        );


        document.getElementById(
            "fechaActividad"
        ).focus();


        return;

    }


    if (!radioCategoria) {

        alert(
            "Selecciona una categoría: SER, SABER, HACER o AUTOEVALUACIÓN."
        );

        return;

    }


    const categoria =
    radioCategoria.value;


    mostrarMensaje(
        "Creando actividad..."
    );


    let orden = 1;


    if (
        actividades.length > 0
    ) {

        orden =
        Math.max(

            ...actividades.map(
                a =>
                Number(
                    a.orden || 0
                )
            )

        ) + 1;

    }


    const puntajeMaximo =
    LIMITES[
        categoria
    ];


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .insert({

        curso:
        cursoSeleccionado,

        trimestre:
        3,

        categoria:
        categoria,

        nombre:
        nombre,

        fecha:
        fechaActividad,

        orden:
        orden,

        puntaje_maximo:
        puntajeMaximo

    });


    if (error) {

        console.error(error);

        alert(
            "Error al crear actividad: " +
            error.message,
            true
        );

        return;

    }


    cerrarModalActividad();


    mostrarMensaje(
        "✓ Actividad creada correctamente."
    );


    await cargarActividades();


    aplicarBusqueda();

}


/* =====================================================
   ELIMINAR ACTIVIDAD
===================================================== */

async function eliminarActividad(
    actividad
) {

    const confirmar =
    confirm(

        "¿Está seguro de eliminar esta actividad?\n\n" +

        "Actividad: " +
        actividad.nombre +

        "\n\nTambién se eliminarán todas las " +
        "calificaciones de esta actividad."

    );


    if (!confirmar) {

        return;

    }


    mostrarMensaje(
        "Eliminando actividad..."
    );


    const {
        error:
        errorCalificaciones
    } =
    await supabaseClient
    .from("calificaciones")
    .delete()
    .eq(
        "actividad_id",
        actividad.id
    );


    if (errorCalificaciones) {

        alert(
            "Error al eliminar calificaciones: " +
            errorCalificaciones.message,
            true
        );

        return;

    }


    const {
        error:
        errorActividad
    } =
    await supabaseClient
    .from("actividades")
    .delete()
    .eq(
        "id",
        actividad.id
    );


    if (errorActividad) {

        alert(
            "Error al eliminar actividad: " +
            errorActividad.message,
            true
        );

        return;

    }


    actividadesDesbloqueadas.delete(
        actividad.id
    );


    mostrarMensaje(
        "✓ Actividad eliminada correctamente."
    );


    await cargarActividades();


    mostrarTablaGeneral();


    aplicarBusqueda();

}

/* =====================================================
   GUARDAR NOTAS
===================================================== */

async function guardarNotas() {

    if (!cursoSeleccionado) {

        alert(
            "Primero selecciona un curso."
        );

        return false;

    }


    if (
        actividades.length === 0
    ) {

        alert(
            "Este curso no tiene actividades."
        );

        return false;

    }


    const inputs =
    document.querySelectorAll(
        ".nota-input"
    );


    for (
        const input of inputs
    ) {

        if (
            input.value === ""
        ) {

            continue;

        }


        const valor =
        Number(
            input.value
        );


        const maximo =
        Number(
            input.dataset.maximo
        );


        if (
            valor < 0 ||
            valor > maximo
        ) {

            alert(

                "⚠️ Hay una nota inválida.\n\n" +

                "Actividad: " +

                obtenerNombreActividad(
                    input.dataset.actividad
                ) +

                "\nMáximo permitido: " +

                maximo

            );


            return false;

        }

    }


    mostrarMensaje(
        "Guardando calificaciones..."
    );


    const registros = [];


    inputs.forEach(
    input => {

        const estudianteId =
        Number(
            input.dataset.estudiante
        );


        const actividadId =
        Number(
            input.dataset.actividad
        );


        let nota = null;


        if (
            input.value !== ""
        ) {

            nota =
            Number(
                input.value
            );

        }


        registros.push({

            actividad_id:
            actividadId,

            estudiante_id:
            estudianteId,

            nota:
            nota

        });

    });


    if (
        registros.length > 0
    ) {

        const {
            error:
            errorCalificaciones
        } =
        await supabaseClient
        .from("calificaciones")
        .upsert(
            registros,
            {
                onConflict:
                "actividad_id,estudiante_id"
            }
        );


        if (errorCalificaciones) {

            console.error(
                errorCalificaciones
            );


            alert(

                "Error al guardar calificaciones: " +

                errorCalificaciones.message,

                true

            );


            return false;

        }

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    for (
        const estudiante
        of estudiantesCurso
    ) {

        const actividadesSER =
        actividades.filter(
            a =>
            a.categoria ===
            "SER"
        );


        const actividadesSABER =
        actividades.filter(
            a =>
            a.categoria ===
            "SABER"
        );


        const actividadesHACER =
        actividades.filter(
            a =>
            a.categoria ===
            "HACER"
        );


        const actividadesAUTO =
        actividades.filter(
            a =>
            a.categoria ===
            "AUTOEVALUACION"
        );


        const puntosSER =
        calcularPuntosCategoria(
            estudiante.id,
            actividadesSER,
            LIMITES.SER
        );


        const puntosSABER =
        calcularPuntosCategoria(
            estudiante.id,
            actividadesSABER,
            LIMITES.SABER
        );


        const puntosHACER =
        calcularPuntosCategoria(
            estudiante.id,
            actividadesHACER,
            LIMITES.HACER
        );


        const puntosAUTO =
        calcularPuntosCategoria(
            estudiante.id,
            actividadesAUTO,
            LIMITES.AUTOEVALUACION
        );


        const nota3T =
        redondear(

            puntosSER +
            puntosSABER +
            puntosHACER +
            puntosAUTO

        );


        const nota1T =
        convertirNumero(
            estudiante.nota_1t
        );


        const nota2T =
        convertirNumero(
            estudiante.nota_2t
        );


        let notaFinal = null;


        if (
            nota1T !== null &&
            nota2T !== null &&
            nota3T !== null
        ) {

            notaFinal =
            redondear(

                (
                    nota1T +
                    nota2T +
                    nota3T
                ) / 3

            );

        }


        const {
            error
        } =
        await supabaseClient
        .from("matematica")
        .update({

            nota_3t:
            nota3T,

            final:
            notaFinal

        })
        .eq(
            "id",
            estudiante.id
        );


        if (error) {

            console.error(error);


            alert(

                "Error al actualizar notas de " +

                estudiante.nombre +

                ": " +

                error.message,

                true

            );


            return false;

        }

    }


    alert(
        "✓ Calificaciones guardados correctamente."
    );


    await cargarEstudiantes();

    await cargarActividades();

    mostrarTablaGeneral();

    await cargarAsistencia();

    aplicarBusqueda();


    return true;

}


/* =====================================================
   CALCULAR PUNTOS
===================================================== */

function calcularPuntosCategoria(

    estudianteId,
    actividadesLista,
    limiteCategoria

) {

    if (
        !actividadesLista ||
        actividadesLista.length === 0
    ) {

        return 0;

    }


    let sumaNotas = 0;

    let sumaMaximos = 0;


    actividadesLista.forEach(
    actividad => {

        const input =
        document.querySelector(

            `.nota-input[data-estudiante="${estudianteId}"][data-actividad="${actividad.id}"]`

        );


        if (
            !input ||
            input.value === ""
        ) {

            return;

        }


        const nota =
        Number(
            input.value
        );


        const maximo =
        Number(
            input.dataset.maximo
        );


        if (
            isNaN(nota) ||
            isNaN(maximo) ||
            maximo <= 0
        ) {

            return;

        }


        sumaNotas +=
        nota;


        sumaMaximos +=
        maximo;

    });


    if (
        sumaMaximos === 0
    ) {

        return 0;

    }


    return (
        sumaNotas /
        sumaMaximos
    ) *
    limiteCategoria;

}


/* =====================================================
   REDONDEAR
===================================================== */

function redondear(
    numero
) {

    if (
        numero === null ||
        numero === undefined ||
        isNaN(numero)
    ) {

        return null;

    }


    return Math.round(
        Number(numero)
    );

}


/* =====================================================
   CONVERTIR
===================================================== */

function convertirNumero(
    valor
) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return null;

    }


    const numero =
    Number(
        valor
    );


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =====================================================
   MOSTRAR NOTA
===================================================== */

function mostrarNota(
    nota
) {

    if (
        nota === null ||
        nota === undefined ||
        nota === ""
    ) {

        return "";

    }


    return Math.round(
        Number(nota)
    );

}


/* =====================================================
   EXPORTAR EXCEL
===================================================== */

async function exportarExcel() {

    try {

        const guardado =
        await guardarNotas();

        if (guardado === false) {
            return;
        }

        mostrarMensaje("Preparando archivo Excel...");

        if (typeof XLSX === "undefined") {
            alert("No se pudo cargar la herramienta de Excel.");
            return;
        }

        /* ACTIVIDADES */
        const {
            data: todasActividades,
            error: errorActividades
        } =
        await supabaseClient
        .from("actividades")
        .select(
            "id,curso,trimestre,categoria,nombre,fecha,orden,puntaje_maximo"
        )
        .eq("trimestre", 3)
        .order("orden");

        if (errorActividades) {
            throw errorActividades;
        }

        /* CALIFICACIONES */
        const idsActividades =
        (todasActividades || []).map(a => a.id);

        let todasCalificaciones = [];

        if (idsActividades.length > 0) {

            const {
                data,
                error
            } =
            await supabaseClient
            .from("calificaciones")
            .select("actividad_id,estudiante_id,nota")
            .in("actividad_id", idsActividades);

            if (error) {
                throw error;
            }

            todasCalificaciones = data || [];
        }

        const mapaCalificaciones = {};

        todasCalificaciones.forEach(cal => {

            const clave =
            cal.estudiante_id + "_" + cal.actividad_id;

            mapaCalificaciones[clave] = cal.nota;

        });

        /* ASISTENCIA */
        const idsEstudiantes =
        estudiantes.map(e => e.id).filter(Boolean);

        let todaAsistencia = [];

        if (idsEstudiantes.length > 0) {

            const {
                data,
                error
            } =
            await supabaseClient
            .from("asistencia")
            .select("estudiante_id,fecha,estado")
            .in("estudiante_id", idsEstudiantes)
            .order("fecha");

            if (error) {
                throw error;
            }

            todaAsistencia = data || [];
        }

        const codigoAsistencia = {
            asistio: "A",
            atraso: "R",
            licencia: "L",
            falta: "F"
        };

        const mapaAsistencia = {};

        todaAsistencia.forEach(registro => {

            const clave =
            registro.estudiante_id + "_" + registro.fecha;

            mapaAsistencia[clave] =
            codigoAsistencia[registro.estado] || "";

        });

        /* SOLO CURSOS QUE TIENEN ASISTENCIA */
        const cursosConAsistencia = new Set();

        todaAsistencia.forEach(registro => {

            const estudiante =
            estudiantes.find(
                e => e.id === registro.estudiante_id
            );

            if (estudiante && estudiante.curso) {
                cursosConAsistencia.add(estudiante.curso);
            }

        });

        const cursos =
        [...cursosConAsistencia].sort();

        if (cursos.length === 0) {

            alert(
                "No existen registros de asistencia para exportar."
            );

            return;
        }

        const libro = XLSX.utils.book_new();

        cursos.forEach(curso => {

            const estudiantesCurso =
            estudiantes.filter(
                e => e.curso === curso
            );

            const idsCurso =
            new Set(
                estudiantesCurso.map(e => e.id)
            );

            /* FECHAS SOLO DE ESTE CURSO */
            const fechasCurso =
            [...new Set(
                todaAsistencia
                .filter(
                    registro =>
                    idsCurso.has(registro.estudiante_id)
                )
                .map(
                    registro => registro.fecha
                )
                .filter(Boolean)
            )].sort();

            /* ACTIVIDADES DEL CURSO */
            const actividadesCurso =
            (todasActividades || [])
            .filter(
                a => a.curso === curso
            );

            const ser =
            actividadesCurso.filter(
                a => a.categoria === "SER"
            );

            const saber =
            actividadesCurso.filter(
                a => a.categoria === "SABER"
            );

            const hacer =
            actividadesCurso.filter(
                a => a.categoria === "HACER"
            );

            const auto =
            actividadesCurso.filter(
                a => a.categoria === "AUTOEVALUACION"
            );

            const columnas = [

                "Nº LISTA",
                "NOMBRE",

                ...fechasCurso.map(
                    fecha => formatearFechaExcel(fecha)
                ),

                "TOTAL A",
                "TOTAL R",
                "TOTAL L",
                "TOTAL F",

                ...ser.map(a => a.nombre),
                "PROMEDIO SER",

                ...saber.map(a => a.nombre),
                "PROMEDIO SABER",

                ...hacer.map(a => a.nombre),
                "PROMEDIO HACER",

                "AUTOEVALUACIÓN",
                "NOTA 3T",
                "NOTA FINAL"
            ];

            const datos = [];
            datos.push(columnas);

            estudiantesCurso.forEach(estudiante => {

                const fila = [];

                fila.push(
                    estudiante.num_lista ?? ""
                );

                fila.push(
                    estudiante.nombre ?? ""
                );

                const totalesAsistencia = {
                    A: 0,
                    R: 0,
                    L: 0,
                    F: 0
                };

                fechasCurso.forEach(fecha => {

                    const clave =
                    estudiante.id + "_" + fecha;

                    const codigo =
                    mapaAsistencia[clave] || "";

                    fila.push(codigo);

                    if (
                        codigo &&
                        totalesAsistencia[codigo] !== undefined
                    ) {
                        totalesAsistencia[codigo]++;
                    }

                });

                fila.push(totalesAsistencia.A);
                fila.push(totalesAsistencia.R);
                fila.push(totalesAsistencia.L);
                fila.push(totalesAsistencia.F);

                /* SER */
                const notasSer =
                ser.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );

                ser.forEach(actividad => {

                    fila.push(
                        obtenerNotaExcel(
                            estudiante.id,
                            actividad.id,
                            mapaCalificaciones
                        )
                    );

                });

                fila.push(
                    calcularPromedioPonderado(
                        notasSer,
                        ser
                    )
                );

                /* SABER */
                const notasSaber =
                saber.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );

                saber.forEach(actividad => {

                    fila.push(
                        obtenerNotaExcel(
                            estudiante.id,
                            actividad.id,
                            mapaCalificaciones
                        )
                    );

                });

                fila.push(
                    calcularPromedioPonderado(
                        notasSaber,
                        saber
                    )
                );

                /* HACER */
                const notasHacer =
                hacer.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );

                hacer.forEach(actividad => {

                    fila.push(
                        obtenerNotaExcel(
                            estudiante.id,
                            actividad.id,
                            mapaCalificaciones
                        )
                    );

                });

                fila.push(
                    calcularPromedioPonderado(
                        notasHacer,
                        hacer
                    )
                );

                /* AUTOEVALUACIÓN */
                const notasAuto =
                auto.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );

                fila.push(
                    calcularPromedioPonderado(
                        notasAuto,
                        auto
                    )
                );

                /* NOTAS */
                fila.push(
                    estudiante.nota_3t === null ||
                    estudiante.nota_3t === undefined
                    ? ""
                    : Math.round(
                        Number(estudiante.nota_3t)
                    )
                );

                fila.push(
                    estudiante.final === null ||
                    estudiante.final === undefined
                    ? ""
                    : Math.round(
                        Number(estudiante.final)
                    )
                );

                datos.push(fila);

            });

            const hoja =
            XLSX.utils.aoa_to_sheet(datos);

            hoja["!freeze"] = {
                xSplit: 2,
                ySplit: 1
            };

            hoja["!cols"] =
            columnas.map(
            (nombre, indice) => {

                if (indice === 0) {
                    return { wch: 10 };
                }

                if (indice === 1) {
                    return { wch: 32 };
                }

                if (
                    indice >= 2 &&
                    indice < 2 + fechasCurso.length
                ) {
                    return { wch: 13 };
                }

                return { wch: 20 };

            });

            if (datos.length > 1) {

                hoja["!autofilter"] = {
                    ref:
                    XLSX.utils.encode_range({
                        s: {
                            r: 0,
                            c: 0
                        },
                        e: {
                            r: datos.length - 1,
                            c: columnas.length - 1
                        }
                    })
                };

            }

            let nombreHoja =
            String(curso)
            .replace(
                /[\\\/\?\*\[\]:]/g,
                ""
            )
            .substring(0, 31);

            if (!nombreHoja) {
                nombreHoja = "Curso";
            }

            XLSX.utils.book_append_sheet(
                libro,
                hoja,
                nombreHoja
            );

        });

        const fecha =
        new Date()
        .toISOString()
        .slice(0, 10);

        XLSX.writeFile(
            libro,
            "Asistencia_y_Calificaciones_Tercer_Trimestre_" +
            fecha +
            ".xlsx"
        );

        mostrarMensaje(
            "✓ Excel exportado correctamente."
        );

    }
    catch (error) {

        console.error(error);

        alert(
            "Error al exportar Excel: " +
            error.message,
            true
        );

    }

}


/* =====================================================
   FORMATEAR FECHA PARA EXCEL
===================================================== */

function formatearFechaExcel(fecha) {

    if (!fecha) {
        return "";
    }

    const partes =
    String(fecha).split("-");

    if (partes.length === 3) {

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }

    return fecha;

}


/* =====================================================
   NOTA EXCEL
===================================================== */

function obtenerNotaExcel(

    estudianteId,
    actividadId,
    mapa

) {

    const clave =
    estudianteId +
    "_" +
    actividadId;


    if (
        mapa[clave] === undefined ||
        mapa[clave] === null
    ) {

        return "";

    }


    return Number(
        mapa[clave]
    );

}


/* =====================================================
   PROMEDIO EXCEL
===================================================== */

function calcularPromedioPonderado(

    notas,
    actividadesLista

) {

    if (
        !actividadesLista ||
        actividadesLista.length === 0
    ) {

        return "";

    }


    let suma = 0;

    let maximos = 0;


    notas.forEach(
    (nota, indice) => {

        if (
            nota === "" ||
            nota === null ||
            nota === undefined
        ) {

            return;

        }


        const actividad =
        actividadesLista[
            indice
        ];


        const maximo =
        Number(

            actividad.puntaje_maximo ||

            LIMITES[
                actividad.categoria
            ]

        );


        suma +=
        Number(nota);


        maximos +=
        maximo;

    });


    if (
        maximos === 0
    ) {

        return "";

    }


    const limite =
    LIMITES[
        actividadesLista[0]
        .categoria
    ];


    return Math.round(

        suma /
        maximos *
        limite

    );

}

/* =====================================================

===================================================== */

function escapeHTML(
    texto
) {

    return String(texto)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   INICIAR
===================================================== */

comprobarSesion();
