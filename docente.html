<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 96%;
    max-width: 1400px;
    margin: 25px auto;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    color: #1557a6;
    margin-top: 0;
}

h2 {
    margin-top: 0;
}

h3 {
    margin-top: 0;
}

.usuario {
    color: #666;
    margin-bottom: 25px;
}

.filtros {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtro {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.nueva {
    background: #1557a6;
    color: white;
}

.guardar {
    background: #16803c;
    color: white;
}

.salir {
    background: #c62828;
    color: white;
}


/* ==========================================
   NUEVA ACTIVIDAD
========================================== */

.nueva-actividad {
    margin-top: 20px;
    padding: 20px;
    background: #eef4fb;
    border-radius: 12px;
    border: 1px solid #cbdced;
}

.nueva-grid {
    display: grid;
    grid-template-columns:
        1fr
        180px
        150px
        auto;

    gap: 12px;
    align-items: end;
}

.maximo-info {
    margin-top: 6px;
    font-size: 13px;
    color: #555;
}


/* ==========================================
   ACTIVIDADES
========================================== */

.seccion {
    margin-top: 25px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #ddd;
    background: white;
}

.titulo-seccion {
    padding: 13px 15px;
    color: white;
    font-size: 17px;
    font-weight: bold;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.titulo-seccion button {
    background: rgba(255,255,255,.2);
    color: white;
    font-size: 20px;
    font-weight: bold;
    width: 40px;
    height: 35px;
    padding: 0;
}

.ser {
    background: #7b1fa2;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00838f;
}


/* ==========================================
   ACTIVIDAD INDIVIDUAL
========================================== */

.actividad {
    margin: 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.actividad-titulo {
    background: #f4f6f8;
    padding: 12px 15px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-weight: bold;
}

.actividad-titulo button {
    background: #777;
    color: white;
    width: 38px;
    height: 32px;
    padding: 0;
    font-size: 20px;
}

.actividad-info {
    font-size: 13px;
    color: #666;
    font-weight: normal;
}


/* ==========================================
   TABLAS
========================================== */

.tabla-contenedor {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
}

th {
    background: #f0f0f0;
    font-weight: bold;
}

td.nombre {
    text-align: left;
    white-space: nowrap;
}

.nota-input {
    width: 70px;
    text-align: center;
    padding: 7px;
}

.total {
    font-weight: bold;
    font-size: 17px;
}

.oculto {
    display: none;
}


/* ==========================================
   RESUMEN
========================================== */

.resumen {
    margin-top: 30px;
    padding: 20px;
    background: #f5f7fa;
    border-radius: 12px;
    border: 1px solid #ddd;
}

.resumen-grid {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;
}

.resumen-item {
    background: white;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    border: 1px solid #ddd;
}

.resumen-item strong {
    display: block;
    font-size: 23px;
    margin-top: 5px;
}

.lista-resumen {
    margin-top: 20px;
}

.resumen-actividad {
    padding: 10px 12px;
    background: white;
    border: 1px solid #ddd;
    margin-bottom: 7px;
    border-radius: 7px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.resumen-categoria {
    font-size: 12px;
    color: #666;
}

.resumen-puntos {
    font-weight: bold;
}


/* ==========================================
   BOTONES
========================================== */

.botones {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.mensaje {
    margin-top: 15px;
    font-weight: bold;
}

.info {
    margin: 15px 0;
    padding: 12px;
    background: #fff8e1;
    border-radius: 8px;
    border: 1px solid #ffe082;
}


/* ==========================================
   RESPONSIVE
========================================== */

@media (max-width: 800px) {

    .resumen-grid {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .nueva-grid {
        grid-template-columns: 1fr;
    }

    .titulo-seccion {
        font-size: 15px;
    }

}

</style>

</head>


<body>


<div class="contenedor">

<div class="panel">


<h1>Panel Docente</h1>


<div class="usuario">

    Usuario:
    <span id="usuario"></span>

</div>


<!-- ==========================================
     FILTROS
========================================== -->

<div class="filtros">


<div class="filtro">

<label>
Buscar por nombre
</label>

<input
    type="text"
    id="buscarNombre"
    placeholder="Escribe un nombre..."
>

</div>


<div class="filtro">

<label>
Curso
</label>

<select id="buscarCurso">

<option value="">
Selecciona un curso
</option>

</select>

</div>


</div>


<div class="info">

Selecciona un curso para cargar las actividades
y calificaciones del tercer trimestre.

</div>


<!-- ==========================================
     NUEVA ACTIVIDAD
========================================== -->

<div
    id="panelNuevaActividad"
    class="nueva-actividad oculto">


<h3>
➕ Crear nueva actividad
</h3>


<div class="nueva-grid">


<div>

<label>
Nombre de la actividad
</label>

<input
    type="text"
    id="nombreActividad"
    placeholder="Ej.: Evaluación 1 - Números"
>

</div>


<div>

<label>
Categoría
</label>

<select id="categoriaActividad">

<option value="SER">
SER
</option>

<option value="SABER">
SABER
</option>

<option value="HACER">
HACER
</option>

<option value="AUTOEVALUACION">
AUTOEVALUACIÓN
</option>

</select>

</div>


<div>

<label>
Puntaje de la actividad
</label>

<input
    type="number"
    id="puntajeActividad"
    min="0"
    step="0.5"
    placeholder="Ej.: 15"
>

<div
    id="maximoInfo"
    class="maximo-info">

Máximo de categoría: 10 puntos

</div>

</div>


<div>

<button
    class="nueva"
    onclick="crearActividad()">

Crear actividad

</button>

</div>


</div>

</div>


<!-- ==========================================
     ACTIVIDADES
========================================== -->

<div id="contenedorActividades"></div>


<!-- ==========================================
     RESUMEN
========================================== -->

<div
    id="resumen"
    class="resumen oculto">


<h2>
Resumen del 3.er trimestre
</h2>


<div id="cursoResumen"></div>


<div class="resumen-grid">


<div class="resumen-item">

SER

<strong id="resumenSER">
0 / 10
</strong>

</div>


<div class="resumen-item">

SABER

<strong id="resumenSABER">
0 / 45
</strong>

</div>


<div class="resumen-item">

HACER

<strong id="resumenHACER">
0 / 40
</strong>

</div>


<div class="resumen-item">

AUTOEVALUACIÓN

<strong id="resumenAUTO">
0 / 5
</strong>

</div>


</div>


<div class="lista-resumen">

<h3>
Actividades realizadas en este curso
</h3>

<div id="listaActividadesResumen"></div>

</div>


</div>


<!-- ==========================================
     BOTONES
========================================== -->

<div class="botones">


<button
    class="guardar"
    onclick="guardarNotas()">

💾 Guardar notas

</button>


<button
    class="salir"
    onclick="cerrarSesion()">

🚪 Cerrar sesión

</button>


</div>


<div
    id="mensaje"
    class="mensaje">

</div>


</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ==========================================
// SUPABASE
// ==========================================

const SUPABASE_URL =
    "https://tecphbbkkmlgahjddcep.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let estudiantes = [];

let actividades = [];

let calificaciones = {};

let cursoSeleccionado = "";


// ==========================================
// PUNTAJES MÁXIMOS
// ==========================================

const LIMITES = {

    SER: 10,

    SABER: 45,

    HACER: 40,

    AUTOEVALUACION: 5

};


// ==========================================
// SESIÓN
// ==========================================

async function comprobarSesion() {


const {
    data: {
        user
    }
} = await supabaseClient.auth.getUser();


if (!user) {

    window.location.href =
        "login-docente.html";

    return;

}


document.getElementById("usuario")
    .textContent = user.email;


cargarEstudiantes();


}


// ==========================================
// CARGAR ESTUDIANTES
// ==========================================

async function cargarEstudiantes() {


const {
    data,
    error
} = await supabaseClient

    .from("matematica")

    .select(
        "id,ci,nombre,curso,nota_1t,nota_2t,nota_3t,final"
    )

    .order("nombre");


if (error) {

    console.error(error);

    mostrarMensaje(
        "Error al cargar estudiantes.",
        true
    );

    return;

}


estudiantes = data || [];


cargarCursos();


}


// ==========================================
// CURSOS
// ==========================================

function cargarCursos() {


const select =
    document.getElementById(
        "buscarCurso"
    );


const cursoAnterior =
    cursoSeleccionado;


select.innerHTML = `

<option value="">
Selecciona un curso
</option>

`;


const cursos =
    [...new Set(

        estudiantes
            .map(e => e.curso)
            .filter(Boolean)

    )]
    .sort();


cursos.forEach(curso => {


const opcion =
    document.createElement(
        "option"
    );


opcion.value =
    curso;


opcion.textContent =
    curso;


select.appendChild(
    opcion
);


});


if (
    cursoAnterior &&
    cursos.includes(
        cursoAnterior
    )
) {

    select.value =
        cursoAnterior;

}

}


// ==========================================
// CAMBIO DE CURSO
// ==========================================

document.getElementById(
    "buscarCurso"
).addEventListener(
    "change",
    async function() {


cursoSeleccionado =
    this.value;


document.getElementById(
    "contenedorActividades"
).innerHTML = "";


document.getElementById(
    "resumen"
).classList.add(
    "oculto"
);


document.getElementById(
    "panelNuevaActividad"
).classList.add(
    "oculto"
);


if (!cursoSeleccionado) {

    return;

}


document.getElementById(
    "panelNuevaActividad"
).classList.remove(
    "oculto"
);


await cargarActividades();


});


// ==========================================
// CAMBIO DE CATEGORÍA
// ==========================================

document.getElementById(
    "categoriaActividad"
).addEventListener(
    "change",
    actualizarMaximo
);


function actualizarMaximo() {


const categoria =
    document.getElementById(
        "categoriaActividad"
    ).value;


const maximo =
    LIMITES[categoria];


const info =
    document.getElementById(
        "maximoInfo"
    );


info.textContent =
    "Máximo total de esta categoría: " +
    maximo +
    " puntos";


}


// ==========================================
// CARGAR ACTIVIDADES
// ==========================================

async function cargarActividades() {


const {
    data,
    error
} = await supabaseClient

    .from("actividades")

    .select(
        "id,curso,trimestre,categoria,nombre,puntaje_maximo,orden"
    )

    .eq(
        "curso",
        cursoSeleccionado
    )

    .eq(
        "trimestre",
        3
    )

    .order(
        "orden"
    );


if (error) {

    console.error(error);

    mostrarMensaje(
        "Error al cargar actividades.",
        true
    );

    return;

}


actividades =
    data || [];


await cargarCalificaciones();


mostrarActividades();


}


// ==========================================
// CARGAR CALIFICACIONES
// ==========================================

async function cargarCalificaciones() {


calificaciones = {};


if (
    actividades.length === 0
) {

    return;

}


const estudiantesCurso =
    estudiantes.filter(
        e =>
            e.curso ===
            cursoSeleccionado
    );


const idsEstudiantes =
    estudiantesCurso.map(
        e => e.id
    );


const idsActividades =
    actividades.map(
        a => a.id
    );


if (
    idsEstudiantes.length === 0 ||
    idsActividades.length === 0
) {

    return;

}


const {
    data,
    error
} = await supabaseClient

    .from("calificaciones")

    .select(
        "id,actividad_id,estudiante_id,nota"
    )

    .in(
        "actividad_id",
        idsActividades
    )

    .in(
        "estudiante_id",
        idsEstudiantes
    );


if (error) {

    console.error(error);

    mostrarMensaje(
        "Error al cargar calificaciones.",
        true
    );

    return;

}


(data || []).forEach(
    cal => {


    if (
        !calificaciones[
            cal.estudiante_id
        ]
    ) {

        calificaciones[
            cal.estudiante_id
        ] = {};

    }


    calificaciones[
        cal.estudiante_id
    ][
        cal.actividad_id
    ] =
        cal.nota;


});


}


// ==========================================
// MOSTRAR ACTIVIDADES
// ==========================================

function mostrarActividades() {


const contenedor =
    document.getElementById(
        "contenedorActividades"
    );


contenedor.innerHTML = "";


if (
    actividades.length === 0
) {


contenedor.innerHTML = `

<div class="info">

Este curso todavía no tiene actividades
para el tercer trimestre.

<br><br>

Crea la primera actividad utilizando
el formulario superior.

</div>

`;


mostrarResumen();

return;

}


const categorias = [

{
    nombre: "SER",
    clase: "ser"
},

{
    nombre: "SABER",
    clase: "saber"
},

{
    nombre: "HACER",
    clase: "hacer"
},

{
    nombre: "AUTOEVALUACION",
    clase: "auto"
}

];


categorias.forEach(
    categoria => {


    const lista =
        actividades.filter(
            a =>
                a.categoria ===
                categoria.nombre
        );


    if (
        lista.length === 0
    ) {

        return;

    }


    const seccion =
        document.createElement(
            "div"
        );


    seccion.className =
        "seccion";


    // ==================================
    // ENCABEZADO CATEGORÍA
    // ==================================

    const titulo =
        document.createElement(
            "div"
        );


    titulo.className =
        "titulo-seccion " +
        categoria.clase;


    const texto =
        document.createElement(
            "span"
        );


    texto.textContent =
        obtenerNombreCategoria(
            categoria.nombre
        ) +
        " — " +
        LIMITES[
            categoria.nombre
        ] +
        " puntos";


    const boton =
        document.createElement(
            "button"
        );


    boton.textContent =
        "−";


    boton.title =
        "Ocultar actividades";


    boton.onclick =
        function() {


        const contenido =
            seccion.querySelector(
                ".contenido-categoria"
            );


        if (
            contenido.classList.contains(
                "oculto"
            )
        ) {

            contenido.classList.remove(
                "oculto"
            );

            boton.textContent =
                "−";

            boton.title =
                "Ocultar actividades";

        } else {

            contenido.classList.add(
                "oculto"
            );

            boton.textContent =
                "+";

            boton.title =
                "Mostrar actividades";

        }


        };


    titulo.appendChild(
        texto
    );


    titulo.appendChild(
        boton
    );


    seccion.appendChild(
        titulo
    );


    // ==================================
    // CONTENIDO CATEGORÍA
    // ==================================

    const contenido =
        document.createElement(
            "div"
        );


    contenido.className =
        "contenido-categoria";


    lista.forEach(
        actividad => {


        const bloque =
            crearBloqueActividad(
                actividad
            );


        contenido.appendChild(
            bloque
        );


        });


    seccion.appendChild(
        contenido
    );


    contenedor.appendChild(
        seccion
    );


    });


mostrarResumen();


calcularTotales();


}


// ==========================================
// CREAR BLOQUE DE ACTIVIDAD
// ==========================================

function crearBloqueActividad(
    actividad
) {


const bloque =
    document.createElement(
        "div"
    );


bloque.className =
    "actividad";


const titulo =
    document.createElement(
        "div"
    );


titulo.className =
    "actividad-titulo";


const texto =
    document.createElement(
        "div"
    );


texto.innerHTML = `

${escapeHTML(
    actividad.nombre
)}

<div class="actividad-info">

Puntaje máximo:
${actividad.puntaje_maximo} puntos

</div>

`;


const boton =
    document.createElement(
        "button"
    );


boton.textContent =
    "−";


boton.title =
    "Ocultar estudiantes";


boton.onclick =
    function() {


    const contenido =
        bloque.querySelector(
            ".contenido-actividad"
        );


    if (
        contenido.classList.contains(
            "oculto"
        )
    ) {


        contenido.classList.remove(
            "oculto"
        );


        boton.textContent =
            "−";


        boton.title =
            "Ocultar estudiantes";


    } else {


        contenido.classList.add(
            "oculto"
        );


        boton.textContent =
            "+";


        boton.title =
            "Mostrar estudiantes";


    }


    };


titulo.appendChild(
    texto
);


titulo.appendChild(
    boton
);


bloque.appendChild(
    titulo
);


// ==========================================
// TABLA
// ==========================================

const contenido =
    document.createElement(
        "div"
    );


contenido.className =
    "contenido-actividad";


const tablaContenedor =
    document.createElement(
        "div"
    );


tablaContenedor.className =
    "tabla-contenedor";


const tabla =
    document.createElement(
        "table"
    );


tabla.innerHTML = `

<thead>

<tr>

<th>CI</th>

<th>Estudiante</th>

<th>
${escapeHTML(
    actividad.nombre
)}
</th>

</tr>

</thead>

<tbody></tbody>

`;


const tbody =
    tabla.querySelector(
        "tbody"
    );


const estudiantesCurso =
    estudiantes.filter(
        e =>
            e.curso ===
            cursoSeleccionado
    );


estudiantesCurso.forEach(
    estudiante => {


    const fila =
        document.createElement(
            "tr"
        );


    const nota =
        obtenerNota(
            estudiante.id,
            actividad.id
        );


    fila.innerHTML = `

<td>
${escapeHTML(
    String(
        estudiante.ci
    )
)}
</td>

<td class="nombre">

${escapeHTML(
    estudiante.nombre
)}

</td>

<td>

<input

class="nota-input"

type="number"

min="0"

max="${actividad.puntaje_maximo}"

step="0.01"

value="${
    nota === null
        ? ""
        : nota
}"

data-estudiante="${
    estudiante.id
}"

data-actividad="${
    actividad.id
}"

data-maximo="${
    actividad.puntaje_maximo
}"

data-categoria="${
    actividad.categoria
}"

oninput="calcularTotales()"

>

</td>

`;


    tbody.appendChild(
        fila
    );


    });


tablaContenedor.appendChild(
    tabla
);


contenido.appendChild(
    tablaContenedor
);


bloque.appendChild(
    contenido
);


return bloque;

}


// ==========================================
// OBTENER NOTA
// ==========================================

function obtenerNota(
    estudianteId,
    actividadId
) {


if (
    !calificaciones[
        estudianteId
    ]
) {

    return null;

}


if (
    calificaciones[
        estudianteId
    ][
        actividadId
    ] === undefined
) {

    return null;

}


return calificaciones[
    estudianteId
][
    actividadId
];


}


// ==========================================
// CALCULAR TOTALES
// ==========================================

function calcularTotales() {


const estudiantesCurso =
    estudiantes.filter(
        e =>
            e.curso ===
            cursoSeleccionado
    );


let totalSER = 0;

let totalSABER = 0;

let totalHACER = 0;

let totalAUTO = 0;


estudiantesCurso.forEach(
    estudiante => {


    const totales = {

        SER: 0,

        SABER: 0,

        HACER: 0,

        AUTOEVALUACION: 0

    };


    document.querySelectorAll(

        `.nota-input[data-estudiante="${estudiante.id}"]`

    ).forEach(
        input => {


        let valor =
            parseFloat(
                input.value
            );


        if (
            isNaN(valor)
        ) {

            valor = 0;

        }


        const maximo =
            parseFloat(
                input.dataset.maximo
            );


        if (
            valor >
            maximo
        ) {

            valor =
                maximo;

            input.value =
                maximo;

        }


        if (
            valor < 0
        ) {

            valor = 0;

            input.value = 0;

        }


        totales[
            input.dataset.categoria
        ] += valor;


        });


    // Limitar categorías

    totales.SER =
        Math.min(
            totales.SER,
            LIMITES.SER
        );


    totales.SABER =
        Math.min(
            totales.SABER,
            LIMITES.SABER
        );


    totales.HACER =
        Math.min(
            totales.HACER,
            LIMITES.HACER
        );


    totales.AUTOEVALUACION =
        Math.min(
            totales.AUTOEVALUACION,
            LIMITES.AUTOEVALUACION
        );


    totalSER +=
        totales.SER;


    totalSABER +=
        totales.SABER;


    totalHACER +=
        totales.HACER;


    totalAUTO +=
        totales.AUTOEVALUACION;


    });


document.getElementById(
    "resumenSER"
).textContent =

redondear(
    totalSER
) +
" / " +
LIMITES.SER;


document.getElementById(
    "resumenSABER"
).textContent =

redondear(
    totalSABER
) +
" / " +
LIMITES.SABER;


document.getElementById(
    "resumenHACER"
).textContent =

redondear(
    totalHACER
) +
" / " +
LIMITES.HACER;


document.getElementById(
    "resumenAUTO"
).textContent =

redondear(
    totalAUTO
) +
" / " +
LIMITES.AUTOEVALUACION;


}


// ==========================================
// CREAR ACTIVIDAD
// ==========================================

async function crearActividad() {


if (
    !cursoSeleccionado
) {

    alert(
        "Primero selecciona un curso."
    );

    return;

}


const nombre =
    document.getElementById(
        "nombreActividad"
    ).value.trim();


const categoria =
    document.getElementById(
        "categoriaActividad"
    ).value;


const puntaje =
    Number(
        document.getElementById(
            "puntajeActividad"
        ).value
    );


if (
    !nombre
) {

    alert(
        "Escribe el nombre de la actividad."
    );

    return;

}


if (
    !puntaje ||
    puntaje <= 0
) {

    alert(
        "Coloca el puntaje de la actividad."
    );

    return;

}


// ==========================================
// COMPROBAR PUNTAJE DISPONIBLE
// ==========================================

const usado =
    actividades

        .filter(
            a =>
                a.categoria ===
                categoria
        )

        .reduce(
            (
                suma,
                a
            ) =>

                suma +
                Number(
                    a.puntaje_maximo
                ),

            0
        );


const disponible =
    LIMITES[categoria] -
    usado;


if (
    puntaje >
    disponible
) {

    alert(

        "No puedes superar el máximo de " +
        LIMITES[categoria] +
        " puntos para " +
        obtenerNombreCategoria(
            categoria
        ) +
        ".\n\n" +

        "Ya tienes asignados: " +
        usado +
        " puntos.\n" +

        "Disponible: " +
        disponible +
        " puntos."

    );

    return;

}


mostrarMensaje(
    "Creando actividad..."
);


// ==========================================
// ORDEN
// ==========================================

const orden =
    actividades.length +
    1;


// ==========================================
// INSERTAR
// ==========================================

const {
    error
} = await supabaseClient

    .from("actividades")

    .insert({

        curso:
            cursoSeleccionado,

        trimestre:
            3,

        categoria:
            categoria,

        nombre:
            nombre,

        puntaje_maximo:
            puntaje,

        orden:
            orden

    });


if (
    error
) {

    console.error(
        error
    );


    mostrarMensaje(
        "Error al crear la actividad: " +
        error.message,
        true
    );


    return;

}


document.getElementById(
    "nombreActividad"
).value = "";


document.getElementById(
    "puntajeActividad"
).value = "";


mostrarMensaje(
    "✓ Actividad creada correctamente."
);


await cargarActividades();


}


// ==========================================
// GUARDAR NOTAS
// ==========================================

async function guardarNotas() {


if (
    !cursoSeleccionado
) {

    alert(
        "Primero selecciona un curso."
    );

    return;

}


if (
    actividades.length === 0
) {

    alert(
        "No hay actividades creadas."
    );

    return;

}


mostrarMensaje(
    "Guardando calificaciones..."
);


const inputs =
    document.querySelectorAll(
        ".nota-input"
    );


const registros = [];


inputs.forEach(
    input => {


    const estudianteId =
        Number(
            input.dataset.estudiante
        );


    const actividadId =
        Number(
            input.dataset.actividad
        );


    let nota =
        input.value === ""
            ? null
            : Number(
                input.value
            );


    const maximo =
        Number(
            input.dataset.maximo
        );


    if (
        nota !== null &&
        nota > maximo
    ) {

        nota =
            maximo;

    }


    if (
        nota !== null &&
        nota < 0
    ) {

        nota = 0;

    }


    registros.push({

        actividad_id:
            actividadId,

        estudiante_id:
            estudianteId,

        nota:
            nota

    });


    });


// ==========================================
// UPSERT
// ==========================================

if (
    registros.length > 0
) {


const {
    error
} = await supabaseClient

    .from("calificaciones")

    .upsert(
        registros,
        {
            onConflict:
                "actividad_id,estudiante_id"
        }
    );


if (
    error
) {

    console.error(
        error
    );


    mostrarMensaje(
        "Error al guardar calificaciones: " +
        error.message,
        true
    );


    return;

}

}


// ==========================================
// ACTUALIZAR NOTA 3T
// ==========================================

const estudiantesCurso =
    estudiantes.filter(
        e =>
            e.curso ===
            cursoSeleccionado
    );


for (
    const estudiante
    of estudiantesCurso
) {


let ser = 0;

let saber = 0;

let hacer = 0;

let auto = 0;


document.querySelectorAll(

    `.nota-input[data-estudiante="${estudiante.id}"]`

).forEach(
    input => {


    let nota =
        input.value === ""
            ? 0
            : Number(
                input.value
            );


    if (
        input.dataset.categoria ===
        "SER"
    ) {

        ser += nota;

    }


    if (
        input.dataset.categoria ===
        "SABER"
    ) {

        saber += nota;

    }


    if (
        input.dataset.categoria ===
        "HACER"
    ) {

        hacer += nota;

    }


    if (
        input.dataset.categoria ===
        "AUTOEVALUACION"
    ) {

        auto += nota;

    }


    });


ser =
    Math.min(
        ser,
        LIMITES.SER
    );


saber =
    Math.min(
        saber,
        LIMITES.SABER
    );


hacer =
    Math.min(
        hacer,
        LIMITES.HACER
    );


auto =
    Math.min(
        auto,
        LIMITES.AUTOEVALUACION
    );


const nota3 =
    Math.round(

        ser +
        saber +
        hacer +
        auto

    );


const {
    error
} = await supabaseClient

    .from("matematica")

    .update({

        nota_3t:
            nota3

    })

    .eq(
        "id",
        estudiante.id
    );


if (
    error
) {

    console.error(
        error
    );


    mostrarMensaje(
        "Error actualizando la nota 3T.",
        true
    );


    return;

}


}


mostrarMensaje(
    "✓ Calificaciones guardadas correctamente."
);


await cargarEstudiantes();


await cargarActividades();


}


// ==========================================
// RESUMEN
// ==========================================

function mostrarResumen() {


const resumen =
    document.getElementById(
        "resumen"
    );


if (
    !cursoSeleccionado
) {

    resumen.classList.add(
        "oculto"
    );

    return;

}


resumen.classList.remove(
    "oculto"
);


document.getElementById(
    "cursoResumen"
).innerHTML = `

<div class="info">

<strong>
Curso:
${escapeHTML(
    cursoSeleccionado
)}
</strong>

</div>

`;


const lista =
    document.getElementById(
        "listaActividadesResumen"
    );


lista.innerHTML = "";


if (
    actividades.length === 0
) {

    lista.innerHTML = `

    <div class="info">

    Todavía no existen actividades
    para este curso.

    </div>

    `;

    return;

}


actividades.forEach(
    actividad => {


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "resumen-actividad";


    item.innerHTML = `

    <div>

        <strong>
        ${escapeHTML(
            actividad.nombre
        )}
        </strong>

        <div class="resumen-categoria">

        ${obtenerNombreCategoria(
            actividad.categoria
        )}

        </div>

    </div>


    <div class="resumen-puntos">

        ${actividad.puntaje_maximo}
        puntos

    </div>

    `;


    lista.appendChild(
        item
    );


    });


}


// ==========================================
// NOMBRE CATEGORÍA
// ==========================================

function obtenerNombreCategoria(
    categoria
) {


if (
    categoria ===
    "AUTOEVALUACION"
) {

    return "AUTOEVALUACIÓN";

}


return categoria;

}


// ==========================================
// BUSCAR ESTUDIANTE
// ==========================================

document.getElementById(
    "buscarNombre"
).addEventListener(
    "input",
    function() {


    const texto =
        this.value
            .toLowerCase()
            .trim();


    document.querySelectorAll(
        "#contenedorActividades tbody tr"
    ).forEach(
        fila => {


        const nombre =
            fila.querySelector(
                ".nombre"
            );


        if (
            !nombre
        ) {

            return;

        }


        const coincide =
            nombre.textContent
                .toLowerCase()
                .includes(
                    texto
                );


        fila.style.display =
            coincide
                ? ""
                : "none";


        });


    });


// ==========================================
// CERRAR SESIÓN
// ==========================================

async function cerrarSesion() {


await supabaseClient.auth.signOut();


window.location.href =
    "login-docente.html";


}


// ==========================================
// MENSAJES
// ==========================================

function mostrarMensaje(
    texto,
    error = false
) {


const mensaje =
    document.getElementById(
        "mensaje"
    );


mensaje.textContent =
    texto;


mensaje.style.color =
    error
        ? "#c62828"
        : "#16803c";


}


// ==========================================
// REDONDEAR
// ==========================================

function redondear(
    numero
) {

return Math.round(
    Number(numero) || 0
);

}


// ==========================================
// SEGURIDAD HTML
// ==========================================

function escapeHTML(
    texto
) {


return String(texto)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );


}


// ==========================================
// INICIAR
// ==========================================

actualizarMaximo();

comprobarSesion();


</script>
