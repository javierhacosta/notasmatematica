<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 96%;
    max-width: 1400px;
    margin: 25px auto;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    color: #1557a6;
    margin-top: 0;
}

h2,
h3 {
    margin-top: 0;
}

.usuario {
    color: #666;
    margin-bottom: 25px;
}


/* ================================
   FILTROS
================================ */

.filtros {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtro {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}


/* ================================
   CREAR ACTIVIDAD
================================ */

.nueva-actividad {
    margin-top: 20px;
    padding: 20px;
    background: #eef4fb;
    border: 1px solid #cbdced;
    border-radius: 12px;
}

.nueva-grid {
    display: grid;
    grid-template-columns: 1fr 220px auto;
    gap: 15px;
    align-items: end;
}


/* ================================
   BOTONES
================================ */

button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.crear {
    background: #1557a6;
    color: white;
}

.guardar {
    background: #16803c;
    color: white;
}

.salir {
    background: #c62828;
    color: white;
}

.boton-ocultar {
    background: rgba(255,255,255,.2);
    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    font-size: 21px;
    font-weight: bold;
}

.boton-eliminar {
    background: #c62828;
    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    font-size: 18px;
}


/* ================================
   CATEGORÍAS
================================ */

.categoria {
    margin-top: 25px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-categoria {
    color: white;
    padding: 13px 15px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    font-size: 17px;
    font-weight: bold;
}

.titulo-categoria-izq {
    display: flex;
    align-items: center;
    gap: 8px;
}

.ser {
    background: #7b1fa2;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00838f;
}


/* ================================
   ACTIVIDADES
================================ */

.actividad {
    margin: 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.encabezado-actividad {
    background: #f4f6f8;

    padding: 12px 15px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;
}

.nombre-actividad {
    font-weight: bold;
    font-size: 16px;
}

.botones-actividad {
    display: flex;
    gap: 7px;
}

.contenido-actividad {
    padding: 0;
}


/* ================================
   TABLA
================================ */

.tabla-contenedor {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
}

th,
td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
}

th {
    background: #f0f0f0;
}

td.nombre {
    text-align: left;
    white-space: nowrap;
}

.nota-input {
    width: 75px;
    text-align: center;
    padding: 7px;
}


/* ================================
   NOTAS GENERALES
================================ */

.tabla-general {
    margin-top: 30px;
}

.nota-3t {
    font-weight: bold;
    font-size: 18px;
}

.nota-final {
    font-weight: bold;
}


/* ================================
   INFORMACIÓN
================================ */

.info {
    margin-top: 15px;
    padding: 12px;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
}

.mensaje {
    margin-top: 15px;
    font-weight: bold;
}


/* ================================
   UTILIDADES
================================ */

.oculto {
    display: none !important;
}


/* ================================
   BOTONES INFERIORES
================================ */

.botones {
    margin-top: 25px;

    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}


/* ================================
   RESPONSIVE
================================ */

@media (max-width: 800px) {

    .nueva-grid {
        grid-template-columns: 1fr;
    }

    .titulo-categoria {
        font-size: 15px;
    }

}

</style>

</head>


<body>


<div class="contenedor">

<div class="panel">


<h1>
Panel Docente
</h1>


<div class="usuario">

Usuario:
<span id="usuario"></span>

</div>


<!-- ==================================
     FILTROS
================================== -->

<div class="filtros">


<div class="filtro">

<label>
Buscar por nombre

<input

Curso

<div

<h3>

</h3>


<div class="nueva-grid">

Nombre de la actividad

<input

<div>

<label>
Categoría

<select id="categoriaActividad">

SER — 10 puntos
</option>

<option value="SABER">
SABER — 45 puntos
</option>

<option value="HACER">

</option>

<option value="AUTOEVALUACION">

</option>

</div>


<div>

<button
    class="crear"
    onclick="crearActividad()">

➕ Crear actividad

</div>

</div>


<!-- ==================================
     ACTIVIDADES
================================== -->

<div
    id="contenedorActividades">

</div>


<!-- ==================================
     TABLA GENERAL
================================== -->

<div
    id="tablaGeneral"
    class="tabla-general oculto">


<h2>
Calificaciones del curso
</h2>


<div class="tabla-contenedor">


<table>


<thead>

<tr>

<th>
CI
</th>

<th>
Nombre
</th>

<th>
Curso
</th>

<th>
1T
</th>

<th>
2T
</th>

<th>
3T
</th>

<th>
Final
</th>

</tr>

</thead>


<tbody
    id="tablaEstudiantes">

</tbody>


</table>


</div>


</div>


<!-- ==================================
     BOTONES
================================== -->

<div class="botones">


<button
    class="guardar"
    onclick="guardarNotas()">

💾 Guardar notas

</button>


<button
    class="salir"
    onclick="cerrarSesion()">

🚪 Cerrar sesión

</button>


</div>


<div
    id="mensaje"
    class="mensaje">

</div>


</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
"https://tecphbbkkmlgahjddcep.supabase.co";


const SUPABASE_KEY =
"sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =====================================================
// VARIABLES
// =====================================================

let estudiantes = [];

let actividades = [];

let calificaciones = {};

let cursoSeleccionado = "";


// =====================================================
// PUNTAJES DE CADA CATEGORÍA
// =====================================================

const LIMITES = {

    SER: 10,

    SABER: 45,

    HACER: 40,

    AUTOEVALUACION: 5

};


// =====================================================
// INICIAR SESIÓN
// =====================================================

async function comprobarSesion() {


const {
    data: {
        user
    }
} = await supabaseClient.auth.getUser();


if (!user) {

    window.location.href =
        "login-docente.html";

    return;

}


document.getElementById(
    "usuario"
).textContent =
user.email;


await cargarEstudiantes();

}


// =====================================================
// CARGAR ESTUDIANTES
// =====================================================

async function cargarEstudiantes() {


const {
    data,
    error
} = await supabaseClient

.from("matematica")

.select(
    "id,ci,nombre,curso,nota_1t,nota_2t,nota_3t,final"
)

.order(
    "nombre"
);


if (error) {

console.error(error);

mostrarMensaje(
    "Error al cargar estudiantes.",
    true
);

return;

}


estudiantes =
data || [];


cargarCursos();


}


// =====================================================
// CARGAR CURSOS
// =====================================================

function cargarCursos() {


const select =
document.getElementById(
    "buscarCurso"
);


select.innerHTML = `

<option value="">
Selecciona un curso
</option>

`;


const cursos =
[...new Set(

    estudiantes
    .map(
        e => e.curso
    )
    .filter(Boolean)

)]
.sort();


cursos.forEach(
curso => {


const opcion =
document.createElement(
    "option"
);


opcion.value =
curso;


opcion.textContent =
curso;


select.appendChild(
    opcion
);


});

}


// =====================================================
// CAMBIO DE CURSO
// =====================================================

document.getElementById(
    "buscarCurso"
).addEventListener(
    "change",
    async function() {


cursoSeleccionado =
this.value;


document.getElementById(
    "contenedorActividades"
).innerHTML = "";


document.getElementById(
    "tablaEstudiantes"
).innerHTML = "";


document.getElementById(
    "tablaGeneral"
).classList.add(
    "oculto"
);


document.getElementById(
    "panelNuevaActividad"
).classList.add(
    "oculto"
);


if (!cursoSeleccionado) {

document.getElementById(
    "mensajeCurso"
).textContent =
"Selecciona un curso para comenzar.";

return;

}


document.getElementById(
    "panelNuevaActividad"
).classList.remove(
    "oculto"
);


document.getElementById(
    "mensajeCurso"
).textContent =
"Curso seleccionado: " +
cursoSeleccionado;


await cargarActividades();


mostrarTablaGeneral();


});


// =====================================================
// CARGAR ACTIVIDADES
// =====================================================

async function cargarActividades() {


const {
    data,
    error
} = await supabaseClient

.from("actividades")

.select(
    "id,curso,trimestre,categoria,nombre,orden"
)

.eq(
    "curso",
    cursoSeleccionado
)

.eq(
    "trimestre",
    3
)

.order(
    "orden"
);


if (error) {

console.error(error);

mostrarMensaje(
    "Error al cargar actividades: " +
    error.message,
    true
);

return;

}


actividades =
data || [];


await cargarCalificaciones();


mostrarActividades();


}


// =====================================================
// CARGAR CALIFICACIONES
// =====================================================

async function cargarCalificaciones() {


calificaciones = {};


if (
    actividades.length === 0
) {

return;

}


const estudiantesCurso =
estudiantes.filter(
    e =>
    e.curso ===
    cursoSeleccionado
);


const idsEstudiantes =
estudiantesCurso.map(
    e => e.id
);


const idsActividades =
actividades.map(
    a => a.id
);


if (
    idsEstudiantes.length === 0 ||
    idsActividades.length === 0
) {

return;

}


const {
    data,
    error
} = await supabaseClient

.from("calificaciones")

.select(
    "id,actividad_id,estudiante_id,nota"
)

.in(
    "actividad_id",
    idsActividades
)

.in(
    "estudiante_id",
    idsEstudiantes
);


if (error) {

console.error(error);

mostrarMensaje(
    "Error al cargar calificaciones.",
    true
);

return;

}


(data || []).forEach(
cal => {


if (
    !calificaciones[
        cal.estudiante_id
    ]
) {

calificaciones[
    cal.estudiante_id
] = {};

}


calificaciones[
    cal.estudiante_id
][
    cal.actividad_id
] =
cal.nota;


});


}


// =====================================================
// MOSTRAR ACTIVIDADES
// =====================================================

function mostrarActividades() {


const contenedor =
document.getElementById(
    "contenedorActividades"
);


contenedor.innerHTML = "";


const categorias = [

{
    codigo: "SER",
    nombre: "SER",
    puntos: 10,
    clase: "ser"
},

{
    codigo: "SABER",
    nombre: "SABER",
    puntos: 45,
    clase: "saber"
},

{
    codigo: "HACER",
    nombre: "HACER",
    puntos: 40,
    clase: "hacer"
},

{
    codigo: "AUTOEVALUACION",
    nombre: "AUTOEVALUACIÓN",
    puntos: 5,
    clase: "auto"
}

];


categorias.forEach(
categoria => {


const lista =
actividades.filter(
a =>
a.categoria ===
categoria.codigo
);


if (
    lista.length === 0
) {

return;

}


const seccion =
document.createElement(
    "div"
);


seccion.className =
"categoria";


const encabezado =
document.createElement(
    "div"
);


encabezado.className =
"titulo-categoria " +
categoria.clase;


const izquierda =
document.createElement(
    "div"
);


izquierda.className =
"titulo-categoria-izq";


const texto =
document.createElement(
    "span"
);


texto.textContent =
categoria.nombre +
" — " +
categoria.puntos +
" puntos";


const botonCategoria =
document.createElement(
    "button"
);


botonCategoria.className =
"boton-ocultar";


botonCategoria.textContent =
"−";


botonCategoria.title =
"Ocultar actividades";


izquierda.appendChild(
    texto
);


encabezado.appendChild(
    izquierda
);


encabezado.appendChild(
    botonCategoria
);


seccion.appendChild(
    encabezado
);


const contenido =
document.createElement(
    "div"
);


lista.forEach(
actividad => {


const bloque =
crearActividadHTML(
    actividad
);


contenido.appendChild(
    bloque
);


});


seccion.appendChild(
    contenido
);


botonCategoria.onclick =
function() {


if (
    contenido.classList.contains(
        "oculto"
    )
) {

contenido.classList.remove(
    "oculto"
);

botonCategoria.textContent =
"−";

botonCategoria.title =
"Ocultar actividades";

} else {

contenido.classList.add(
    "oculto"
);

botonCategoria.textContent =
"+";

botonCategoria.title =
"Mostrar actividades";

}

};


contenedor.appendChild(
seccion
);


});


// Si no hay actividades

if (
    actividades.length === 0
) {

contenedor.innerHTML = `

<div class="info">

Este curso todavía no tiene actividades
para el tercer trimestre.

<br><br>

Puedes crear la primera actividad
arriba.

</div>

`;

}


}


// =====================================================
// CREAR HTML DE UNA ACTIVIDAD
// =====================================================

function crearActividadHTML(
    actividad
) {


const bloque =
document.createElement(
    "div"
);


bloque.className =
"actividad";


const encabezado =
document.createElement(
    "div"
);


encabezado.className =
"encabezado-actividad";


const nombre =
document.createElement(
    "div"
);


nombre.className =
"nombre-actividad";


nombre.textContent =
actividad.nombre;


const botones =
document.createElement(
    "div"
);


botones.className =
"botones-actividad";


// -------------------------------
// BOTÓN OCULTAR
// -------------------------------

const botonOcultar =
document.createElement(
    "button"
);


botonOcultar.className =
"boton-ocultar";


botonOcultar.textContent =
"−";


botonOcultar.title =
"Ocultar estudiantes";


// -------------------------------
// BOTÓN ELIMINAR
// -------------------------------

const botonEliminar =
document.createElement(
    "button"
);


botonEliminar.className =
"boton-eliminar";


botonEliminar.textContent =
"🗑️";


botonEliminar.title =
"Eliminar actividad";


botones.appendChild(
    botonOcultar
);


botones.appendChild(
    botonEliminar
);


encabezado.appendChild(
    nombre
);


encabezado.appendChild(
    botones
);


bloque.appendChild(
    encabezado
);


// =====================================================
// CONTENIDO
// =====================================================

const contenido =
document.createElement(
    "div"
);


contenido.className =
"contenido-actividad";


const tablaContenedor =
document.createElement(
    "div"
);


tablaContenedor.className =
"tabla-contenedor";


const tabla =
document.createElement(
    "table"
);


tabla.innerHTML = `

<thead>

<tr>

<th>CI</th>

<th>Nombre</th>

<th>Nota / 100</th>

</tr>

</thead>

<tbody></tbody>

`;


const tbody =
tabla.querySelector(
    "tbody"
);


const estudiantesCurso =
estudiantes.filter(
    e =>
    e.curso ===
    cursoSeleccionado
);


estudiantesCurso.forEach(
estudiante => {


const fila =
document.createElement(
    "tr"
);


let nota = null;


if (
    calificaciones[
        estudiante.id
    ] &&
    calificaciones[
        estudiante.id
    ][
        actividad.id
    ] !== undefined
) {

nota =
calificaciones[
    estudiante.id
][
    actividad.id
];

}


fila.innerHTML = `

<td>
${escapeHTML(
    String(
        estudiante.ci
    )
)}
</td>

<td class="nombre">

${escapeHTML(
    estudiante.nombre
)}

</td>

<td>

<input

class="nota-input"

type="number"

min="0"

max="100"

step="0.01"

value="${
    nota === null
    ? ""
    : nota
}"

data-estudiante="${
    estudiante.id
}"

data-actividad="${
    actividad.id
}"

data-categoria="${
    actividad.categoria
}"

oninput="validarNota(this)"

>

</td>

`;


tbody.appendChild(
    fila
);


});


tablaContenedor.appendChild(
    tabla
);


contenido.appendChild(
    tablaContenedor
);


bloque.appendChild(
    contenido
);


// =====================================================
// OCULTAR / MOSTRAR
// =====================================================

botonOcultar.onclick =
function() {


if (
    contenido.classList.contains(
        "oculto"
    )
) {

contenido.classList.remove(
    "oculto"
);

botonOcultar.textContent =
"−";

botonOcultar.title =
"Ocultar estudiantes";

} else {

contenido.classList.add(
    "oculto"
);

botonOcultar.textContent =
"+";

botonOcultar.title =
"Mostrar estudiantes";

}

};


// =====================================================
// ELIMINAR
// =====================================================

botonEliminar.onclick =
function() {

eliminarActividad(
    actividad
);

};


return bloque;

}


// =====================================================
// VALIDAR NOTA
// =====================================================

function validarNota(
    input
) {


let valor =
Number(
    input.value
);


if (
    input.value === ""
) {

return;

}


if (
    valor < 0
) {

input.value = 0;

}


if (
    valor > 100
) {

input.value = 100;

}

}


// =====================================================
// CREAR ACTIVIDAD
// =====================================================

async function crearActividad() {


if (
    !cursoSeleccionado
) {

alert(
    "Primero selecciona un curso."
);

return;

}


const nombre =
document.getElementById(
    "nombreActividad"
).value.trim();


const categoria =
document.getElementById(
    "categoriaActividad"
).value;


if (
    !nombre
) {

alert(
    "Escribe el nombre de la actividad."
);

return;

}


mostrarMensaje(
    "Creando actividad..."
);


// =====================================================
// ORDEN
// =====================================================

let orden = 1;


if (
    actividades.length > 0
) {

orden =
Math.max(
    ...actividades.map(
        a =>
        Number(
            a.orden || 0
        )
    )
) + 1;

}


// =====================================================
// INSERTAR
// =====================================================

const {
    data,
    error
} = await supabaseClient

.from("actividades")

.insert({

    curso:
        cursoSeleccionado,

    trimestre:
        3,

    categoria:
        categoria,

    nombre:
        nombre,

    orden:
        orden

})

.select();


if (error) {

console.error(error);

mostrarMensaje(
    "Error al crear actividad: " +
    error.message,
    true
);

return;

}


document.getElementById(
    "nombreActividad"
).value = "";


mostrarMensaje(
    "✓ Actividad creada correctamente."
);


await cargarActividades();


}

// ELIMINAR ACTIVIDAD
// =====================================================

) {

);

} = await supabaseClient

.from("calificaciones")

.delete()

.eq(
    "actividad_id",
    actividad.id
);

    errorCalificaciones
) {

    errorCalificaciones
);

);

} = await supabaseClient

.from("actividades")

.delete()

.eq(

    actividad.id
);

) {

    errorActividad
);

);

// =====================================================
// GUARDAR NOTAS
// =====================================================

async function guardarNotas() {


if (
    !cursoSeleccionado
) {

alert(
    "Primero selecciona un curso."
);

return;

}


if (
    actividades.length === 0
) {

alert(
    "Este curso no tiene actividades."
);

return;

}


mostrarMensaje(
    "Guardando calificaciones..."
);


const inputs =
document.querySelectorAll(
    ".nota-input"
);


const registros = [];


inputs.forEach(
input => {


const estudianteId =
Number(
    input.dataset.estudiante
);


const actividadId =
Number(
    input.dataset.actividad
);


let nota = null;


if (
    input.value !== ""
) {

nota =
Number(
    input.value
);


if (
    nota < 0
) {

nota = 0;

}


if (
    nota > 100
) {

nota = 100;

}

}


registros.push({

    actividad_id:
        actividadId,

    estudiante_id:
        estudianteId,

    nota:
        nota

});


});


/*
===========================================
GUARDAR CALIFICACIONES
===========================================
*/

const {
    error:
    errorCalificaciones
} = await supabaseClient

.from("calificaciones")

.upsert(

    registros,

    {
        onConflict:
        "actividad_id,estudiante_id"
    }

);


if (
    errorCalificaciones
) {

console.error(
    errorCalificaciones
);

mostrarMensaje(

"Error al guardar calificaciones: " +
errorCalificaciones.message,

true

);

return;

}


// =====================================================
// CALCULAR NOTA 3T DE CADA ESTUDIANTE
// =====================================================

const estudiantesCurso =
estudiantes.filter(
    e =>
    e.curso ===
    cursoSeleccionado
);


for (
    const estudiante
    of estudiantesCurso
) {


const totales = {

    SER: [],

    SABER: [],

    HACER: [],

    AUTOEVALUACION: []

};


// =====================================================
// RECORRER ACTIVIDADES
// =====================================================

actividades.forEach(
actividad => {


const input =
document.querySelector(

`.nota-input[data-estudiante="${estudiante.id}"][data-actividad="${actividad.id}"]`

);


let nota = null;


if (
    input &&
    input.value !== ""
) {

nota =
Number(
    input.value
);

}


if (
    nota !== null &&
    !isNaN(nota)
) {

totales[
    actividad.categoria
].push(
    nota
);

}


});


// =====================================================
// PROMEDIOS
// =====================================================

const promedioSER =
calcularPromedio(
    totales.SER
);


const promedioSABER =
calcularPromedio(
    totales.SABER
);


const promedioHACER =
calcularPromedio(
    totales.HACER
);


const promedioAUTO =
calcularPromedio(
    totales.AUTOEVALUACION
);


// =====================================================
// CONVERTIR A LOS PUNTOS CORRESPONDIENTES
// =====================================================

const puntosSER =
(promedioSER / 100) *
LIMITES.SER;


const puntosSABER =
(promedioSABER / 100) *
LIMITES.SABER;


const puntosHACER =
(promedioHACER / 100) *
LIMITES.HACER;


const puntosAUTO =
(promedioAUTO / 100) *
LIMITES.AUTOEVALUACION;


// =====================================================
// NOTA FINAL 3T
// =====================================================

const nota3T =
Math.round(

    puntosSER +
    puntosSABER +
    puntosHACER +
    puntosAUTO

);


// =====================================================
// GUARDAR NOTA 3T
// =====================================================

const {
    error
} = await supabaseClient

.from("matematica")

.update({

    nota_3t:
        nota3T

})

.eq(
    "id",
    estudiante.id
);


if (error) {

console.error(error);

mostrarMensaje(

"Error al actualizar nota 3T: " +
error.message,

true

);

return;

}


}


// =====================================================
// RECARGAR
// =====================================================

mostrarMensaje(
    "✓ Calificaciones guardadas correctamente."
);


await cargarEstudiantes();

mostrarTablaGeneral();

await cargarActividades();


}


// =====================================================
// CALCULAR PROMEDIO
// =====================================================

function calcularPromedio(
    valores
) {


if (
    !valores ||
    valores.length === 0
) {

return 0;

}


const suma =
valores.reduce(
    (
        total,
        valor
    ) =>
        total +
        Number(valor),
    0
);


return
suma /
valores.length;

}


// =====================================================
// MOSTRAR NOTA
// =====================================================

function mostrarNota(
    nota
) {


if (
    nota === null ||
    nota === undefined
) {

return "";

}


return nota;

}


// =====================================================
// BUSCAR POR NOMBRE
// =====================================================

document.getElementById(
    "buscarNombre"
).addEventListener(
    "input",
    function() {


const texto =
this.value
.toLowerCase()
.trim();


document.querySelectorAll(
    "#contenedorActividades tbody tr"
).forEach(
fila => {


const nombre =
fila.querySelector(
    ".nombre"
);


if (!nombre) {

return;

}


const coincide =
nombre.textContent
.toLowerCase()
.includes(
    texto
);


fila.style.display =
coincide
    ? ""
    : "none";


});


});

// CERRAR SESIÓN

// =====================================================
// MENSAJES
// =====================================================

function mostrarMensaje(
    texto,
    error = false
) {


const mensaje =
document.getElementById(
    "mensaje"
);


mensaje.textContent =
texto;


mensaje.style.color =
error
    ? "#c62828"
    : "#16803c";


}


// =====================================================
// ESCAPAR HTML
// =====================================================

function escapeHTML(
    texto
) {


return String(texto)

.replace(
    /&/g,
    "&amp;"
)

.replace(
    /</g,
    "&lt;"
)

.replace(
    />/g,
    "&gt;"
)

.replace(
    /"/g,
    "&quot;"
)

.replace(
    /'/g,
    "&#039;"
);

}

// INICIAR
// =====================================================

comprobarSesion();
