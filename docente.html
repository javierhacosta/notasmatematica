<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 96%;
    max-width: 1400px;
    margin: 25px auto;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    color: #1557a6;
    margin-top: 0;
}

h3 {
    margin-top: 0;
}

.usuario {
    color: #666;
    margin-bottom: 25px;
}


/* =====================================================
   FILTROS
===================================================== */

.filtros {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtro {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.info {
    margin-top: 15px;
    padding: 12px;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
}


/* =====================================================
   MODAL NUEVA ACTIVIDAD
===================================================== */

.modal-fondo {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 9999;
}

.modal-fondo.oculto {
    display: none !important;
}

.modal-actividad {
    width: 100%;
    max-width: 520px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,.30);
    overflow: hidden;
    animation: aparecerModal .18s ease-out;
}

@keyframes aparecerModal {

    from {
        opacity: 0;
        transform: scale(.94);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

.modal-cabecera {
    background: #1557a6;
    color: white;
    padding: 15px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-cabecera h3 {
    margin: 0;
    font-size: 18px;
}

.boton-cerrar-modal {
    width: 34px;
    height: 34px;
    padding: 0;
    background: rgba(255,255,255,.18);
    color: white;
    font-size: 23px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
}

.boton-cerrar-modal:hover {
    background: rgba(255,255,255,.30);
}

.modal-cuerpo {
    padding: 20px;
}

.modal-cuerpo .campo {
    margin-bottom: 17px;
}

.modal-cuerpo label {
    margin-bottom: 7px;
}


/* =====================================================
   BOTONES DEL MODAL
   AHORA SIEMPRE UNO AL LADO DEL OTRO
===================================================== */

.modal-acciones {
    display: flex;
    flex-direction: row;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
}

.modal-acciones button {
    flex: 0 0 auto;
    width: auto;
    min-width: 120px;
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 15px;
}

.boton-cancelar {
    background: #777;
    color: white;
}

.boton-crear-modal {
    background: #16803c;
    color: white;
}


/* =====================================================
   CATEGORÍAS
===================================================== */

.categoria {
    margin-top: 25px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-categoria {
    color: white;
    padding: 13px 15px;
    font-size: 17px;
    font-weight: bold;
}

.ser {
    background: #7b1fa2;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00838f;
}


/* =====================================================
   ACTIVIDAD
===================================================== */

.actividad {
    margin: 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
}


/* =====================================================
   ENCABEZADO DE ACTIVIDAD
===================================================== */

.encabezado-actividad {
    background: #f4f6f8;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}


/* CONTENEDOR IZQUIERDO */

.izquierda-actividad {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
}


/* CONTENEDOR DERECHO */

.derecha-actividad {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}


/* =====================================================
   NOMBRE ACTIVIDAD
===================================================== */

.nombre-actividad {
    font-weight: bold;
    font-size: 16px;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
}

.puntaje-actividad {
    font-weight: normal;
    color: #555;
    font-size: 14px;
}


/* =====================================================
   BOTONES DE ACTIVIDAD
===================================================== */

.botones-actividad {
    display: contents;
}

.boton-ocultar,
.boton-editar,
.boton-bloquear,
.boton-eliminar {

    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}


/* Editar */

.boton-editar {
    background: #1565c0;
}


/* Eliminar */

.boton-eliminar {
    background: #c62828;
}


/* Mostrar / ocultar */

.boton-ocultar {
    background: #555;
}


/* Bloquear */

.boton-bloquear {
    background: #ef6c00;
}


/* =====================================================
   CONTENIDO
===================================================== */

.contenido-actividad {
    padding: 0;
}


/* =====================================================
   TABLAS
===================================================== */

.tabla-contenedor {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
}

th,
td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: #f0f0f0;
}


/* =====================================================
   NOMBRE DEL ESTUDIANTE
===================================================== */

td.nombre {
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: normal;
    min-width: 120px;
    line-height: 1.25;
}


/* =====================================================
   COLUMNA Nº
===================================================== */

th:first-child,
td:first-child {
    width: 45px;
    min-width: 45px;
}


/* =====================================================
   INPUT DE NOTAS
===================================================== */

.nota-input {
    width: 65px;
    max-width: 100%;
    text-align: center;
    padding: 7px;
    transition: .2s;
}

.nota-input:disabled {
    background: #eeeeee;
    color: #555;
    cursor: not-allowed;
    border-color: #ddd;
}

.nota-input.editable {
    background: #fffde7;
    border: 2px solid #ef6c00;
}

.estado-bloqueo {
    font-size: 12px;
    color: #777;
    margin-left: 5px;
}


/* =====================================================
   TABLA GENERAL
===================================================== */

.tabla-general {
    margin-top: 30px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-general {
    background: #1557a6;
    color: white;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: bold;
}


/* =====================================================
   ACCIONES JUNTO A CALIFICACIONES
===================================================== */

.acciones-general {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
}


/* =====================================================
   BOTÓN NUEVA ACTIVIDAD
===================================================== */

.boton-nueva-actividad {
    background: rgba(255,255,255,.20);
    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    border: none;
    border-radius: 7px;
    font-size: 21px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.boton-nueva-actividad:hover {
    background: rgba(255,255,255,.35);
    transform: scale(1.03);
}


/* =====================================================
   BOTÓN GENERAL + / -
===================================================== */

.boton-general {
    background: rgba(255,255,255,.20);
    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    border: none;
    border-radius: 7px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

.boton-general:hover {
    background: rgba(255,255,255,.35);
}


/* =====================================================
   NOTAS FINALES
===================================================== */

.nota-3t,
.nota-final {
    font-weight: bold;
    font-size: 18px;
}


/* =====================================================
   BOTONES INFERIORES
===================================================== */

.botones {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.botones button {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 15px;
}

.guardar {
    background: #16803c;
    color: white;
}

.exportar {
    background: #1565c0;
    color: white;
}

.salir {
    background: #c62828;
    color: white;
}


/* =====================================================
   MENSAJES
===================================================== */

.mensaje {
    margin-top: 15px;
    font-weight: bold;
}

.oculto {
    display: none !important;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 800px) {

    .panel {
        padding: 15px;
    }

    .encabezado-actividad {
        align-items: stretch;
    }

    .izquierda-actividad {
        flex: 1;
        min-width: 0;
    }

    .derecha-actividad {
        margin-left: auto;
    }

    .nombre-actividad {
        font-size: 15px;
    }

}


/* =====================================================
   CELULARES
===================================================== */

@media (max-width: 600px) {

    .contenedor {
        width: 100%;
        margin: 10px auto;
    }

    .panel {
        padding: 10px;
        border-radius: 10px;
    }

    h1 {
        font-size: 24px;
    }

    .encabezado-actividad {
        flex-wrap: wrap;
    }

    .izquierda-actividad {
        width: 100%;
        min-width: 0;
    }

    .derecha-actividad {
        width: 100%;
        justify-content: flex-end;
    }


    /* =================================================
       BOTONES DEL MODAL EN CELULAR
       SE MANTIENEN LADO A LADO
    ================================================= */

    .modal-acciones {
        flex-direction: row;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
    }

    .modal-acciones button {
        width: auto;
        flex: 1;
        min-width: 0;
        padding: 10px 8px;
        font-size: 14px;
    }


    /* TABLA */

    .tabla-contenedor {
        width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 0;
        table-layout: fixed;
    }

    th,
    td {
        padding: 6px 4px;
        font-size: 13px;
    }

    th:first-child,
    td:first-child {
        width: 38px;
        min-width: 38px;
    }

    th:nth-child(2),
    td:nth-child(2) {
        width: auto;
        min-width: 0;
    }

    td.nombre {
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: normal;
        line-height: 1.2;
    }

    th:nth-child(3),
    td:nth-child(3) {
        width: 55px;
        min-width: 50px;
    }

    .nota-input {
        width: 58px;
        max-width: 100%;
        padding: 6px 2px;
        font-size: 14px;
    }

    #tablaGeneral table {
        table-layout: fixed;
    }

    #tablaGeneral th,
    #tablaGeneral td {
        font-size: 12px;
        padding: 6px 3px;
    }

    #tablaGeneral th:first-child,
    #tablaGeneral td:first-child {
        width: 35px;
        min-width: 35px;
    }

    #tablaGeneral th:nth-child(2),
    #tablaGeneral td:nth-child(2) {
        width: auto;
        min-width: 0;
    }

    #tablaGeneral th:nth-child(3),
    #tablaGeneral td:nth-child(3) {
        width: 50px;
        min-width: 45px;
    }

    #tablaGeneral th:nth-child(4),
    #tablaGeneral td:nth-child(4),
    #tablaGeneral th:nth-child(5),
    #tablaGeneral td:nth-child(5),
    #tablaGeneral th:nth-child(6),
    #tablaGeneral td:nth-child(6),
    #tablaGeneral th:nth-child(7),
    #tablaGeneral td:nth-child(7) {
        width: 42px;
        min-width: 38px;
    }

    /* MODAL */

    .modal-actividad {
        max-width: 100%;
    }

    .modal-cuerpo {
        padding: 16px;
    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media (max-width: 400px) {

    .panel {
        padding: 8px;
    }

    .actividad {
        margin: 10px;
    }

    th,
    td {
        padding: 5px 3px;
        font-size: 12px;
    }

    th:first-child,
    td:first-child {
        width: 32px;
        min-width: 32px;
    }

    th:nth-child(3),
    td:nth-child(3) {
        width: 48px;
        min-width: 45px;
    }

    .nota-input {
        width: 52px;
        font-size: 13px;
    }

    #tablaGeneral th:first-child,
    #tablaGeneral td:first-child {
        width: 30px;
        min-width: 30px;
    }

    #tablaGeneral th:nth-child(3),
    #tablaGeneral td:nth-child(3) {
        width: 45px;
        min-width: 42px;
    }

    #tablaGeneral th:nth-child(4),
    #tablaGeneral td:nth-child(4),
    #tablaGeneral th:nth-child(5),
    #tablaGeneral td:nth-child(5),
    #tablaGeneral th:nth-child(6),
    #tablaGeneral td:nth-child(6),
    #tablaGeneral th:nth-child(7),
    #tablaGeneral td:nth-child(7) {
        width: 38px;
        min-width: 35px;
    }


    /* =================================================
       MODAL EN CELULARES PEQUEÑOS
    ================================================= */

    .modal-acciones {
        flex-direction: row;
        gap: 6px;
    }

    .modal-acciones button {
        flex: 1;
        min-width: 0;
        padding: 9px 5px;
        font-size: 13px;
    }

}


/* =====================================================
   EVITAR DESBORDAMIENTO
===================================================== */

th,
td,
.nombre-actividad,
.titulo-categoria,
.titulo-general {
    overflow-wrap: anywhere;
}


/* =====================================================
   NOMBRE DE ACTIVIDAD
===================================================== */

.nombre-actividad > span:first-child {
    overflow-wrap: anywhere;
    word-break: normal;
}

</style>

</head>


<body>

<div class="contenedor">

<div class="panel">

<h1>Panel Docente</h1>

<div class="usuario">
Usuario: <span id="usuario"></span>
</div>


<!-- =====================================================
     FILTROS
===================================================== -->

<div class="filtros">

<div class="filtro">

<label>Curso</label>

<select id="buscarCurso">

<option value="">
Selecciona un curso
</option>

</select>

</div>


<div class="filtro">

<label>Buscar estudiante</label>

<input
    type="text"
    id="buscarNombre"
    placeholder="Buscar por nombre o Nº de lista..."
>

</div>

</div>


<!-- =====================================================
     ACTIVIDADES
===================================================== -->

<div
    id="contenedorActividades">
</div>


<!-- =====================================================
     TABLA GENERAL
===================================================== -->

<div
    id="tablaGeneral"
    class="tabla-general oculto">

<div class="titulo-general">

<span>
📊 Calificaciones del curso
</span>

<div class="acciones-general">

<button
    type="button"
    class="boton-nueva-actividad"
    onclick="abrirModalActividad()"
    title="Añadir nueva actividad">

📝

</button>


<button
    id="botonGeneral"
    class="boton-general"
    onclick="ocultarTablaGeneral()"
    title="Mostrar u ocultar calificaciones">

+

</button>

</div>

</div>


<div
    id="contenidoGeneral"
    class="oculto">

<div class="tabla-contenedor">

<table>

<thead>

<tr>

<th>Nº</th>

<th>Nombre</th>

<th>Curso</th>

<th>1T</th>

<th>2T</th>

<th>3T</th>

<th>Final</th>

</tr>

</thead>

<tbody
    id="tablaEstudiantes">
</tbody>

</table>

</div>

</div>

</div>


<!-- =====================================================
     BOTONES
===================================================== -->

<div class="botones">

<button
    class="guardar"
    onclick="guardarNotas()">

💾 Guardar notas

</button>


<button
    class="exportar"
    onclick="exportarExcel()">

📊 Exportar Excel

</button>


<button
    class="salir"
    onclick="cerrarSesion()">

🚪 Cerrar sesión

</button>

</div>


<div
    id="mensaje"
    class="mensaje">
</div>

</div>

</div>


<!-- =====================================================
     MODAL NUEVA ACTIVIDAD
===================================================== -->

<div
    id="modalNuevaActividad"
    class="modal-fondo oculto"
    onclick="cerrarModalDesdeFondo(event)">

<div
    class="modal-actividad"
    onclick="event.stopPropagation()">

<div class="modal-cabecera">

<h3>
📝 Crear nueva actividad
</h3>

<button
    type="button"
    class="boton-cerrar-modal"
    onclick="cerrarModalActividad()"
    title="Cerrar">

×

</button>

</div>


<div class="modal-cuerpo">

<div class="campo">

<label>
Nombre de la actividad
</label>

<input
    type="text"
    id="nombreActividad"
    placeholder="Ej.: Evaluación de números"
    autocomplete="off"
>

</div>


<div class="campo">

<label>
Categoría
</label>

<select id="categoriaActividad">

<option value="SER">
SER — 10 puntos
</option>

<option value="SABER">
SABER — 45 puntos
</option>

<option value="HACER">
HACER — 40 puntos
</option>

<option value="AUTOEVALUACION">
AUTOEVALUACIÓN — 5 puntos
</option>

</select>

</div>


<div class="modal-acciones">

<button
    type="button"
    class="boton-cancelar"
    onclick="cerrarModalActividad()">

Cancelar

</button>


<button
    type="button"
    class="boton-crear-modal"
    onclick="crearActividad()">

📝 Crear actividad

</button>

</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://tecphbbkkmlgahjddcep.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let estudiantes = [];

let actividades = [];

let calificaciones = {};

let cursoSeleccionado = "";


/* =====================================================
   LIMITES
===================================================== */

const LIMITES = {

    SER: 10,

    SABER: 45,

    HACER: 40,

    AUTOEVALUACION: 5

};


/* =====================================================
   ESTADO DE BLOQUEO
===================================================== */

const actividadesDesbloqueadas =
new Set();


/* =====================================================
   SESIÓN
===================================================== */

async function comprobarSesion() {

    const {
        data: {
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href =
        "login-docente.html";

        return;

    }


    document.getElementById(
        "usuario"
    ).textContent =
    user.email;


    await cargarEstudiantes();

}


/* =====================================================
   CARGAR ESTUDIANTES
===================================================== */

async function cargarEstudiantes() {

    const {
        data,
        error
    } =
    await supabaseClient
    .from("matematica")
    .select(
        "id,num_lista,ci,nombre,curso,nota_1t,nota_2t,nota_3t,final"
    )
    .order("curso")
    .order("num_lista");


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar estudiantes: " +
            error.message,
            true
        );

        return;

    }


    estudiantes =
    data || [];


    cargarCursos();

}


/* =====================================================
   CURSOS
===================================================== */

function cargarCursos() {

    const select =
    document.getElementById(
        "buscarCurso"
    );


    const valorAnterior =
    select.value;


    select.innerHTML = `

        <option value="">
            Selecciona un curso
        </option>

    `;


    const cursos =
    [...new Set(

        estudiantes
        .map(e => e.curso)
        .filter(Boolean)

    )].sort();


    cursos.forEach(
    curso => {

        const opcion =
        document.createElement(
            "option"
        );


        opcion.value =
        curso;


        opcion.textContent =
        curso;


        select.appendChild(
            opcion
        );

    });


    if (
        valorAnterior &&
        cursos.includes(
            valorAnterior
        )
    ) {

        select.value =
        valorAnterior;

    }

}

/* =====================================================
   CARGAR ACTIVIDADES
===================================================== */

async function cargarActividades() {

    const {
        data,
        error
    } =
    await supabaseClient
    .from("actividades")
    .select(
        "id,curso,trimestre,categoria,nombre,orden,puntaje_maximo"
    )
    .eq(
        "curso",
        cursoSeleccionado
    )
    .eq(
        "trimestre",
        3
    )
    .order(
        "orden"
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar actividades: " +
            error.message,
            true
        );

        return;

    }


    actividades =
    data || [];


    await cargarCalificaciones();


    mostrarActividades();

}


/* =====================================================
   CARGAR CALIFICACIONES
===================================================== */

async function cargarCalificaciones() {

    calificaciones = {};


    if (
        actividades.length === 0
    ) {

        return;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    const idsEstudiantes =
    estudiantesCurso.map(
        e => e.id
    );


    const idsActividades =
    actividades.map(
        a => a.id
    );


    if (
        idsEstudiantes.length === 0 ||
        idsActividades.length === 0
    ) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("calificaciones")
    .select(
        "id,actividad_id,estudiante_id,nota"
    )
    .in(
        "actividad_id",
        idsActividades
    )
    .in(
        "estudiante_id",
        idsEstudiantes
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar calificaciones: " +
            error.message,
            true
        );

        return;

    }


    (data || []).forEach(
    cal => {

        if (
            !calificaciones[
                cal.estudiante_id
            ]
        ) {

            calificaciones[
                cal.estudiante_id
            ] = {};

        }


        calificaciones[
            cal.estudiante_id
        ][
            cal.actividad_id
        ] =
        cal.nota;

    });

}

                input.classList.remove(
                    "editable"
                );

            actividadesDesbloqueadas.delete(

        );

/* =====================================================
   EDITAR NOMBRE ACTIVIDAD
===================================================== */

async function editarNombreActividad(
    actividad
) {

    const nuevoNombre =
    prompt(
        "Escribe el nuevo nombre de la actividad:",
        actividad.nombre
    );


    if (
        nuevoNombre === null
    ) {

        return;

    }


    const nombre =
    nuevoNombre.trim();


    if (!nombre) {

        alert(
            "El nombre no puede estar vacío."
        );

        return;

    }


    if (
        nombre === actividad.nombre
    ) {

        return;

    }


    mostrarMensaje(
        "Actualizando nombre..."
    );


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .update({

        nombre:
        nombre

    })
    .eq(
        "id",
        actividad.id
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cambiar el nombre: " +
            error.message,
            true
        );

        return;

    }


    actividad.nombre =
    nombre;


    const elemento =
    document.getElementById(
        "nombre-actividad-" +
        actividad.id
    );


    if (elemento) {

        elemento.textContent =
        nombre;

    }


    mostrarMensaje(
        "✓ Nombre actualizado correctamente."
    );

}


/* =====================================================
   VALIDAR NOTA
===================================================== */

function validarNota(input) {

    if (
        input.value === ""
    ) {

        return true;

    }


    const valor =
    Number(
        input.value
    );


    const maximo =
    Number(
        input.dataset.maximo
    );


    if (
        valor < 0
    ) {

        alert(
            "La nota no puede ser menor que 0."
        );


        input.value = "";


        return false;

    }


    if (
        valor > maximo
    ) {

        alert(

            "⚠️ NOTA NO VÁLIDA\n\n" +

            "La actividad \"" +

            obtenerNombreActividad(
                input.dataset.actividad
            ) +

            "\" tiene un máximo de " +

            maximo +

            " puntos."

        );


        input.value = "";


        input.focus();


        return false;

    }


    return true;

}


/* =====================================================
   OBTENER NOMBRE ACTIVIDAD
===================================================== */

function obtenerNombreActividad(
    id
) {

    const actividad =
    actividades.find(
        a =>
        String(a.id) ===
        String(id)
    );


    return actividad
        ? actividad.nombre
        : "esta actividad";

}


/* =====================================================
   CREAR ACTIVIDAD
===================================================== */

async function crearActividad() {

    if (
        !cursoSeleccionado
    ) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const nombre =
    document.getElementById(
        "nombreActividad"
    ).value.trim();


    const categoria =
    document.getElementById(
        "categoriaActividad"
    ).value;


    if (!nombre) {

        alert(
            "Escribe el nombre de la actividad."
        );


        document.getElementById(
            "nombreActividad"
        ).focus();


        return;

    }


    mostrarMensaje(
        "Creando actividad..."
    );


    let orden = 1;


    if (
        actividades.length > 0
    ) {

        orden =
        Math.max(

            ...actividades.map(
                a =>
                Number(
                    a.orden || 0
                )
            )

        ) + 1;

    }


    const puntajeMaximo =
    LIMITES[
        categoria
    ];


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .insert({

        curso:
        cursoSeleccionado,

        trimestre:
        3,

        categoria:
        categoria,

        nombre:
        nombre,

        orden:
        orden,

        puntaje_maximo:
        puntajeMaximo

    });


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al crear actividad: " +
            error.message,
            true
        );

        return;

    }


    document.getElementById(
        "nombreActividad"
    ).value = "";


    document.getElementById(
        "categoriaActividad"
    ).value = "SER";


    cerrarModalActividad();


    mostrarMensaje(
        "✓ Actividad creada correctamente."
    );


    await cargarActividades();


    aplicarBusqueda();

}


/* =====================================================
   ELIMINAR ACTIVIDAD
===================================================== */

async function eliminarActividad(
    actividad
) {

    const confirmar =
    confirm(

        "¿Está seguro de eliminar esta actividad?\n\n" +

        "Actividad: " +
        actividad.nombre +

        "\n\nTambién se eliminarán todas las " +
        "calificaciones de esta actividad."

    );


    if (!confirmar) {

        return;

    }


    mostrarMensaje(
        "Eliminando actividad..."
    );


    const {
        error:
        errorCalificaciones
    } =
    await supabaseClient
    .from("calificaciones")
    .delete()
    .eq(
        "actividad_id",
        actividad.id
    );


    if (errorCalificaciones) {

        mostrarMensaje(
            "Error al eliminar calificaciones: " +
            errorCalificaciones.message,
            true
        );

        return;

    }


    const {
        error:
        errorActividad
    } =
    await supabaseClient
    .from("actividades")
    .delete()
    .eq(
        "id",
        actividad.id
    );


    if (errorActividad) {

        mostrarMensaje(
            "Error al eliminar actividad: " +
            errorActividad.message,
            true
        );

        return;

    }


    actividadesDesbloqueadas.delete(
        actividad.id
    );


    mostrarMensaje(
        "✓ Actividad eliminada correctamente."
    );


    await cargarActividades();


    mostrarTablaGeneral();


    aplicarBusqueda();

}

/* =====================================================
   BÚSQUEDA POR NOMBRE O NÚMERO
===================================================== */

document.getElementById(
    "buscarNombre"
).addEventListener(
    "input",
    aplicarBusqueda
);


function aplicarBusqueda() {

    const campo =
    document.getElementById(
        "buscarNombre"
    );


    if (!campo) {

        return;

    }


    const texto =
    campo.value
    .toLowerCase()
    .trim();


    /* ACTIVIDADES */

    document.querySelectorAll(
        "#contenedorActividades tbody tr"
    ).forEach(
    fila => {

        const celdas =
        fila.querySelectorAll(
            "td"
        );


        if (
            celdas.length === 0
        ) {

            return;

        }


        const numero =
        celdas[0]
        ? celdas[0]
            .textContent
            .toLowerCase()
            .trim()
        : "";


        const nombre =
        celdas[1]
        ? celdas[1]
            .textContent
            .toLowerCase()
            .trim()
        : "";


        const coincide =

            texto === "" ||

            nombre.includes(
                texto
            ) ||

            numero.includes(
                texto
            );


        fila.style.display =
        coincide
        ? ""
        : "none";

    });


    /* TABLA GENERAL */

    document.querySelectorAll(
        "#tablaEstudiantes tr"
    ).forEach(
    fila => {

        const celdas =
        fila.querySelectorAll(
            "td"
        );


        if (
            celdas.length === 0
        ) {

            return;

        }


        const numero =
        celdas[0]
        ? celdas[0]
            .textContent
            .toLowerCase()
            .trim()
        : "";


        const nombre =
        celdas[1]
        ? celdas[1]
            .textContent
            .toLowerCase()
            .trim()
        : "";


        const coincide =

            texto === "" ||

            nombre.includes(
                texto
            ) ||

            numero.includes(
                texto
            );


        fila.style.display =
        coincide
        ? ""
        : "none";

    });

}


/* =====================================================
   GUARDAR NOTAS
===================================================== */

async function guardarNotas() {

    if (!cursoSeleccionado) {

        alert(
            "Primero selecciona un curso."
        );

        return false;

    }


    if (
        actividades.length === 0
    ) {

        alert(
            "Este curso no tiene actividades."
        );

        return false;

    }


    const inputs =
    document.querySelectorAll(
        ".nota-input"
    );


    for (
        const input of inputs
    ) {

        if (
            input.value === ""
        ) {

            continue;

        }


        const valor =
        Number(
            input.value
        );


        const maximo =
        Number(
            input.dataset.maximo
        );


        if (
            valor < 0 ||
            valor > maximo
        ) {

            alert(

                "⚠️ Hay una nota inválida.\n\n" +

                "Actividad: " +

                obtenerNombreActividad(
                    input.dataset.actividad
                ) +

                "\nMáximo permitido: " +

                maximo

            );


            return false;

        }

    }


    mostrarMensaje(
        "Guardando calificaciones..."
    );


    const registros = [];


    inputs.forEach(
    input => {

        const estudianteId =
        Number(
            input.dataset.estudiante
        );


        const actividadId =
        Number(
            input.dataset.actividad
        );


        let nota = null;


        if (
            input.value !== ""
        ) {

            nota =
            Number(
                input.value
            );

        }


        registros.push({

            actividad_id:
            actividadId,

            estudiante_id:
            estudianteId,

            nota:
            nota

        });

    });


    if (
        registros.length > 0
    ) {

        const {
            error:
            errorCalificaciones
        } =
        await supabaseClient
        .from("calificaciones")
        .upsert(
            registros,
            {
                onConflict:
                "actividad_id,estudiante_id"
            }
        );


        if (errorCalificaciones) {

            console.error(
                errorCalificaciones
            );


            mostrarMensaje(

                "Error al guardar calificaciones: " +

                errorCalificaciones.message,

                true

            );


            return false;

        }

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    for (
        const estudiante
        of estudiantesCurso
    ) {

        const actividadesSER =
        actividades.filter(
            a =>
            a.categoria ===
            "SER"
        );


        const actividadesSABER =
        actividades.filter(
            a =>
            a.categoria ===
            "SABER"
        );


        const actividadesHACER =
        actividades.filter(
            a =>
            a.categoria ===
            "HACER"
        );


        const actividadesAUTO =
        actividades.filter(
            a =>
            a.categoria ===
            "AUTOEVALUACION"
        );


        const puntosSER =
        calcularPuntosCategoria(

            estudiante.id,

            actividadesSER,

            LIMITES.SER

        );


        const puntosSABER =
        calcularPuntosCategoria(

            estudiante.id,

            actividadesSABER,

            LIMITES.SABER

        );


        const puntosHACER =
        calcularPuntosCategoria(

            estudiante.id,

            actividadesHACER,

            LIMITES.HACER

        );


        const puntosAUTO =
        calcularPuntosCategoria(

            estudiante.id,

            actividadesAUTO,

            LIMITES.AUTOEVALUACION

        );


        const nota3T =
        redondear(

            puntosSER +
            puntosSABER +
            puntosHACER +
            puntosAUTO

        );


        const nota1T =
        convertirNumero(
            estudiante.nota_1t
        );


        const nota2T =
        convertirNumero(
            estudiante.nota_2t
        );


        let notaFinal = null;


        if (
            nota1T !== null &&
            nota2T !== null &&
            nota3T !== null
        ) {

            notaFinal =
            redondear(

                (
                    nota1T +
                    nota2T +
                    nota3T
                ) / 3

            );

        }


        const {
            error
        } =
        await supabaseClient
        .from("matematica")
        .update({

            nota_3t:
            nota3T,

            final:
            notaFinal

        })
        .eq(
            "id",
            estudiante.id
        );


        if (error) {

            console.error(error);


            mostrarMensaje(

                "Error al actualizar notas de " +

                estudiante.nombre +

                ": " +

                error.message,

                true

            );


            return false;

        }

    }


    mostrarMensaje(
        "✓ Calificaciones, 3T y FINAL guardados correctamente."
    );


    await cargarEstudiantes();


    await cargarActividades();


    mostrarTablaGeneral();


    aplicarBusqueda();


    return true;

}


/* =====================================================
   CALCULAR PUNTOS CATEGORÍA
===================================================== */

function calcularPuntosCategoria(

    estudianteId,

    actividadesLista,

    limiteCategoria

) {

    if (
        !actividadesLista ||
        actividadesLista.length === 0
    ) {

        return 0;

    }


    let sumaNotas = 0;

    let sumaMaximos = 0;


    actividadesLista.forEach(
    actividad => {

        const input =
        document.querySelector(

            `.nota-input[data-estudiante="${estudianteId}"][data-actividad="${actividad.id}"]`

        );


        if (
            !input ||
            input.value === ""
        ) {

            return;

        }


        const nota =
        Number(
            input.value
        );


        const maximo =
        Number(
            input.dataset.maximo
        );


        if (
            isNaN(nota) ||
            isNaN(maximo) ||
            maximo <= 0
        ) {

            return;

        }


        sumaNotas +=
        nota;


        sumaMaximos +=
        maximo;

    });


    if (
        sumaMaximos === 0
    ) {

        return 0;

    }


    const puntos =

    (
        sumaNotas /
        sumaMaximos
    ) *
    limiteCategoria;


    return puntos;

}


/* =====================================================
   REDONDEAR
===================================================== */

function redondear(
    numero
) {

    if (
        numero === null ||
        numero === undefined ||
        isNaN(numero)
    ) {

        return null;

    }


    return Math.round(
        Number(numero)
    );

}


/* =====================================================
   CONVERTIR NÚMERO
===================================================== */

function convertirNumero(
    valor
) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return null;

    }


    const numero =
    Number(
        valor
    );


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =====================================================
   MOSTRAR NOTA
===================================================== */

function mostrarNota(
    nota
) {

    if (
        nota === null ||
        nota === undefined ||
        nota === ""
    ) {

        return "";

    }


    return Math.round(
        Number(nota)
    );

}


/* =====================================================
   EXPORTAR EXCEL
===================================================== */

async function exportarExcel() {

    try {

        const guardado =
        await guardarNotas();


        if (
            guardado === false
        ) {

            return;

        }


        mostrarMensaje(
            "Preparando archivo Excel..."
        );


        if (
            typeof XLSX === "undefined"
        ) {

            alert(
                "No se pudo cargar la herramienta de Excel."
            );

            return;

        }


        const {
            data:
            todasActividades,
            error:
            errorActividades
        } =
        await supabaseClient
        .from("actividades")
        .select(
            "id,curso,trimestre,categoria,nombre,orden,puntaje_maximo"
        )
        .eq(
            "trimestre",
            3
        )
        .order(
            "orden"
        );


        if (errorActividades) {

            throw errorActividades;

        }


        const idsActividades =

        (todasActividades || [])
        .map(
            a => a.id
        );


        let todasCalificaciones = [];


        if (
            idsActividades.length > 0
        ) {

            const {
                data,
                error
            } =
            await supabaseClient
            .from("calificaciones")
            .select(
                "actividad_id,estudiante_id,nota"
            )
            .in(
                "actividad_id",
                idsActividades
            );


            if (error) {

                throw error;

            }


            todasCalificaciones =
            data || [];

        }


        const mapaCalificaciones = {};


        todasCalificaciones.forEach(
        cal => {

            const clave =
            cal.estudiante_id +
            "_" +
            cal.actividad_id;


            mapaCalificaciones[
                clave
            ] =
            cal.nota;

        });


        const cursos =
        [...new Set(

            estudiantes
            .map(
                e => e.curso
            )
            .filter(Boolean)

        )].sort();


        if (
            cursos.length === 0
        ) {

            alert(
                "No existen estudiantes para exportar."
            );

            return;

        }


        const libro =
        XLSX.utils.book_new();


        cursos.forEach(
        curso => {

            const estudiantesCurso =
            estudiantes.filter(
                e =>
                e.curso ===
                curso
            );


            const actividadesCurso =
            (todasActividades || [])
            .filter(
                a =>
                a.curso ===
                curso
            );


            const ser =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "SER"
            );


            const saber =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "SABER"
            );


            const hacer =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "HACER"
            );


            const auto =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "AUTOEVALUACION"
            );


            const columnas = [

                "Nº LISTA",

                "NOMBRE",

                ...ser.map(
                    a => a.nombre
                ),

                "PROMEDIO SER",

                ...saber.map(
                    a => a.nombre
                ),

                "PROMEDIO SABER",

                ...hacer.map(
                    a => a.nombre
                ),

                "PROMEDIO HACER",

                "AUTOEVALUACIÓN",

                "NOTA 3T",

                "NOTA FINAL"

            ];


            const datos = [];


            datos.push(
                columnas
            );


            estudiantesCurso.forEach(
            estudiante => {

                const fila = [];


                fila.push(
                    estudiante.num_lista ??
                    ""
                );


                fila.push(
                    estudiante.nombre ??
                    ""
                );


                const notasSer =
                ser.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                ser.forEach(
                actividad => {

                    fila.push(

                        obtenerNotaExcel(

                            estudiante.id,

                            actividad.id,

                            mapaCalificaciones

                        )

                    );

                });


                fila.push(

                    calcularPromedioPonderado(

                        notasSer,

                        ser

                    )

                );


                const notasSaber =
                saber.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                saber.forEach(
                actividad => {

                    fila.push(

                        obtenerNotaExcel(

                            estudiante.id,

                            actividad.id,

                            mapaCalificaciones

                        )

                    );

                });


                fila.push(

                    calcularPromedioPonderado(

                        notasSaber,

                        saber

                    )

                );


                const notasHacer =
                hacer.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                hacer.forEach(
                actividad => {

                    fila.push(

                        obtenerNotaExcel(

                            estudiante.id,

                            actividad.id,

                            mapaCalificaciones

                        )

                    );

                });


                fila.push(

                    calcularPromedioPonderado(

                        notasHacer,

                        hacer

                    )

                );


                const notasAuto =
                auto.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                fila.push(

                    calcularPromedioPonderado(

                        notasAuto,

                        auto

                    )

                );


                fila.push(

                    estudiante.nota_3t === null ||
                    estudiante.nota_3t === undefined

                    ? ""

                    : Math.round(
                        Number(
                            estudiante.nota_3t
                        )
                    )

                );


                fila.push(

                    estudiante.final === null ||
                    estudiante.final === undefined

                    ? ""

                    : Math.round(
                        Number(
                            estudiante.final
                        )
                    )

                );


                datos.push(
                    fila
                );

            });


            const hoja =
            XLSX.utils.aoa_to_sheet(
                datos
            );


            hoja["!freeze"] = {

                xSplit: 2,

                ySplit: 1

            };


            hoja["!cols"] =
            columnas.map(
            (nombre, indice) => {

                if (
                    indice === 0
                ) {

                    return {
                        wch: 10
                    };

                }


                if (
                    indice === 1
                ) {

                    return {
                        wch: 32
                    };

                }


                return {
                    wch: 20
                };

            });


            const rango =
            XLSX.utils.decode_range(
                hoja["!ref"]
            );


            for (
                let fila =
                rango.s.r;

                fila <=
                rango.e.r;

                fila++
            ) {

                for (
                    let columna =
                    rango.s.c;

                    columna <=
                    rango.e.c;

                    columna++
                ) {

                    const celda =
                    hoja[
                        XLSX.utils.encode_cell({

                            r: fila,

                            c: columna

                        })
                    ];


                    if (!celda) {

                        continue;

                    }


                    celda.s = {

                        alignment: {

                            horizontal:
                            columna === 1
                            ? "left"
                            : "center",

                            vertical:
                            "center",

                            wrapText:
                            true

                        },

                        font: {

                            name:
                            "Arial",

                            sz:
                            10

                        },

                        border: {

                            top: {
                                style:
                                "thin"
                            },

                            bottom: {
                                style:
                                "thin"
                            },

                            left: {
                                style:
                                "thin"
                            },

                            right: {
                                style:
                                "thin"
                            }

                        }

                    };


                    if (
                        fila === 0
                    ) {

                        celda.s.font = {

                            name:
                            "Arial",

                            sz:
                            10,

                            bold:
                            true

                        };

                    }

                }

            }


            hoja["!rows"] = [

                {
                    hpt: 35
                }

            ];


            let nombreHoja =
            String(curso)
            .replace(
                /[\\\/\?\*\[\]:]/g,
                ""
            )
            .substring(
                0,
                31
            );


            if (!nombreHoja) {

                nombreHoja =
                "Curso";

            }


            XLSX.utils.book_append_sheet(

                libro,

                hoja,

                nombreHoja

            );

        });


        const fecha =
        new Date()
        .toISOString()
        .slice(
            0,
            10
        );


        XLSX.writeFile(

            libro,

            "Calificaciones_Tercer_Trimestre_" +
            fecha +
            ".xlsx"

        );


        mostrarMensaje(
            "✓ Excel exportado correctamente."
        );


    }

    catch (error) {

        console.error(error);


        mostrarMensaje(

            "Error al exportar Excel: " +
            error.message,

            true

        );

    }

}


/* =====================================================
   OBTENER NOTA EXCEL
===================================================== */

function obtenerNotaExcel(

    estudianteId,

    actividadId,

    mapa

) {

    const clave =
    estudianteId +
    "_" +
    actividadId;


    if (
        mapa[clave] === undefined ||
        mapa[clave] === null
    ) {

        return "";

    }


    return Number(
        mapa[clave]
    );

}


/* =====================================================
   PROMEDIO EXCEL
===================================================== */

function calcularPromedioPonderado(

    notas,

    actividadesLista

) {

    if (
        !actividadesLista ||
        actividadesLista.length === 0
    ) {

        return "";

    }


    let suma = 0;

    let maximos = 0;


    notas.forEach(
    (nota, indice) => {

        if (
            nota === "" ||
            nota === null ||
            nota === undefined
        ) {

            return;

        }


        const actividad =
        actividadesLista[
            indice
        ];


        const maximo =
        Number(

            actividad.puntaje_maximo ||

            LIMITES[
                actividad.categoria
            ]

        );


        suma +=
        Number(nota);


        maximos +=
        maximo;

    });


    if (
        maximos === 0
    ) {

        return "";

    }


    const limite =
    LIMITES[
        actividadesLista[0]
        .categoria
    ];


    return Math.round(

        (

            suma /
            maximos *
            limite

        )

    );

}

/* =====================================================
   MENSAJES
===================================================== */

function mostrarMensaje(

    texto,

    error = false

) {

    const mensaje =
    document.getElementById(
        "mensaje"
    );


    mensaje.textContent =
    texto;


    mensaje.style.color =
    error
    ? "#c62828"
    : "#16803c";

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(
    texto
) {

    return String(texto)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

comprobarSesion();
