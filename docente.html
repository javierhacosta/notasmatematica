<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 96%;
    max-width: 1400px;
    margin: 25px auto;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    color: #1557a6;
    margin-top: 0;
}

.usuario {
    color: #666;
    margin-bottom: 25px;
}


/* =====================================================
   FILTROS
===================================================== */

.filtros {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtro {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.info {
    margin-top: 15px;
    padding: 12px;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
}


/* =====================================================
   ELEMENTOS OCULTOS
===================================================== */

.oculto {
    display: none !important;
}


/* =====================================================
   CATEGORÍAS
===================================================== */

.categoria {
    margin-top: 25px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-categoria {
    color: white;
    padding: 13px 15px;
    font-size: 17px;
    font-weight: bold;
}

.ser {
    background: #7b1fa2;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00838f;
}


/* =====================================================
   ACTIVIDAD
===================================================== */

.actividad {
    margin: 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.encabezado-actividad {
    background: #f4f6f8;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.izquierda-actividad {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
}

.derecha-actividad {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.nombre-actividad {
    font-weight: bold;
    font-size: 16px;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
}

.puntaje-actividad {
    font-weight: normal;
    color: #555;
    font-size: 14px;
}


/* =====================================================
   BOTONES ACTIVIDAD
===================================================== */

.boton-editar,
.boton-eliminar,
.boton-ocultar,
.boton-bloquear {

    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.boton-editar {
    background: #1565c0;
}

.boton-eliminar {
    background: #c62828;
}

.boton-ocultar {
    background: #555;
}

.boton-bloquear {
    background: #ef6c00;
}


/* =====================================================
   CONTENIDO ACTIVIDAD
===================================================== */

.contenido-actividad {
    padding: 0;
}


/* =====================================================
   TABLAS
===================================================== */

.tabla-contenedor {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
}

th,
td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: #f0f0f0;
}

td.nombre {
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
    word-break: normal;
    min-width: 120px;
    line-height: 1.25;
}


/* =====================================================
   NOTAS
===================================================== */

.nota-input {
    width: 65px;
    max-width: 100%;
    text-align: center;
    padding: 7px;
    transition: .2s;
}

.nota-input:disabled {
    background: #eeeeee;
    color: #555;
    cursor: not-allowed;
    border-color: #ddd;
}

.nota-input.editable {
    background: #fffde7;
    border: 2px solid #ef6c00;
}


/* =====================================================
   TABLA GENERAL
===================================================== */

.tabla-general {
    margin-top: 30px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-general {
    background: #1557a6;
    color: white;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: bold;
}

.acciones-general {
    display: flex;
    align-items: center;
    gap: 7px;
}

.boton-nueva-actividad,
.boton-general {

    background: rgba(255,255,255,.20);
    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    border: none;
    border-radius: 7px;
    font-size: 21px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.boton-nueva-actividad:hover,
.boton-general:hover {
    background: rgba(255,255,255,.35);
}


/* =====================================================
   NOTAS FINALES
===================================================== */

.nota-3t,
.nota-final {
    font-weight: bold;
    font-size: 18px;
}


/* =====================================================
   ASISTENCIA
===================================================== */

.asistencia {
    margin-top: 30px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-asistencia {
    background: #1557a6;
    color: white;
    padding: 12px 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: bold;
}

.controles-asistencia {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    padding: 15px;
    background: #f8fafc;
}

.control-fecha {
    width: 220px;
}

.resumen {
    padding: 12px 15px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
    font-weight: bold;
    background: white;
    border-bottom: 1px solid #ddd;
}


/* =====================================================
   BOTONES ESTADO ASISTENCIA
===================================================== */

.estado-btn {

    width: 40px;
    height: 36px;

    border: 2px solid #ddd;

    border-radius: 50%;

    background: white;

    cursor: pointer;

    font-size: 20px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    transition: .15s;

}

.estado-btn:hover {

    transform: scale(1.08);

}

.estado-btn.seleccionado {

    border-color: #222;

    box-shadow:
        0 0 0 3px rgba(21,87,166,.18);

    transform: scale(1.08);

}

.estado-presente.seleccionado {

    background: #d9f7df;

}

.estado-atraso.seleccionado {

    background: #fff2bd;

}

.estado-licencia.seleccionado {

    background: #dceeff;

}

.estado-falta.seleccionado {

    background: #ffdede;

}

.observacion {

    min-width: 180px;

    width: 100%;

    padding: 7px;

    border: 1px solid #ccc;

    border-radius: 6px;

    font-size: 14px;

}


/* =====================================================
   MODAL NUEVA ACTIVIDAD
===================================================== */

.modal-fondo {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.55);

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 15px;

    z-index: 9999;

}

.modal-actividad {

    width: 100%;

    max-width: 520px;

    background: white;

    border-radius: 14px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.30);

    overflow: hidden;

    animation:
        aparecerModal .18s ease-out;

}

@keyframes aparecerModal {

    from {

        opacity: 0;

        transform: scale(.94);

    }

    to {

        opacity: 1;

        transform: scale(1);

    }

}

.modal-cabecera {

    background: #1557a6;

    color: white;

    padding: 15px 18px;

    display: flex;

    align-items: center;

    justify-content: space-between;

}

.modal-cabecera h3 {

    margin: 0;

    font-size: 18px;

}

.boton-cerrar-modal {

    width: 34px;

    height: 34px;

    padding: 0;

    background: rgba(255,255,255,.18);

    color: white;

    font-size: 23px;

    border-radius: 7px;

    display: flex;

    align-items: center;

    justify-content: center;

    border: none;

    cursor: pointer;

}

.modal-cuerpo {

    padding: 20px;

}

.modal-cuerpo .campo {

    margin-bottom: 17px;

}


/* =====================================================
   RADIO BUTTONS DE CATEGORÍA
===================================================== */

.opciones-categoria {

    display: flex;

    gap: 8px;

    justify-content: space-between;

    width: 100%;

}

.opcion-categoria {

    position: relative;

    flex: 1;

    min-width: 0;

}

.opcion-categoria input {

    position: absolute;

    opacity: 0;

    width: 1px;

    height: 1px;

}

.opcion-categoria label {

    margin: 0;

    min-height: 72px;

    padding: 10px 5px;

    border: 2px solid #ddd;

    border-radius: 12px;

    text-align: center;

    cursor: pointer;

    font-size: 28px;

    background: #fafafa;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    transition: .18s;

}

.opcion-categoria label:hover {

    border-color: #aaa;

    transform: translateY(-2px);

}

.opcion-categoria label span {

    display: none;

    font-size: 12px;

    line-height: 1.2;

    margin-top: 5px;

    font-weight: bold;

}

.opcion-categoria input:checked + label {

    border-color: #1557a6;

    background: #eaf2ff;

    box-shadow:
        0 3px 10px rgba(21,87,166,.15);

}

.opcion-categoria input:checked + label span {

    display: block;

    color: #1557a6;

}


/* =====================================================
   ACCIONES MODAL
===================================================== */

.modal-acciones {

    display: flex;

    flex-direction: row;

    justify-content: flex-end;

    align-items: center;

    gap: 10px;

    margin-top: 20px;

}

.modal-acciones button {

    flex: 0 0 auto;

    width: auto;

    min-width: 120px;

    border: none;

    border-radius: 8px;

    padding: 10px 15px;

    cursor: pointer;

    font-size: 15px;

}

.boton-cancelar {

    background: #777;

    color: white;

}

.boton-crear-modal {

    background: #16803c;

    color: white;

}


/* =====================================================
   BOTONES INFERIORES
===================================================== */

.botones {

    margin-top: 25px;

    display: flex;

    gap: 12px;

    flex-wrap: wrap;

}

.botones button {

    border: none;

    border-radius: 8px;

    padding: 10px 15px;

    cursor: pointer;

    font-size: 15px;

}

.guardar {

    background: #16803c;

    color: white;

}

.exportar {

    background: #1565c0;

    color: white;

}

.salir {

    background: #c62828;

    color: white;

}


/* =====================================================
   MENSAJES
===================================================== */

.mensaje {

    margin-top: 15px;

    font-weight: bold;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 800px) {

    .panel {

        padding: 15px;

    }

    .encabezado-actividad {

        align-items: stretch;

    }

    .izquierda-actividad {

        flex: 1;

        min-width: 0;

    }

    .derecha-actividad {

        margin-left: auto;

    }

}


/* =====================================================
   CELULARES
===================================================== */

@media (max-width: 600px) {

    .contenedor {

        width: 100%;

        margin: 10px auto;

    }

    .panel {

        padding: 10px;

        border-radius: 10px;

    }

    h1 {

        font-size: 24px;

    }

    .encabezado-actividad {

        flex-wrap: wrap;

    }

    .izquierda-actividad {

        width: 100%;

        min-width: 0;

    }

    .derecha-actividad {

        width: 100%;

        justify-content: flex-end;

    }

    .opciones-categoria {

        gap: 5px;

    }

    .opcion-categoria label {

        min-height: 64px;

        padding: 8px 3px;

        font-size: 24px;

    }

    .opcion-categoria label span {

        font-size: 10px;

    }

    .modal-acciones {

        flex-direction: row;

        gap: 8px;

    }

    .modal-acciones button {

        flex: 1;

        min-width: 0;

        padding: 10px 8px;

        font-size: 14px;

    }

    .tabla-contenedor {

        width: 100%;

        overflow-x: auto;

    }

    table {

        width: 100%;

        min-width: 0;

        table-layout: fixed;

    }

    th,
    td {

        padding: 6px 4px;

        font-size: 13px;

    }

    td.nombre {

        white-space: normal;

        overflow-wrap: anywhere;

        word-break: normal;

        line-height: 1.2;

    }

    .nota-input {

        width: 58px;

        max-width: 100%;

        padding: 6px 2px;

        font-size: 14px;

    }

    .observacion {

        min-width: 120px;

        font-size: 12px;

    }

    .estado-btn {

        width: 34px;

        height: 32px;

        font-size: 17px;

    }

    .resumen {

        gap: 8px;

        font-size: 12px;

    }

    .control-fecha {

        width: 100%;

    }

    .modal-actividad {

        max-width: 100%;

    }

    .modal-cuerpo {

        padding: 16px;

    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media (max-width: 400px) {

    .panel {

        padding: 8px;

    }

    .actividad {

        margin: 10px;

    }

    .opciones-categoria {

        gap: 3px;

    }

    .opcion-categoria label {

        min-height: 58px;

        font-size: 21px;

    }

    .opcion-categoria label span {

        font-size: 9px;

    }

    th,
    td {

        padding: 5px 3px;

        font-size: 12px;

    }

    .estado-btn {

        width: 30px;

        height: 30px;

        font-size: 15px;

    }

}


/* =====================================================
   EVITAR DESBORDAMIENTO
===================================================== */

th,
td,
.nombre-actividad,
.titulo-categoria,
.titulo-general {

    overflow-wrap: anywhere;

}

</style>

</head>


<body>

<div class="contenedor">

<div class="panel">

<h1>Panel Docente</h1>

<div class="usuario">

Usuario:
<span id="usuario"></span>

</div>


<!-- =====================================================
     FILTROS
===================================================== -->

<div class="filtros">

<div class="filtro">

<label>Curso</label>

<select id="buscarCurso">

Selecciona un curso

</select>

</div>

</div>

<div

<div

<span>

📝

+

</div>

</table>

</div>

</div>

</div>


<!-- =====================================================

<div
    id="seccionAsistencia"

</div>

>

</div>

</div>

<th>Observación</th>

</thead>

<tbody
    id="tablaAsistencia">
</tbody>

</table>

</div>

</div>


<!-- =====================================================
     BOTONES
===================================================== -->

<div class="botones">

<button
    class="guardar"
    onclick="guardarNotas()">

💾 Guardar notas

</button>


<button
    class="exportar"
    onclick="exportarExcel()">

📊 Exportar Excel

</button>


<button
    class="salir"
    onclick="cerrarSesion()">

🚪 Cerrar sesión

</button>

</div>


<div
    id="mensaje"

</div>

</div>

</div>


<!-- =====================================================
     MODAL NUEVA ACTIVIDAD
===================================================== -->

<div
    id="modalNuevaActividad"

📝 Crear nueva actividad

    onclick="cerrarModalActividad()"

×

</button>

</div>


<div class="modal-cuerpo">

<div class="campo">

<label>
Nombre de la actividad
</label>

<input
    type="text"

>

Categoría
</label>

     RADIO BUTTONS

HACER — 40 puntos

</label>

</div>


<div class="opcion-categoria">

<input
    type="radio"

⭐

AUTOEVALUACIÓN — 5 puntos

</div>

</div>


<div class="modal-acciones">

<button

    class="boton-cancelar"

Cancelar

</button>


<button
    type="button"
    class="boton-crear-modal"

📝 Crear actividad

</button>

</div>

</div>

</div>

</div>

<script>

/* =====================================================

/* =====================================================

let estudiantes = [];

let actividades = [];

let calificaciones = {};

let cursoSeleccionado = "";


/* =====================================================
   LIMITES
===================================================== */

const LIMITES = {

    SER: 10,

    select.value;


    select.innerHTML = `

        ...new Set(

        valorAnterior &&
        cursos.includes(
            valorAnterior
        )
    ) {

        select.value =

async function cargarActividades() {

    const {
        data,
        error
    } =
    await supabaseClient
    .from("actividades")
    .select(
        "id,curso,trimestre,categoria,nombre,orden,puntaje_maximo"
    )
    .eq(
        "curso",
        cursoSeleccionado
    )
    .eq(
        "trimestre",
        3
    )
    .order(
        "orden"
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar actividades: " +
            error.message,
            true
        );

        return;

    }


    actividades =
    data || [];


    await cargarCalificaciones();


    mostrarActividades();

}


/* =====================================================
   CARGAR CALIFICACIONES
===================================================== */

async function cargarCalificaciones() {

    calificaciones = {};


    if (
        actividades.length === 0
    ) {

        return;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    const idsEstudiantes =
    estudiantesCurso.map(
        e => e.id
    );


    const idsActividades =
    actividades.map(
        a => a.id
    );


    if (
        idsEstudiantes.length === 0 ||
        idsActividades.length === 0
    ) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("calificaciones")
    .select(
        "id,actividad_id,estudiante_id,nota"
    )
    .in(
        "actividad_id",
        idsActividades
    )
    .in(
        "estudiante_id",
        idsEstudiantes
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar calificaciones: " +
            error.message,
            true
        );

        return;

    }


    (data || []).forEach(
    cal => {

        if (
            !calificaciones[
                cal.estudiante_id
            ]
        ) {

            calificaciones[
                cal.estudiante_id
            ] = {};

        }


        calificaciones[
            cal.estudiante_id
        ][
            cal.actividad_id
        ] =
        cal.nota;

    });

}

            ] &&

                estudiante.id
            ][
                actividad.id
            ] !== undefined
        ) {

        );

                    max="${puntajeMaximo}"

                    step="0.01"

                        nota === null
                        ? ""
                        : nota
                    }"

                    }"

                        actividad.id
                    }"

                    data-maximo="${
                        puntajeMaximo
                    }"

    function() {

        actividadesDesbloqueadas.has(
            actividad.id
        );


        const inputs =
        bloque.querySelectorAll(
            ".nota-input"
        );


        if (desbloqueada) {

            inputs.forEach(
            input => {

                input.disabled =
                true;

                input.classList.remove(
                    "editable"
                );

            });


            actividadesDesbloqueadas.delete(
                actividad.id
            );


            botonBloquear.textContent =
            "🔒";


            botonBloquear.title =
            "Desbloquear notas";

        }

        else {

            inputs.forEach(
            input => {

                input.disabled =
                false;

                input.classList.add(
                    "editable"
                );

            });


            actividadesDesbloqueadas.add(
                actividad.id
            );


            botonBloquear.textContent =
            "🔓";


            botonBloquear.title =
            "Bloquear notas";

        }

    };


    botonEliminar.onclick =
    function() {

        eliminarActividad(
            actividad
        );

    };


    return bloque;

}


/* =====================================================
   EDITAR NOMBRE
===================================================== */

async function editarNombreActividad(
    actividad
) {

    const nuevoNombre =
    prompt(
        "Escribe el nuevo nombre de la actividad:",
        actividad.nombre
    );


    if (
        nuevoNombre === null
    ) {

        return;

    }


    const nombre =
    nuevoNombre.trim();


    if (!nombre) {

        alert(
            "El nombre no puede estar vacío."
        );

        return;

    }


    if (
        nombre ===
        actividad.nombre
    ) {

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .update({

        nombre:
        nombre

    })
    .eq(
        "id",
        actividad.id
    );


    if (error) {

        alert(
            "Error al cambiar el nombre: " +
            error.message
        );

        return;

    }


    actividad.nombre =
    nombre;


    const elemento =
    document.getElementById(
        "nombre-actividad-" +
        actividad.id
    );


    if (elemento) {

        elemento.textContent =
        nombre;

    }


    mostrarMensaje(
        "✓ Nombre actualizado correctamente."
    );

}


/* =====================================================
   VALIDAR NOTA
===================================================== */

function validarNota(input) {

    if (
        input.value === ""
    ) {

        return true;

    }


    const valor =
    Number(
        input.value
    );


    const maximo =
    Number(
        input.dataset.maximo
    );


    if (
        valor < 0 ||
        valor > maximo
    ) {

        alert(

            "La nota debe estar entre 0 y " +
            maximo

        );


        input.value = "";


        return false;

    }


    return true;

}


/* =====================================================
   CREAR ACTIVIDAD
===================================================== */

async function crearActividad() {

    if (
        !cursoSeleccionado
    ) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const nombre =
    document.getElementById(
        "nombreActividad"
    ).value.trim();


    const radioSeleccionado =
    document.querySelector(
        'input[name="categoriaActividad"]:checked'
    );


    if (!nombre) {

        alert(
            "Escribe el nombre de la actividad."
        );

        document.getElementById(
            "nombreActividad"
        ).focus();

        return;

    }


    /*
       OBLIGAR A SELECCIONAR
       UNA CATEGORÍA
    */

    if (
        !radioSeleccionado
    ) {

        alert(
            "Selecciona una categoría: SER, SABER, HACER o AUTOEVALUACIÓN."
        );

        return;

    }


    const categoria =
    radioSeleccionado.value;


    let orden = 1;


    if (
        actividades.length > 0
    ) {

        orden =
        Math.max(

            ...actividades.map(
                a =>
                Number(
                    a.orden || 0
                )
            )

        ) + 1;

    }


    const puntajeMaximo =
    LIMITES[
        categoria
    ];


    mostrarMensaje(
        "Creando actividad..."
    );


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .insert({

        curso:
        cursoSeleccionado,

        trimestre:
        3,

        categoria:
        categoria,

        nombre:
        nombre,

        orden:
        orden,

        puntaje_maximo:
        puntajeMaximo

    });


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al crear actividad: " +
            error.message,
            true
        );

        return;

    }


    cerrarModalActividad();


    mostrarMensaje(
        "✓ Actividad creada correctamente."
    );


    await cargarActividades();


    aplicarBusqueda();

}


/* =====================================================
   ELIMINAR ACTIVIDAD
===================================================== */

async function eliminarActividad(
    actividad
) {

    const confirmar =
    confirm(

        "¿Está seguro de eliminar esta actividad?\n\n" +

        "Actividad: " +
        actividad.nombre +

        "\n\nTambién se eliminarán sus calificaciones."

    );


    if (!confirmar) {

        return;

    }


    mostrarMensaje(
        "Eliminando actividad..."
    );


    const {
        error:
        errorCalificaciones
    } =
    await supabaseClient
    .from("calificaciones")
    .delete()
    .eq(
        "actividad_id",
        actividad.id
    );


    if (
        errorCalificaciones
    ) {

        mostrarMensaje(
            "Error al eliminar calificaciones: " +
            errorCalificaciones.message,
            true
        );

        return;

    }


    const {
        error:
        errorActividad
    } =
    await supabaseClient
    .from("actividades")
    .delete()
    .eq(
        "id",
        actividad.id
    );


    if (errorActividad) {

        mostrarMensaje(
            "Error al eliminar actividad: " +
            errorActividad.message,
            true
        );

        return;

    }


    actividadesDesbloqueadas.delete(
        actividad.id
    );


    await cargarActividades();


    mostrarMensaje(
        "✓ Actividad eliminada correctamente."
    );

}

    ) {

        contenido.classList.remove(
            "oculto"
        );


        boton.textContent =
        "−";

    }

    else {

        contenido.classList.add(
            "oculto"
        );


        boton.textContent =
        "+";

    }

}


/* =====================================================
   ASISTENCIA
===================================================== */

function fechaHoy() {

    const ahora =
    new Date();

    const offset =
    ahora.getTimezoneOffset();

    const local =
    new Date(
        ahora.getTime() -
        offset * 60000
    );


    return local
        .toISOString()
        .slice(
            0,
            10
        );

}


/* =====================================================
   CARGAR ASISTENCIA
===================================================== */

async function cargarAsistencia() {

    if (
        !cursoSeleccionado
    ) {

        return;

    }


    const seccion =
    document.getElementById(
        "seccionAsistencia"
    );


    seccion.classList.remove(
        "oculto"
    );


    const fecha =
    document.getElementById(
        "fechaAsistencia"
    );


    if (!fecha.value) {

        fecha.value =
        fechaHoy();

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    const ids =
    estudiantesCurso.map(
        e =>
        e.id
    );


    if (
        ids.length === 0
    ) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("asistencias")
    .select(
        "estudiante_id,estado,observacion"
    )
    .eq(
        "fecha",
        fecha.value
    )
    .in(
        "estudiante_id",
        ids
    );


    if (error) {

        console.error(error);

        /*
           Si todavía no existe la tabla
           se muestra el listado igualmente.
        */

        crearTablaAsistencia([]);

        return;

    }


    crearTablaAsistencia(
        data || []
    );

}

        mapa[
            registro.estudiante_id

    });

    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    estudiantesCurso.forEach(

        mapa[

                    String(

                    title="Presente">

                    🟢

                </button>

            </td>

            <td>

                <button
                    type="button"
                    class="estado-btn estado-atraso ${
                        registro.estado ===
                        "ATRASO"
                        ? "seleccionado"
                        : ""
                    }"
                    data-estado="ATRASO"
                    title="Atraso">

                    🟡

                </button>

            </td>

            <td>

                <button
                    type="button"
                    class="estado-btn estado-licencia ${
                        registro.estado ===
                        "LICENCIA"
                        ? "seleccionado"
                        : ""
                    }"
                    data-estado="LICENCIA"
                    title="Falta con licencia">

                    🔵

                </button>

            </td>

            <td>

                <button
                    type="button"
                    class="estado-btn estado-falta ${
                        registro.estado ===
                        "FALTA"
                        ? "seleccionado"
                        : ""
                    }"

                    title="Falta sin licencia">

                    🔴

                <input

                        estudiante.id
                    }"
                    value="${escapeHTML(
                        registro.observacion || ""
                    )}"
                    placeholder="Observación">

            </td>

        `;


        fila
        .querySelectorAll(
            ".estado-btn"
        )
        .forEach(
        boton => {

            boton.onclick =
            function() {

                fila
                .querySelectorAll(
                    ".estado-btn"
                )
                .forEach(
                    otro => {

                        otro.classList.remove(
                            "seleccionado"
                        );

                    }
                );


                boton.classList.add(
                    "seleccionado"
                );


                actualizarResumen();

            };

        });


        tabla.appendChild(
            fila
        );

    });


    actualizarResumen();


    aplicarBusqueda();

}


/* =====================================================
   GUARDAR ASISTENCIA
===================================================== */

async function guardarAsistencia() {

    if (
        !cursoSeleccionado
    ) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const fecha =
    document.getElementById(
        "fechaAsistencia"
    ).value;


    if (!fecha) {

        alert(
            "Selecciona una fecha."
        );

        return;

    }


    const registros = [];


    document
    .querySelectorAll(
        "#tablaAsistencia tr"
    )
    .forEach(
    fila => {

        const seleccionado =
        fila.querySelector(
            ".estado-btn.seleccionado"
        );


        const observacion =
        fila.querySelector(
            ".observacion"
        );


        if (
            !observacion
        ) {

            return;

        }


        const estudianteId =
        Number(
            observacion.dataset.estudiante
        );


        if (
            seleccionado
        ) {

            registros.push({

                estudiante_id:
                estudianteId,

                fecha:
                fecha,

                estado:
                seleccionado.dataset.estado,

                observacion:
                observacion.value.trim() ||
                null

            });

        }

    });


    if (
        registros.length === 0
    ) {

        alert(
            "Selecciona al menos un estado de asistencia."
        );

        return;

    }


    mostrarMensaje(
        "Guardando asistencia..."
    );


    const {
        error
    } =
    await supabaseClient
    .from("asistencias")
    .upsert(
        registros,
        {
            onConflict:
            "estudiante_id,fecha"
        }
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al guardar asistencia: " +
            error.message,
            true
        );

        return;

    }


    mostrarMensaje(
        "✓ Asistencia guardada correctamente."
    );


    actualizarResumen();

}

function actualizarResumen() {

    const conteo = {

        PRESENTE: 0,

        ATRASO: 0,

        LICENCIA: 0,

        FALTA: 0

    };


    document
    .querySelectorAll(
        "#tablaAsistencia .estado-btn.seleccionado"

    .forEach(
    boton => {

        boton.dataset.estado;


        if (

    document.getElementById(

    " Atrasos";


    document.getElementById(

}

            );

===================================================== */

async function guardarNotas() {

    if (
        !cursoSeleccionado
    ) {

        alert(
            "Primero selecciona un curso."
        );

        return false;

    }


    const inputs =
    document.querySelectorAll(
        ".nota-input"
    );


    const registros = [];


    inputs.forEach(
    input => {

        if (
            input.value === ""
        ) {

            return;

        }


        const valor =
        Number(
            input.value
        );


        const maximo =
        Number(
            input.dataset.maximo
        );


        if (
            valor < 0 ||
            valor > maximo
        ) {

            return;

        }


        registros.push({

            actividad_id:
            Number(
                input.dataset.actividad
            ),

            estudiante_id:
            Number(
                input.dataset.estudiante
            ),

            nota:
            valor

        });

    });


    if (
        registros.length === 0
    ) {

        alert(
            "No hay notas para guardar."
        );

        return false;

    }


    mostrarMensaje(
        "Guardando calificaciones..."
    );


    const {
        error
    } =
    await supabaseClient
    .from("calificaciones")
    .upsert(
        registros,
        {
            onConflict:
            "actividad_id,estudiante_id"
        }
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al guardar calificaciones: " +
            error.message,
            true
        );

        return false;

    }


    mostrarMensaje(
        "✓ Calificaciones guardadas correctamente."
    );


    await cargarCalificaciones();


    return true;

}


/* =====================================================
   MOSTRAR NOTA
===================================================== */

function mostrarNota(
    nota
) {

    if (
        nota === null ||
        nota === undefined ||
        nota === ""
    ) {

        return "";

    }


    return Math.round(
        Number(nota)
    );

}

async function exportarExcel() {

    if (
        typeof XLSX ===
        "undefined"
    ) {

        alert(
            "No se pudo cargar la herramienta de Excel."
        );

        return;

    }


    if (
        !cursoSeleccionado
    ) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const datos = [

        [
            "Nº LISTA",
            "NOMBRE",
            "CURSO",
            "1T",
            "2T",
            "3T",
            "FINAL"
        ]

    ];


    estudiantes
    .filter(
        e =>
        e.curso ===
        cursoSeleccionado
    )
    .forEach(
    estudiante => {

        datos.push([

            estudiante.num_lista ??
            "",

            estudiante.nombre ??
            "",

            estudiante.curso ??
            "",

            mostrarNota(
                estudiante.nota_1t
            ),

            mostrarNota(
                estudiante.nota_2t
            ),

            mostrarNota(
                estudiante.nota_3t
            ),

            mostrarNota(
                estudiante.final
            )

        ]);

    });


    const libro =
    XLSX.utils.book_new();


    const hoja =
    XLSX.utils.aoa_to_sheet(
        datos
    );


    hoja["!cols"] = [

        {
            wch: 12
        },

        {
            wch: 35
        },

        {
            wch: 15
        },

        {
            wch: 8
        },

        {
            wch: 8
        },

        {
            wch: 8
        },

        {
            wch: 10
        }

    ];


    XLSX.utils.book_append_sheet(

        libro,

        hoja,

        "Calificaciones"

    );


    XLSX.writeFile(

        libro,

        "Calificaciones_" +
        cursoSeleccionado +
        ".xlsx"

    );


    mostrarMensaje(
        "✓ Excel exportado correctamente."
    );

}

/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(
    texto
) {

    return String(
        texto ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
