<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #263238;
}

button,
input,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}


/* =====================================================
   ENCABEZADO
===================================================== */

.header {
    background: #ffffff;
    padding: 14px 20px;
    border-bottom: 1px solid #e1e6eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.header-title {
    font-size: 22px;
    font-weight: bold;
    color: #263238;
}

.header-subtitle {
    font-size: 13px;
    color: #78909c;
    margin-top: 3px;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.container {
    width: 100%;
    max-width: 1400px;
    margin: auto;
    padding: 18px;
}


/* =====================================================
   BARRA DE CONTROLES
===================================================== */

.controls {
    background: #ffffff;
    border-radius: 12px;
    padding: 14px;
    display: flex;
    align-items: end;
    gap: 10px;
    flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
    margin-bottom: 15px;
}

.control-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.control-group label {
    font-size: 12px;
    font-weight: bold;
    color: #607d8b;
}

.control-group select,
.control-group input {
    height: 40px;
    border: 1px solid #d7dee5;
    border-radius: 8px;
    padding: 0 12px;
    background: #fff;
    outline: none;
    min-width: 210px;
}

.control-group select:focus,
.control-group input:focus {
    border-color: #1976d2;
}


/* =====================================================
   BOTONES
===================================================== */

.btn {
    border: none;
    border-radius: 8px;
    min-height: 40px;
    padding: 0 15px;
    font-weight: bold;
    transition: .2s;
}

.btn:hover {
    transform: translateY(-1px);
}

.btn-primary {
    background: #1976d2;
    color: white;
}

.btn-success {
    background: #2e7d32;
    color: white;
}

.btn-danger {
    background: #d32f2f;
    color: white;
}

.btn-secondary {
    background: #eceff1;
    color: #37474f;
}

.btn-warning {
    background: #f9a825;
    color: white;
}


/* =====================================================
   ENCABEZADO CALIFICACIONES
===================================================== */

.course-header {
    background: #ffffff;
    border-radius: 12px;
    padding: 13px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
}

.course-title {
    font-size: 17px;
    font-weight: bold;
}

.course-title span {
    color: #1976d2;
}

.course-actions {
    display: flex;
    align-items: center;
    gap: 7px;
}


/* =====================================================
   BOTÓN AGREGAR ACTIVIDAD
===================================================== */

.activity-add-btn {
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 8px;
    background: #1976d2;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    padding: 0;
    transition: .2s;
}

.activity-add-btn:hover {
    background: #1565c0;
    transform: translateY(-1px);
}


/* =====================================================
   CONTENEDOR DE ACTIVIDADES
===================================================== */

.activities-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
}


/* =====================================================
   CATEGORÍA
===================================================== */

.category-card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
    overflow: hidden;
}

.category-header {
    min-height: 52px;
    padding: 9px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-bottom: 1px solid #edf0f2;
}

.category-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: bold;
    font-size: 15px;
}


/* =====================================================
   ICONOS DE CATEGORÍAS
   PEQUEÑOS - SIN CONTORNOS
===================================================== */

.category-icon {
    width: 27px;
    height: 27px;
    min-width: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    line-height: 1;
    border: none;
    background: transparent;
    padding: 0;
}


/* Iconos diferenciados */

.icon-ser {
    color: #7e57c2;
}

.icon-saber {
    color: #1976d2;
}

.icon-hacer {
    color: #ef6c00;
}

.icon-auto {
    color: #2e7d32;
}


/* =====================================================
   BOTÓN OCULTAR CATEGORÍA
===================================================== */

.category-toggle {
    border: none;
    background: transparent;
    color: #78909c;
    font-size: 17px;
    width: 30px;
    height: 30px;
    border-radius: 6px;
}

.category-toggle:hover {
    background: #f1f3f4;
}


/* =====================================================
   ACTIVIDAD
===================================================== */

.activity {
    border-bottom: 1px solid #edf0f2;
}

.activity:last-child {
    border-bottom: none;
}

.activity-header {
    min-height: 46px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.activity-name {
    font-size: 14px;
    font-weight: bold;
    word-break: break-word;
}

.activity-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
}

.icon-btn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 7px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
}

.icon-btn:hover {
    background: #eceff1;
}

.icon-btn.edit {
    color: #1976d2;
}

.icon-btn.lock {
    color: #ef6c00;
}

.icon-btn.delete {
    color: #d32f2f;
}


/* =====================================================
   TABLA
===================================================== */

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

.grade-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.grade-table th {
    background: #f7f9fa;
    color: #607d8b;
    font-size: 11px;
    font-weight: bold;
    padding: 8px 6px;
    text-align: center;
    border-bottom: 1px solid #e3e8ec;
}

.grade-table td {
    padding: 7px 6px;
    border-bottom: 1px solid #edf0f2;
    font-size: 13px;
    vertical-align: middle;
}

.grade-table th:first-child,
.grade-table td:first-child {
    width: 48px;
    text-align: center;
}

.grade-table th:nth-child(2),
.grade-table td:nth-child(2) {
    width: 35%;
    text-align: left;
}

.grade-table th:nth-child(3),
.grade-table td:nth-child(3) {
    width: 100px;
    text-align: center;
}

.grade-input {
    width: 65px;
    height: 32px;
    border: 1px solid #d7dee5;
    border-radius: 6px;
    text-align: center;
    outline: none;
    font-weight: bold;
}

.grade-input:focus {
    border-color: #1976d2;
}

.grade-input:disabled {
    background: #f1f3f4;
    color: #78909c;
}

.student-name {
    word-break: break-word;
    overflow-wrap: anywhere;
}


/* =====================================================
   PIE DE ACTIVIDAD
===================================================== */

.activity-footer {
    padding: 8px 14px;
    background: #fafbfc;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.activity-info {
    font-size: 11px;
    color: #78909c;
}

.save-btn {
    min-height: 34px;
    padding: 0 12px;
    border: none;
    border-radius: 7px;
    background: #2e7d32;
    color: white;
    font-size: 12px;
    font-weight: bold;
}


/* =====================================================
   MODAL
===================================================== */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 1000;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    background: white;
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,.25);
}

.modal-header {
    padding: 16px 18px;
    border-bottom: 1px solid #e9edef;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-title {
    font-size: 18px;
    font-weight: bold;
}

.modal-close {
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 7px;
    background: transparent;
    font-size: 22px;
    color: #607d8b;
}

.modal-close:hover {
    background: #eceff1;
}

.modal-body {
    padding: 18px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
    font-weight: bold;
    color: #455a64;
}

.form-group input,
.form-group select {
    width: 100%;
    height: 42px;
    border: 1px solid #d5dce1;
    border-radius: 8px;
    padding: 0 12px;
    outline: none;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    border-color: #1976d2;
}


/* =====================================================
   CATEGORÍAS DEL MODAL
===================================================== */

.category-options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.category-option {
    position: relative;
}

.category-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.category-option label {
    height: 48px;
    border: 1px solid #dce2e6;
    border-radius: 9px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    cursor: pointer;
    transition: .2s;
    font-size: 13px;
    font-weight: bold;
    color: #455a64;
}

.category-option label:hover {
    background: #f7f9fa;
}

.category-option input:checked + label {
    border-color: #1976d2;
    background: #eef6ff;
    color: #1976d2;
}

.modal-category-icon {
    font-size: 17px;
    width: 23px;
    text-align: center;
}


/* =====================================================
   BOTONES MODAL
===================================================== */

.modal-footer {
    padding: 14px 18px;
    border-top: 1px solid #e9edef;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.modal-footer button {
    min-height: 40px;
    padding: 0 16px;
}


/* =====================================================
   MENSAJES
===================================================== */

.message {
    padding: 14px;
    background: white;
    border-radius: 10px;
    text-align: center;
    color: #607d8b;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
}

.loading {
    padding: 30px;
    text-align: center;
    color: #607d8b;
}

.empty {
    padding: 30px;
    text-align: center;
    color: #90a4ae;
}


/* =====================================================
   TOAST
===================================================== */

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #263238;
    color: white;
    padding: 12px 17px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(10px);
    transition: .25s;
    z-index: 2000;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 700px) {

    .header {
        padding: 12px 14px;
    }

    .header-title {
        font-size: 18px;
    }

    .container {
        padding: 10px;
    }

    .controls {
        padding: 11px;
        align-items: stretch;
    }

    .control-group {
        width: 100%;
    }

    .control-group select,
    .control-group input {
        width: 100%;
        min-width: 0;
    }

    .controls .btn {
        width: 100%;
    }

    .course-header {
        padding: 11px;
    }

    .course-title {
        font-size: 14px;
    }

    .activity-add-btn {
        width: 35px;
        height: 35px;
        font-size: 17px;
    }

    .category-header {
        padding: 8px 10px;
    }

    .category-title {
        font-size: 14px;
    }

    .category-icon {
        width: 25px;
        min-width: 25px;
        height: 25px;
        font-size: 16px;
    }

    .activity-header {
        padding: 7px 10px;
    }

    .activity-name {
        font-size: 13px;
    }

    .activity-actions {
        gap: 1px;
    }

    .icon-btn {
        width: 29px;
        height: 29px;
        font-size: 14px;
    }

    /*
       En celular la tabla ocupa todo el ancho.
       El nombre puede pasar a varias líneas.
    */

    .grade-table {
        table-layout: fixed;
    }

    .grade-table th:first-child,
    .grade-table td:first-child {
        width: 38px;
    }

    .grade-table th:nth-child(2),
    .grade-table td:nth-child(2) {
        width: auto;
    }

    .grade-table th:nth-child(3),
    .grade-table td:nth-child(3) {
        width: 75px;
    }

    .grade-input {
        width: 55px;
        height: 30px;
    }

    .student-name {
        white-space: normal;
        line-height: 1.2;
    }

    .activity-footer {
        padding: 8px 10px;
    }

    .category-options {
        grid-template-columns: 1fr;
    }

    .modal {
        max-height: 94vh;
    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media (max-width: 400px) {

    .course-header {
        flex-wrap: wrap;
    }

    .course-actions {
        margin-left: auto;
    }

    .category-title {
        font-size: 13px;
    }

    .activity-header {
        align-items: flex-start;
    }

    .activity-name {
        max-width: calc(100% - 90px);
    }

    .grade-table th,
    .grade-table td {
        padding: 6px 3px;
    }

    .grade-table th:nth-child(3),
    .grade-table td:nth-child(3) {
        width: 68px;
    }

}


/* =====================================================
   ESTADOS
===================================================== */

.hidden {
    display: none !important;
}

.locked {
    opacity: .85;
}

.approved {
    color: #2e7d32;
}

.failed {
    color: #d32f2f;
}

</style>

</head>


<body>


<!-- =====================================================
     ENCABEZADO
===================================================== -->

<header class="header">

    <div>
        <div class="header-title">
            Panel Docente
        </div>

        <div class="header-subtitle">
            Gestión de actividades y calificaciones
        </div>
    </div>

</header>


<!-- =====================================================
     CONTENIDO
===================================================== -->

<main class="container">


    <!-- =================================================
         CONTROLES
    ================================================== -->

    <section class="controls">


        <!-- CURSO PRIMERO -->

        <div class="control-group">

            <label for="courseSelect">
                Seleccionar curso
            </label>

            <select id="courseSelect">

                <option value="">
                    Seleccionar curso
                </option>

            </select>

        </div>


        <!-- BUSCAR DESPUÉS -->

        <div class="control-group">

            <label for="searchInput">
                Buscar estudiante
            </label>

            <input
                type="text"
                id="searchInput"
                placeholder="Nombre o número..."
                autocomplete="off"
            >

        </div>


        <button
            class="btn btn-secondary"
            id="clearSearchBtn"
            type="button"
        >
            Limpiar
        </button>


        <button
            class="btn btn-success"
            id="exportBtn"
            type="button"
        >
            📊 Exportar
        </button>

    </section>


    <!-- =================================================
         ENCABEZADO DEL CURSO
    ================================================== -->

    <section class="course-header">

        <div class="course-title">
            Calificaciones del curso
            <span id="selectedCourseName"></span>
        </div>

        <div class="course-actions">

            <!-- ICONO PARA CREAR ACTIVIDAD -->

            <button
                type="button"
                class="activity-add-btn"
                id="openActivityModal"
                title="Crear nueva actividad"
                aria-label="Crear nueva actividad"
            >
                📝
            </button>

        </div>

    </section>


    <!-- =================================================
         ACTIVIDADES
    ================================================== -->

    <section
        id="activitiesContainer"
        class="activities-container"
    >

        <div class="message">
            Selecciona un curso para mostrar las actividades.
        </div>

    </section>


</main>


<!-- =====================================================
     MODAL CREAR ACTIVIDAD
===================================================== -->

<div
    class="modal-overlay"
    id="activityModal"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >


        <!-- CABECERA -->

        <div class="modal-header">

            <div
                class="modal-title"
                id="modalTitle"
            >
                Crear nueva actividad
            </div>

            <button
                type="button"
                class="modal-close"
                id="closeActivityModal"
                aria-label="Cerrar"
            >
                ×
            </button>

        </div>


        <!-- CUERPO -->

        <div class="modal-body">


            <!-- NOMBRE -->

            <div class="form-group">

                <label for="activityName">
                    Nombre de la actividad
                </label>

                <input
                    type="text"
                    id="activityName"
                    placeholder="Ej. Trabajo práctico"
                    maxlength="100"
                >

            </div>


            <!-- CATEGORÍA -->

            <div class="form-group">

                <label>
                    Categoría
                </label>


                <div class="category-options">


                    <!-- SER -->

                    <div class="category-option">

                        <input
                            type="radio"
                            name="activityCategory"
                            id="catSer"
                            value="SER"
                        >

                        <label for="catSer">

                            <span class="modal-category-icon icon-ser">
                                👤
                            </span>

                            SER

                        </label>

                    </div>


                    <!-- SABER -->

                    <div class="category-option">

                        <input
                            type="radio"
                            name="activityCategory"
                            id="catSaber"
                            value="SABER"
                        >

                        <label for="catSaber">

                            <span class="modal-category-icon icon-saber">
                                💡
                            </span>

                            SABER

                        </label>

                    </div>


                    <!-- HACER -->

                    <div class="category-option">

                        <input
                            type="radio"
                            name="activityCategory"
                            id="catHacer"
                            value="HACER"
                        >

                        <label for="catHacer">

                            <span class="modal-category-icon icon-hacer">
                                🔧
                            </span>

                            HACER

                        </label>

                    </div>


                    <!-- AUTOEVALUACIÓN -->

                    <div class="category-option">

                        <input
                            type="radio"
                            name="activityCategory"
                            id="catAuto"
                            value="AUTOEVALUACION"
                        >

                        <label for="catAuto">

                            <span class="modal-category-icon icon-auto">
                                ✓
                            </span>

                            AUTOEVALUACIÓN

                        </label>

                    </div>


                </div>

            </div>


            <!-- TRIMESTRE -->

            <div class="form-group">

                <label for="trimesterSelect">
                    Trimestre
                </label>

                <select id="trimesterSelect">

                    <option value="3">
                        Tercer trimestre
                    </option>

                </select>

            </div>


        </div>


        <!-- PIE -->

        <div class="modal-footer">

            <button
                type="button"
                class="btn btn-secondary"
                id="cancelActivityBtn"
            >
                Cancelar
            </button>

            <button
                type="button"
                class="btn btn-primary"
                id="saveActivityBtn"
            >
                Crear actividad
            </button>

        </div>


    </div>

</div>


<!-- =====================================================
     TOAST
===================================================== -->

<div
    id="toast"
    class="toast"
></div>


<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

/*
   REEMPLAZA ESTOS DOS VALORES POR LOS DE TU PROYECTO.
*/

const SUPABASE_URL = "TU_SUPABASE_URL";

const SUPABASE_KEY = "TU_SUPABASE_PUBLISHABLE_KEY";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   VARIABLES
===================================================== */

let students = [];

let activities = [];

let editingActivityId = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const courseSelect =
    document.getElementById("courseSelect");

const searchInput =
    document.getElementById("searchInput");

const clearSearchBtn =
    document.getElementById("clearSearchBtn");

const exportBtn =
    document.getElementById("exportBtn");

const selectedCourseName =
    document.getElementById("selectedCourseName");

const activitiesContainer =
    document.getElementById("activitiesContainer");

const activityModal =
    document.getElementById("activityModal");

const openActivityModal =
    document.getElementById("openActivityModal");

const closeActivityModal =
    document.getElementById("closeActivityModal");

const cancelActivityBtn =
    document.getElementById("cancelActivityBtn");

const saveActivityBtn =
    document.getElementById("saveActivityBtn");

const activityName =
    document.getElementById("activityName");

const toast =
    document.getElementById("toast");


/* =====================================================
   MOSTRAR MENSAJE
===================================================== */

function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2500);

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   ICONO CATEGORÍA
===================================================== */

function getCategoryIcon(category) {

    switch (category) {

        case "SER":
            return `
                <span class="category-icon icon-ser">
                    👤
                </span>
            `;

        case "SABER":
            return `
                <span class="category-icon icon-saber">
                    💡
                </span>
            `;

        case "HACER":
            return `
                <span class="category-icon icon-hacer">
                    🔧
                </span>
            `;

        case "AUTOEVALUACION":
            return `
                <span class="category-icon icon-auto">
                    ✓
                </span>
            `;

        default:
            return `
                <span class="category-icon">
                    •
                </span>
            `;
    }

}


/* =====================================================
   NOMBRE CATEGORÍA
===================================================== */

function getCategoryName(category) {

    switch (category) {

        case "SER":
            return "SER";

        case "SABER":
            return "SABER";

        case "HACER":
            return "HACER";

        case "AUTOEVALUACION":
            return "AUTOEVALUACIÓN";

        default:
            return category;
    }

}


/* =====================================================
   CARGAR CURSOS
===================================================== */

async function loadCourses() {

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("matematica")
            .select("curso")
            .order("curso");


        if (error) {
            throw error;
        }


        const courses = [
            ...new Set(
                (data || [])
                    .map(item => item.curso)
                    .filter(Boolean)
            )
        ];


        courseSelect.innerHTML = `
            <option value="">
                Seleccionar curso
            </option>
        `;


        courses.forEach(course => {

            const option =
                document.createElement("option");

            option.value = course;

            option.textContent = course;

            courseSelect.appendChild(option);

        });


    } catch (error) {

        console.error(error);

        showToast(
            "No se pudieron cargar los cursos."
        );

    }

}


/* =====================================================
   CARGAR ESTUDIANTES
===================================================== */

async function loadStudents(course) {

    if (!course) {

        students = [];

        return;

    }


    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("matematica")
            .select("*")
            .eq("curso", course)
            .order("nombre");


        if (error) {
            throw error;
        }


        students = data || [];


    } catch (error) {

        console.error(error);

        students = [];

        showToast(
            "No se pudieron cargar los estudiantes."
        );

    }

}


/* =====================================================
   CARGAR ACTIVIDADES
===================================================== */

async function loadActivities(course) {

    activitiesContainer.innerHTML = `
        <div class="loading">
            Cargando actividades...
        </div>
    `;


    /*
       IMPORTANTE:

       Esta consulta supone que existe una tabla
       llamada "actividades" con campos similares a:

       id
       nombre
       categoria
       trimestre
       curso

       Si tu tabla tiene otro nombre, cambia
       "actividades" por el nombre correspondiente.
    */


    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("actividades")
            .select("*")
            .eq("curso", course)
            .eq("trimestre", 3)
            .order("id");


        if (error) {
            throw error;
        }


        activities = data || [];


        renderActivities();

    } catch (error) {

        console.error(error);


        activities = [];


        activitiesContainer.innerHTML = `
            <div class="message">
                No se encontraron actividades para este curso.
                <br><br>
                Puedes crear una nueva actividad usando el botón 📝.
            </div>
        `;

    }

}


/* =====================================================
   FILTRAR ESTUDIANTES
===================================================== */

function getFilteredStudents() {

    const search =
        searchInput.value
            .trim()
            .toLowerCase();


    if (!search) {
        return students;
    }


    return students.filter(student => {

        const name =
            String(student.nombre || "")
                .toLowerCase();

        const ci =
            String(student.ci || "")
                .toLowerCase();


        return (
            name.includes(search) ||
            ci.includes(search)
        );

    });

}


/* =====================================================
   RENDERIZAR ACTIVIDADES
===================================================== */

function renderActivities() {

    if (!courseSelect.value) {

        activitiesContainer.innerHTML = `
            <div class="message">
                Selecciona un curso para mostrar las actividades.
            </div>
        `;

        return;

    }


    if (!activities.length) {

        activitiesContainer.innerHTML = `
            <div class="empty">
                No hay actividades creadas para este curso.
                <br><br>
                Presiona 📝 para crear una actividad.
            </div>
        `;

        return;

    }


    const categories = [
        "SER",
        "SABER",
        "HACER",
        "AUTOEVALUACION"
    ];


    const filteredStudents =
        getFilteredStudents();


    let html = "";


    categories.forEach(category => {

        const categoryActivities =
            activities.filter(
                activity =>
                    activity.categoria === category
            );


        if (!categoryActivities.length) {
            return;
        }


        html += `

            <div class="category-card">

                <div class="category-header">

                    <div class="category-title">

                        ${getCategoryIcon(category)}

                        <span>
                            ${getCategoryName(category)}
                        </span>

                    </div>

                    <button
                        class="category-toggle"
                        type="button"
                        onclick="toggleCategory(this)"
                        title="Mostrar/Ocultar"
                    >
                        ▲
                    </button>

                </div>


                <div class="category-content">
        `;


        categoryActivities.forEach(activity => {

            html += renderActivity(
                activity,
                filteredStudents
            );

        });


        html += `

                </div>

            </div>

        `;

    });


    activitiesContainer.innerHTML =
        html ||
        `
            <div class="empty">
                No hay actividades disponibles.
            </div>
        `;

}


/* =====================================================
   RENDERIZAR ACTIVIDAD
===================================================== */

function renderActivity(activity, filteredStudents) {

    const locked =
        activity.bloqueada === true;


    let rows = "";


    filteredStudents.forEach((student, index) => {

        const grade =
            getActivityGrade(
                student,
                activity.id
            );


        rows += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td class="student-name">
                    ${escapeHtml(student.nombre)}
                </td>

                <td>
                    ${escapeHtml(student.ci || "")}
                </td>

                <td>

                    <input
                        type="number"
                        min="0"
                        max="100"
                        step="0.01"
                        class="grade-input"
                        data-student-id="${student.id}"
                        data-activity-id="${activity.id}"
                        value="${grade}"
                        ${locked ? "disabled" : ""}
                        onchange="markChanged(this)"
                    >

                </td>

            </tr>

        `;

    });


    return `

        <div
            class="activity ${locked ? "locked" : ""}"
            data-activity="${activity.id}"
        >


            <div class="activity-header">

                <div class="activity-name">

                    ${escapeHtml(activity.nombre)}

                    ${locked ? " 🔒" : ""}

                </div>


                <div class="activity-actions">


                    <button
                        type="button"
                        class="icon-btn edit"
                        title="Editar actividad"
                        onclick="editActivity('${activity.id}')"
                    >
                        ✏️
                    </button>


                    <button
                        type="button"
                        class="icon-btn lock"
                        title="${locked ? "Desbloquear" : "Bloquear"} actividad"
                        onclick="toggleActivityLock('${activity.id}', ${!locked})"
                    >
                        ${locked ? "🔓" : "🔒"}
                    </button>


                    <button
                        type="button"
                        class="icon-btn delete"
                        title="Eliminar actividad"
                        onclick="deleteActivity('${activity.id}')"
                    >
                        🗑️
                    </button>


                </div>

            </div>


            <div class="table-wrapper">

                <table class="grade-table">

                    <thead>

                        <tr>

                            <th>
                                Nº
                            </th>

                            <th>
                                Nombre
                            </th>

                            <th>
                                CI
                            </th>

                            <th>
                                Nota
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        ${
                            rows ||
                            `
                                <tr>
                                    <td
                                        colspan="4"
                                        style="text-align:center"
                                    >
                                        No hay estudiantes.
                                    </td>
                                </tr>
                            `
                        }

                    </tbody>

                </table>

            </div>


            <div class="activity-footer">

                <div class="activity-info">

                    ${filteredStudents.length}
                    estudiante(s)

                </div>


                ${
                    locked
                    ?
                    `
                        <span class="activity-info">
                            Actividad bloqueada
                        </span>
                    `
                    :
                    `
                        <button
                            type="button"
                            class="save-btn"
                            onclick="saveActivityGrades('${activity.id}')"
                        >
                            💾 Guardar notas
                        </button>
                    `
                }

            </div>


        </div>

    `;

}


/* =====================================================
   OBTENER NOTA
===================================================== */

function getActivityGrade(student, activityId) {

    /*
       Si utilizas una tabla independiente para las notas
       de actividades, adapta esta función a esa estructura.

       Esta versión busca primero una propiedad dinámica
       con el ID de la actividad.
    */


    const possibleKeys = [
        `actividad_${activityId}`,
        `activity_${activityId}`,
        String(activityId)
    ];


    for (const key of possibleKeys) {

        if (
            student[key] !== undefined &&
            student[key] !== null
        ) {

            return student[key];

        }

    }


    return "";

}


/* =====================================================
   MARCAR CAMBIO
===================================================== */

function markChanged(input) {

    input.dataset.changed = "true";

    input.style.borderColor =
        "#1976d2";

}


/* =====================================================
   GUARDAR NOTAS
===================================================== */

async function saveActivityGrades(activityId) {

    const inputs =
        document.querySelectorAll(
            `.grade-input[data-activity-id="${activityId}"]`
        );


    if (!inputs.length) {
        return;
    }


    try {

        /*
           Aquí se pueden guardar las notas
           en una tabla independiente de actividades.

           Estructura recomendada:

           calificaciones_actividades

           id
           actividad_id
           estudiante_id
           nota
        */


        for (const input of inputs) {

            if (
                input.dataset.changed !== "true"
            ) {
                continue;
            }


            const studentId =
                input.dataset.studentId;


            const value =
                input.value === ""
                ? null
                : Number(input.value);


            const {
                error
            } = await supabaseClient
                .from("calificaciones_actividades")
                .upsert(
                    {
                        actividad_id:
                            activityId,

                        estudiante_id:
                            studentId,

                        nota:
                            value
                    },
                    {
                        onConflict:
                            "actividad_id,estudiante_id"
                    }
                );


            if (error) {
                throw error;
            }


            input.dataset.changed =
                "false";

            input.style.borderColor =
                "#d7dee5";

        }


        showToast(
            "Notas guardadas correctamente."
        );


    } catch (error) {

        console.error(error);

        showToast(
            "No se pudieron guardar las notas."
        );

    }

}


/* =====================================================
   CREAR ACTIVIDAD
===================================================== */

async function createActivity() {

    const name =
        activityName.value.trim();


    const categoryElement =
        document.querySelector(
            'input[name="activityCategory"]:checked'
        );


    if (!name) {

        showToast(
            "Escribe el nombre de la actividad."
        );

        activityName.focus();

        return;

    }


    if (!categoryElement) {

        showToast(
            "Selecciona una categoría."
        );

        return;

    }


    const category =
        categoryElement.value;


    const course =
        courseSelect.value;


    if (!course) {

        showToast(
            "Primero selecciona un curso."
        );

        closeModal();

        return;

    }


    saveActivityBtn.disabled =
        true;


    saveActivityBtn.textContent =
        "Guardando...";


    try {

        let result;


        if (editingActivityId) {

            result =
                await supabaseClient
                    .from("actividades")
                    .update({
                        nombre: name,
                        categoria: category
                    })
                    .eq(
                        "id",
                        editingActivityId
                    );

        } else {

            result =
                await supabaseClient
                    .from("actividades")
                    .insert({
                        nombre: name,
                        categoria: category,
                        trimestre: 3,
                        curso: course,
                        bloqueada: false
                    });

        }


        if (result.error) {
            throw result.error;
        }


        showToast(
            editingActivityId
            ? "Actividad actualizada."
            : "Actividad creada correctamente."
        );


        closeModal();


        await loadActivities(course);


    } catch (error) {

        console.error(error);

        showToast(
            "No se pudo guardar la actividad."
        );

    } finally {

        saveActivityBtn.disabled =
            false;

        saveActivityBtn.textContent =
            editingActivityId
            ? "Guardar cambios"
            : "Crear actividad";

    }

}


/* =====================================================
   EDITAR ACTIVIDAD
===================================================== */

window.editActivity =
async function(id) {

    const activity =
        activities.find(
            item =>
                String(item.id) === String(id)
        );


    if (!activity) {
        return;
    }


    editingActivityId =
        activity.id;


    activityName.value =
        activity.nombre || "";


    const radio =
        document.querySelector(
            `input[name="activityCategory"][value="${activity.categoria}"]`
        );


    if (radio) {
        radio.checked = true;
    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Editar actividad";


    saveActivityBtn.textContent =
        "Guardar cambios";


    openModal();

};


/* =====================================================
   ELIMINAR ACTIVIDAD
===================================================== */

window.deleteActivity =
async function(id) {

    const activity =
        activities.find(
            item =>
                String(item.id) === String(id)
        );


    if (!activity) {
        return;
    }


    const confirmDelete =
        confirm(
            `¿Eliminar la actividad "${activity.nombre}"?`
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const {
            error
        } = await supabaseClient
            .from("actividades")
            .delete()
            .eq("id", id);


        if (error) {
            throw error;
        }


        showToast(
            "Actividad eliminada."
        );


        await loadActivities(
            courseSelect.value
        );


    } catch (error) {

        console.error(error);

        showToast(
            "No se pudo eliminar la actividad."
        );

    }

};


/* =====================================================
   BLOQUEAR / DESBLOQUEAR
===================================================== */

window.toggleActivityLock =
async function(id, newState) {

    try {

        const {
            error
        } = await supabaseClient
            .from("actividades")
            .update({
                bloqueada: newState
            })
            .eq("id", id);


        if (error) {
            throw error;
        }


        showToast(
            newState
            ? "Actividad bloqueada."
            : "Actividad desbloqueada."
        );


        await loadActivities(
            courseSelect.value
        );


    } catch (error) {

        console.error(error);

        showToast(
            "No se pudo cambiar el estado."
        );

    }

};


/* =====================================================
   MOSTRAR / OCULTAR CATEGORÍA
===================================================== */

window.toggleCategory =
function(button) {

    const card =
        button.closest(
            ".category-card"
        );


    const content =
        card.querySelector(
            ".category-content"
        );


    if (
        content.style.display ===
        "none"
    ) {

        content.style.display =
            "";

        button.textContent =
            "▲";

    } else {

        content.style.display =
            "none";

        button.textContent =
            "▼";

    }

};


/* =====================================================
   MODAL
===================================================== */

function openModal() {

    activityModal.classList.add(
        "active"
    );

    setTimeout(() => {

        activityName.focus();

    }, 100);

}


function closeModal() {

    activityModal.classList.remove(
        "active"
    );


    editingActivityId =
        null;


    activityName.value =
        "";


    document.querySelectorAll(
        'input[name="activityCategory"]'
    ).forEach(input => {

        input.checked =
            false;

    });


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Crear nueva actividad";


    saveActivityBtn.textContent =
        "Crear actividad";

}


/* =====================================================
   EVENTOS MODAL
===================================================== */

openActivityModal.addEventListener(
    "click",
    () => {

        if (!courseSelect.value) {

            showToast(
                "Primero selecciona un curso."
            );

            return;

        }


        openModal();

    }
);


closeActivityModal.addEventListener(
    "click",
    closeModal
);


cancelActivityBtn.addEventListener(
    "click",
    closeModal
);


activityModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            activityModal
        ) {

            closeModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            activityModal.classList.contains(
                "active"
            )
        ) {

            closeModal();

        }

    }
);


saveActivityBtn.addEventListener(
    "click",
    createActivity
);


/* =====================================================
   CAMBIO DE CURSO
===================================================== */

courseSelect.addEventListener(
    "change",
    async function() {

        const course =
            this.value;


        selectedCourseName.textContent =
            course
            ? `— ${course}`
            : "";


        searchInput.value =
            "";


        if (!course) {

            activities = [];

            students = [];

            renderActivities();

            return;

        }


        activitiesContainer.innerHTML = `
            <div class="loading">
                Cargando...
            </div>
        `;


        await loadStudents(
            course
        );


        await loadActivities(
            course
        );

    }
);


/* =====================================================
   BUSCAR
===================================================== */

searchInput.addEventListener(
    "input",
    () => {

        if (
            courseSelect.value
        ) {

            renderActivities();

        }

    }
);


/* =====================================================
   LIMPIAR BÚSQUEDA
===================================================== */

clearSearchBtn.addEventListener(
    "click",
    () => {

        searchInput.value =
            "";

        renderActivities();

    }
);


/* =====================================================
   EXPORTAR A EXCEL
===================================================== */

exportBtn.addEventListener(
    "click",
    () => {

        if (!courseSelect.value) {

            showToast(
                "Primero selecciona un curso."
            );

            return;

        }


        if (!students.length) {

            showToast(
                "No hay estudiantes para exportar."
            );

            return;

        }


        const rows = [];


        students.forEach(
            (student, index) => {

                const row = {

                    "Nº":
                        index + 1,

                    "Nombre":
                        student.nombre || "",

                    "CI":
                        student.ci || "",

                    "Curso":
                        student.curso || ""

                };


                activities.forEach(
                    activity => {

                        row[
                            `${activity.categoria} - ${activity.nombre}`
                        ] =
                            getActivityGrade(
                                student,
                                activity.id
                            );

                    }
                );


                rows.push(row);

            }
        );


        const worksheet =
            XLSX.utils.json_to_sheet(
                rows
            );


        const workbook =
            XLSX.utils.book_new();


        XLSX.utils.book_append_sheet(
            workbook,
            worksheet,
            "Calificaciones"
        );


        const safeCourse =
            courseSelect.value
                .replace(
                    /[\\/:*?"<>|]/g,
                    "_"
                );


        XLSX.writeFile(
            workbook,
            `Calificaciones_${safeCourse}.xlsx`
        );


        showToast(
            "Excel exportado correctamente."
        );

    }
);


/* =====================================================
   INICIO
===================================================== */

async function init() {

    await loadCourses();

}


init();

</script>
