<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 96%;
    max-width: 1400px;
    margin: 25px auto;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    color: #1557a6;
    margin-top: 0;
}

h3 {
    margin-top: 0;
}

.usuario {
    color: #666;
    margin-bottom: 25px;
}


/* =====================================================
   FILTROS
===================================================== */

.filtros {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtro {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.info {
    margin-top: 15px;
    padding: 12px;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
}


/* =====================================================
   MODAL
===================================================== */

.modal-fondo {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 9999;
}

.modal-fondo.oculto {
    display: none !important;
}

.modal-actividad {
    width: 100%;
    max-width: 550px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,.30);
    overflow: hidden;
    animation: aparecerModal .18s ease-out;
}

@keyframes aparecerModal {

    from {
        opacity: 0;
        transform: scale(.94);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

.modal-cabecera {
    background: #1557a6;
    color: white;
    padding: 15px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-cabecera h3 {
    margin: 0;
    font-size: 18px;
}

.boton-cerrar-modal {
    width: 34px;
    height: 34px;
    padding: 0;
    background: rgba(255,255,255,.18);
    color: white;
    font-size: 23px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
}

.modal-cuerpo {
    padding: 20px;
}

.modal-cuerpo .campo {
    margin-bottom: 20px;
}


/* =====================================================
   RADIO BUTTONS DE CATEGORÍAS
===================================================== */

.categorias-radio {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 10px;
    width: 100%;
}

.radio-categoria {
    flex: 1;
    position: relative;
}

.radio-categoria input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.radio-categoria label {
    margin: 0;
    height: 75px;
    border: 2px solid #ddd;
    border-radius: 12px;
    background: #f7f7f7;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: .2s;
    color: #777;
}

.radio-icono {
    font-size: 25px;
    line-height: 1;
    margin-bottom: 5px;
    opacity: .45;
}

.radio-nombre {
    font-size: 12px;
    font-weight: bold;
    display: none;
    text-align: center;
}

.radio-categoria input:checked + label {
    transform: translateY(-2px);
    background: white;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.radio-categoria input:checked + label .radio-icono {
    opacity: 1;
}

.radio-categoria input:checked + label .radio-nombre {
    display: block;
}


/* COLORES */

.radio-ser input:checked + label {
    border-color: #7b1fa2;
    color: #7b1fa2;
}

.radio-saber input:checked + label {
    border-color: #1565c0;
    color: #1565c0;
}

.radio-hacer input:checked + label {
    border-color: #ef6c00;
    color: #ef6c00;
}

.radio-auto input:checked + label {
    border-color: #00838f;
    color: #00838f;
}


/* =====================================================
   BOTONES MODAL
===================================================== */

.modal-acciones {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.modal-acciones button {
    min-width: 120px;
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 15px;
}

.boton-cancelar {
    background: #777;
    color: white;
}

.boton-crear-modal {
    background: #16803c;
    color: white;
}


/* =====================================================
   CATEGORÍAS
===================================================== */

.categoria {
    margin-top: 25px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-categoria {
    color: white;
    padding: 13px 15px;
    font-size: 17px;
    font-weight: bold;
}

.ser {
    background: #7b1fa2;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00838f;
}


/* =====================================================
   ACTIVIDAD
===================================================== */

.actividad {
    margin: 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.encabezado-actividad {
    background: #f4f6f8;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.izquierda-actividad {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
}

.derecha-actividad {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.nombre-actividad {
    font-weight: bold;
    font-size: 16px;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
}

.puntaje-actividad {
    font-weight: normal;
    color: #555;
    font-size: 14px;
}


/* =====================================================
   BOTONES ACTIVIDAD
===================================================== */

.boton-ocultar,
.boton-editar,
.boton-bloquear,
.boton-eliminar {

    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.boton-editar {
    background: #1565c0;
}

.boton-eliminar {
    background: #c62828;
}

.boton-ocultar {
    background: #555;
}

.boton-bloquear {
    background: #ef6c00;
}


/* =====================================================
   CONTENIDO / TABLAS
===================================================== */

.contenido-actividad {
    padding: 0;
}

.tabla-contenedor {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
}

th,
td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: #f0f0f0;
}

td.nombre {
    text-align: left;
    white-space: normal;
    overflow-wrap: anywhere;
    min-width: 120px;
    line-height: 1.25;
}

th:first-child,
td:first-child {
    width: 45px;
    min-width: 45px;
}


/* =====================================================
   NOTAS
===================================================== */

.nota-input {
    width: 65px;
    max-width: 100%;
    text-align: center;
    padding: 7px;
    transition: .2s;
}

.nota-input:disabled {
    background: #eeeeee;
    color: #555;
    cursor: not-allowed;
    border-color: #ddd;
}

.nota-input.editable {
    background: #fffde7;
    border: 2px solid #ef6c00;
}

.nota-3t,
.nota-final {
    font-weight: bold;
    font-size: 18px;
}


/* =====================================================
   TABLA GENERAL
===================================================== */

.tabla-general {
    margin-top: 30px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-general {
    background: #1557a6;
    color: white;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: bold;
}

.acciones-general {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
}

.boton-nueva-actividad,
.boton-general {

    background: rgba(255,255,255,.20);
    color: white;
    width: 38px;
    height: 34px;
    padding: 0;
    border: none;
    border-radius: 7px;
    font-size: 21px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}


/* =====================================================
   ASISTENCIA
===================================================== */

.asistencia {
    margin-top: 30px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-asistencia {
    background: #455a64;
    color: white;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 17px;
    font-weight: bold;
}

.asistencia-controles {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
}

.fecha-asistencia {
    width: 145px;
    padding: 7px 9px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
}

.boton-guardar-asistencia {
    height: 34px;
    padding: 0 12px;
    border: none;
    border-radius: 7px;
    background: #16803c;
    color: white;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

.boton-abrir-asistencia {
    width: 38px;
    height: 34px;
    border: none;
    border-radius: 7px;
    background: rgba(255,255,255,.20);
    color: white;
    font-size: 22px;
    cursor: pointer;
}

.contenido-asistencia {
    padding: 0;
}

.fila-asistencia {
    display: flex;
    align-items: center;
    gap: 10px;
}

.nombre-asistencia {
    flex: 1;
    text-align: left;
    min-width: 0;
}

.numero-asistencia {
    width: 40px;
    text-align: center;
    flex-shrink: 0;
}


/* =====================================================
   BOTONES DE ASISTENCIA
===================================================== */

.estados-asistencia {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}

.estado-asistencia {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: #e5e5e5;
    opacity: .45;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    cursor: pointer;
    transition: .18s;
    filter: grayscale(70%);
}

.estado-asistencia:hover {
    opacity: .75;
    transform: scale(1.05);
}

.estado-asistencia.seleccionado {
    opacity: 1;
    filter: grayscale(0);
    transform: scale(1.08);
    box-shadow: 0 0 0 2px rgba(0,0,0,.10);
}


/* COLORES AL SELECCIONAR */

.estado-asistencia[data-estado="ASISTENCIA"].seleccionado {
    background: #c8e6c9;
    color: #16803c;
}

.estado-asistencia[data-estado="ATRASO"].seleccionado {
    background: #fff3cd;
    color: #e69500;
}

.estado-asistencia[data-estado="LICENCIA"].seleccionado {
    background: #dbeafe;
    color: #1565c0;
}

.estado-asistencia[data-estado="FALTA"].seleccionado {
    background: #ffcdd2;
    color: #c62828;
}

.estado-asistencia[data-estado="OBSERVACION"].seleccionado {
    background: #e0e0e0;
    color: #555;
}


/* =====================================================
   OBSERVACIÓN
===================================================== */

.observacion-asistencia {
    width: 180px;
    padding: 7px;
    font-size: 13px;
}


/* =====================================================
   BOTONES INFERIORES
===================================================== */

.botones {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.botones button {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 15px;
}

.guardar {
    background: #16803c;
    color: white;
}

.exportar {
    background: #1565c0;
    color: white;
}

.salir {
    background: #c62828;
    color: white;
}


/* =====================================================
   MENSAJES
===================================================== */

.mensaje {
    margin-top: 15px;
    font-weight: bold;
}

.oculto {
    display: none !important;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 800px) {

    .panel {
        padding: 15px;
    }

    .fila-asistencia {
        flex-wrap: wrap;
    }

    .nombre-asistencia {
        width: calc(100% - 50px);
    }

    .estados-asistencia {
        width: 100%;
        justify-content: flex-end;
    }

    .observacion-asistencia {
        width: 100%;
    }

}


/* =====================================================
   CELULARES
===================================================== */

@media (max-width: 600px) {

    .contenedor {
        width: 100%;
        margin: 10px auto;
    }

    .panel {
        padding: 10px;
        border-radius: 10px;
    }

    h1 {
        font-size: 24px;
    }

    .categorias-radio {
        gap: 6px;
    }

    .radio-categoria label {
        height: 65px;
    }

    .radio-icono {
        font-size: 22px;
    }

    .radio-nombre {
        font-size: 10px;
    }

    .encabezado-actividad {
        flex-wrap: wrap;
    }

    .izquierda-actividad {
        width: 100%;
    }

    .derecha-actividad {
        width: 100%;
        justify-content: flex-end;
    }

    .modal-acciones {
        flex-direction: row;
    }

    .modal-acciones button {
        flex: 1;
        min-width: 0;
    }

    th,
    td {
        padding: 6px 4px;
        font-size: 13px;
    }

    .nota-input {
        width: 58px;
    }

    .titulo-asistencia {
        flex-wrap: wrap;
        gap: 8px;
    }

    .asistencia-controles {
        width: 100%;
        margin-left: 0;
    }

    .fecha-asistencia {
        flex: 1;
    }

    .boton-guardar-asistencia {
        flex: 0 0 auto;
    }

    .estado-asistencia {
        width: 27px;
        height: 27px;
        font-size: 14px;
    }

}


/* =====================================================
   CELULARES PEQUEÑOS
===================================================== */

@media (max-width: 400px) {

    .categorias-radio {
        gap: 4px;
    }

    .radio-categoria label {
        height: 60px;
    }

    .radio-icono {
        font-size: 20px;
    }

    .estado-asistencia {
        width: 25px;
        height: 25px;
        font-size: 13px;
    }

    .fecha-asistencia {
        width: 120px;
    }

}


/* =====================================================
   EVITAR DESBORDAMIENTO
===================================================== */

th,
td,
.nombre-actividad,
.titulo-categoria,
.titulo-general {
    overflow-wrap: anywhere;
}

</style>

</head>


<body>

<div class="contenedor">

<div class="panel">

<h1>Panel Docente</h1>

<div class="usuario">
Usuario: <span id="usuario"></span>
</div>


<!-- =====================================================
     FILTROS
===================================================== -->

<div class="filtros">

<div class="filtro">

<label>Curso</label>

<select id="buscarCurso">

<option value="">
Selecciona un curso
</option>

</select>

</div>


<div class="filtro">

<label>Buscar estudiante</label>

<input
    type="text"
    id="buscarNombre"
    placeholder="Buscar por nombre o Nº de lista..."
>

</div>

</div>


<!-- =====================================================
     ACTIVIDADES
===================================================== -->

<div id="contenedorActividades"></div>


<!-- =====================================================
     TABLA GENERAL
===================================================== -->

<div
    id="tablaGeneral"
    class="tabla-general oculto">

<div class="titulo-general">

<span>
📊 Calificaciones del curso
</span>

<div class="acciones-general">

<button
    type="button"
    class="boton-nueva-actividad"
    onclick="abrirModalActividad()"
    title="Añadir nueva actividad">

📝

</button>


<button
    id="botonGeneral"
    class="boton-general"
    onclick="ocultarTablaGeneral()"
    title="Mostrar u ocultar calificaciones">

+

</button>

</div>

</div>


<div
    id="contenidoGeneral"
    class="oculto">

<div class="tabla-contenedor">

<table>

<thead>

<tr>

<th>Nº</th>
<th>Nombre</th>
<th>Curso</th>
<th>1T</th>
<th>2T</th>
<th>3T</th>
<th>Final</th>

</tr>

</thead>

<tbody id="tablaEstudiantes"></tbody>

</table>

</div>

</div>

</div>


<!-- =====================================================
     ASISTENCIA
===================================================== -->

<div
    id="asistencia"
    class="asistencia oculto">

<div class="titulo-asistencia">

<span>
🧑‍🏫 Asistencia
</span>

<div class="asistencia-controles">

<input
    type="date"
    id="fechaAsistencia"
    class="fecha-asistencia"
>

<button
    type="button"
    class="boton-guardar-asistencia"
    onclick="guardarAsistencia()">

💾 Guardar

</button>

<button
    type="button"
    id="botonAbrirAsistencia"
    class="boton-abrir-asistencia"
    onclick="mostrarOcultarAsistencia()"
    title="Mostrar asistencia">

+

</button>

</div>

</div>


<div
    id="contenidoAsistencia"
    class="contenido-asistencia oculto">

<div class="tabla-contenedor">

<table>

<thead>

<tr>

<th>Nº</th>

<th>Estudiante</th>

<th>Estado</th>

<th>Observación</th>

</tr>

</thead>

<tbody id="tablaAsistencia"></tbody>

</table>

</div>

</div>

</div>


<!-- =====================================================
     BOTONES
===================================================== -->

<div class="botones">

<button
    class="guardar"
    onclick="guardarNotas()">

💾 Guardar notas

</button>


<button
    class="exportar"
    onclick="exportarExcel()">

📊 Exportar Excel

</button>


<button
    class="salir"
    onclick="cerrarSesion()">

🚪 Cerrar sesión

</button>

</div>


<div
    id="mensaje"
    class="mensaje">
</div>

</div>

</div>


<!-- =====================================================
     MODAL NUEVA ACTIVIDAD
===================================================== -->

<div
    id="modalNuevaActividad"
    class="modal-fondo oculto"
    onclick="cerrarModalDesdeFondo(event)">

<div
    class="modal-actividad"
    onclick="event.stopPropagation()">

<div class="modal-cabecera">

<h3>
📝 Crear nueva actividad
</h3>

<button
    type="button"
    class="boton-cerrar-modal"
    onclick="cerrarModalActividad()">

×

</button>

</div>


<div class="modal-cuerpo">

<div class="campo">

<label>
Nombre de la actividad
</label>

<input
    type="text"
    id="nombreActividad"
    placeholder="Ej.: Evaluación de números"
    autocomplete="off"
>

</div>


<div class="campo">

<label>
Categoría
</label>


<div class="categorias-radio">


<div class="radio-categoria radio-ser">

<input
    type="radio"
    name="categoriaActividad"
    id="categoriaSER"
    value="SER"
>

<label for="categoriaSER">

<span class="radio-icono">
❤️
</span>

<span class="radio-nombre">
SER · 10 puntos
</span>

</label>

</div>


<div class="radio-categoria radio-saber">

<input
    type="radio"
    name="categoriaActividad"
    id="categoriaSABER"
    value="SABER"
>

<label for="categoriaSABER">

<span class="radio-icono">
🧠
</span>

<span class="radio-nombre">
SABER · 45 puntos
</span>

</label>

</div>


<div class="radio-categoria radio-hacer">

<input
    type="radio"
    name="categoriaActividad"
    id="categoriaHACER"
    value="HACER"
>

<label for="categoriaHACER">

<span class="radio-icono">
🔧
</span>

<span class="radio-nombre">
HACER · 40 puntos
</span>

</label>

</div>


<div class="radio-categoria radio-auto">

<input
    type="radio"
    name="categoriaActividad"
    id="categoriaAUTO"
    value="AUTOEVALUACION"
>

<label for="categoriaAUTO">

<span class="radio-icono">
⭐
</span>

<span class="radio-nombre">
AUTOEVALUACIÓN · 5 puntos
</span>

</label>

</div>

</div>

</div>


<div class="modal-acciones">

<button
    type="button"
    class="boton-cancelar"
    onclick="cerrarModalActividad()">

Cancelar

async function cargarCalificaciones() {

    calificaciones = {};


    if (
        actividades.length === 0
    ) {

        return;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    const idsEstudiantes =
    estudiantesCurso.map(
        e => e.id
    );


    const idsActividades =
    actividades.map(
        a => a.id
    );


    if (
        idsEstudiantes.length === 0 ||
        idsActividades.length === 0
    ) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("calificaciones")
    .select(
        "id,actividad_id,estudiante_id,nota"
    )
    .in(
        "actividad_id",
        idsActividades
    )
    .in(
        "estudiante_id",
        idsEstudiantes
    );


    if (error) {

        console.error(error);

        return;

    }


    (data || []).forEach(
    cal => {

        if (
            !calificaciones[
                cal.estudiante_id
            ]
        ) {

            calificaciones[
                cal.estudiante_id
            ] = {};

        calificaciones[
            cal.estudiante_id

/* =====================================================
   CREAR ACTIVIDAD
===================================================== */

async function crearActividad() {

    if (!cursoSeleccionado) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const nombre =
    document.getElementById(
        "nombreActividad"
    ).value.trim();


    const radio =
    document.querySelector(
        'input[name="categoriaActividad"]:checked'
    );


    if (!nombre) {

        alert(
            "Escribe el nombre de la actividad."
        );

        return;

    }


    if (!radio) {

        alert(
            "Selecciona una categoría: SER, SABER, HACER o AUTOEVALUACIÓN."
        );

        return;

    }


    const categoria =
    radio.value;


    let orden = 1;


    if (
        actividades.length > 0
    ) {

        orden =
        Math.max(
            ...actividades.map(
                a =>
                Number(
                    a.orden || 0
                )
            )
        ) + 1;

    }


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .insert({

        curso:
        cursoSeleccionado,

        trimestre:
        3,

        categoria:
        categoria,

        nombre:
        nombre,

        orden:
        orden,

        puntaje_maximo:
        LIMITES[categoria]

    });


    if (error) {

        mostrarMensaje(
            "Error al crear actividad: " +
            error.message,
            true
        );

        return;

    }


    cerrarModalActividad();


    mostrarMensaje(
        "✓ Actividad creada correctamente."
    );


    await cargarActividades();

    aplicarBusqueda();

}

   EDITAR ACTIVIDAD
===================================================== */

async function editarNombreActividad(
    actividad
) {

    const nuevoNombre =
    prompt(
        "Escribe el nuevo nombre:",
        actividad.nombre
    );


    if (
        nuevoNombre === null
    ) {

        return;

    }


    const nombre =
    nuevoNombre.trim();


    if (!nombre) {

        alert(
            "El nombre no puede estar vacío."
        );

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .update({
        nombre: nombre
    })
    .eq(
        "id",
        actividad.id
    );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    actividad.nombre =
    nombre;


    const elemento =
    document.getElementById(
        "nombre-actividad-" +
        actividad.id
    );


    if (elemento) {

        elemento.textContent =
        nombre;

    }

}


/* =====================================================
   ELIMINAR ACTIVIDAD
===================================================== */

async function eliminarActividad(
    actividad
) {

    if (
        !confirm(
            "¿Eliminar la actividad \"" +
            actividad.nombre +
            "\"?\n\nTambién se eliminarán sus calificaciones."
        )
    ) {

        return;

    }


    await supabaseClient
    .from("calificaciones")
    .delete()
    .eq(
        "actividad_id",
        actividad.id
    );


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .delete()
    .eq(
        "id",
        actividad.id
    );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    actividadesDesbloqueadas.delete(
        actividad.id
    );


    await cargarActividades();

}


/* =====================================================
   VALIDAR NOTA
===================================================== */

function validarNota(input) {

    if (
        input.value === ""
    ) {

        return;

    }


    const valor =
    Number(
        input.value
    );


    const maximo =
    Number(
        input.dataset.maximo
    );


    if (
        valor < 0 ||
        valor > maximo
    ) {

        alert(
            "La nota debe estar entre 0 y " +
            maximo +
            " puntos."
        );

        input.value = "";

    }

}

        data,

    } =
    await supabaseClient
    .from("asistencia")
    .select(
        "id,curso,fecha,estudiante_id,estado,observacion"
    )
    .eq(
        "curso",
        cursoSeleccionado
    )
    .eq(
        "fecha",
        fecha
    )
    .in(
        "estudiante_id",
        ids
    );


    if (error) {

        console.error(
            "Error asistencia:",
            error
        );

        return;

    }


    (data || []).forEach(
    registro => {

        asistenciaDatos[
            registro.estudiante_id
        ] = {

            estado:
            registro.estado,

            observacion:
            registro.observacion || ""

        };

    });

}

/* =====================================================
   SELECCIONAR ESTADO
===================================================== */

function seleccionarEstado(
    boton,
    estudianteId
) {

    const contenedor =
    boton.closest(
        ".estados-asistencia"
    );


    contenedor
    .querySelectorAll(
        ".estado-asistencia"
    )
    .forEach(
        b =>
        b.classList.remove(
            "seleccionado"
        )
    );


    boton.classList.add(
        "seleccionado"
    );


    const estado =
    boton.dataset.estado;


    if (
        !asistenciaDatos[
            estudianteId
        ]
    ) {

        asistenciaDatos[
            estudianteId
        ] = {};

    }


    asistenciaDatos[
        estudianteId
    ].estado =
    estado;

}


/* =====================================================
   MOSTRAR / OCULTAR ASISTENCIA
===================================================== */

function mostrarOcultarAsistencia() {

    const contenido =
    document.getElementById(
        "contenidoAsistencia"
    );

    const boton =
    document.getElementById(
        "botonAbrirAsistencia"
    );


    if (
        contenido.classList.contains(
            "oculto"
        )
    ) {

        contenido.classList.remove(
            "oculto"
        );

        boton.textContent =
        "−";

        boton.title =
        "Ocultar asistencia";

    }

    else {

        contenido.classList.add(
            "oculto"
        );

        boton.textContent =
        "+";

        boton.title =
        "Mostrar asistencia";

    }

}

/* =====================================================
   GUARDAR ASISTENCIA
===================================================== */

async function guardarAsistencia() {

    if (!cursoSeleccionado) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const fecha =
    document.getElementById(
        "fechaAsistencia"
    ).value;


    if (!fecha) {

        alert(
            "Selecciona una fecha."
        );

        return;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    if (
        estudiantesCurso.length === 0
    ) {

        return;

    }


    mostrarMensaje(
        "Guardando asistencia..."
    );


    const registros = [];


    estudiantesCurso.forEach(
    estudiante => {

        const dato =
        asistenciaDatos[
            estudiante.id
        ] || {};


        const input =
        document.querySelector(
            `[data-estudiante-observacion="${estudiante.id}"]`
        );


        const observacion =
        input
        ? input.value.trim()
        : "";


        if (
            !dato.estado
        ) {

            return;

        }


        registros.push({

            curso:
            cursoSeleccionado,

            fecha:
            fecha,

            estudiante_id:
            estudiante.id,

            estado:
            dato.estado,

            observacion:
            observacion

        });

    });


    if (
        registros.length === 0
    ) {

        alert(
            "Selecciona al menos un estado de asistencia."
        );

        return;

    }


    const {
        error
    } =
    await supabaseClient
    .from("asistencia")
    .upsert(
        registros,
        {
            onConflict:
            "curso,fecha,estudiante_id"
        }
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al guardar asistencia: " +
            error.message,
            true
        );

        return;

    }


    mostrarMensaje(
        "✓ Asistencia guardada correctamente."
    );

}

async function guardarNotas() {

    if (!cursoSeleccionado) {

        alert(
            "Primero selecciona un curso."
        );

        return false;

    }


    const inputs =
    document.querySelectorAll(
        ".nota-input"
    );


    const registros = [];


    inputs.forEach(
    input => {

        registros.push({

            actividad_id:
            Number(
                input.dataset.actividad
            ),

            estudiante_id:
            Number(
                input.dataset.estudiante
            ),

            nota:
            input.value === ""
            ? null
            : Number(
                input.value
            )

        });

    });


    if (
        registros.length > 0
    ) {

        const {
            error
        } =
        await supabaseClient
        .from("calificaciones")
        .upsert(
            registros,
            {
                onConflict:
                "actividad_id,estudiante_id"
            }
        );


        if (error) {

            mostrarMensaje(
                "Error al guardar notas: " +
                error.message,
                true
            );

            return false;

        }

    }


    mostrarMensaje(
        "✓ Calificaciones guardadas correctamente."
    );


    return true;

}


/* =====================================================
   NOTA
===================================================== */

function mostrarNota(
    nota
) {

    if (
        nota === null ||
        nota === undefined ||
        nota === ""
    ) {

        return "";

    }


    return Math.round(
        Number(nota)
    );

}


/* =====================================================
   EXPORTAR EXCEL
===================================================== */

async function exportarExcel() {

    if (
        typeof XLSX === "undefined"
    ) {

        alert(
            "No se pudo cargar Excel."
        );

        return;

    }


    const datos = [];


    datos.push([
        "Nº LISTA",
        "NOMBRE",
        "CURSO",
        "1T",
        "2T",
        "3T",
        "FINAL"
    ]);


    estudiantes
    .filter(
        e =>
        !cursoSeleccionado ||
        e.curso ===
        cursoSeleccionado
    )
    .forEach(
    e => {

        datos.push([

            e.num_lista ?? "",

            e.nombre ?? "",

            e.curso ?? "",

            mostrarNota(
                e.nota_1t
            ),

            mostrarNota(
                e.nota_2t
            ),

            mostrarNota(
                e.nota_3t
            ),

            mostrarNota(
                e.final
            )

        ]);

    });


    const hoja =
    XLSX.utils.aoa_to_sheet(
        datos
    );


    const libro =
    XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        libro,
        hoja,
        "Calificaciones"
    );


    XLSX.writeFile(
        libro,
        "Calificaciones.xlsx"
    );


    mostrarMensaje(
        "✓ Excel exportado correctamente."
    );

}

/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(
    texto
) {

    return String(texto)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
