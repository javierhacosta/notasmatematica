<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 96%;
    max-width: 1400px;
    margin: 25px auto;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    color: #1557a6;
    margin-top: 0;
}

.usuario {
    color: #666;
    margin-bottom: 25px;
}

.filtros {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtro {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-size: 15px;
    cursor: pointer;
}

.nueva {
    background: #1557a6;
    color: white;
}

.guardar {
    background: #16803c;
    color: white;
}

.salir {
    background: #c62828;
    color: white;
}

.botones {
    margin-top: 25px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.seccion {
    margin-top: 30px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #ddd;
}

.titulo-seccion {
    padding: 14px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.ser {
    background: #7b1fa2;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00838f;
}

.tabla-contenedor {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
}

th,
td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
}

th {
    background: #f0f0f0;
    font-weight: bold;
}

td.nombre {
    text-align: left;
    white-space: nowrap;
}

.nota-input {
    width: 65px;
    text-align: center;
    padding: 7px;
}

.total {
    font-weight: bold;
    font-size: 17px;
}

.resumen {
    margin-top: 25px;
    padding: 20px;
    background: #f5f7fa;
    border-radius: 12px;
}

.resumen-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.resumen-item {
    background: white;
    border-radius: 10px;
    padding: 15px;
    text-align: center;
    border: 1px solid #ddd;
}

.resumen-item strong {
    display: block;
    font-size: 24px;
    margin-top: 5px;
}

.nueva-actividad {
    margin-top: 25px;
    padding: 20px;
    background: #eef4fb;
    border-radius: 12px;
    border: 1px solid #cbdced;
}

.nueva-grid {
    display: grid;
    grid-template-columns: 1fr 180px 150px auto;
    gap: 12px;
    align-items: end;
}

.mensaje {
    margin-top: 15px;
    font-weight: bold;
}

.info {
    margin: 15px 0;
    padding: 12px;
    background: #fff8e1;
    border-radius: 8px;
    border: 1px solid #ffe082;
}

.oculto {
    display: none;
}

@media (max-width: 800px) {

    .resumen-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .nueva-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<div class="panel">

<h1>Panel Docente</h1>

<div class="usuario">
    Usuario:
    <span id="usuario"></span>
</div>


<!-- FILTROS -->

<div class="filtros">

    <div class="filtro">

        <label>Buscar por nombre</label>

        <input
            type="text"
            id="buscarNombre"
            placeholder="Escribe un nombre..."
        >

    </div>


    <div class="filtro">

        <label>Curso</label>

        <select id="buscarCurso">

            <option value="">
                Selecciona un curso
            </option>

        </select>

    </div>

</div>


<div class="info">

    Selecciona un curso para cargar las actividades
    y las calificaciones del 3.er trimestre.

</div>


<!-- NUEVA ACTIVIDAD -->

<div
    id="panelNuevaActividad"
    class="nueva-actividad oculto">

    <h3>➕ Nueva actividad</h3>

    <div class="nueva-grid">

        <div>

            <label>Nombre de la actividad</label>

            <input
                type="text"
                id="nombreActividad"
                placeholder="Ej.: Práctica 1 - Números">

        </div>


        <div>

            <label>Categoría</label>

            <select id="categoriaActividad">

                <option value="SER">
                    SER
                </option>

                <option value="SABER">
                    SABER
                </option>

                <option value="HACER">
                    HACER
                </option>

                <option value="AUTOEVALUACION">
                    AUTOEVALUACIÓN
                </option>

            </select>

        </div>


        <div>

            <label>Puntaje máximo</label>

            <input
                type="number"
                id="puntajeActividad"
                min="1"
                max="45"
                placeholder="10">

        </div>


        <button
            class="nueva"
            onclick="crearActividad()">

            Crear actividad

        </button>

    </div>

</div>


<!-- ACTIVIDADES -->

<div id="contenedorActividades"></div>


<!-- RESUMEN -->

<div
    id="resumen"
    class="resumen oculto">

    <h2>Resumen del 3.er trimestre</h2>

    <div class="resumen-grid">

        <div class="resumen-item">

            SER

            <strong id="resumenSER">
                0 / 10
            </strong>

        </div>


        <div class="resumen-item">

            SABER

            <strong id="resumenSABER">
                0 / 45
            </strong>

        </div>


        <div class="resumen-item">

            HACER

            <strong id="resumenHACER">
                0 / 40
            </strong>

        </div>


        <div class="resumen-item">

            AUTO

            <strong id="resumenAUTO">
                0 / 5
            </strong>

        </div>

    </div>

</div>


<!-- BOTONES -->

<div class="botones">

    <button
        class="guardar"
        onclick="guardarNotas()">

        💾 Guardar notas

    </button>


    <button
        class="salir"
        onclick="cerrarSesion()">

        🚪 Cerrar sesión

    </button>

</div>


<div
    id="mensaje"
    class="mensaje">
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://tecphbbkkmlgahjddcep.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let estudiantes = [];

let actividades = [];

let calificaciones = {};

let cursoSeleccionado = "";


// =====================================================
// SESIÓN
// =====================================================

async function comprobarSesion() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href =
            "login-docente.html";

        return;

    }


    document.getElementById("usuario")
        .textContent = user.email;


    cargarEstudiantes();

}


// =====================================================
// CARGAR ESTUDIANTES
// =====================================================

async function cargarEstudiantes() {

    const {
        data,
        error
    } = await supabaseClient

        .from("matematica")

        .select(
            "id,ci,nombre,curso,nota_1t,nota_2t,nota_3t,final"
        )

        .order("nombre");


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar estudiantes.",
            true
        );

        return;

    }


    estudiantes = data || [];

    cargarCursos();

}


// =====================================================
// CURSOS
// =====================================================

function cargarCursos() {

    const select =
        document.getElementById("buscarCurso");


    select.innerHTML = `
        <option value="">
            Selecciona un curso
        </option>
    `;


    const cursos =
        [...new Set(
            estudiantes
                .map(e => e.curso)
                .filter(Boolean)
        )]
        .sort();


    cursos.forEach(curso => {

        const opcion =
            document.createElement("option");

        opcion.value = curso;

        opcion.textContent = curso;

        select.appendChild(opcion);

    });

}


// =====================================================
// CAMBIO DE CURSO
// =====================================================

document.getElementById(
    "buscarCurso"
).addEventListener(
    "change",
    async function() {

        cursoSeleccionado = this.value;

        document.getElementById(
            "contenedorActividades"
        ).innerHTML = "";

        document.getElementById(
            "resumen"
        ).classList.add("oculto");

        document.getElementById(
            "panelNuevaActividad"
        ).classList.add("oculto");


        if (!cursoSeleccionado) {

            return;

        }


        document.getElementById(
            "panelNuevaActividad"
        ).classList.remove("oculto");


        await cargarActividades();

    }
);


// =====================================================
// CARGAR ACTIVIDADES
// =====================================================

async function cargarActividades() {

    const {
        data,
        error
    } = await supabaseClient

        .from("actividades")

        .select(
            "id,curso,trimestre,categoria,nombre,puntaje_maximo,orden"
        )

        .eq("curso", cursoSeleccionado)

        .eq("trimestre", 3)

        .order("orden");


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar actividades.",
            true
        );

        return;

    }


    actividades = data || [];


    await cargarCalificaciones();

    mostrarActividades();

}


// =====================================================
// CARGAR CALIFICACIONES
// =====================================================

async function cargarCalificaciones() {

    calificaciones = {};


    if (
        actividades.length === 0 ||
        estudiantes.length === 0
    ) {

        return;

    }


    const estudiantesCurso =
        estudiantes.filter(
            e => e.curso === cursoSeleccionado
        );


    const idsEstudiantes =
        estudiantesCurso.map(
            e => e.id
        );


    const idsActividades =
        actividades.map(
            a => a.id
        );


    if (
        idsEstudiantes.length === 0 ||
        idsActividades.length === 0
    ) {

        return;

    }


    const {
        data,
        error
    } = await supabaseClient

        .from("calificaciones")

        .select(
            "id,actividad_id,estudiante_id,nota"
        )

        .in(
            "actividad_id",
            idsActividades
        )

        .in(
            "estudiante_id",
            idsEstudiantes
        );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar calificaciones.",
            true
        );

        return;

    }


    (data || []).forEach(cal => {

        if (!calificaciones[cal.estudiante_id]) {

            calificaciones[cal.estudiante_id] = {};

        }


        calificaciones[
            cal.estudiante_id
        ][
            cal.actividad_id
        ] = cal.nota;

    });

}


// =====================================================
// MOSTRAR ACTIVIDADES
// =====================================================

function mostrarActividades() {

    const contenedor =
        document.getElementById(
            "contenedorActividades"
        );


    contenedor.innerHTML = "";


    const estudiantesCurso =
        estudiantes.filter(
            e => e.curso === cursoSeleccionado
        );


    if (actividades.length === 0) {

        contenedor.innerHTML = `
            <div class="info">
                Este curso todavía no tiene actividades
                para el 3.er trimestre.
                <br><br>
                Utiliza <strong>Nueva actividad</strong>
                para comenzar.
            </div>
        `;

        return;

    }


    const categorias = [
        {
            nombre: "SER",
            clase: "ser",
            maximo: 10
        },
        {
            nombre: "SABER",
            clase: "saber",
            maximo: 45
        },
        {
            nombre: "HACER",
            clase: "hacer",
            maximo: 40
        },
        {
            nombre: "AUTOEVALUACION",
            clase: "auto",
            maximo: 5
        }
    ];


    categorias.forEach(categoria => {

        const lista =
            actividades.filter(
                a =>
                    a.categoria ===
                    categoria.nombre
            );


        if (lista.length === 0) {

            return;

        }


        const seccion =
            document.createElement("div");

        seccion.className =
            "seccion";


        const titulo =
            document.createElement("div");

        titulo.className =
            "titulo-seccion " +
            categoria.clase;

        titulo.textContent =
            categoria.nombre ===
            "AUTOEVALUACION"

                ? "AUTOEVALUACIÓN — 5 puntos"

                : categoria.nombre +
                  " — " +
                  categoria.maximo +
                  " puntos";


        seccion.appendChild(titulo);


        const tablaContenedor =
            document.createElement("div");

        tablaContenedor.className =
            "tabla-contenedor";


        const tabla =
            document.createElement("table");


        const thead =
            document.createElement("thead");


        let encabezado = `
            <tr>
                <th>CI</th>
                <th>Estudiante</th>
        `;


        lista.forEach(a => {

            encabezado += `
                <th>
                    ${escapeHTML(a.nombre)}
                    <br>
                    <small>
                        / ${a.puntaje_maximo}
                    </small>
                </th>
            `;

        });


        encabezado += `
                <th>TOTAL</th>
            </tr>
        `;


        thead.innerHTML =
            encabezado;


        tabla.appendChild(thead);


        const tbody =
            document.createElement("tbody");


        estudiantesCurso.forEach(estudiante => {

            const fila =
                document.createElement("tr");


            let html = `
                <td>
                    ${escapeHTML(
                        String(estudiante.ci)
                    )}
                </td>

                <td class="nombre">
                    ${escapeHTML(
                        estudiante.nombre
                    )}
                </td>
            `;


            lista.forEach(actividad => {

                const valor =
                    obtenerNota(
                        estudiante.id,
                        actividad.id
                    );


                html += `
                    <td>

                        <input
                            class="nota-input"
                            type="number"
                            min="0"
                            max="${actividad.puntaje_maximo}"
                            step="0.01"
                            value="${
                                valor === null
                                ? ""
                                : valor
                            }"
                            data-estudiante="${
                                estudiante.id
                            }"
                            data-actividad="${
                                actividad.id
                            }"
                            data-maximo="${
                                actividad.puntaje_maximo
                            }"
                            data-categoria="${
                                actividad.categoria
                            }"
                            oninput="calcularTotales()">

                    </td>
                `;

            });


            html += `
                <td
                    class="total"
                    id="total-${categoria.nombre}-${estudiante.id}">
                    0
                </td>
            `;


            fila.innerHTML = html;

            tbody.appendChild(fila);

        });


        tabla.appendChild(tbody);

        tablaContenedor.appendChild(tabla);

        seccion.appendChild(tablaContenedor);

        contenedor.appendChild(seccion);

    });


    document.getElementById(
        "resumen"
    ).classList.remove("oculto");


    calcularTotales();

}


// =====================================================
// OBTENER NOTA
// =====================================================

function obtenerNota(
    estudianteId,
    actividadId
) {

    if (
        !calificaciones[estudianteId] ||
        calificaciones[estudianteId][actividadId]
        === undefined ||
        calificaciones[estudianteId][actividadId]
        === null
    ) {

        return null;

    }


    return calificaciones[
        estudianteId
    ][actividadId];

}


// =====================================================
// CALCULAR TOTALES
// =====================================================

function calcularTotales() {

    const estudiantesCurso =
        estudiantes.filter(
            e => e.curso === cursoSeleccionado
        );


    let totalSER = 0;
    let totalSABER = 0;
    let totalHACER = 0;
    let totalAUTO = 0;


    estudiantesCurso.forEach(estudiante => {

        const totales = {
            SER: 0,
            SABER: 0,
            HACER: 0,
            AUTOEVALUACION: 0
        };


        document.querySelectorAll(
            `.nota-input[data-estudiante="${estudiante.id}"]`
        ).forEach(input => {

            let valor =
                parseFloat(input.value);


            if (isNaN(valor)) {

                valor = 0;

            }


            const maximo =
                parseFloat(
                    input.dataset.maximo
                );


            if (valor > maximo) {

                valor = maximo;

                input.value = maximo;

            }


            if (valor < 0) {

                valor = 0;

                input.value = 0;

            }


            totales[
                input.dataset.categoria
            ] += valor;

        });


        Object.keys(totales).forEach(categoria => {

            const elemento =
                document.getElementById(
                    `total-${categoria}-${estudiante.id}`
                );


            if (elemento) {

                elemento.textContent =
                    redondear(totales[categoria]);

            }

        });


        totalSER += totales.SER;
        totalSABER += totales.SABER;
        totalHACER += totales.HACER;
        totalAUTO += totales.AUTOEVALUACION;

    });


    document.getElementById(
        "resumenSER"
    ).textContent =
        redondear(totalSER) +
        " / " +
        calcularMaximoCategoria("SER");


    document.getElementById(
        "resumenSABER"
    ).textContent =
        redondear(totalSABER) +
        " / " +
        calcularMaximoCategoria("SABER");


    document.getElementById(
        "resumenHACER"
    ).textContent =
        redondear(totalHACER) +
        " / " +
        calcularMaximoCategoria("HACER");


    document.getElementById(
        "resumenAUTO"
    ).textContent =
        redondear(totalAUTO) +
        " / " +
        calcularMaximoCategoria(
            "AUTOEVALUACION"
        );

}


// =====================================================
// MÁXIMO DE CATEGORÍA
// =====================================================

function calcularMaximoCategoria(
    categoria
) {

    const limites = {
        SER: 10,
        SABER: 45,
        HACER: 40,
        AUTOEVALUACION: 5
    };


    return limites[categoria];

}


// =====================================================
// CREAR ACTIVIDAD
// =====================================================

async function crearActividad() {

    if (!cursoSeleccionado) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const nombre =
        document.getElementById(
            "nombreActividad"
        ).value.trim();


    const categoria =
        document.getElementById(
            "categoriaActividad"
        ).value;


    const puntaje =
        Number(
            document.getElementById(
                "puntajeActividad"
            ).value
        );


    if (!nombre) {

        alert(
            "Escribe el nombre de la actividad."
        );

        return;

    }


    const limites = {
        SER: 10,
        SABER: 45,
        HACER: 40,
        AUTOEVALUACION: 5
    };


    if (
        !puntaje ||
        puntaje <= 0
    ) {

        alert(
            "Coloca un puntaje máximo válido."
        );

        return;

    }


    const usado =
        actividades
            .filter(
                a =>
                    a.categoria ===
                    categoria
            )
            .reduce(
                (
                    suma,
                    a
                ) =>
                    suma +
                    Number(
                        a.puntaje_maximo
                    ),
                0
            );


    if (
        usado + puntaje >
        limites[categoria]
    ) {

        alert(
            `No puedes superar los ${limites[categoria]} puntos de ${categoria}.\n\n` +
            `Actualmente tienes ${usado} puntos.`
        );

        return;

    }


    mostrarMensaje(
        "Creando actividad..."
    );


    const orden =
        actividades.length + 1;


    const {
        error
    } = await supabaseClient

        .from("actividades")

        .insert({

            curso:
                cursoSeleccionado,

            trimestre:
                3,

            categoria:
                categoria,

            nombre:
                nombre,

            puntaje_maximo:
                puntaje,

            orden:
                orden

        });


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al crear la actividad.",
            true
        );

        return;

    }


    document.getElementById(
        "nombreActividad"
    ).value = "";


    document.getElementById(
        "puntajeActividad"
    ).value = "";


    mostrarMensaje(
        "✓ Actividad creada correctamente."
    );


    await cargarActividades();

}


// =====================================================
// GUARDAR NOTAS
// =====================================================

async function guardarNotas() {

    if (!cursoSeleccionado) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    if (actividades.length === 0) {

        alert(
            "Este curso todavía no tiene actividades."
        );

        return;

    }


    mostrarMensaje(
        "Guardando calificaciones..."
    );


    const inputs =
        document.querySelectorAll(
            ".nota-input"
        );


    const registros = [];


    // ---------------------------------------------
    // PREPARAR CALIFICACIONES
    // ---------------------------------------------

    inputs.forEach(input => {

        const estudianteId =
            Number(
                input.dataset.estudiante
            );


        const actividadId =
            Number(
                input.dataset.actividad
            );


        let nota =
            input.value === ""
                ? null
                : Number(input.value);


        const maximo =
            Number(
                input.dataset.maximo
            );


        if (
            nota !== null &&
            nota > maximo
        ) {

            nota = maximo;

        }


        if (
            nota !== null &&
            nota < 0
        ) {

            nota = 0;

        }


        registros.push({

            actividad_id:
                actividadId,

            estudiante_id:
                estudianteId,

            nota:
                nota

        });

    });


    // ---------------------------------------------
    // GUARDAR EN CALIFICACIONES
    // ---------------------------------------------

    if (registros.length > 0) {

        const {
            error
        } = await supabaseClient

            .from("calificaciones")

            .upsert(
                registros,
                {
                    onConflict:
                        "actividad_id,estudiante_id"
                }
            );


        if (error) {

            console.error(error);

            mostrarMensaje(
                "Error al guardar las calificaciones: " +
                error.message,
                true
            );

            return;

        }

    }


    // ---------------------------------------------
    // ACTUALIZAR NOTA 3T
    // ---------------------------------------------

    const estudiantesCurso =
        estudiantes.filter(
            e => e.curso === cursoSeleccionado
        );


    for (
        const estudiante
        of estudiantesCurso
    ) {

        let ser = 0;
        let saber = 0;
        let hacer = 0;
        let auto = 0;


        document.querySelectorAll(
            `.nota-input[data-estudiante="${estudiante.id}"]`
        ).forEach(input => {

            let nota =
                input.value === ""
                    ? 0
                    : Number(input.value);


            if (
                input.dataset.categoria ===
                "SER"
            ) {

                ser += nota;

            }


            if (
                input.dataset.categoria ===
                "SABER"
            ) {

                saber += nota;

            }


            if (
                input.dataset.categoria ===
                "HACER"
            ) {

                hacer += nota;

            }


            if (
                input.dataset.categoria ===
                "AUTOEVALUACION"
            ) {

                auto += nota;

            }

        });


        // Limitar a los máximos

        ser =
            Math.min(ser, 10);

        saber =
            Math.min(saber, 45);

        hacer =
            Math.min(hacer, 40);

        auto =
            Math.min(auto, 5);


        const nota3 =
            Math.round(
                ser +
                saber +
                hacer +
                auto
            );


        const {
            error
        } = await supabaseClient

            .from("matematica")

            .update({
                nota_3t:
                    nota3
            })

            .eq(
                "id",
                estudiante.id
            );


        if (error) {

            console.error(error);

            mostrarMensaje(
                "Las calificaciones se guardaron, pero hubo un error actualizando la nota 3T.",
                true
            );

            return;

        }

    }


    mostrarMensaje(
        "✓ Calificaciones guardadas correctamente."
    );


    await cargarEstudiantes();


    // Volver a cargar las actividades
    // del curso seleccionado

    await cargarActividades();

}


// =====================================================
// CERRAR SESIÓN
// =====================================================

async function cerrarSesion() {

    await supabaseClient.auth.signOut();

    window.location.href =
        "login-docente.html";

}


// =====================================================
// MENSAJES
// =====================================================

function mostrarMensaje(
    texto,
    error = false
) {

    const mensaje =
        document.getElementById(
            "mensaje"
        );


    mensaje.textContent =
        texto;


    mensaje.style.color =
        error
            ? "#c62828"
            : "#16803c";

}


// =====================================================
// REDONDEAR
// =====================================================

function redondear(numero) {

    return Math.round(
        Number(numero) || 0
    );

}


// =====================================================
// SEGURIDAD HTML
// =====================================================

function escapeHTML(texto) {

    return String(texto)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================================
// BUSCAR POR NOMBRE
// =====================================================

document.getElementById(
    "buscarNombre"
).addEventListener(
    "input",
    function() {

        const texto =
            this.value
                .toLowerCase()
                .trim();


        document.querySelectorAll(
            ".nota-input"
        ).forEach(input => {

            // La búsqueda se controla
            // ocultando las filas.

        });


        const filas =
            document.querySelectorAll(
                "#contenedorActividades tbody tr"
            );


        filas.forEach(fila => {

            const nombre =
                fila
                    .querySelector(
                        ".nombre"
                    );


            if (!nombre) {

                return;

            }


            const coincide =
                nombre.textContent
                    .toLowerCase()
                    .includes(texto);


            fila.style.display =
                coincide
                    ? ""
                    : "none";

        });

    }
);


// =====================================================
// INICIAR
// =====================================================

comprobarSesion();

</script>
