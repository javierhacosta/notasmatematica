<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 96%;
    max-width: 1400px;
    margin: 25px auto;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    color: #1557a6;
    margin-top: 0;
}

h3 {
    margin-top: 0;
}

.usuario {
    color: #666;
    margin-bottom: 25px;
}


/* ================================
   FILTROS
================================ */

.filtros {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtro {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}


/* ================================
   INFORMACIÓN DEL CURSO
================================ */

.info {
    margin-top: 15px;
    padding: 12px;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
}


/* ================================
   CREAR ACTIVIDAD
================================ */

.nueva-actividad {
    margin-top: 20px;
    padding: 20px;
    background: #eef4fb;
    border: 1px solid #cbdced;
    border-radius: 12px;
}

.nueva-grid {
    display: grid;
    grid-template-columns: 1fr 260px auto;
    gap: 15px;
    align-items: end;
}


/* ================================
   BOTONES
================================ */

button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.crear {
    background: #1557a6;
    color: white;
}

.guardar {
    background: #16803c;
    color: white;
}

.salir {
    background: #c62828;
    color: white;
}


/* ================================
   BOTÓN -
================================ */

.boton-ocultar {
    background: #555;
    color: white;

    width: 38px;
    height: 34px;

    padding: 0;

    font-size: 22px;
    font-weight: bold;
}


/* ================================
   BOTÓN BASURERO
================================ */

.boton-eliminar {
    background: #c62828;
    color: white;

    width: 38px;
    height: 34px;

    padding: 0;

    font-size: 18px;
}


/* ================================
   CATEGORÍAS
================================ */

.categoria {
    margin-top: 25px;

    border: 1px solid #ddd;
    border-radius: 12px;

    overflow: hidden;
}

.titulo-categoria {
    color: white;

    padding: 13px 15px;

    font-size: 17px;
    font-weight: bold;
}

.ser {
    background: #7b1fa2;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00838f;
}


/* ================================
   ACTIVIDADES
================================ */

.actividad {
    margin: 18px;

    border: 1px solid #ddd;
    border-radius: 10px;

    overflow: hidden;
}

.encabezado-actividad {

    background: #f4f6f8;

    padding: 12px 15px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;
}

.nombre-actividad {

    font-weight: bold;

    font-size: 16px;
}

.botones-actividad {

    display: flex;

    gap: 7px;
}

.contenido-actividad {

    padding: 0;
}


/* ================================
   TABLAS
================================ */

.tabla-contenedor {

    overflow-x: auto;
}

table {

    width: 100%;

    border-collapse: collapse;

    min-width: 650px;
}

th,
td {

    border: 1px solid #ddd;

    padding: 8px;

    text-align: center;
}

th {

    background: #f0f0f0;
}

td.nombre {

    text-align: left;

    white-space: nowrap;
}

.nota-input {

    width: 75px;

    text-align: center;

    padding: 7px;
}


/* ================================
   TABLA GENERAL
================================ */

.tabla-general {

    margin-top: 30px;

    border: 1px solid #ddd;

    border-radius: 12px;

    overflow: hidden;
}

.titulo-general {

    background: #1557a6;

    color: white;

    padding: 13px 15px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 18px;

    font-weight: bold;
}

.boton-general {

    background: rgba(255,255,255,.20);

    color: white;

    width: 38px;

    height: 34px;

    padding: 0;

    font-size: 22px;

    font-weight: bold;
}

.nota-3t {

    font-weight: bold;

    font-size: 18px;
}

.nota-final {

    font-weight: bold;
}


/* ================================
   BOTONES INFERIORES
================================ */

.botones {

    margin-top: 25px;

    display: flex;

    gap: 12px;

    flex-wrap: wrap;
}


/* ================================
   MENSAJE
================================ */

.mensaje {

    margin-top: 15px;

    font-weight: bold;
}


/* ================================
   OCULTO
================================ */

.oculto {

    display: none !important;
}


/* ================================
   CELULAR
================================ */

@media (max-width: 800px) {

    .nueva-grid {

        grid-template-columns: 1fr;

    }

    .panel {

        padding: 15px;

    }

}

</style>

</head>


<body>


<div class="contenedor">

<div class="panel">


<h1>
Panel Docente
</h1>


<div class="usuario">

Usuario:
<span id="usuario"></span>

</div>


<!-- =====================================
     FILTROS
===================================== -->

<div class="filtros">


<div class="filtro">

<label>
Buscar por nombre
</label>

<input
    type="text"
    id="buscarNombre"
    placeholder="Escribe un nombre..."
>

</div>


<div class="filtro">

<label>
Curso
</label>

<select id="buscarCurso">

<option value="">
Selecciona un curso
</option>

</select>

</div>


</div>


<div
    id="mensajeCurso"

Selecciona un curso para comenzar.

<!-- =====================================
     CREAR ACTIVIDAD
===================================== -->

<div
    id="panelNuevaActividad"
    class="nueva-actividad oculto">


<h3>
➕ Crear nueva actividad
</h3>


<div class="nueva-grid">


<div>

<label>
Nombre de la actividad
</label>

<input
    type="text"
    id="nombreActividad"
    placeholder="Ej.: Evaluación de números"
>

</div>


<div>

<label>
Categoría</label>

<select id="categoriaActividad">

<option value="SER">
SER — 10 puntos
</option>

<option value="SABER">
SABER — 45 puntos
</option>

<option value="HACER">
HACER — 40 puntos
</option>

<option value="AUTOEVALUACION">
AUTOEVALUACIÓN — 5 puntos
</option>

</select>

</div>


<div>

<button
    class="crear"
    onclick="crearActividad()">

➕ Crear actividad

</button>

</div>


</div>

</div>


<!-- =====================================
     ACTIVIDADES
===================================== -->

<div
    id="contenedorActividades">

</div>


<!-- =====================================
     CALIFICACIONES DEL CURSO
===================================== -->

<div
    id="tablaGeneral"
    class="tabla-general oculto">


<div class="titulo-general">

<span>
📊 Calificaciones del curso
</span>


<button
    id="botonGeneral"
    class="boton-general"
    onclick="ocultarTablaGeneral()"
    title="Ocultar calificaciones">

−

</button>

</div>


<div
    id="contenidoGeneral">


<div class="tabla-contenedor">

<table>

<thead>

<tr>

<th>
CI
</th>

<th>
Nombre
</th>

<th>
Curso
</th>

<th>
1T
</th>

<th>
2T
</th>

<th>
3T
</th>

<th>
Final
</th>

</tr>

</thead>


<tbody
    id="tablaEstudiantes">

</tbody>

</table>

</div>

</div>

</div>


<!-- =====================================
     BOTONES
===================================== -->

<div class="botones">


<button
    class="guardar"
    onclick="guardarNotas()">

💾 Guardar notas

</button>


<button
    class="salir"
    onclick="cerrarSesion()">

🚪 Cerrar sesión

</button>


</div>


<div
    id="mensaje"
    class="mensaje">

</div>


</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ==================================================
// SUPABASE
// ==================================================

const SUPABASE_URL =
"https://tecphbbkkmlgahjddcep.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ==================================================
// VARIABLES
// ==================================================

let estudiantes = [];

let actividades = [];

let calificaciones = {};

let cursoSeleccionado = "";


// ==================================================
// PUNTAJES FIJOS
// ==================================================

const LIMITES = {

    SER: 10,

    SABER: 45,

    HACER: 40,

    AUTOEVALUACION: 5

};


// ==================================================
// COMPROBAR SESIÓN
// ==================================================

async function comprobarSesion() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href =
        "login-docente.html";

        return;

    }


    document.getElementById(
        "usuario"
    ).textContent = user.email;


    await cargarEstudiantes();

}


// ==================================================
// CARGAR ESTUDIANTES
// ==================================================

async function cargarEstudiantes() {

    const {
        data,
        error
    } = await supabaseClient

    .from("matematica")

    .select(
        "id,ci,nombre,curso,nota_1t,nota_2t,nota_3t,final"
    )

    .order("nombre");


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar estudiantes: " +
            error.message,
            true
        );

        return;

    }


    estudiantes = data || [];


    cargarCursos();

}


// ==================================================
// CARGAR CURSOS
// ==================================================

function cargarCursos() {

    const select =
    document.getElementById(
        "buscarCurso"
    );


    select.innerHTML = `

    <option value="">
    Selecciona un curso
    </option>

    `;


    const cursos =
    [...new Set(

        estudiantes
        .map(
            e => e.curso
        )
        .filter(Boolean)

    )].sort();


    cursos.forEach(
    curso => {

        const opcion =
        document.createElement(
            "option"
        );


        opcion.value =
        curso;


        opcion.textContent =
        curso;


        select.appendChild(
            opcion
        );

    });

}


// ==================================================
// CAMBIO DE CURSO
// ==================================================

document.getElementById(
    "buscarCurso"
).addEventListener(
    "change",
    async function() {


        cursoSeleccionado =
        this.value;


        document.getElementById(
            "contenedorActividades"
        ).innerHTML = "";


        document.getElementById(
            "tablaEstudiantes"
        ).innerHTML = "";


        document.getElementById(
            "tablaGeneral"
        ).classList.add(
            "oculto"
        );


        document.getElementById(
            "panelNuevaActividad"
        ).classList.add(
            "oculto"
        );


        if (!cursoSeleccionado) {

            document.getElementById(
                "mensajeCurso"
            ).textContent =
            "Selecciona un curso para comenzar.";

            return;

        }


        document.getElementById(
            "panelNuevaActividad"
        ).classList.remove(
            "oculto"
        );


        document.getElementById(
            "mensajeCurso"
        ).textContent =
        "Curso seleccionado: " +
        cursoSeleccionado;


        await cargarActividades();


        mostrarTablaGeneral();

    });


// ==================================================
// CARGAR ACTIVIDADES
// ==================================================

async function cargarActividades() {

    const {
        data,
        error
    } = await supabaseClient

    .from("actividades")

    .select(
        "id,curso,trimestre,categoria,nombre,orden,puntaje_maximo"
    )

    .eq(
        "curso",
        cursoSeleccionado
    )

    .eq(
        "trimestre",
        3
    )

    .order(
        "orden"
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar actividades: " +
            error.message,
            true
        );

        return;

    }


    actividades =
    data || [];


    await cargarCalificaciones();


    mostrarActividades();

}


// ==================================================
// CARGAR CALIFICACIONES
// ==================================================

async function cargarCalificaciones() {

    calificaciones = {};


    if (
        actividades.length === 0
    ) {

        return;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    const idsEstudiantes =
    estudiantesCurso.map(
        e => e.id
    );


    const idsActividades =
    actividades.map(
        a => a.id
    );


    if (
        idsEstudiantes.length === 0 ||
        idsActividades.length === 0
    ) {

        return;

    }


    const {
        data,
        error
    } = await supabaseClient

    .from("calificaciones")

    .select(
        "id,actividad_id,estudiante_id,nota"
    )

    .in(
        "actividad_id",
        idsActividades
    )

    .in(
        "estudiante_id",
        idsEstudiantes
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar calificaciones: " +
            error.message,
            true
        );

        return;

    }


    (data || []).forEach(
    cal => {


        if (
            !calificaciones[
                cal.estudiante_id
            ]
        ) {

            calificaciones[
                cal.estudiante_id
            ] = {};

        }


        calificaciones[
            cal.estudiante_id
        ][
            cal.actividad_id
        ] =
        cal.nota;


    });

}


// ==================================================
// MOSTRAR ACTIVIDADES
// ==================================================

function mostrarActividades() {

    const contenedor =
    document.getElementById(
        "contenedorActividades"
    );


    contenedor.innerHTML = "";


    const categorias = [

        {
            codigo: "SER",
            nombre: "SER — 10 puntos",
            clase: "ser"
        },

        {
            codigo: "SABER",
            nombre: "SABER — 45 puntos",
            clase: "saber"
        },

        {
            codigo: "HACER",
            nombre: "HACER — 40 puntos",
            clase: "hacer"
        },

        {
            codigo: "AUTOEVALUACION",
            nombre: "AUTOEVALUACIÓN — 5 puntos",
            clase: "auto"
        }

    ];


    categorias.forEach(
    categoria => {


        const lista =
        actividades.filter(
            a =>
            a.categoria ===
            categoria.codigo
        );


        if (
            lista.length === 0
        ) {

            return;

        }


        // =========================================
        // CATEGORÍA
        // SIN BOTÓN -
        // =========================================

        const seccion =
        document.createElement(
            "div"
        );


        seccion.className =
        "categoria";


        const encabezado =
        document.createElement(
            "div"
        );


        encabezado.className =
        "titulo-categoria " +
        categoria.clase;


        encabezado.textContent =
        categoria.nombre;


        seccion.appendChild(
            encabezado
        );


        // =========================================
        // ACTIVIDADES
        // =========================================

        lista.forEach(
        actividad => {

            seccion.appendChild(
                crearActividadHTML(
                    actividad
                )
            );

        });


        contenedor.appendChild(
            seccion
        );


    });


    if (
        actividades.length === 0
    ) {

        contenedor.innerHTML = `

        <div class="info">

        Este curso todavía no tiene actividades
        para el tercer trimestre.

        </div>

        `;

    }

}


// ==================================================
// CREAR HTML DE UNA ACTIVIDAD
// ==================================================

function crearActividadHTML(
    actividad
) {


    const bloque =
    document.createElement(
        "div"
    );


    bloque.className =
    "actividad";


    // =========================================
    // ENCABEZADO
    // =========================================

    const encabezado =
    document.createElement(
        "div"
    );


    encabezado.className =
    "encabezado-actividad";


    const nombre =
    document.createElement(
        "div"
    );


    nombre.className =
    "nombre-actividad";


    nombre.textContent =
    actividad.nombre;


    const botones =
    document.createElement(
        "div"
    );


    botones.className =
    "botones-actividad";


    // =========================================
    // BOTÓN -
    // =========================================

    const botonOcultar =
    document.createElement(
        "button"
    );


    botonOcultar.className =
    "boton-ocultar";


    botonOcultar.textContent =
    "−";


    botonOcultar.title =
    "Ocultar estudiantes";


    // =========================================
    // BOTÓN ELIMINAR
    // =========================================

    const botonEliminar =
    document.createElement(
        "button"
    );


    botonEliminar.className =
    "boton-eliminar";


    botonEliminar.textContent =
    "🗑️";


    botonEliminar.title =
    "Eliminar actividad";


    botones.appendChild(
        botonOcultar
    );


    botones.appendChild(
        botonEliminar
    );


    encabezado.appendChild(
        nombre
    );


    encabezado.appendChild(
        botones
    );


    bloque.appendChild(
        encabezado
    );


    // =========================================
    // CONTENIDO
    // =========================================

    const contenido =
    document.createElement(
        "div"
    );


    contenido.className =
    "contenido-actividad";


    const tablaContenedor =
    document.createElement(
        "div"
    );


    tablaContenedor.className =
    "tabla-contenedor";


    const tabla =
    document.createElement(
        "table"
    );


    tabla.innerHTML = `

    <thead>

    <tr>

    <th>
    CI
    </th>

    <th>
    Nombre
    </th>

    <th>
    Nota
    </th>

    </tr>

    </thead>

    <tbody></tbody>

    `;


    const tbody =
    tabla.querySelector(
        "tbody"
    );


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    estudiantesCurso.forEach(
    estudiante => {


        let nota = null;


        if (
            calificaciones[
                estudiante.id
            ] &&
            calificaciones[
                estudiante.id
            ][
                actividad.id
            ] !== undefined
        ) {

            nota =
            calificaciones[
                estudiante.id
            ][
                actividad.id
            ];

        }


        const fila =
        document.createElement(
            "tr"
        );


        fila.innerHTML = `

        <td>
        ${escapeHTML(
            String(
                estudiante.ci
            )
        )}
        </td>

        <td class="nombre">
        ${escapeHTML(
            estudiante.nombre
        )}
        </td>

        <td>

        <input

        class="nota-input"

        type="number"

        min="0"

        max="100"

        step="0.01"

        value="${
            nota === null
            ? ""
            : nota
        }"

        data-estudiante="${
            estudiante.id
        }"

        data-actividad="${
            actividad.id
        }"

        data-categoria="${
            actividad.categoria
        }"

        oninput="validarNota(this)"

        >

        </td>

        `;


        tbody.appendChild(
            fila
        );

    });


    tablaContenedor.appendChild(
        tabla
    );


    contenido.appendChild(
        tablaContenedor
    );


    bloque.appendChild(
        contenido
    );


    // =========================================
    // FUNCION BOTÓN -
    // =========================================

    botonOcultar.onclick =
    function() {


        if (
            contenido.classList.contains(
                "oculto"
            )
        ) {

            contenido.classList.remove(
                "oculto"
            );


            botonOcultar.textContent =
            "−";


            botonOcultar.title =
            "Ocultar estudiantes";


        } else {

            contenido.classList.add(
                "oculto"
            );


            botonOcultar.textContent =
            "+";


            botonOcultar.title =
            "Mostrar estudiantes";

        }

    };


    // =========================================
    // ELIMINAR
    // =========================================

    botonEliminar.onclick =
    function() {

        eliminarActividad(
            actividad
        );

    };


    return bloque;

}


// ==================================================
// VALIDAR NOTA
// ==================================================

function validarNota(
    input
) {


    if (
        input.value === ""
    ) {

        return;

    }


    let valor =
    Number(
        input.value
    );


    if (
        valor < 0
    ) {

        input.value =
        0;

    }


    if (
        valor > 100
    ) {

        input.value =
        100;

    }

}


// ==================================================
// CREAR ACTIVIDAD
// ==================================================

async function crearActividad() {


    if (
        !cursoSeleccionado
    ) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const nombre =
    document.getElementById(
        "nombreActividad"
    ).value.trim();


    const categoria =
    document.getElementById(
        "categoriaActividad"
    ).value;


    if (
        !nombre
    ) {

        alert(
            "Escribe el nombre de la actividad."
        );

        return;

    }


    mostrarMensaje(
        "Creando actividad..."
    );


    // =========================================
    // ORDEN AUTOMÁTICO
    // =========================================

    let orden = 1;


    if (
        actividades.length > 0
    ) {

        orden =
        Math.max(
            ...actividades.map(
                a =>
                Number(
                    a.orden || 0
                )
            )
        ) + 1;

    }


    // =========================================
    // PUNTAJE AUTOMÁTICO
    // =========================================

    const puntajeMaximo =
    LIMITES[
        categoria
    ];


    // =========================================
    // INSERTAR
    // =========================================

    const {
        data,
        error
    } = await supabaseClient

    .from("actividades")

    .insert({

        curso:
        cursoSeleccionado,

        trimestre:
        3,

        categoria:
        categoria,

        nombre:
        nombre,

        orden:
        orden,

        puntaje_maximo:
        puntajeMaximo

    })

    .select();


    if (error) {

        console.error(error);

        mostrarMensaje(

            "Error al crear actividad: " +
            error.message,

            true

        );

        return;

    }


    document.getElementById(
        "nombreActividad"
    ).value = "";


    mostrarMensaje(
        "✓ Actividad creada correctamente."
    );


    await cargarActividades();

}


// ==================================================
// ELIMINAR ACTIVIDAD
// ==================================================

async function eliminarActividad(
    actividad
) {


    const confirmar =
    confirm(

        "¿Está seguro de eliminar esta actividad?\n\n" +

        "Actividad: " +
        actividad.nombre +

        "\n\n" +

        "También se eliminarán todas las " +
        "calificaciones de esta actividad."

    );


    if (
        !confirmar
    ) {

        return;

    }


    mostrarMensaje(
        "Eliminando actividad..."
    );


    // =========================================
    // 1. ELIMINAR CALIFICACIONES
    // =========================================

    const {
        error:
        errorCalificaciones
    } = await supabaseClient

    .from("calificaciones")

    .delete()

    .eq(
        "actividad_id",
        actividad.id
    );


    if (
        errorCalificaciones
    ) {

        console.error(
            errorCalificaciones
        );


        mostrarMensaje(

            "Error al eliminar las calificaciones: " +

            errorCalificaciones.message,

            true

        );

        return;

    }


    // =========================================
    // 2. ELIMINAR ACTIVIDAD
    // =========================================

    const {
        error:
        errorActividad
    } = await supabaseClient

    .from("actividades")

    .delete()

    .eq(
        "id",
        actividad.id
    );


    if (
        errorActividad
    ) {

        console.error(
            errorActividad
        );


        mostrarMensaje(

            "Error al eliminar la actividad: " +

            errorActividad.message,

            true

        );

        return;

    }


    mostrarMensaje(
        "✓ Actividad eliminada correctamente."
    );


    await cargarActividades();

}


// ==================================================
// MOSTRAR TABLA GENERAL
// ==================================================

function mostrarTablaGeneral() {


    const tabla =
    document.getElementById(
        "tablaEstudiantes"
    );


    tabla.innerHTML = "";


    if (
        !cursoSeleccionado
    ) {

        return;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    estudiantesCurso.forEach(
    estudiante => {


        const fila =
        document.createElement(
            "tr"
        );


        fila.innerHTML = `

        <td>

        ${escapeHTML(
            String(
                estudiante.ci
            )
        )}

        </td>

        <td class="nombre">

        ${escapeHTML(
            estudiante.nombre
        )}

        </td>

        <td>

        ${escapeHTML(
            estudiante.curso
        )}

        </td>

        <td>

        ${mostrarNota(
            estudiante.nota_1t
        )}

        </td>

        <td>

        ${mostrarNota(
            estudiante.nota_2t
        )}

        </td>

        <td
            id="nota3t-${estudiante.id}"
            class="nota-3t">

        ${mostrarNota(
            estudiante.nota_3t
        )}

        </td>

        <td
            id="final-${estudiante.id}"

// ==================================================
// OCULTAR TABLA GENERAL
// ==================================================

function ocultarTablaGeneral() {


    const contenido =
    document.getElementById(
        "contenidoGeneral"
    );


    const boton =
    document.getElementById(
        "botonGeneral"
    );


    if (
        contenido.classList.contains(
            "oculto"
        )
    ) {

        contenido.classList.remove(
            "oculto"
        );


        boton.textContent =
        "−";


        boton.title =
        "Ocultar calificaciones";


    } else {

        contenido.classList.add(
            "oculto"
        );


        boton.textContent =
        "+";


        boton.title =
        "Mostrar calificaciones";

    }

}


// ==================================================
// GUARDAR NOTAS
// ==================================================

async function guardarNotas() {


    if (
        !cursoSeleccionado
    ) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    if (
        actividades.length === 0
    ) {

        alert(
            "Este curso no tiene actividades."
        );

        return;

    }


    mostrarMensaje(
        "Guardando calificaciones..."
    );


    const inputs =
    document.querySelectorAll(
        ".nota-input"
    );


    const registros = [];


    inputs.forEach(
    input => {


        const estudianteId =
        Number(
            input.dataset.estudiante
        );


        const actividadId =
        Number(
            input.dataset.actividad
        );


        let nota = null;


        if (
            input.value !== ""
        ) {

            nota =
            Number(
                input.value
            );


            if (
                nota < 0
            ) {

                nota = 0;

            }


            if (
                nota > 100
            ) {

                nota = 100;

            }

        }


        registros.push({

            actividad_id:
            actividadId,

            estudiante_id:
            estudianteId,

            nota:
            nota

        });


    });


    // =========================================
    // GUARDAR CALIFICACIONES
    // =========================================

    const {
        error:
        errorCalificaciones
    } = await supabaseClient

    .from("calificaciones")

    .upsert(

        registros,

        {
            onConflict:
            "actividad_id,estudiante_id"
        }

    );


    if (
        errorCalificaciones
    ) {

        console.error(
            errorCalificaciones
        );


        mostrarMensaje(

            "Error al guardar calificaciones: " +

            errorCalificaciones.message,

            true

        );

        return;

    }


    // =========================================
    // CALCULAR 3T
    // =========================================

    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    for (
        const estudiante
        of estudiantesCurso
    ) {


        const totales = {

            SER: [],

            SABER: [],

            HACER: [],

            AUTOEVALUACION: []

        };


        actividades.forEach(
        actividad => {


            const input =
            document.querySelector(

                `.nota-input[data-estudiante="${estudiante.id}"][data-actividad="${actividad.id}"]`

            );


            if (
                !input ||
                input.value === ""
            ) {

                return;

            }


            const nota =
            Number(
                input.value
            );


            if (
                !isNaN(nota)
            ) {

                totales[
                    actividad.categoria
                ].push(
                    nota
                );

            }


        });


        // =====================================
        // PROMEDIOS
        // =====================================

        const promedioSER =
        calcularPromedio(
            totales.SER
        );


        const promedioSABER =
        calcularPromedio(
            totales.SABER
        );


        const promedioHACER =
        calcularPromedio(
            totales.HACER
        );


        const promedioAUTO =
        calcularPromedio(
            totales.AUTOEVALUACION
        );


        // =====================================
        // CONVERTIR A PUNTOS
        // =====================================

        const puntosSER =
        (promedioSER / 100) *
        LIMITES.SER;


        const puntosSABER =
        (promedioSABER / 100) *
        LIMITES.SABER;


        const puntosHACER =
        (promedioHACER / 100) *
        LIMITES.HACER;


        const puntosAUTO =
        (promedioAUTO / 100) *
        LIMITES.AUTOEVALUACION;


        // =====================================
        // NOTA 3T
        // =====================================

        const nota3T =
        Math.round(

            puntosSER +
            puntosSABER +
            puntosHACER +
            puntosAUTO

        );


        // =====================================
        // GUARDAR 3T
        // =====================================

        const {
            error
        } = await supabaseClient

        .from("matematica")

        .update({

            nota_3t:
            nota3T

        })

        .eq(
            "id",
            estudiante.id
        );


        if (error) {

            console.error(error);

            mostrarMensaje(

                "Error al actualizar 3T: " +
                error.message,

                true

            );

            return;

        }


    }


    mostrarMensaje(
        "✓ Calificaciones guardadas correctamente."
    );


    await cargarEstudiantes();

    mostrarTablaGeneral();

    await cargarActividades();

}


// ==================================================
// CALCULAR PROMEDIO
// ==================================================

function calcularPromedio(
    valores
) {


    if (
        !valores ||
        valores.length === 0
    ) {

        return 0;

    }


    const suma =
    valores.reduce(
        (
            total,
            valor
        ) =>

        total +
        Number(valor),

        0
    );


    return
    suma /
    valores.length;

}


// ==================================================
// MOSTRAR NOTA
// ==================================================

function mostrarNota(
    nota
) {


    if (
        nota === null ||
        nota === undefined
    ) {

        return "";

    }


    return nota;

}


// ==================================================
// BUSCAR POR NOMBRE
// ==================================================

document.getElementById(
    "buscarNombre"
).addEventListener(
    "input",
    function() {


        const texto =
        this.value
        .toLowerCase()
        .trim();


        document.querySelectorAll(
            "#contenedorActividades tbody tr"
        ).forEach(
        fila => {


            const nombre =
            fila.querySelector(
                ".nombre"
            );


            if (!nombre) {

                return;

            }


            const coincide =
            nombre.textContent
            .toLowerCase()
            .includes(
                texto
            );


            fila.style.display =
            coincide
            ? ""
            : "none";


        });

    });

// ==================================================
// MENSAJES
// ==================================================

function mostrarMensaje(
    texto,
    error = false
) {


    const mensaje =
    document.getElementById(
        "mensaje"
    );


    mensaje.textContent =
    texto;


    mensaje.style.color =
    error
    ? "#c62828"
    : "#16803c";

}


// ==================================================
// ESCAPAR HTML
// ==================================================

function escapeHTML(
    texto
) {


    return String(texto)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

// ==================================================

comprobarSesion();
