<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 96%;
    max-width: 1400px;
    margin: 25px auto;
    overflow-x: hidden;
}

.panel {
    width: 100%;
    max-width: 100%;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    color: #1557a6;
    margin-top: 0;
}

h3 {
    margin-top: 0;
}

.usuario {
    color: #666;
    margin-bottom: 25px;
}


/* =====================================================
   FILTROS
===================================================== */

.filtros {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtro {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    max-width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.info {
    margin-top: 15px;
    padding: 12px;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
}


/* =====================================================
   MODAL NUEVA ACTIVIDAD
===================================================== */

.modal-fondo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: 100%;
    background: rgba(0,0,0,.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    z-index: 9999;
    overflow: hidden;
}

.modal-fondo.oculto {
    display: none !important;
}

.modal-actividad {
    width: 100%;
    max-width: 560px;
    background: white;
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0,0,0,.30);
    overflow: hidden;
    animation: aparecerModal .18s ease-out;
}

@keyframes aparecerModal {

    from {
        opacity: 0;
        transform: scale(.94);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

.modal-cabecera {
    background: #1557a6;
    color: white;
    padding: 15px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.modal-cabecera h3 {
    margin: 0;
    font-size: 18px;
}

.boton-cerrar-modal {
    width: 34px;
    height: 34px;
    padding: 0;
    background: rgba(255,255,255,.18);
    color: white;
    font-size: 23px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
}

.boton-cerrar-modal:hover {
    background: rgba(255,255,255,.30);
}

.modal-cuerpo {
    padding: 20px;
}

.modal-cuerpo .campo {
    margin-bottom: 17px;
}

.modal-cuerpo label {
    margin-bottom: 7px;
}


/* =====================================================
   CATEGORÍAS RADIO
===================================================== */

.categorias-radio {
    display: flex;
    justify-content: center;
    align-items: stretch;
    gap: 12px;
    margin-top: 12px;
    max-width: 100%;
}

.radio-categoria {
    position: relative;
    flex: 1;
    max-width: 125px;
    min-width: 0;
}

.radio-categoria input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.radio-categoria label {
    width: 100%;
    height: 100%;
    margin: 0;
    cursor: pointer;
    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 8px 5px;

    border-radius: 10px;
    border: none;
    background: #fafafa;

    transition: all .2s ease;
}

.radio-categoria label:hover {
    transform: translateY(-1px);
    box-shadow: none;
}


/* =====================================================
   ICONOS DE CATEGORÍA
   PEQUEÑOS Y SIN CONTORNOS
===================================================== */

.icono-categoria {
    width: 38px;
    height: 38px;

    margin: 0 auto 3px;

    border-radius: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;

    background: transparent;
    color: #777;

    opacity: .55;
    filter: grayscale(100%);

    transition: all .2s ease;

    border: none;
}

.radio-categoria label:hover .icono-categoria {
    opacity: .85;
    transform: scale(1.05);
}


/* =====================================================
   NOMBRE CATEGORÍA
===================================================== */

.nombre-categoria {
    display: none;

    margin-top: 4px;

    font-weight: bold;

    font-size: 11px;

    line-height: 1.2;

    color: #444;

    animation: aparecerNombreCategoria .18s ease-out;
}

.radio-categoria input:checked + label .nombre-categoria {
    display: block;
}

@keyframes aparecerNombreCategoria {

    from {
        opacity: 0;
        transform: translateY(-4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =====================================================
   SER
===================================================== */

.radio-categoria.ser label {
    border: none;
    background: #fafafa;
}

.radio-categoria.ser .icono-categoria {
    background: transparent;
    color: #7b1fa2;
}

.radio-categoria.ser input:checked + label {
    background: #faf3fc;
    border: none;
    box-shadow: none;
}

.radio-categoria.ser input:checked + label .icono-categoria {
    background: transparent;
    color: #7b1fa2;

    opacity: 1;
    filter: grayscale(0);

    border: none;

    transform: scale(1.08);
}

.radio-categoria.ser input:checked + label .nombre-categoria {
    color: #7b1fa2;
}


/* =====================================================
   SABER
===================================================== */

.radio-categoria.saber label {
    border: none;
    background: #fafafa;
}

.radio-categoria.saber .icono-categoria {
    background: transparent;
    color: #1565c0;
}

.radio-categoria.saber input:checked + label {
    background: #f2f8ff;
    border: none;
    box-shadow: none;
}

.radio-categoria.saber input:checked + label .icono-categoria {
    background: transparent;
    color: #1565c0;

    opacity: 1;
    filter: grayscale(0);

    border: none;

    transform: scale(1.08);
}

.radio-categoria.saber input:checked + label .nombre-categoria {
    color: #1565c0;
}


/* =====================================================
   HACER
===================================================== */

.radio-categoria.hacer label {
    border: none;
    background: #fafafa;
}

.radio-categoria.hacer .icono-categoria {
    background: transparent;
    color: #ef6c00;
}

.radio-categoria.hacer input:checked + label {
    background: #fff8ef;
    border: none;
    box-shadow: none;
}

.radio-categoria.hacer input:checked + label .icono-categoria {
    background: transparent;
    color: #ef6c00;

    opacity: 1;
    filter: grayscale(0);

    border: none;

    transform: scale(1.08);
}

.radio-categoria.hacer input:checked + label .nombre-categoria {
    color: #ef6c00;
}


/* =====================================================
   AUTOEVALUACIÓN
===================================================== */

.radio-categoria.auto label {
    border: none;
    background: #fafafa;
}

.radio-categoria.auto .icono-categoria {
    background: transparent;
    color: #00838f;
}

.radio-categoria.auto input:checked + label {
    background: #effcfb;
    border: none;
    box-shadow: none;
}

.radio-categoria.auto input:checked + label .icono-categoria {
    background: transparent;
    color: #00838f;

    opacity: 1;
    filter: grayscale(0);

    border: none;

    transform: scale(1.08);
}

.radio-categoria.auto input:checked + label .nombre-categoria {
    color: #00838f;
}


/* =====================================================
   BOTONES DEL MODAL
===================================================== */

.modal-acciones {
    display: flex;
    flex-direction: row;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
}

.modal-acciones button {
    flex: 0 0 auto;
    width: auto;
    min-width: 120px;

    border: none;
    border-radius: 8px;

    padding: 10px 15px;

    cursor: pointer;

    font-size: 15px;
}

.boton-cancelar {
    background: #777;
    color: white;
}

.boton-crear-modal {
    background: #16803c;
    color: white;
}


/* =====================================================
   CATEGORÍAS ACTIVIDADES
===================================================== */

.categoria {
    width: 100%;
    max-width: 100%;
    margin-top: 25px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-categoria {
    color: white;
    padding: 13px 15px;
    font-size: 17px;
    font-weight: bold;
}

.ser {
    background: #7b1fa2;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00838f;
}


/* =====================================================
   ACTIVIDAD
===================================================== */

.actividad {
    width: calc(100% - 36px);
    max-width: calc(100% - 36px);
    margin: 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
}


/* =====================================================
   ENCABEZADO ACTIVIDAD
===================================================== */

.encabezado-actividad {
    background: #f4f6f8;
    padding: 10px 12px;

    display: flex;
    align-items: center;

    gap: 10px;

    max-width: 100%;
}

.izquierda-actividad {
    display: flex;
    align-items: center;

    gap: 6px;

    min-width: 0;
}

.derecha-actividad {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 6px;

    flex-shrink: 0;
}

.nombre-actividad {
    font-weight: bold;

    font-size: 16px;

    min-width: 0;

    display: flex;
    align-items: center;

    gap: 5px;

    flex-wrap: wrap;
}

.puntaje-actividad {
    font-weight: normal;

    color: #555;

    font-size: 14px;
}


/* =====================================================
   BOTONES ACTIVIDAD
===================================================== */

.boton-ocultar,
.boton-editar,
.boton-bloquear,
.boton-eliminar {

    color: white;

    width: 38px;
    height: 34px;

    padding: 0;

    font-size: 18px;

    font-weight: bold;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    border: none;

    border-radius: 6px;

    cursor: pointer;
}

.boton-editar {
    background: #1565c0;
}

.boton-eliminar {
    background: #c62828;
}

.boton-ocultar {
    background: #555;
}

.boton-bloquear {
    background: #ef6c00;
}


/* =====================================================
   CONTENIDO
===================================================== */

.contenido-actividad {
    padding: 0;
    width: 100%;
    max-width: 100%;
}


/* =====================================================
   TABLAS
===================================================== */

.tabla-contenedor {
    width: 100%;
    max-width: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    -webkit-overflow-scrolling: touch;
}

table {
    width: 100%;

    border-collapse: collapse;

    table-layout: auto;
}

th,
td {
    border: 1px solid #ddd;

    padding: 8px;

    text-align: center;

    vertical-align: middle;
}

th {
    background: #f0f0f0;
}

td.nombre {
    text-align: left;

    white-space: normal;

    overflow-wrap: anywhere;

    word-break: normal;

    min-width: 120px;

    line-height: 1.25;
}

th:first-child,
td:first-child {
    width: 45px;

    min-width: 45px;
}


/* =====================================================
   INPUT NOTAS
===================================================== */

.nota-input {
    width: 65px;

    max-width: 100%;

    text-align: center;

    padding: 7px;

    transition: .2s;
}

.nota-input:disabled {
    background: #eeeeee;

    color: #555;

    cursor: not-allowed;

    border-color: #ddd;
}

.nota-input.editable {
    background: #fffde7;

    border: 2px solid #ef6c00;
}


/* =====================================================
   TABLA GENERAL
===================================================== */

.tabla-general {
    width: 100%;
    max-width: 100%;

    margin-top: 30px;

    border: 1px solid #ddd;

    border-radius: 12px;

    overflow: hidden;
}

.titulo-general {
    background: #1557a6;

    color: white;

    padding: 10px 12px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 17px;

    font-weight: bold;
}

.acciones-general {
    display: flex;

    align-items: center;

    gap: 7px;

    margin-left: auto;
}

.boton-nueva-actividad {
    background: rgba(255,255,255,.20);

    color: white;

    width: 38px;
    height: 34px;

    padding: 0;

    border: none;

    border-radius: 7px;

    font-size: 21px;

    font-weight: bold;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.boton-general {
    background: rgba(255,255,255,.20);

    color: white;

    width: 38px;
    height: 34px;

    padding: 0;

    border: none;

    border-radius: 7px;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;
}


/* =====================================================
   ASISTENCIA
===================================================== */

.panel-asistencia {
    width: 100%;
    max-width: 100%;

    margin-top: 25px;

    border: 1px solid #ddd;

    border-radius: 12px;

    overflow: hidden;
}

.titulo-asistencia {
    background: #37474f;

    color: white;

    padding: 10px 12px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    font-size: 17px;

    font-weight: bold;
}

.acciones-asistencia {
    display: flex;

    align-items: center;

    gap: 7px;
}

.fecha-asistencia {
    width: 145px;

    padding: 7px 8px;

    border: none;

    border-radius: 6px;

    font-size: 14px;

    background: white;

    color: #222;
}


/* =====================================================
   BOTÓN GUARDAR ASISTENCIA
===================================================== */

.boton-guardar-asistencia {
    border: none;

    border-radius: 7px;

    background: #16803c;

    color: white;

    height: 34px;

    padding: 0 13px;

    font-size: 14px;

    font-weight: bold;

    cursor: pointer;

    white-space: nowrap;
}

.boton-guardar-asistencia:hover {
    background: #11652f;
}


/* =====================================================
   BOTÓN +
===================================================== */

.boton-asistencia {
    width: 38px;
    height: 34px;

    border: none;

    border-radius: 7px;

    background: rgba(255,255,255,.18);

    color: white;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;
}

.boton-asistencia:hover {
    background: rgba(255,255,255,.30);
}


/* =====================================================
   CONTENIDO
===================================================== */

.contenido-asistencia {
    background: white;
    width: 100%;
    max-width: 100%;
}

.contenido-asistencia.oculto {
    display: none;
}


/* =====================================================
   TABLA ASISTENCIA
===================================================== */

.tabla-asistencia {
    width: 100%;
}

.tabla-asistencia th {
    background: #f0f2f3;

    font-size: 13px;
}

.tabla-asistencia td {
    padding: 7px 5px;
}


/* =====================================================
   BOTONES DE ESTADO DE ASISTENCIA
===================================================== */

.estados-asistencia {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 5px;
}

.radio-asistencia {
    position: relative;
}

.radio-asistencia input {
    position: absolute;

    opacity: 0;

    pointer-events: none;
}

.boton-estado {
    width: 30px;
    height: 30px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    font-size: 16px;

    opacity: .28;

    filter: grayscale(100%);

    transition: all .18s ease;

    border: 2px solid transparent;
}


/* ASISTENCIA */

.estado-asistio {
    background: #2e7d32;
    color: white;
}


/* ATRASO */

.estado-atraso {
    background: #f9a825;
    color: white;
}


/* LICENCIA */

.estado-licencia {
    background: #1565c0;
    color: white;
}


/* FALTA */

.estado-falta {
    background: #c62828;
    color: white;
}


/* SELECCIONADO */

.radio-asistencia input:checked + label .boton-estado {
    opacity: 1;

    filter: grayscale(0);

    transform: scale(1.08);

    border-color: #222;

    box-shadow:
        0 2px 7px rgba(0,0,0,.25);
}


/* =====================================================
   OBSERVACIÓN
===================================================== */

.observacion-asistencia {
    width: 100%;

    min-width: 150px;

    padding: 7px;

    border: 1px solid #ccc;

    border-radius: 6px;

    font-size: 13px;
}


/* =====================================================
   NOTAS FINALES
===================================================== */

.nota-3t,
.nota-final {
    font-weight: bold;

    font-size: 18px;
}


/* =====================================================
   BOTONES INFERIORES
===================================================== */

.botones {
    margin-top: 25px;

    display: flex;

    gap: 12px;

    flex-wrap: wrap;
}

.botones button {
    border: none;

    border-radius: 8px;

    padding: 10px 15px;

    cursor: pointer;

    font-size: 15px;
}

.guardar {
    background: #16803c;

    color: white;
}

.exportar {
    background: #1565c0;

    color: white;
}

.salir {
    background: #c62828;

    color: white;
}


/* =====================================================
   MENSAJES
===================================================== */

.mensaje {
    position: fixed;

    left: 50%;

    bottom: 22px;

    transform: translateX(-50%);

    z-index: 100000;

    min-width: 280px;

    max-width: 90%;

    padding: 13px 20px;

    background: white;

    border: 1px solid #ddd;

    border-radius: 10px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.20);

    text-align: center;

    font-weight: bold;

    line-height: 1.4;

    margin: 0;

    display: none;
}

.mensaje:not(:empty) {
    display: block;
}


/* =====================================================
   OCULTO
===================================================== */

.oculto {
    display: none !important;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 800px) {

    .panel {
        padding: 15px;
    }

    .encabezado-actividad {
        align-items: stretch;
    }

    .izquierda-actividad {
        flex: 1;

        min-width: 0;
    }

    .derecha-actividad {
        margin-left: auto;
    }

    .nombre-actividad {
        font-size: 15px;
    }

}


/* =====================================================
   CELULARES
===================================================== */

@media (max-width: 600px) {

    .contenedor {
        width: 100%;
        max-width: 100%;
        margin: 10px auto;
        overflow-x: hidden;
    }

    .panel {
        width: 100%;
        max-width: 100%;
        padding: 10px;
        border-radius: 10px;
    }

    h1 {
        font-size: 24px;
    }

    .encabezado-actividad {
        flex-wrap: wrap;
    }

    .izquierda-actividad {
        width: 100%;
    }

    .derecha-actividad {
        width: 100%;
        justify-content: flex-end;
    }


    /* =================================================
       MODAL
    ================================================= */

    .modal-actividad {
        max-width: 100%;
    }

    .modal-cuerpo {
        padding: 16px;
    }

    .categorias-radio {
        gap: 5px;
        width: 100%;
        max-width: 100%;
    }

    .radio-categoria label {
        padding: 6px 2px;
        border-radius: 8px;
    }

    .icono-categoria {
        width: 34px;
        height: 34px;
        font-size: 22px;
        margin-bottom: 2px;
    }

    .nombre-categoria {
        font-size: 10px;
    }


    /* =================================================
       TABLA
    ================================================= */

    .tabla-contenedor {
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
    }

    table {
        width: 100%;
        min-width: 0;
        table-layout: fixed;
    }

    th,
    td {
        padding: 6px 4px;
        font-size: 13px;
    }

    td.nombre {
        white-space: normal;
        overflow-wrap: anywhere;
    }

    .nota-input {
        width: 58px;
        max-width: 100%;
        padding: 6px 2px;
        font-size: 14px;
    }


    /* =================================================
       ASISTENCIA
    ================================================= */

    .titulo-asistencia {
        flex-wrap: wrap;
    }

    .acciones-asistencia {
        width: 100%;
        justify-content: flex-end;
    }

    .fecha-asistencia {
        width: 135px;
    }

    .boton-guardar-asistencia {
        padding: 0 9px;
        font-size: 13px;
    }

    .tabla-asistencia {
        min-width: 620px;
    }

    .estados-asistencia {
        gap: 3px;
    }

    .boton-estado {
        width: 27px;
        height: 27px;
        font-size: 14px;
    }


    /* =================================================
       MENSAJE
    ================================================= */

    .mensaje {
        bottom: 12px;

        min-width: 0;

        width: 92%;

        max-width: 92%;

        padding: 12px 15px;

        font-size: 14px;
    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media (max-width: 400px) {

    .panel {
        padding: 8px;
    }

    .actividad {

async function cargarAsistencia() {

    registrosAsistencia = {};


    if (!cursoSeleccionado) {
        return;
    }


    const fecha =
    document.getElementById(
        "fechaAsistencia"
    ).value;


    if (!fecha) {
        return;

    const estudiantesCurso =
    estudiantes.filter(
        e =>

        cursoSeleccionado
    );


    const ids =
    estudiantesCurso.map(
        e => e.id
    );


    if (
        ids.length === 0
    ) {

        mostrarTablaAsistencia();

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("asistencia")
    .select(
        "id,estudiante_id,fecha,estado,observacion"
    )
    .eq(
        "fecha",
        fecha
    )
    .in(
        "estudiante_id",
        ids
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar asistencia: " +
            error.message,
            true
        );

        mostrarTablaAsistencia();

        return;

    }


    (data || []).forEach(
    registro => {

        registrosAsistencia[
            registro.estudiante_id
        ] = {

            estado:
            registro.estado,

            observacion:
            registro.observacion || ""

    mostrarTablaAsistencia();

/* =====================================================

async function guardarAsistencia() {

    if (!cursoSeleccionado) {

        alert(
            "Primero selecciona un curso."
        );

        return false;

    }


    const fecha =
    document.getElementById(
        "fechaAsistencia"
    ).value;


    if (!fecha) {

        alert(
            "Selecciona una fecha."
        );

        return false;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    if (
        estudiantesCurso.length === 0
    ) {

        alert(
            "No existen estudiantes en este curso."
        );

        return false;

    }


    mostrarMensaje(
        "Guardando asistencia..."
    );


    const registros = [];


    estudiantesCurso.forEach(
    estudiante => {

        const seleccionado =
        document.querySelector(
            `input[name="asistencia-${estudiante.id}"]:checked`
        );


        const observacion =
        document.querySelector(
            `.observacion-asistencia[data-estudiante="${estudiante.id}"]`
        );


        let estado = null;


        if (seleccionado) {

            estado =
            seleccionado.value;

        }


        registros.push({

            estudiante_id:
            estudiante.id,

            fecha:
            fecha,

            estado:
            estado || "asistio",

            observacion:
            observacion
            ? observacion.value.trim()
            : null

        });

    });


    const {
        error
    } =
    await supabaseClient
    .from("asistencia")
    .upsert(
        registros,
        {
            onConflict:
            "estudiante_id,fecha"
        }
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al guardar asistencia: " +
            error.message,
            true
        );

        return false;

    }


    mostrarMensaje(
        "✓ Asistencia guardada correctamente."
    );


    await cargarAsistencia();

    return true;

}

   CARGAR CALIFICACIONES
===================================================== */

async function cargarCalificaciones() {

    calificaciones = {};


    if (
        actividades.length === 0
    ) {
        return;
    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    const idsEstudiantes =
    estudiantesCurso.map(
        e => e.id
    );


    const idsActividades =
    actividades.map(
        a => a.id
    );


    if (
        idsEstudiantes.length === 0 ||
        idsActividades.length === 0
    ) {
        return;
    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("calificaciones")
    .select(
        "id,actividad_id,estudiante_id,nota"
    )
    .in(
        "actividad_id",
        idsActividades
    )
    .in(
        "estudiante_id",
        idsEstudiantes
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar calificaciones: " +
            error.message,
            true
        );

        return;

    }


    (data || []).forEach(
    cal => {

        if (
            !calificaciones[
                cal.estudiante_id
            ]
        ) {

            calificaciones[
                cal.estudiante_id
            ] = {};

        }


        calificaciones[
            cal.estudiante_id
        ][
            cal.actividad_id
        ] =
        cal.nota;

    });

}

/* =====================================================
   EDITAR NOMBRE
===================================================== */

async function editarNombreActividad(
    actividad
) {

    const nuevoNombre =
    prompt(
        "Escribe el nuevo nombre de la actividad:",
        actividad.nombre
    );


    if (
        nuevoNombre === null
    ) {
        return;
    }


    const nombre =
    nuevoNombre.trim();


    if (!nombre) {

        alert(
            "El nombre no puede estar vacío."
        );

        return;

    }


    if (
        nombre === actividad.nombre
    ) {
        return;
    }


    mostrarMensaje(
        "Actualizando nombre..."
    );


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .update({

        nombre:
        nombre

    })
    .eq(
        "id",
        actividad.id
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cambiar el nombre: " +
            error.message,
            true
        );

        return;

    }


    actividad.nombre =
    nombre;


    const elemento =
    document.getElementById(
        "nombre-actividad-" +
        actividad.id
    );


    if (elemento) {

        elemento.textContent =
        nombre;

    }


    mostrarMensaje(
        "✓ Nombre actualizado correctamente."
    );

}


/* =====================================================
   VALIDAR NOTA
===================================================== */

function validarNota(input) {

    if (
        input.value === ""
    ) {
        return true;
    }


    const valor =
    Number(
        input.value
    );


    const maximo =
    Number(
        input.dataset.maximo
    );


    if (
        valor < 0
    ) {

        alert(
            "La nota no puede ser menor que 0."
        );


        input.value = "";


        return false;

    }


    if (
        valor > maximo
    ) {

        alert(

            "⚠️ NOTA NO VÁLIDA\n\n" +

            "La actividad \"" +

            obtenerNombreActividad(
                input.dataset.actividad
            ) +

            "\" tiene un máximo de " +

            maximo +

            " puntos."

        );


        input.value = "";

        input.focus();


        return false;

    }


    return true;

}


/* =====================================================
   OBTENER NOMBRE ACTIVIDAD
===================================================== */

function obtenerNombreActividad(
    id
) {

    const actividad =
    actividades.find(
        a =>
        String(a.id) ===
        String(id)
    );


    return actividad
        ? actividad.nombre
        : "esta actividad";

}


/* =====================================================
   CREAR ACTIVIDAD
===================================================== */

async function crearActividad() {

    if (
        !cursoSeleccionado
    ) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const nombre =
    document.getElementById(
        "nombreActividad"
    ).value.trim();


    const radioCategoria =
    document.querySelector(
        'input[name="categoriaActividad"]:checked'
    );


    if (!nombre) {

        alert(
            "Escribe el nombre de la actividad."
        );


        document.getElementById(
            "nombreActividad"
        ).focus();


        return;

    }


    if (!radioCategoria) {

        alert(
            "Selecciona una categoría: SER, SABER, HACER o AUTOEVALUACIÓN."
        );


        return;

    }


    const categoria =
    radioCategoria.value;


    mostrarMensaje(
        "Creando actividad..."
    );


    let orden = 1;


    if (
        actividades.length > 0
    ) {

        orden =
        Math.max(

            ...actividades.map(
                a =>
                Number(
                    a.orden || 0
                )
            )

        ) + 1;

    }


    const puntajeMaximo =
    LIMITES[
        categoria
    ];


    const {
        error
    } =
    await supabaseClient
    .from("actividades")
    .insert({

        curso:
        cursoSeleccionado,

        trimestre:
        3,

        categoria:
        categoria,

        nombre:
        nombre,

        orden:
        orden,

        puntaje_maximo:
        puntajeMaximo

    });


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al crear actividad: " +
            error.message,
            true
        );

        return;

    }


    cerrarModalActividad();


    mostrarMensaje(
        "✓ Actividad creada correctamente."
    );


    await cargarActividades();

    aplicarBusqueda();

}


/* =====================================================
   ELIMINAR ACTIVIDAD
===================================================== */

async function eliminarActividad(
    actividad
) {

    const confirmar =
    confirm(

        "¿Está seguro de eliminar esta actividad?\n\n" +

        "Actividad: " +
        actividad.nombre +

        "\n\nTambién se eliminarán todas las " +

        "calificaciones de esta actividad."

    );


    if (!confirmar) {
        return;
    }


    mostrarMensaje(
        "Eliminando actividad..."
    );


    const {
        error:
        errorCalificaciones
    } =
    await supabaseClient
    .from("calificaciones")
    .delete()
    .eq(
        "actividad_id",
        actividad.id
    );


    if (errorCalificaciones) {

        mostrarMensaje(
            "Error al eliminar calificaciones: " +
            errorCalificaciones.message,
            true
        );

        return;

    }


    const {
        error:
        errorActividad
    } =
    await supabaseClient
    .from("actividades")
    .delete()
    .eq(
        "id",
        actividad.id
    );


    if (errorActividad) {

        mostrarMensaje(
            "Error al eliminar actividad: " +
            errorActividad.message,
            true
        );

        return;

    }


    actividadesDesbloqueadas.delete(
        actividad.id
    );


    mostrarMensaje(
        "✓ Actividad eliminada correctamente."
    );


    await cargarActividades();

    mostrarTablaGeneral();

    aplicarBusqueda();

}

    }

        );

    );


    for (
        const input of inputs
    ) {

        if (
            input.value === ""
        ) {
            continue;

        Number(
            input.value
        );


        const maximo =
        Number(
            input.dataset.maximo

            valor > maximo
        ) {

            alert(

                "⚠️ Hay una nota inválida.\n\n" +

                "Actividad: " +

                obtenerNombreActividad(
                    input.dataset.actividad

                maximo

            );


            return false;

        }

    }


    mostrarMensaje(
        "Guardando calificaciones..."
    );


    const registros = [];


    inputs.forEach(
    input => {

        const estudianteId =
        Number(
            input.dataset.estudiante
        );


        const actividadId =
        Number(
            input.dataset.actividad
        );


        let nota = null;


        if (
            input.value !== ""
        ) {

            nota =
            Number(
                input.value
            );

        }


        registros.push({

            actividad_id:
            actividadId,

            estudiante_id:
            estudianteId,

            nota:
            nota

        });

    });


    if (
        registros.length > 0
    ) {

        const {
            error:
            errorCalificaciones
        } =
        await supabaseClient
        .from("calificaciones")
        .upsert(
            registros,
            {
                onConflict:
                "actividad_id,estudiante_id"
            }
        );


        if (errorCalificaciones) {

            console.error(
                errorCalificaciones
            );


            mostrarMensaje(

                "Error al guardar calificaciones: " +

                errorCalificaciones.message,

                true

            );


            return false;

        }

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    for (
        const estudiante
        of estudiantesCurso
    ) {

        const actividadesSER =
        actividades.filter(
            a =>
            a.categoria ===
            "SER"
        );


        const actividadesSABER =
        actividades.filter(
            a =>
            a.categoria ===
            "SABER"
        );


        const actividadesHACER =
        actividades.filter(
            a =>
            a.categoria ===
            "HACER"
        );


        const actividadesAUTO =
        actividades.filter(
            a =>
            a.categoria ===
            "AUTOEVALUACION"
        );


        const puntosSER =
        calcularPuntosCategoria(
            estudiante.id,
            actividadesSER,
            LIMITES.SER
        );


        const puntosSABER =
        calcularPuntosCategoria(
            estudiante.id,
            actividadesSABER,
            LIMITES.SABER
        );


        const puntosHACER =
        calcularPuntosCategoria(
            estudiante.id,
            actividadesHACER,
            LIMITES.HACER
        );


        const puntosAUTO =
        calcularPuntosCategoria(
            estudiante.id,
            actividadesAUTO,
            LIMITES.AUTOEVALUACION
        );


        const nota3T =
        redondear(

            puntosSER +
            puntosSABER +
            puntosHACER +
            puntosAUTO

        );


        const nota1T =
        convertirNumero(
            estudiante.nota_1t
        );


        const nota2T =
        convertirNumero(
            estudiante.nota_2t
        );


        let notaFinal = null;


        if (
            nota1T !== null &&
            nota2T !== null &&
            nota3T !== null
        ) {

            notaFinal =
            redondear(

                (
                    nota1T +
                    nota2T +
                    nota3T
                ) / 3

            );

        }


        const {
            error
        } =
        await supabaseClient
        .from("matematica")
        .update({

            nota_3t:
            nota3T,

            final:
            notaFinal

        })
        .eq(
            "id",
            estudiante.id
        );


        if (error) {

            console.error(error);


            mostrarMensaje(

                "Error al actualizar notas de " +

                estudiante.nombre +

                ": " +

                error.message,

                true

            );


            return false;

        }

    }


    mostrarMensaje(

        "✓ Calificaciones, 3T y FINAL guardados correctamente."

    );


    await cargarEstudiantes();

    await cargarActividades();

    mostrarTablaGeneral();

    await cargarAsistencia();

    aplicarBusqueda();


    return true;

}


/* =====================================================
   CALCULAR PUNTOS
===================================================== */

function calcularPuntosCategoria(

    estudianteId,
    actividadesLista,
    limiteCategoria

) {

    if (
        !actividadesLista ||
        actividadesLista.length === 0
    ) {

        return 0;

    }


    let sumaNotas = 0;

    let sumaMaximos = 0;


    actividadesLista.forEach(
    actividad => {

        const input =
        document.querySelector(

            `.nota-input[data-estudiante="${estudianteId}"][data-actividad="${actividad.id}"]`

        );


        if (
            !input ||
            input.value === ""
        ) {

            return;

        }


        const nota =
        Number(
            input.value
        );


        const maximo =
        Number(
            input.dataset.maximo
        );


        if (
            isNaN(nota) ||
            isNaN(maximo) ||
            maximo <= 0
        ) {

            return;

        }


        sumaNotas +=
        nota;


        sumaMaximos +=
        maximo;

    });


    if (
        sumaMaximos === 0
    ) {

        return 0;

    }


    return (

        sumaNotas /
        sumaMaximos

    ) *
    limiteCategoria;

}


/* =====================================================
   REDONDEAR
===================================================== */

function redondear(
    numero
) {

    if (
        numero === null ||
        numero === undefined ||
        isNaN(numero)
    ) {

        return null;

    }


    return Math.round(
        Number(numero)
    );

}


/* =====================================================
   CONVERTIR
===================================================== */

function convertirNumero(
    valor
) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return null;

    }


    const numero =
    Number(
        valor
    );


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =====================================================
   MOSTRAR NOTA
===================================================== */

function mostrarNota(
    nota
) {

    if (
        nota === null ||
        nota === undefined ||
        nota === ""
    ) {

        return "";

    }


    return Math.round(
        Number(nota)
    );

}


/* =====================================================
   EXPORTAR EXCEL
===================================================== */

async function exportarExcel() {

    try {

        const guardado =
        await guardarNotas();


        if (
            guardado === false
        ) {

            return;

        }


        mostrarMensaje(
            "Preparando archivo Excel..."
        );


        if (
            typeof XLSX === "undefined"
        ) {

            mostrarMensaje(
                "Error: no se pudo cargar la herramienta de Excel.",
                true
            );

            return;

        }


        const {
            data:
            todasActividades,
            error:
            errorActividades
        } =
        await supabaseClient
        .from("actividades")
        .select(
            "id,curso,trimestre,categoria,nombre,orden,puntaje_maximo"
        )
        .eq(
            "trimestre",
            3
        )
        .order(
            "orden"
        );


        if (errorActividades) {
            throw errorActividades;
        }


        const idsActividades =
        (todasActividades || [])
        .map(
            a => a.id
        );


        let todasCalificaciones = [];


        if (
            idsActividades.length > 0
        ) {

            const {
                data,
                error
            } =
            await supabaseClient
            .from("calificaciones")
            .select(
                "actividad_id,estudiante_id,nota"
            )
            .in(
                "actividad_id",
                idsActividades
            );


            if (error) {
                throw error;
            }


            todasCalificaciones =
            data || [];

        }


        const mapaCalificaciones = {};


        todasCalificaciones.forEach(
        cal => {

            const clave =
            cal.estudiante_id +
            "_" +
            cal.actividad_id;


            mapaCalificaciones[
                clave
            ] =
            cal.nota;

        });


        const idsEstudiantes =
        estudiantes.map(
            e => e.id
        );


        let todasAsistencias = [];


        if (
            idsEstudiantes.length > 0
        ) {

            const {
                data:
                asistencias,
                error:
                errorAsistencia
            } =
            await supabaseClient
            .from("asistencia")
            .select(
                "estudiante_id,fecha,estado,observacion"
            )
            .in(
                "estudiante_id",
                idsEstudiantes
            )
            .order(
                "fecha",
                {
                    ascending: true
                }
            );


            if (errorAsistencia) {
                throw errorAsistencia;
            }


            todasAsistencias =
            asistencias || [];

        }


        const mapaAsistencia = {};


        todasAsistencias.forEach(
        registro => {

            const estudianteId =
            registro.estudiante_id;


            if (
                !mapaAsistencia[
                    estudianteId
                ]
            ) {

                mapaAsistencia[
                    estudianteId
                ] = {};

            }


            mapaAsistencia[
                estudianteId
            ][
                registro.fecha
            ] =
            registro.estado || "";

        });


        const mapaObservaciones = {};


        todasAsistencias.forEach(
        registro => {

            if (
                !registro.observacion ||
                !registro.observacion.trim()
            ) {

                return;

            }


            const estudianteId =
            registro.estudiante_id;


            if (
                !mapaObservaciones[
                    estudianteId
                ]
            ) {

                mapaObservaciones[
                    estudianteId
                ] = [];

            }


            mapaObservaciones[
                estudianteId
            ].push(

                formatearFechaExcel(
                    registro.fecha
                ) +

                ": " +

                registro.observacion.trim()

            );

        });


        const cursos =
        [...new Set(

            estudiantes
            .map(
                e => e.curso
            )
            .filter(Boolean)

        )].sort();


        const libro =
        XLSX.utils.book_new();


        cursos.forEach(
        curso => {

            const estudiantesCurso =
            estudiantes.filter(
                e =>
                e.curso ===
                curso
            );


            const idsEstudiantesCurso =
            estudiantesCurso.map(
                e => e.id
            );


            const asistenciasCurso =
            todasAsistencias.filter(
                registro =>
                idsEstudiantesCurso.includes(
                    registro.estudiante_id
                )
            );


            const fechasAsistenciaCurso =
            [
                ...new Set(

                    asistenciasCurso
                    .map(
                        registro =>
                        registro.fecha
                    )
                    .filter(Boolean)

                )
            ]
            .sort();


            const actividadesCurso =
            (todasActividades || [])
            .filter(
                a =>
                a.curso ===
                curso
            );


            const ser =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "SER"
            );


            const saber =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "SABER"
            );


            const hacer =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "HACER"
            );


            const auto =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "AUTOEVALUACION"
            );


            const columnas = [

                "Nº LISTA",

                "NOMBRE",

                ...fechasAsistenciaCurso.map(
                    fecha =>
                    formatearFechaExcel(
                        fecha
                    )
                ),

                "TOTAL A",

                "TOTAL R",

                "TOTAL L",

                "TOTAL F",

                "OBSERVACIONES",

                ...ser.map(
                    a => a.nombre
                ),

                "PROMEDIO SER",

                ...saber.map(
                    a => a.nombre
                ),

                "PROMEDIO SABER",

                ...hacer.map(
                    a => a.nombre
                ),

                "PROMEDIO HACER",

                "AUTOEVALUACIÓN",

                "NOTA 3T",

                "NOTA FINAL"

            ];


            const datos = [];


            datos.push(
                columnas
            );


            estudiantesCurso.forEach(
            estudiante => {

                const fila = [];


                fila.push(
                    estudiante.num_lista ??
                    ""
                );


                fila.push(
                    estudiante.nombre ??
                    ""
                );


                fechasAsistenciaCurso.forEach(
                fecha => {

                    const estado =
                    mapaAsistencia[
                        estudiante.id
                    ] &&
                    mapaAsistencia[
                        estudiante.id
                    ][
                        fecha
                    ];


                    fila.push(
                        convertirEstadoAsistencia(
                            estado
                        )
                    );

                });


                const totales =
                calcularTotalesAsistencia(

                    estudiante.id,

                    asistenciasCurso

                );


                fila.push(
                    totales.A
                );


                fila.push(
                    totales.R
                );


                fila.push(
                    totales.L
                );


                fila.push(
                    totales.F
                );


                const observaciones =
                mapaObservaciones[
                    estudiante.id
                ] || [];


                fila.push(
                    observaciones.join(
                        " | "
                    )
                );


                const notasSer =
                ser.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                ser.forEach(
                actividad => {

                    fila.push(
                        obtenerNotaExcel(
                            estudiante.id,
                            actividad.id,
                            mapaCalificaciones
                        )
                    );

                });


                fila.push(
                    calcularPromedioPonderado(
                        notasSer,
                        ser
                    )
                );


                const notasSaber =
                saber.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                saber.forEach(
                actividad => {

                    fila.push(
                        obtenerNotaExcel(
                            estudiante.id,
                            actividad.id,
                            mapaCalificaciones
                        )
                    );

                });


                fila.push(
                    calcularPromedioPonderado(
                        notasSaber,
                        saber
                    )
                );


                const notasHacer =
                hacer.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                hacer.forEach(
                actividad => {

                    fila.push(
                        obtenerNotaExcel(
                            estudiante.id,
                            actividad.id,
                            mapaCalificaciones
                        )
                    );

                });


                fila.push(
                    calcularPromedioPonderado(
                        notasHacer,
                        hacer
                    )
                );


                const notasAuto =
                auto.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                fila.push(
                    calcularPromedioPonderado(
                        notasAuto,
                        auto
                    )
                );


                fila.push(

                    estudiante.nota_3t === null ||
                    estudiante.nota_3t === undefined

                    ? ""

                    : Math.round(
                        Number(
                            estudiante.nota_3t
                        )
                    )

                );


                fila.push(

                    estudiante.final === null ||
                    estudiante.final === undefined

                    ? ""

                    : Math.round(
                        Number(
                            estudiante.final
                        )
                    )

                );


                datos.push(
                    fila
                );

            });


            const hoja =
            XLSX.utils.aoa_to_sheet(
                datos
            );


            hoja["!freeze"] = {

                xSplit: 2,

                ySplit: 1

            };


            hoja["!cols"] =
            columnas.map(
            (nombre, indice) => {

                if (
                    indice === 0
                ) {

                    return {
                        wch: 10
                    };

                }


                if (
                    indice === 1
                ) {

                    return {
                        wch: 32
                    };

                }


                if (
                    indice >= 2 &&
                    indice <
                    2 +
                    fechasAsistenciaCurso.length
                ) {

                    return {
                        wch: 13
                    };

                }


                const inicioTotales =
                2 +
                fechasAsistenciaCurso.length;


                if (
                    indice >=
                    inicioTotales &&

                    indice <
                    inicioTotales + 4
                ) {

                    return {
                        wch: 12
                    };

                }


                if (
                    indice ===
                    inicioTotales + 4
                ) {

                    return {
                        wch: 45
                    };

                }


                return {
                    wch: 20
                };

            });


            let nombreHoja =
            String(curso)
            .replace(
                /[\\\/\?\*\[\]:]/g,
                ""
            )
            .substring(
                0,
                31
            );


            if (!nombreHoja) {

                nombreHoja =
                "Curso";

            }


            XLSX.utils.book_append_sheet(

                libro,

                hoja,

                nombreHoja

            );

        });


        const fecha =
        new Date()
        .toISOString()
        .slice(
            0,
            10
        );


        XLSX.writeFile(

            libro,

            "Calificaciones_Tercer_Trimestre_" +
            fecha +
            ".xlsx"

        );


        mostrarMensaje(
            "✓ Excel exportado correctamente."
        );

    }

    catch (error) {

        console.error(error);


        mostrarMensaje(

            "Error al exportar Excel: " +
            error.message,

            true

        );

    }

}


/* =====================================================
   CONVERTIR ESTADO A LETRA
===================================================== */

function convertirEstadoAsistencia(
    estado
) {

    if (!estado) {
        return "";
    }


    const valor =
    String(
        estado
    )
    .toLowerCase()
    .trim();


    if (
        valor === "asistio"
    ) {

        return "A";

    }


    if (
        valor === "atraso"
    ) {

        return "R";

    }


    if (
        valor === "licencia"
    ) {

        return "L";

    }


    if (
        valor === "falta"
    ) {

        return "F";

    }


    return "";

}


/* =====================================================
   CALCULAR TOTALES ASISTENCIA
===================================================== */

function calcularTotalesAsistencia(

    estudianteId,

    asistencias

) {

    const totales = {

        A: 0,

        R: 0,

        L: 0,

        F: 0

    };


    asistencias
    .filter(
        registro =>
        String(
            registro.estudiante_id
        ) ===
        String(
            estudianteId
        )
    )
    .forEach(
    registro => {

        const letra =
        convertirEstadoAsistencia(
            registro.estado
        );


        if (
            letra === "A"
        ) {

            totales.A++;

        }

        else if (
            letra === "R"
        ) {

            totales.R++;

        }

        else if (
            letra === "L"
        ) {

            totales.L++;

        }

        else if (
            letra === "F"
        ) {

            totales.F++;

        }

    });


    return totales;

}


/* =====================================================
   FORMATEAR FECHA EXCEL
===================================================== */

function formatearFechaExcel(
    fecha
) {

    if (!fecha) {
        return "";
    }


    const partes =
    String(
        fecha
    ).split("-");


    if (
        partes.length === 3
    ) {

        return (

            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]

        );

    }


    return String(
        fecha
    );

}


/* =====================================================
   NOTA EXCEL
===================================================== */

function obtenerNotaExcel(

    estudianteId,
    actividadId,
    mapa

) {

    const clave =
    estudianteId +
    "_" +
    actividadId;


    if (
        mapa[clave] === undefined ||
        mapa[clave] === null
    ) {

        return "";

    }


    return Number(
        mapa[clave]
    );

}


/* =====================================================
   PROMEDIO EXCEL
===================================================== */

function calcularPromedioPonderado(

    notas,
    actividadesLista

) {

    if (
        !actividadesLista ||
        actividadesLista.length === 0
    ) {

        return "";

    }


    let suma = 0;

    let maximos = 0;


    notas.forEach(
    (nota, indice) => {

        if (
            nota === "" ||
            nota === null ||
            nota === undefined
        ) {

            return;

        }


        const actividad =
        actividadesLista[
            indice
        ];


        const maximo =
        Number(

            actividad.puntaje_maximo ||

            LIMITES[
                actividad.categoria
            ]

        );


        suma +=
        Number(nota);


        maximos +=
        maximo;

    });


    if (
        maximos === 0
    ) {

        return "";

    }


    const limite =
    LIMITES[
        actividadesLista[0]
        .categoria
    ];


    return Math.round(

        suma /
        maximos *
        limite

    );

}

   CERRAR SESIÓN

async function cerrarSesion() {

    await supabaseClient.auth.signOut();

    window.location.href =

/* =====================================================
   MENSAJES
===================================================== */

function mostrarMensaje(

    texto,
    error = false

) {

    const mensaje =
    document.getElementById(
        "mensaje"
    );


    if (!mensaje) {
        return;
    }


    if (temporizadorMensaje) {

        clearTimeout(
            temporizadorMensaje
        );

        temporizadorMensaje =
        null;

    }


    mensaje.textContent =
    texto;


    mensaje.style.color =
    error
    ? "#c62828"
    : "#16803c";


    mensaje.style.borderColor =
    error
    ? "#ef9a9a"
    : "#a5d6a7";


    mensaje.style.background =
    error
    ? "#fff5f5"
    : "#f5fff6";


    mensaje.style.display =
    "block";


    temporizadorMensaje =
    setTimeout(
    function() {

        mensaje.textContent =
        "";

        mensaje.style.display =
        "none";

        temporizadorMensaje =
        null;

    },
    4000
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapeHTML(
    texto
) {

    return String(texto)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

comprobarSesion();
