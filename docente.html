<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Panel Docente</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 96%;
    max-width: 1400px;
    margin: 25px auto;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.10);
}

h1 {
    color: #1557a6;
    margin-top: 0;
}

h3 {
    margin-top: 0;
}

.usuario {
    color: #666;
    margin-bottom: 25px;
}

.filtros {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.filtro {
    flex: 1;
    min-width: 220px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.info {
    margin-top: 15px;
    padding: 12px;
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
}

.nueva-actividad {
    margin-top: 20px;
    padding: 20px;
    background: #eef4fb;
    border: 1px solid #cbdced;
    border-radius: 12px;
}

.nueva-grid {
    display: grid;
    grid-template-columns: 1fr 260px auto;
    gap: 15px;
    align-items: end;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.crear {
    background: #1557a6;
    color: white;
}

.guardar {
    background: #16803c;
    color: white;
}

.exportar {
    background: #217346;
    color: white;
}

.salir {
    background: #c62828;
    color: white;
}

.categoria {
    margin-top: 25px;
    border: 1px solid #ddd;
    border-radius: 12px;
    overflow: hidden;
}

.titulo-categoria {
    color: white;
    padding: 13px 15px;
    font-size: 17px;
    font-weight: bold;
}

.ser {
    background: #7b1fa2;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00838f;
}


/* =====================================================
   ACTIVIDAD
===================================================== */

.actividad {
    margin: 18px;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow: hidden;
}

.encabezado-actividad {
    background: #f4f6f8;
    padding: 10px 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;
}


/* IZQUIERDA */

.izquierda-actividad {
    display: flex;
    align-items: center;
    gap: 8px;

    min-width: 0;
    flex: 1;
}

.nombre-actividad {
    font-weight: bold;
    font-size: 16px;

    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.puntaje-actividad {
    font-weight: normal;
    color: #555;
    font-size: 14px;
}


/* DERECHA */

.botones-actividad {
    display: flex;
    align-items: center;
    gap: 6px;

    flex-shrink: 0;
}


/* BOTONES */

.boton-editar {
    background: #1976d2;
    color: white;

    width: 36px;
    height: 34px;

    padding: 0;

    font-size: 17px;
}

.boton-eliminar {
    background: #c62828;
    color: white;

    width: 36px;
    height: 34px;

    padding: 0;

    font-size: 17px;
}

.boton-ocultar {
    background: #555;
    color: white;

    width: 38px;
    height: 34px;

    padding: 0;

    font-size: 22px;
    font-weight: bold;
}


/* BLOQUEAR */

.boton-bloqueo {
    background: #f9a825;
    color: white;

    width: 38px;
    height: 34px;

    padding: 0;

    font-size: 18px;
}

.boton-bloqueo.bloqueado {
    background: #16803c;
}


/* CONTENIDO */

.contenido-actividad {
    padding: 0;
}

.tabla-contenedor {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}


/* =====================================================
   TABLAS
===================================================== */

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;

    min-width: 720px;
}

th,
td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;

    background: white;
}

th {
    background: #f0f0f0;
}

td.nombre {
    text-align: left;
    white-space: nowrap;
}


/* =====================================================
   COLUMNAS FIJAS
===================================================== */

/* Nº */

table th:first-child,
table td:first-child {

    position: sticky;
    left: 0;

    z-index: 5;

    min-width: 55px;
    width: 55px;

    background: white;

}


/* Nombre */

table th:nth-child(2),
table td:nth-child(2) {

    position: sticky;
    left: 55px;

    z-index: 5;

    min-width: 190px;
    width: 190px;

    background: white;

}


/* Encabezados de columnas fijas */

table thead th:first-child,
table thead th:nth-child(2) {

    z-index: 10;
    background: #f0f0f0;

}


/* Sombra para separar columnas fijas */

table th:nth-child(2),
table td:nth-child(2) {

    box-shadow:
        3px 0 5px rgba(0,0,0,.10);

}


/* =====================================================
   INPUTS
===================================================== */

.nota-input {
    width: 75px;

    text-align: center;

    padding: 7px;

    border: 1px solid #ccc;
    border-radius: 6px;
}


/* NOTA BLOQUEADA */

.nota-input:disabled {

    background: #e9ecef;

    color: #555;

    cursor: not-allowed;

    border-color: #bbb;

}


/* =====================================================
   TABLA GENERAL
===================================================== */

.tabla-general {
    margin-top: 30px;

    border: 1px solid #ddd;

    border-radius: 12px;

    overflow: hidden;
}

.titulo-general {
    background: #1557a6;

    color: white;

    padding: 13px 15px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-size: 18px;

    font-weight: bold;
}

.boton-general {
    background: rgba(255,255,255,.20);

    color: white;

    width: 38px;
    height: 34px;

    padding: 0;

    font-size: 22px;
    font-weight: bold;
}

.nota-3t {
    font-weight: bold;
    font-size: 18px;
}

.nota-final {
    font-weight: bold;
    font-size: 18px;
}


/* =====================================================
   BOTONES GENERALES
===================================================== */

.botones {
    margin-top: 25px;

    display: flex;

    gap: 12px;

    flex-wrap: wrap;
}

.mensaje {
    margin-top: 15px;

    font-weight: bold;
}

.oculto {
    display: none !important;
}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width: 800px) {

    .contenedor {
        width: 100%;
        margin: 0;
    }

    .panel {
        padding: 12px;

        border-radius: 0;
    }

    .nueva-grid {
        grid-template-columns: 1fr;
    }

    .actividad {
        margin: 12px 0;
    }

    .encabezado-actividad {
        padding: 9px;
    }

    .nombre-actividad {
        font-size: 14px;
    }

    .puntaje-actividad {
        font-size: 12px;
    }

    .boton-editar,
    .boton-eliminar,
    .boton-ocultar,
    .boton-bloqueo {
        width: 34px;
        height: 32px;
    }

    table {
        min-width: 700px;
    }

    table th:first-child,
    table td:first-child {

        min-width: 50px;
        width: 50px;

    }

    table th:nth-child(2),
    table td:nth-child(2) {

        left: 50px;

        min-width: 170px;
        width: 170px;

    }

}

</style>

</head>

<body>

<div class="contenedor">

<div class="panel">

<h1>
Panel Docente
</h1>

<div class="usuario">

Usuario:
<span id="usuario"></span>

</div>


<!-- =====================================================
     FILTROS
===================================================== -->

<div class="filtros">

<div class="filtro">

<label>
Buscar por nombre o Nº de lista
</label>

<input
    type="text"
    id="buscarNombre"
    placeholder="Nombre o número de lista..."
>

</div>


<div class="filtro">

<label>
Curso
</label>

<select id="buscarCurso">

<option value="">
Selecciona un curso
</option>

</select>

</div>

</div>


<div
    id="mensajeCurso"
    class="info">

Selecciona un curso para comenzar.

</div>


<!-- =====================================================
     CREAR ACTIVIDAD
===================================================== -->

<div
    id="panelNuevaActividad"
    class="nueva-actividad oculto">

<h3>
➕ Crear nueva actividad
</h3>

<div class="nueva-grid">

<div>

<label>
Nombre de la actividad
</label>

<input
    type="text"
    id="nombreActividad"
    placeholder="Ej.: Evaluación de números"
>

</div>


<div>

<label>
Categoría
</label>

<select id="categoriaActividad">

<option value="SER">
SER — 10 puntos
</option>

<option value="SABER">
SABER — 45 puntos
</option>

<option value="HACER">
HACER — 40 puntos
</option>

<option value="AUTOEVALUACION">
AUTOEVALUACIÓN — 5 puntos
</option>

</select>

</div>


<div>

<button
    class="crear"
    onclick="crearActividad()">

➕ Crear actividad

</button>

</div>

</div>

</div>


<!-- =====================================================
     ACTIVIDADES
===================================================== -->

<div
    id="contenedorActividades">
</div>


<!-- =====================================================
     TABLA GENERAL
===================================================== -->

<div
    id="tablaGeneral"
    class="tabla-general oculto">

<div class="titulo-general">

<span>
📊 Calificaciones del curso
</span>

<button
    id="botonGeneral"
    class="boton-general"
    onclick="ocultarTablaGeneral()"
    title="Ocultar calificaciones">

−

</button>

</div>


<div id="contenidoGeneral">

<div class="tabla-contenedor">

<table>

<thead>

<tr>

<th>Nº</th>

<th>Nombre</th>

<th>Curso</th>

<th>1T</th>

<th>2T</th>

<th>3T</th>

<th>Final</th>

</tr>

</thead>

<tbody
    id="tablaEstudiantes">
</tbody>

</table>

</div>

</div>

</div>


<!-- =====================================================
     BOTONES
===================================================== -->

<div class="botones">

<button
    class="guardar"
    onclick="guardarNotas()">

💾 Guardar notas

</button>


<button
    class="exportar"
    onclick="exportarExcel()">

📊 Exportar Excel

</button>


<button
    class="salir"
    onclick="cerrarSesion()">

🚪 Cerrar sesión

</button>

</div>


<div
    id="mensaje"
    class="mensaje">
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>


<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
"https://tecphbbkkmlgahjddcep.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// =====================================================
// VARIABLES
// =====================================================

let estudiantes = [];

let actividades = [];

let calificaciones = {};

let cursoSeleccionado = "";


/*
    Guarda qué actividades están bloqueadas.

    Ejemplo:

    actividadBloqueada[15] = true;
*/

let actividadBloqueada = {};


// =====================================================
// LIMITES
// =====================================================

const LIMITES = {

    SER: 10,

    SABER: 45,

    HACER: 40,

    AUTOEVALUACION: 5

};


// =====================================================
// SESIÓN
// =====================================================

async function comprobarSesion() {

    const {
        data: {
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href =
        "login-docente.html";

        return;

    }


    document.getElementById(
        "usuario"
    ).textContent =
    user.email;


    await cargarEstudiantes();

}


// =====================================================
// CARGAR ESTUDIANTES
// =====================================================

async function cargarEstudiantes() {

    const {
        data,
        error
    } =
    await supabaseClient

    .from("matematica")

    .select(
        "id,num_lista,ci,nombre,curso,nota_1t,nota_2t,nota_3t,final"
    )

    .order("curso")

    .order("num_lista");


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar estudiantes: " +
            error.message,
            true
        );

        return;

    }


    estudiantes =
    data || [];


    cargarCursos();

}


// =====================================================
// CURSOS
// =====================================================

function cargarCursos() {

    const select =
    document.getElementById(
        "buscarCurso"
    );


    const valorAnterior =
    select.value;


    select.innerHTML = `

        <option value="">
        Selecciona un curso
        </option>

    `;


    const cursos =
    [...new Set(

        estudiantes
        .map(e => e.curso)
        .filter(Boolean)

    )].sort();


    cursos.forEach(
    curso => {

        const opcion =
        document.createElement(
            "option"
        );

        opcion.value =
        curso;

        opcion.textContent =
        curso;

        select.appendChild(
            opcion
        );

    });


    if (
        valorAnterior &&
        cursos.includes(
            valorAnterior
        )
    ) {

        select.value =
        valorAnterior;

    }

}


// =====================================================
// CAMBIO DE CURSO
// =====================================================

document.getElementById(
    "buscarCurso"
).addEventListener(
    "change",
    async function() {

        cursoSeleccionado =
        this.value;


        document.getElementById(
            "contenedorActividades"
        ).innerHTML = "";


        document.getElementById(
            "tablaEstudiantes"
        ).innerHTML = "";


        document.getElementById(
            "tablaGeneral"
        ).classList.add(
            "oculto"
        );


        document.getElementById(
            "panelNuevaActividad"
        ).classList.add(
            "oculto"
        );


        if (!cursoSeleccionado) {

            document.getElementById(
                "mensajeCurso"
            ).textContent =
            "Selecciona un curso para comenzar.";

            return;

        }


        document.getElementById(
            "panelNuevaActividad"
        ).classList.remove(
            "oculto"
        );


        document.getElementById(
            "mensajeCurso"
        ).textContent =
        "Curso seleccionado: " +
        cursoSeleccionado;


        await cargarActividades();


        mostrarTablaGeneral();

    });


// =====================================================
// CARGAR ACTIVIDADES
// =====================================================

async function cargarActividades() {

    const {
        data,
        error
    } =
    await supabaseClient

    .from("actividades")

    .select(
        "id,curso,trimestre,categoria,nombre,orden,puntaje_maximo"
    )

    .eq(
        "curso",
        cursoSeleccionado
    )

    .eq(
        "trimestre",
        3
    )

    .order(
        "orden"
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar actividades: " +
            error.message,
            true
        );

        return;

    }


    actividades =
    data || [];


    /*
        Al cambiar de curso se inicia
        cada actividad desbloqueada.
    */

    actividadBloqueada = {};


    await cargarCalificaciones();


    mostrarActividades();

}


// =====================================================
// CARGAR CALIFICACIONES
// =====================================================

async function cargarCalificaciones() {

    calificaciones = {};


    if (
        actividades.length === 0
    ) {

        return;

    }


    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    const idsEstudiantes =
    estudiantesCurso.map(
        e => e.id
    );


    const idsActividades =
    actividades.map(
        a => a.id
    );


    if (
        idsEstudiantes.length === 0 ||
        idsActividades.length === 0
    ) {

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient

    .from("calificaciones")

    .select(
        "id,actividad_id,estudiante_id,nota"
    )

    .in(
        "actividad_id",
        idsActividades
    )

    .in(
        "estudiante_id",
        idsEstudiantes
    );


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al cargar calificaciones: " +
            error.message,
            true
        );

        return;

    }


    (data || []).forEach(
    cal => {

        if (
            !calificaciones[
                cal.estudiante_id
            ]
        ) {

            calificaciones[
                cal.estudiante_id
            ] = {};

        }


        calificaciones[
            cal.estudiante_id
        ][
            cal.actividad_id
        ] =
        cal.nota;

    });

}


// =====================================================
// MOSTRAR ACTIVIDADES
// =====================================================

function mostrarActividades() {

    const contenedor =
    document.getElementById(
        "contenedorActividades"
    );


    contenedor.innerHTML = "";


    const categorias = [

        {
            codigo: "SER",
            nombre: "SER — 10 puntos",
            clase: "ser"
        },

        {
            codigo: "SABER",
            nombre: "SABER — 45 puntos",
            clase: "saber"
        },

        {
            codigo: "HACER",
            nombre: "HACER — 40 puntos",
            clase: "hacer"
        },

        {
            codigo: "AUTOEVALUACION",
            nombre: "AUTOEVALUACIÓN — 5 puntos",
            clase: "auto"
        }

    ];


    categorias.forEach(
    categoria => {

        const lista =
        actividades.filter(
            a =>
            a.categoria ===
            categoria.codigo
        );


        if (
            lista.length === 0
        ) {

            return;

        }


        const seccion =
        document.createElement(
            "div"
        );


        seccion.className =
        "categoria";


        const encabezado =
        document.createElement(
            "div"
        );


        encabezado.className =
        "titulo-categoria " +
        categoria.clase;


        encabezado.textContent =
        categoria.nombre;


        seccion.appendChild(
            encabezado
        );


        lista.forEach(
        actividad => {

            seccion.appendChild(
                crearActividadHTML(
                    actividad
                )
            );

        });


        contenedor.appendChild(
            seccion
        );

    });


    if (
        actividades.length === 0
    ) {

        contenedor.innerHTML = `

        <div class="info">

        Este curso todavía no tiene actividades
        para el tercer trimestre.

        </div>

        `;

    }

}


// =====================================================
// HTML DE ACTIVIDAD
// =====================================================

function crearActividadHTML(
    actividad
) {

    const bloque =
    document.createElement(
        "div"
    );


    bloque.className =
    "actividad";


    // =================================================
    // ENCABEZADO
    // =================================================

    const encabezado =
    document.createElement(
        "div"
    );


    encabezado.className =
    "encabezado-actividad";


    // =================================================
    // PARTE IZQUIERDA
    // =================================================

    const izquierda =
    document.createElement(
        "div"
    );


    izquierda.className =
    "izquierda-actividad";


    // BOTÓN EDITAR

    const botonEditar =
    document.createElement(
        "button"
    );


    botonEditar.className =
    "boton-editar";


    botonEditar.textContent =
    "✏️";


    botonEditar.title =
    "Editar nombre de actividad";


    botonEditar.onclick =
    function() {

        editarNombreActividad(
            actividad
        );

    };


    izquierda.appendChild(
        botonEditar
    );


    // BOTÓN ELIMINAR

    const botonEliminar =
    document.createElement(
        "button"
    );


    botonEliminar.className =
    "boton-eliminar";


    botonEliminar.textContent =
    "🗑️";


    botonEliminar.title =
    "Eliminar actividad";


    botonEliminar.onclick =
    function() {

        eliminarActividad(
            actividad
        );

    };


    izquierda.appendChild(
        botonEliminar
    );


    // NOMBRE

    const nombre =
    document.createElement(
        "div"
    );


    nombre.className =
    "nombre-actividad";


    let puntajeMaximo =
    Number(
        actividad.puntaje_maximo
    );


    if (
        !puntajeMaximo ||
        puntajeMaximo <= 0
    ) {

        puntajeMaximo =
        LIMITES[
            actividad.categoria
        ];

    }


    nombre.innerHTML = `

        ${escapeHTML(
            actividad.nombre
        )}

        <span class="puntaje-actividad">

        — máximo ${puntajeMaximo} puntos

        </span>

    `;


    izquierda.appendChild(
        nombre
    );


    // =================================================
    // PARTE DERECHA
    // =================================================

    const botones =
    document.createElement(
        "div"
    );


    botones.className =
    "botones-actividad";


    // BOTÓN +

    const botonOcultar =
    document.createElement(
        "button"
    );


    botonOcultar.className =
    "boton-ocultar";


    botonOcultar.textContent =

// =====================================================
// VALIDAR NOTA
// =====================================================

function validarNota(input) {

    if (
        input.value === ""
    ) {

        return true;

    }


    const valor =
    Number(
        input.value
    );


    const maximo =
    Number(
        input.dataset.maximo
    );


    if (
        valor < 0
    ) {

        alert(
            "La nota no puede ser menor que 0."
        );


        input.value = "";


        return false;

    }


    if (
        valor > maximo
    ) {

        alert(

            "⚠️ NOTA NO VÁLIDA\n\n" +

            "La actividad \"" +

            obtenerNombreActividad(
                input.dataset.actividad
            ) +

            "\" tiene un máximo de " +

            maximo +

            " puntos."

        );


        input.value = "";


        input.focus();


        return false;

    }


    return true;

}

) {

    const actividad =

}

// =====================================================

async function crearActividad() {

    if (
        !cursoSeleccionado
    ) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    const nombre =
    document.getElementById(
        "nombreActividad"
    ).value.trim();


    const categoria =
    document.getElementById(
        "categoriaActividad"
    ).value;


    if (!nombre) {

        alert(
            "Escribe el nombre de la actividad."
        );

        return;

    }


    mostrarMensaje(
        "Creando actividad..."
    );


    let orden = 1;


    if (
        actividades.length > 0
    ) {

        orden =
        Math.max(

            ...actividades.map(
                a =>
                Number(
                    a.orden || 0
                )
            )

        ) + 1;

    }


    const puntajeMaximo =
    LIMITES[
        categoria
    ];


    const {
        error
    } =
    await supabaseClient

    .from("actividades")

    .insert({

        curso:
        cursoSeleccionado,

        trimestre:
        3,

        categoria:
        categoria,

        nombre:
        nombre,

        orden:
        orden,

        puntaje_maximo:
        puntajeMaximo

    });


    if (error) {

        console.error(error);

        mostrarMensaje(
            "Error al crear actividad: " +
            error.message,
            true
        );

        return;

    }


    document.getElementById(
        "nombreActividad"
    ).value = "";


    mostrarMensaje(
        "✓ Actividad creada correctamente."
    );


    await cargarActividades();

}

// =====================================================
// GUARDAR NOTAS
// =====================================================

async function guardarNotas() {

    if (!cursoSeleccionado) {

        alert(
            "Primero selecciona un curso."
        );

        return;

    }


    if (
        actividades.length === 0
    ) {

        alert(
            "Este curso no tiene actividades."
        );

        return;

    }


    const inputs =
    document.querySelectorAll(
        ".nota-input"
    );


    // =================================================
    // VALIDAR
    // =================================================

    for (
        const input of inputs
    ) {

        if (
            input.value === ""
        ) {

            continue;

        }


        const valor =
        Number(
            input.value
        );


        const maximo =
        Number(
            input.dataset.maximo
        );


        if (
            valor < 0 ||
            valor > maximo
        ) {

            alert(

                "⚠️ Hay una nota inválida.\n\n" +

                "Actividad: " +

                obtenerNombreActividad(
                    input.dataset.actividad
                ) +

                "\nMáximo permitido: " +

                maximo

            );


            input.focus();


            return;

        }

    }


    mostrarMensaje(
        "Guardando calificaciones..."
    );


    // =================================================
    // GUARDAR CALIFICACIONES
    // =================================================

    const registros = [];


    inputs.forEach(
    input => {

        const estudianteId =
        Number(
            input.dataset.estudiante
        );


        const actividadId =
        Number(
            input.dataset.actividad
        );


        let nota = null;


        if (
            input.value !== ""
        ) {

            nota =
            Number(
                input.value
            );

        }


        registros.push({

            actividad_id:
            actividadId,

            estudiante_id:
            estudianteId,

            nota:
            nota

        });

    });


    const {
        error:
        errorCalificaciones
    } =
    await supabaseClient

    .from("calificaciones")

    .upsert(

        registros,

        {
            onConflict:
            "actividad_id,estudiante_id"
        }

    );


    if (errorCalificaciones) {

        console.error(
            errorCalificaciones
        );


        mostrarMensaje(

            "Error al guardar calificaciones: " +
            errorCalificaciones.message,

            true

        );


        return;

    }


    // =================================================
    // CALCULAR 3T Y FINAL
    // =================================================

    const estudiantesCurso =
    estudiantes.filter(
        e =>
        e.curso ===
        cursoSeleccionado
    );


    for (
        const estudiante
        of estudiantesCurso
    ) {

        const actividadesSER =
        actividades.filter(
            a =>
            a.categoria ===
            "SER"
        );


        const actividadesSABER =
        actividades.filter(
            a =>
            a.categoria ===
            "SABER"
        );


        const actividadesHACER =
        actividades.filter(
            a =>
            a.categoria ===
            "HACER"
        );


        const actividadesAUTO =
        actividades.filter(
            a =>
            a.categoria ===
            "AUTOEVALUACION"
        );


        // =================================================
        // PUNTOS
        // =================================================

        const puntosSER =
        calcularPuntosCategoria(

            estudiante.id,

            actividadesSER,

            LIMITES.SER

        );


        const puntosSABER =
        calcularPuntosCategoria(

            estudiante.id,

            actividadesSABER,

            LIMITES.SABER

        );


        const puntosHACER =
        calcularPuntosCategoria(

            estudiante.id,

            actividadesHACER,

            LIMITES.HACER

        );


        const puntosAUTO =
        calcularPuntosCategoria(

            estudiante.id,

            actividadesAUTO,

            LIMITES.AUTOEVALUACION

        );


        // =================================================
        // 3T REDONDEADO
        // =================================================

        const nota3T =
        redondear(

            puntosSER +
            puntosSABER +
            puntosHACER +
            puntosAUTO

        );


        // =================================================
        // FINAL REDONDEADO
        // =================================================

        const nota1T =
        convertirNumero(
            estudiante.nota_1t
        );


        const nota2T =
        convertirNumero(
            estudiante.nota_2t
        );


        let notaFinal = null;


        if (
            nota1T !== null &&
            nota2T !== null &&
            nota3T !== null
        ) {

            notaFinal =
            redondear(

                (
                    nota1T +
                    nota2T +
                    nota3T
                ) / 3

            );

        }


        // =================================================
        // GUARDAR
        // =================================================

        const {
            error
        } =
        await supabaseClient

        .from("matematica")

        .update({

            nota_3t:
            nota3T,

            final:
            notaFinal

        })

        .eq(
            "id",
            estudiante.id
        );


        if (error) {

            console.error(error);


            mostrarMensaje(

                "Error al actualizar notas de " +
                estudiante.nombre +
                ": " +
                error.message,

                true

            );


            return;

        }

    }


    mostrarMensaje(
        "✓ Calificaciones, 3T y FINAL guardados correctamente."
    );


    await cargarEstudiantes();


    await cargarActividades();


    mostrarTablaGeneral();

}


// =====================================================
// CALCULAR PUNTOS CATEGORÍA
// =====================================================

function calcularPuntosCategoria(
    estudianteId,
    actividadesLista,
    limiteCategoria
) {

    if (
        !actividadesLista ||
        actividadesLista.length === 0
    ) {

        return 0;

    }


    let sumaNotas = 0;

    let sumaMaximos = 0;


    actividadesLista.forEach(
    actividad => {

        const input =
        document.querySelector(

            `.nota-input[data-estudiante="${estudianteId}"][data-actividad="${actividad.id}"]`

        );


        if (
            !input ||
            input.value === ""
        ) {

            return;

        }


        const nota =
        Number(
            input.value
        );


        const maximo =
        Number(
            input.dataset.maximo
        );


        if (
            isNaN(nota) ||
            isNaN(maximo) ||
            maximo <= 0
        ) {

            return;

        }


        sumaNotas +=
        nota;


        sumaMaximos +=
        maximo;

    });


    if (
        sumaMaximos === 0
    ) {

        return 0;

    }


    const puntos =
    (
        sumaNotas /
        sumaMaximos
    ) *
    limiteCategoria;


    return puntos;

}


// =====================================================
// REDONDEAR A 0 DECIMALES
// =====================================================

function redondear(
    numero
) {

    if (
        numero === null ||
        numero === undefined ||
        isNaN(numero)
    ) {

        return null;

    }


    return Math.round(
        numero
    );

}


// =====================================================
// CONVERTIR NÚMERO
// =====================================================

function convertirNumero(
    valor
) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return null;

    }


    const numero =
    Number(
        valor
    );


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


// =====================================================
// MOSTRAR NOTA
// =====================================================

function mostrarNota(
    nota
) {

    if (
        nota === null ||
        nota === undefined ||
        nota === ""
    ) {

        return "";

    }


    return redondear(
        Number(nota)
    );

}

async function exportarExcel() {

    try {

        // Guardar primero

        await guardarNotas();


        mostrarMensaje(
            "Preparando archivo Excel..."
        );


        if (
            typeof XLSX === "undefined"
        ) {

            alert(
                "No se pudo cargar la herramienta de Excel."
            );

            return;

        }


        // =================================================
        // CARGAR ACTIVIDADES
        // =================================================

        const {
            data:
            todasActividades,
            error:
            errorActividades
        } =
        await supabaseClient

        .from("actividades")

        .select(
            "id,curso,trimestre,categoria,nombre,orden,puntaje_maximo"
        )

        .eq(
            "trimestre",
            3
        )

        .order(
            "orden"
        );


        if (errorActividades) {

            throw errorActividades;

        }


        // =================================================
        // CALIFICACIONES
        // =================================================

        const idsActividades =
        (todasActividades || [])
        .map(
            a => a.id
        );


        let todasCalificaciones = [];


        if (
            idsActividades.length > 0
        ) {

            const {
                data,
                error
            } =
            await supabaseClient

            .from("calificaciones")

            .select(
                "actividad_id,estudiante_id,nota"
            )

            .in(
                "actividad_id",
                idsActividades
            );


            if (error) {

                throw error;

            }


            todasCalificaciones =
            data || [];

        }


        // =================================================
        // MAPA
        // =================================================

        const mapaCalificaciones = {};


        todasCalificaciones.forEach(
        cal => {

            const clave =
            cal.estudiante_id +
            "_" +
            cal.actividad_id;


            mapaCalificaciones[
                clave
            ] =
            cal.nota;

        });


        // =================================================
        // CURSOS
        // =================================================

        const cursos =
        [...new Set(

            estudiantes
            .map(
                e => e.curso
            )
            .filter(Boolean)

        )].sort();


        if (
            cursos.length === 0
        ) {

            alert(
                "No existen estudiantes para exportar."
            );

            return;

        }


        const libro =
        XLSX.utils.book_new();


        // =================================================
        // UNA HOJA POR CURSO
        // =================================================

        cursos.forEach(
        curso => {

            const estudiantesCurso =
            estudiantes.filter(
                e =>
                e.curso ===
                curso
            );


            const actividadesCurso =
            (todasActividades || [])
            .filter(
                a =>
                a.curso ===
                curso
            );


            // =================================================
            // CATEGORÍAS
            // =================================================

            const ser =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "SER"
            );


            const saber =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "SABER"
            );


            const hacer =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "HACER"
            );


            const auto =
            actividadesCurso.filter(
                a =>
                a.categoria ===
                "AUTOEVALUACION"
            );


            // =================================================
            // COLUMNAS
            //
            // Nº
            // Nombre
            // SER 1
            // SER 2
            // PROMEDIO SER
            // SABER 1
            // SABER 2
            // PROMEDIO SABER
            // HACER 1
            // HACER 2
            // PROMEDIO HACER
            // AUTOEVALUACIÓN
            // NOTA FINAL
            // =================================================

            const columnas = [

                "Nº LISTA",

                "NOMBRE"

            ];


            ser.forEach(
                actividad =>
                columnas.push(
                    actividad.nombre
                )
            );


            columnas.push(
                "PROMEDIO SER"
            );


            saber.forEach(
                actividad =>
                columnas.push(
                    actividad.nombre
                )
            );


            columnas.push(
                "PROMEDIO SABER"
            );


            hacer.forEach(
                actividad =>
                columnas.push(
                    actividad.nombre
                )
            );


            columnas.push(
                "PROMEDIO HACER"
            );


            auto.forEach(
                actividad =>
                columnas.push(
                    actividad.nombre
                )
            );


            columnas.push(
                "NOTA FINAL"
            );


            // =================================================
            // DATOS
            // =================================================

            const datos = [
                columnas
            ];


            estudiantesCurso.forEach(
            estudiante => {

                const fila = [];


                // Nº

                fila.push(
                    estudiante.num_lista ?? ""
                );


                // NOMBRE

                fila.push(
                    estudiante.nombre ?? ""
                );


                // =================================================
                // SER
                // =================================================

                const notasSer =
                ser.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                notasSer.forEach(
                    nota =>
                    fila.push(nota)
                );


                fila.push(
                    calcularPromedioPonderado(
                        notasSer,
                        ser
                    )
                );


                // =================================================
                // SABER
                // =================================================

                const notasSaber =
                saber.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                notasSaber.forEach(
                    nota =>
                    fila.push(nota)
                );


                fila.push(
                    calcularPromedioPonderado(
                        notasSaber,
                        saber
                    )
                );


                // =================================================
                // HACER
                // =================================================

                const notasHacer =
                hacer.map(
                    actividad =>
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    )
                );


                notasHacer.forEach(
                    nota =>
                    fila.push(nota)
                );


                fila.push(
                    calcularPromedioPonderado(
                        notasHacer,
                        hacer
                    )
                );


                // =================================================
                // AUTOEVALUACIÓN
                // =================================================

                auto.forEach(
                actividad => {

                    const nota =
                    obtenerNotaExcel(
                        estudiante.id,
                        actividad.id,
                        mapaCalificaciones
                    );


                    fila.push(
                        nota
                    );

                });


                // =================================================
                // NOTA FINAL
                // =================================================

                fila.push(
                    estudiante.final === null ||
                    estudiante.final === undefined
                    ? ""
                    : redondear(
                        Number(
                            estudiante.final
                        )
                    )
                );


                datos.push(
                    fila
                );

            });


            // =================================================
            // CREAR HOJA
            // =================================================

            const hoja =
            XLSX.utils.aoa_to_sheet(
                datos
            );


            // =================================================
            // ANCHOS
            // =================================================

            hoja["!cols"] =
            columnas.map(
            (nombre, indice) => {

                if (
                    indice === 0
                ) {

                    return {
                        wch: 10
                    };

                }


                if (
                    indice === 1
                ) {

                    return {
                        wch: 32
                    };

                }


                return {
                    wch: 22
                };

            });


            // =================================================
            // ESTILO
            // =================================================

            const rango =
            XLSX.utils.decode_range(
                hoja["!ref"]
            );


            for (
                let fila =
                rango.s.r;
                fila <= rango.e.r;
                fila++
            ) {

                for (
                    let columna =
                    rango.s.c;
                    columna <= rango.e.c;
                    columna++
                ) {

                    const celda =
                    hoja[
                        XLSX.utils.encode_cell({
                            r: fila,
                            c: columna
                        })
                    ];


                    if (!celda) {

                        continue;

                    }


                    celda.s = {

                        alignment: {

                            horizontal:
                            columna === 1
                            ? "left"
                            : "center",

                            vertical:
                            "center",

                            wrapText:
                            true

                        },

                        font: {

                            name:
                            "Arial",

                            sz:
                            10

                        },

                        border: {

                            top: {
                                style:
                                "thin"
                            },

                            bottom: {
                                style:
                                "thin"
                            },

                            left: {
                                style:
                                "thin"
                            },

                            right: {
                                style:
                                "thin"
                            }

                        }

                    };


                    // Encabezado

                    if (
                        fila === 0
                    ) {

                        celda.s.font = {

                            name:
                            "Arial",

                            sz:
                            10,

                            bold:
                            true

                        };

                    }

                }

            }


            // =================================================
            // CONGELAR FILA Y COLUMNAS
            // =================================================

            hoja["!freeze"] = {

                xSplit: 2,

                ySplit: 1

            };


            // =================================================
            // NOMBRE DE HOJA
            // =================================================

            let nombreHoja =
            String(curso)
            .replace(
                /[\\\/\?\*\[\]:]/g,
                ""
            )
            .substring(
                0,
                31
            );


            if (!nombreHoja) {

                nombreHoja =
                "Curso";

            }


            XLSX.utils.book_append_sheet(
                libro,
                hoja,
                nombreHoja
            );

        });


        // =================================================
        // DESCARGAR
        // =================================================

        const fecha =
        new Date()
        .toISOString()
        .slice(
            0,
            10
        );


        XLSX.writeFile(

            libro,

            "Calificaciones_Tercer_Trimestre_" +
            fecha +
            ".xlsx"

        );


        mostrarMensaje(
            "✓ Excel exportado correctamente."
        );


    } catch (error) {

        console.error(error);


        mostrarMensaje(

            "Error al exportar Excel: " +
            error.message,

            true

        );

    }

}


// =====================================================
// OBTENER NOTA EXCEL
// =====================================================

function obtenerNotaExcel(
    estudianteId,
    actividadId,
    mapa
) {

    const clave =
    estudianteId +
    "_" +
    actividadId;


    if (
        mapa[clave] === undefined ||
        mapa[clave] === null
    ) {

        return "";

    }


    return Number(
        mapa[clave]
    );

}


// =====================================================
// PROMEDIO EXCEL
// =====================================================

function calcularPromedioPonderado(
    notas,
    actividadesLista
) {

    if (
        !actividadesLista ||
        actividadesLista.length === 0
    ) {

        return "";

    }


    let suma = 0;

    let maximos = 0;


    notas.forEach(
    (nota, indice) => {

        if (
            nota === "" ||
            nota === null ||
            nota === undefined
        ) {

            return;

        }


        const actividad =
        actividadesLista[
            indice
        ];


        const maximo =
        Number(
            actividad.puntaje_maximo ||
            LIMITES[
                actividad.categoria
            ]
        );


        suma +=
        Number(nota);


        maximos +=
        maximo;

    });


    if (
        maximos === 0
    ) {

        return "";

    }


    const limite =
    LIMITES[
        actividadesLista[0]
        .categoria
    ];


    // REDONDEADO A 0 DECIMALES

    return Math.round(

        (
            suma /
            maximos *
            limite

        )

    );

}

// CERRAR SESIÓN

    await supabaseClient.auth.signOut();


    window.location.href =

// =====================================================
// MENSAJES
// =====================================================

function mostrarMensaje(
    texto,
    error = false
) {

    const mensaje =
    document.getElementById(
        "mensaje"
    );


    mensaje.textContent =
    texto;


    mensaje.style.color =
    error
    ? "#c62828"
    : "#16803c";

}


// =====================================================
// ESCAPAR HTML
// =====================================================

function escapeHTML(
    texto
) {

    return String(texto)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


// =====================================================
// INICIAR
// =====================================================

comprobarSesion();
