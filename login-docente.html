<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acceso Docente</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f2f5f9;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .login {

            width: 90%;

            max-width: 400px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.12);

        }


        h1 {

            text-align: center;

            color: #1557a6;

            margin-top: 0;

        }


        .subtitulo {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 6px;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1557a6;

            color: white;

            font-size: 17px;

            cursor: pointer;

        }


        button:hover {

            background: #0d4282;

        }


        #mensaje {

            margin-top: 15px;

            text-align: center;

            font-weight: bold;

        }


        .error {

            color: #c62828;

        }


        .cargando {

            color: #1557a6;

        }

    </style>

</head>


<body>


<div class="login">


    <h1>Panel Docente</h1>


    <div class="subtitulo">

        Inicia sesión para continuar

    </div>


    <label for="email">

        Correo electrónico

    </label>


    <input

        type="email"

        id="email"

        placeholder="docente@colegio.com"

    >


    <label for="password">

        Contraseña

    </label>


    <input

        type="password"

        id="password"

        placeholder="Ingresa tu contraseña"

    >


    <button onclick="iniciarSesion()">

        Ingresar

    </button>


    <div id="mensaje"></div>

    <button id="btnClaveLocal" type="button" onclick="accederConClaveLocal()" style="display:none;">
        🔐 Usar clave de acceso del celular
    </button>

    <button id="btnRegistrarClaveLocal" type="button" onclick="registrarClaveLocal()" style="display:none; background:#2e7d32;">
        📱 Registrar este celular
    </button>


 </div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    const SUPABASE_URL =

        "https://tecphbbkkmlgahjddcep.supabase.co";


    const SUPABASE_KEY =

        "sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


    const supabaseClient =

        window.supabase.createClient(

            SUPABASE_URL,

            SUPABASE_KEY

        );




    // ================================
    // CLAVE DE ACCESO LOCAL DEL CELULAR
    // ================================
    // Usa WebAuthn/passkeys: huella, rostro, PIN o bloqueo del dispositivo.
    // La credencial queda guardada por el sistema del celular y NO en Supabase.
    const CLAVE_LOCAL_ID = "docente_passkey_local_v1";
    const CLAVE_LOCAL_STORAGE = "docente_passkey_credential_id";

    function base64UrlEncode(buffer) {
        const bytes = new Uint8Array(buffer);
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary)
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/g, "");
    }

    function base64UrlDecode(value) {
        value = value.replace(/-/g, "+").replace(/_/g, "/");
        while (value.length % 4) value += "=";
        const binary = atob(value);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    function bufferToArrayBuffer(buffer) {
        return buffer instanceof ArrayBuffer
            ? buffer
            : buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength);
    }

    function soporteClaveLocal() {
        return window.isSecureContext &&
               !!window.PublicKeyCredential &&
               !!navigator.credentials;
    }

    function mostrarOpcionesClaveLocal() {
        const btn = document.getElementById("btnClaveLocal");
        const registrar = document.getElementById("btnRegistrarClaveLocal");

        if (!soporteClaveLocal()) return;

        const credencial = localStorage.getItem(CLAVE_LOCAL_STORAGE);

        if (credencial) {
            btn.style.display = "block";
            registrar.style.display = "none";
        } else {
            btn.style.display = "none";
            registrar.style.display = "block";
        }
    }

    async function registrarClaveLocal() {
        const email = document.getElementById("email").value.trim();
        const mensaje = document.getElementById("mensaje");

        if (!soporteClaveLocal()) {
            mensaje.textContent = "Este navegador no permite clave de acceso local.";
            mensaje.className = "error";
            return;
        }

        if (!email) {
            mensaje.textContent = "Primero ingresa el correo electrónico.";
            mensaje.className = "error";
            return;
        }

        try {
            mensaje.textContent = "Confirma con la huella, rostro o bloqueo de tu celular...";
            mensaje.className = "cargando";

            const challenge = crypto.getRandomValues(new Uint8Array(32));

            const credencial = await navigator.credentials.create({
                publicKey: {
                    challenge,
                    rp: {
                        name: "Panel Docente"
                    },
                    user: {
                        id: crypto.getRandomValues(new Uint8Array(16)),
                        name: email,
                        displayName: email
                    },
                    pubKeyCredParams: [
                        { type: "public-key", alg: -7 },
                        { type: "public-key", alg: -257 }
                    ],
                    authenticatorSelection: {
                        residentKey: "preferred",
                        userVerification: "required"
                    },
                    timeout: 60000,
                    attestation: "none"
                }
            });

            if (!credencial) throw new Error("No se creó la clave.");

            localStorage.setItem(
                CLAVE_LOCAL_STORAGE,
                base64UrlEncode(bufferToArrayBuffer(credencial.rawId))
            );

            localStorage.setItem(CLAVE_LOCAL_ID, email);

            mensaje.textContent = "Clave local registrada. Ahora puedes usarla para ingresar.";
            mensaje.className = "cargando";

            mostrarOpcionesClaveLocal();

        } catch (error) {
            console.error("Error registrando clave local:", error);

            if (error.name === "NotAllowedError") {
                mensaje.textContent = "Registro cancelado o no autorizado.";
            } else {
                mensaje.textContent = "No se pudo registrar la clave local en este celular.";
            }

            mensaje.className = "error";
        }
    }

    async function accederConClaveLocal() {
        const mensaje = document.getElementById("mensaje");
        const idGuardado = localStorage.getItem(CLAVE_LOCAL_STORAGE);

        if (!soporteClaveLocal() || !idGuardado) {
            mensaje.textContent = "No hay una clave local registrada en este celular.";
            mensaje.className = "error";
            return;
        }

        try {
            mensaje.textContent = "Confirma con la huella, rostro o bloqueo de tu celular...";
            mensaje.className = "cargando";

            const assertion = await navigator.credentials.get({
                publicKey: {
                    challenge: crypto.getRandomValues(new Uint8Array(32)),
                    allowCredentials: [{
                        type: "public-key",
                        id: base64UrlDecode(idGuardado)
                    }],
                    userVerification: "required",
                    timeout: 60000
                }
            });

            if (!assertion) throw new Error("No se pudo verificar la clave.");

            // La clave privada nunca sale del celular.
            // Esta verificación local solo habilita la entrada a docente.html.
            window.location.href = "docente.html";

        } catch (error) {
            console.error("Error usando clave local:", error);

            if (error.name === "NotAllowedError") {
                mensaje.textContent = "Acceso cancelado o no autorizado.";
            } else {
                mensaje.textContent = "No se pudo verificar la clave local.";
            }

            mensaje.className = "error";
        }
    }

    async function iniciarSesion() {


        const email =

            document

                .getElementById("email")

                .value

                .trim();


        const password =

            document

                .getElementById("password")

                .value;



        const mensaje =

            document

                .getElementById("mensaje");



        if (!email || !password) {

            mensaje.textContent =

                "Ingresa correo y contraseña.";

            mensaje.className = "error";

            return;

        }



        mensaje.textContent =

            "Ingresando...";

        mensaje.className = "cargando";



        const {

            data,

            error

        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });



        if (error) {

            console.error(error);

            mensaje.textContent =

                "Correo o contraseña incorrectos.";

            mensaje.className = "error";

            return;

        }



        // Verificar que realmente sea docente

        const {

            data: docente,

            error: errorDocente

        } = await supabaseClient

            .from("docentes")

            .select("id,nombre,ci")

            .eq("user_id", data.user.id)

            .maybeSingle();



        if (errorDocente || !docente) {

            await supabaseClient.auth.signOut();

            mensaje.textContent =

                "Este usuario no está autorizado como docente.";

            mensaje.className = "error";

            return;

        }



        // Acceso correcto

        window.location.href =

            "docente.html";

    }

    window.addEventListener("DOMContentLoaded", () => {
        mostrarOpcionesClaveLocal();
    });

</script>


</body>

</html>
