<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Acceso Docente</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f2f5f9;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .login {

            width: 90%;

            max-width: 400px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.12);

        }


        h1 {

            text-align: center;

            color: #1557a6;

            margin-top: 0;

        }


        .subtitulo {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }


        label {

            display: block;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 6px;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

        }


        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1557a6;

            color: white;

            font-size: 17px;

            cursor: pointer;

        }


        button:hover {

            background: #0d4282;

        }


        #mensaje {

            margin-top: 15px;

            text-align: center;

            font-weight: bold;

        }


        .error {

            color: #c62828;

        }


        .cargando {

            color: #1557a6;

        }

        .boton-local {
            margin-top: 12px;
            background: #2e7d32;
        }

        .boton-local:hover {
            background: #1b5e20;
        }

        .boton-secundario {
            margin-top: 10px;
            background: #f1f3f5;
            color: #1557a6;
            border: 1px solid #d0d7de;
        }

        .boton-secundario:hover {
            background: #e7ebef;
        }

        .separador-local {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 18px;
            color: #777;
            font-size: 13px;
        }

        .separador-local::before,
        .separador-local::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

    </style>

</head>


<body>


<div class="login">


    <h1>Panel Docente</h1>


    <div class="subtitulo">

        Inicia sesión para continuar

    </div>


    <div id="accesoManual">

        <label for="email">

            Correo electrónico

        </label>


        <input

            type="email"

            id="email"

            placeholder="docente@colegio.com"

        >


        <label for="password">

            Contraseña

        </label>


        <input

            type="password"

            id="password"

            placeholder="Ingresa tu contraseña"

        >


        <button onclick="iniciarSesion()">

            Ingresar

        </button>

    </div>

    <div class="separador-local">
        Acceso local
    </div>

    <button
        type="button"
        id="btnClaveLocal"
        class="boton-local"
        onclick="ingresarConClaveLocal()"
        style="display:none;"
    >
        🔐 Ingresar con huella / clave del dispositivo
    </button>

    <button
        type="button"
        id="btnCrearClaveLocal"
        class="boton-secundario"
        onclick="crearClaveLocal()"
    >
        Crear clave de acceso local
    </button>


    <div id="mensaje"></div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


    const SUPABASE_URL =

        "https://tecphbbkkmlgahjddcep.supabase.co";


    const SUPABASE_KEY =

        "sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


    const supabaseClient =

        window.supabase.createClient(

            SUPABASE_URL,

            SUPABASE_KEY

        );



    /*
     * Acceso local mediante WebAuthn.
     * El inicio normal con correo y contraseña permanece sin cambios.
     */
    const CLAVE_LOCAL_STORAGE = "acceso_docente_clave_local_v1";
    const INTENTOS_LOCAL_STORAGE = "acceso_docente_intentos_clave_local_v1";

    function obtenerIntentosFallidos() {
        return parseInt(localStorage.getItem(INTENTOS_LOCAL_STORAGE) || "0", 10) || 0;
    }

    function registrarIntentoFallido() {
        const intentos = obtenerIntentosFallidos() + 1;
        localStorage.setItem(INTENTOS_LOCAL_STORAGE, String(intentos));
        return intentos;
    }

    function reiniciarIntentosFallidos() {
        localStorage.removeItem(INTENTOS_LOCAL_STORAGE);
    }

    function bytesABase64(bytes) {
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary);
    }

    function base64ABytes(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes;
    }

    function generarBytes(cantidad) {
        const bytes = new Uint8Array(cantidad);
        crypto.getRandomValues(bytes);
        return bytes;
    }

    function webAuthnDisponible() {
        return (
            window.isSecureContext &&
            "PublicKeyCredential" in window &&
            navigator.credentials &&
            typeof navigator.credentials.create === "function" &&
            typeof navigator.credentials.get === "function"
        );
    }

    function obtenerClaveLocal() {
        try {
            return JSON.parse(
                localStorage.getItem(CLAVE_LOCAL_STORAGE) || "null"
            );
        } catch (e) {
            console.error(e);
            return null;
        }
    }

    function mostrarMensaje(texto, clase = "") {
        const mensaje = document.getElementById("mensaje");
        mensaje.textContent = texto;
        mensaje.className = clase;
    }

    function actualizarBotonClaveLocal() {
        const datos = obtenerClaveLocal();
        const boton = document.getElementById("btnClaveLocal");
        const botonCrear = document.getElementById("btnCrearClaveLocal");
        const accesoManual = document.getElementById("accesoManual");
        const separador = document.querySelector(".separador-local");

        if (datos && datos.credentialId) {
            boton.style.display = "block";
            botonCrear.style.display = "none";

            // Mientras no haya 3 fallos, se muestra sólo el acceso local.
            if (obtenerIntentosFallidos() < 3) {
                accesoManual.style.display = "none";
                separador.style.display = "flex";
            } else {
                accesoManual.style.display = "block";
            }
        } else {
            boton.style.display = "none";
            botonCrear.style.display = "block";
            accesoManual.style.display = "block";
            separador.style.display = "flex";
        }
    }

    async function verificarDocente(data) {
        const {
            data: docente,
            error: errorDocente
        } = await supabaseClient
            .from("docentes")
            .select("id,nombre,ci")
            .eq("user_id", data.user.id)
            .maybeSingle();

        if (errorDocente || !docente) {
            await supabaseClient.auth.signOut();
            return false;
        }

        return true;
    }

    async function iniciarSesion() {

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const mensaje =
            document
                .getElementById("mensaje");

        if (!email || !password) {

            mensaje.textContent =
                "Ingresa correo y contraseña.";

            mensaje.className = "error";

            return;
        }

        mensaje.textContent =
            "Ingresando...";

        mensaje.className = "cargando";

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });

        if (error) {

            console.error(error);

            mensaje.textContent =
                "Correo o contraseña incorrectos.";

            mensaje.className = "error";

            return;
        }

        if (!(await verificarDocente(data))) {

            mensaje.textContent =
                "Este usuario no está autorizado como docente.";

            mensaje.className = "error";

            return;
        }

        // Acceso correcto
        window.location.href =
            "docente.html";
    }

    async function crearClaveLocal() {

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        if (!email || !password) {

            mostrarMensaje(
                "Primero ingresa tu correo y contraseña para crear la clave local.",
                "error"
            );

            return;
        }

        if (!webAuthnDisponible()) {

            mostrarMensaje(
                "Este navegador o dispositivo no permite crear una clave de acceso local. Usa HTTPS y un navegador actualizado.",
                "error"
            );

            return;
        }

        try {

            mostrarMensaje(
                "Verificando correo y contraseña...",
                "cargando"
            );

            // Verificar las credenciales actuales antes de guardarlas.
            const {
                data,
                error
            } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {

                mostrarMensaje(
                    "Correo o contraseña incorrectos.",
                    "error"
                );

                return;
            }

            if (!(await verificarDocente(data))) {

                mostrarMensaje(
                    "Este usuario no está autorizado como docente.",
                    "error"
                );

                return;
            }

            await supabaseClient.auth.signOut();

            mostrarMensaje(
                "Ahora confirma con tu huella, rostro o PIN del dispositivo...",
                "cargando"
            );

            const credencialExistente = obtenerClaveLocal();

            const opciones = {
                challenge: generarBytes(32),
                rp: {
                    name: "Panel Docente"
                },
                user: {
                    id: generarBytes(16),
                    name: email,
                    displayName: email
                },
                pubKeyCredParams: [
                    {
                        type: "public-key",
                        alg: -7
                    },
                    {
                        type: "public-key",
                        alg: -257
                    }
                ],
                authenticatorSelection: {
                    residentKey: "preferred",
                    userVerification: "required"
                },
                timeout: 60000,
                attestation: "none"
            };

            if (credencialExistente && credencialExistente.credentialId) {
                opciones.excludeCredentials = [{
                    type: "public-key",
                    id: base64ABytes(credencialExistente.credentialId)
                }];
            }

            const credencial =
                await navigator.credentials.create({
                    publicKey: opciones
                });

            if (!credencial) {
                throw new Error("No se creó la clave local.");
            }

            /*
             * La clave de acceso del dispositivo protege el uso de estos
             * datos locales. Se guardan sólo en este navegador/dispositivo.
             */
            localStorage.setItem(
                CLAVE_LOCAL_STORAGE,
                JSON.stringify({
                    credentialId: bytesABase64(
                        new Uint8Array(credencial.rawId)
                    ),
                    email: email,
                    password: password,
                    createdAt: new Date().toISOString()
                })
            );

            reiniciarIntentosFallidos();
            actualizarBotonClaveLocal();

            document.getElementById("email").value = email;
            document.getElementById("password").value = password;

            mostrarMensaje(
                "Clave de acceso local creada correctamente. Desde ahora puedes ingresar con huella, rostro o PIN.",
                "cargando"
            );

        } catch (error) {

            console.error(error);

            if (error.name === "NotAllowedError") {
                mostrarMensaje(
                    "No se completó la verificación del dispositivo.",
                    "error"
                );
            } else if (error.name === "InvalidStateError") {
                mostrarMensaje(
                    "Ya existe una clave local para este dispositivo.",
                    "error"
                );
            } else {
                mostrarMensaje(
                    "No se pudo crear la clave de acceso local.",
                    "error"
                );
            }
        }
    }

    async function ingresarConClaveLocal() {

        const datos = obtenerClaveLocal();

        if (!datos || !datos.credentialId) {

            mostrarMensaje(
                "Primero debes crear una clave de acceso local.",
                "error"
            );

            return;
        }

        if (!webAuthnDisponible()) {

            mostrarMensaje(
                "Este navegador o dispositivo no permite usar la clave local.",
                "error"
            );

            return;
        }

        try {

            mostrarMensaje(
                "Confirma tu identidad con huella, rostro o PIN...",
                "cargando"
            );

            const assertion =
                await navigator.credentials.get({
                    publicKey: {
                        challenge: generarBytes(32),
                        allowCredentials: [{
                            type: "public-key",
                            id: base64ABytes(datos.credentialId)
                        }],
                        userVerification: "required",
                        timeout: 60000
                    }
                });

            if (!assertion) {
                throw new Error("No se pudo validar la clave local.");
            }

            document.getElementById("email").value =
                datos.email;

            document.getElementById("password").value =
                datos.password;

            mostrarMensaje(
                "Datos recuperados. Ingresando...",
                "cargando"
            );

            const {
                data,
                error
            } = await supabaseClient.auth.signInWithPassword({
                email: datos.email,
                password: datos.password
            });

            if (error) {

                mostrarMensaje(
                    "La clave local es válida, pero el correo o contraseña guardados ya no funcionan. Ingresa nuevamente tus datos.",
                    "error"
                );

                return;
            }

            if (!(await verificarDocente(data))) {

                mostrarMensaje(
                    "Este usuario no está autorizado como docente.",
                    "error"
                );

                return;
            }

            reiniciarIntentosFallidos();
            window.location.href =
                "docente.html";

        } catch (error) {

            console.error(error);

            if (error.name === "NotAllowedError") {
                const intentos = registrarIntentoFallido();

                if (intentos >= 3) {
                    actualizarBotonClaveLocal();
                    mostrarMensaje(
                        "Se alcanzaron 3 intentos fallidos. Puedes ingresar con tu correo y contraseña.",
                        "error"
                    );
                } else {
                    mostrarMensaje(
                        "No se completó la verificación con huella, rostro o PIN. Intento " + intentos + " de 3.",
                        "error"
                    );
                }
            } else {
                mostrarMensaje(
                    "No se pudo utilizar la clave de acceso local.",
                    "error"
                );
            }
        }
    }

    actualizarBotonClaveLocal();

</script>


</body>

</html>
