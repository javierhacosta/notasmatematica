<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Acceso Docente</title>


<style>

    * {
        box-sizing: border-box;
    }


    body {

        margin: 0;

        font-family: Arial, sans-serif;

        background: #f2f5f9;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

    }


    .login {

        width: 90%;

        max-width: 400px;

        background: white;

        padding: 30px;

        border-radius: 15px;

        box-shadow:
            0 5px 20px rgba(0,0,0,.12);

    }


    h1 {

        text-align: center;

        color: #1557a6;

        margin-top: 0;

    }


    .subtitulo {

        text-align: center;

        color: #666;

        margin-bottom: 25px;

    }


    label {

        display: block;

        font-weight: bold;

        margin-top: 15px;

        margin-bottom: 6px;

    }


    input {

        width: 100%;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 8px;

        font-size: 16px;

    }


    button {

        width: 100%;

        margin-top: 25px;

        padding: 13px;

        border: none;

        border-radius: 8px;

        background: #1557a6;

        color: white;

        font-size: 17px;

        cursor: pointer;

    }


    button:hover {

        background: #0d4282;

    }


    #botonHuella {

        margin-top: 10px;

        background: #37474f;

    }


    #botonHuella:hover {

        background: #263238;

    }


    #mensaje {

        margin-top: 15px;

        text-align: center;

        font-weight: bold;

    }


    .error {

        color: #c62828;

    }


    .cargando {

        color: #1557a6;

    }

</style>

</head><body><div class="login"><h1>Panel Docente</h1>


<div class="subtitulo">

    Inicia sesión para continuar

</div>


<button
    type="button"
    id="botonCrearClave"
    onclick="crearClaveLocal()">
    🔐 Crear clave de acceso local
</button>

<button
    type="button"
    id="botonHuella"
    onclick="iniciarConHuella()">
    🫆 Ingresar con huella / bloqueo del celular
</button>

<div id="mensaje"></div>

</div>
<script>
    /*
     * Acceso local mediante WebAuthn/Passkey.
     * No usa Supabase ni guarda la huella: el sistema operativo
     * del teléfono/computadora conserva la credencial.
     */
    const CLAVE_LOCAL = "docente_clave_acceso_local_v1";
    const RP_ID = location.hostname;
    const NOMBRE_SITIO = "Panel Docente";

    const mensaje = document.getElementById("mensaje");
    const botonCrear = document.getElementById("botonCrearClave");
    const botonHuella = document.getElementById("botonHuella");

    function mostrar(texto, clase = "") {
        mensaje.textContent = texto;
        mensaje.className = clase;
    }

    function soporteWebAuthn() {
        return !!(window.isSecureContext &&
                   window.PublicKeyCredential &&
                   navigator.credentials);
    }

    function base64url(bytes) {
        let str = "";
        const arr = new Uint8Array(bytes);
        for (const b of arr) str += String.fromCharCode(b);
        return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function desdeBase64url(texto) {
        const normal = texto.replace(/-/g, "+").replace(/_/g, "/");
        const padded = normal + "=".repeat((4 - normal.length % 4) % 4);
        const bin = atob(padded);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
    }

    function tieneClaveLocal() {
        return !!localStorage.getItem(CLAVE_LOCAL);
    }

    function actualizarBotones() {
        const existe = tieneClaveLocal();
        botonCrear.textContent = existe
            ? "🔄 Cambiar clave de acceso local"
            : "🔐 Crear clave de acceso local";
        botonHuella.disabled = !existe;
        botonHuella.style.opacity = existe ? "1" : ".55";
    }

    async function crearClaveLocal() {
        if (!soporteWebAuthn()) {
            mostrar(
                "Este navegador no permite clave de acceso. Abre la página con HTTPS.",
                "error"
            );
            return;
        }

        try {
            mostrar("Sigue la indicación del celular para registrar tu huella, rostro, PIN o bloqueo de pantalla...", "cargando");

            const existente = tieneClaveLocal();

            const credencial = await navigator.credentials.create({
                publicKey: {
                    challenge: crypto.getRandomValues(new Uint8Array(32)),
                    rp: {
                        name: NOMBRE_SITIO,
                        id: RP_ID
                    },
                    user: {
                        id: crypto.getRandomValues(new Uint8Array(16)),
                        name: "docente-local",
                        displayName: "Docente"
                    },
                    pubKeyCredParams: [
                        { type: "public-key", alg: -7 },
                        { type: "public-key", alg: -257 }
                    ],
                    authenticatorSelection: {
                        residentKey: "preferred",
                        requireResidentKey: false,
                        userVerification: "required"
                    },
                    timeout: 60000,
                    attestation: "none"
                }
            });

            if (!credencial) throw new Error("No se creó la credencial.");

            localStorage.setItem(
                CLAVE_LOCAL,
                JSON.stringify({
                    id: base64url(credencial.rawId),
                    rpId: RP_ID,
                    creada: Date.now()
                })
            );

            actualizarBotones();
            mostrar(
                existente
                    ? "Clave de acceso local cambiada correctamente."
                    : "Clave de acceso local creada correctamente. Ahora puedes ingresar con tu huella o bloqueo del celular.",
                "cargando"
            );
        } catch (error) {
            console.error("WebAuthn:", error);

            if (error.name === "NotAllowedError") {
                mostrar("Registro cancelado o no autorizado por el celular.", "error");
            } else if (error.name === "InvalidStateError") {
                mostrar("El celular ya tiene una clave para esta página. Puedes intentar cambiarla.", "error");
            } else {
                mostrar("No se pudo crear la clave de acceso local.", "error");
            }
        }
    }

    async function iniciarConHuella() {
        if (!tieneClaveLocal()) {
            mostrar("Primero crea una clave de acceso local.", "error");
            return;
        }

        if (!soporteWebAuthn()) {
            mostrar(
                "Este navegador no permite clave de acceso. Abre la página con HTTPS.",
                "error"
            );
            return;
        }

        try {
            mostrar("Verificando huella o bloqueo del celular...", "cargando");

            const guardada = JSON.parse(localStorage.getItem(CLAVE_LOCAL));

            const credencial = await navigator.credentials.get({
                publicKey: {
                    challenge: crypto.getRandomValues(new Uint8Array(32)),
                    rpId: guardada.rpId || RP_ID,
                    allowCredentials: [{
                        type: "public-key",
                        id: desdeBase64url(guardada.id)
                    }],
                    userVerification: "required",
                    timeout: 60000
                }
            });

            if (!credencial) throw new Error("No se obtuvo credencial.");

            // La credencial está ligada al dominio por WebAuthn.
            // El navegador/OS ya realizó la verificación biométrica
            // o del método de desbloqueo configurado en el dispositivo.
            if (base64url(credencial.rawId) !== guardada.id) {
                throw new Error("Credencial local no coincide.");
            }

            sessionStorage.setItem("docente_acceso_local", "1");
            window.location.href = "docente.html";
        } catch (error) {
            console.error("WebAuthn:", error);

            if (error.name === "NotAllowedError") {
                mostrar("Huella, rostro o bloqueo no reconocido, o autenticación cancelada.", "error");
            } else {
                mostrar("No se pudo verificar la clave de acceso local.", "error");
            }
        }
    }

    // Si la página se abre en un dominio diferente, la clave queda
    // vinculada a ese dominio y no se comparte con otros sitios.
    actualizarBotones();
</script></body></html>
