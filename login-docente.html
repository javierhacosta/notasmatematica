<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Acceso Docente</title>


<style>

    * {
        box-sizing: border-box;
    }


    body {

        margin: 0;

        font-family: Arial, sans-serif;

        background: #f2f5f9;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

    }


    .login {

        width: 90%;

        max-width: 400px;

        background: white;

        padding: 30px;

        border-radius: 15px;

        box-shadow:
            0 5px 20px rgba(0,0,0,.12);

    }


    h1 {

        text-align: center;

        color: #1557a6;

        margin-top: 0;

    }


    .subtitulo {

        text-align: center;

        color: #666;

        margin-bottom: 25px;

    }


    label {

        display: block;

        font-weight: bold;

        margin-top: 15px;

        margin-bottom: 6px;

    }


    input {

        width: 100%;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 8px;

        font-size: 16px;

    }


    button {

        width: 100%;

        margin-top: 25px;

        padding: 13px;

        border: none;

        border-radius: 8px;

        background: #1557a6;

        color: white;

        font-size: 17px;

        cursor: pointer;

    }


    button:hover {

        background: #0d4282;

    }


    #botonHuella {

        margin-top: 10px;

        background: #37474f;

    }


    #botonHuella:hover {

        background: #263238;

    }

    #botonClaveLocal {

        margin-top: 10px;
        background: #607d8b;

    }

    #botonClaveLocal:hover {

        background: #455a64;

    }


    #mensaje {

        margin-top: 15px;

        text-align: center;

        font-weight: bold;

    }


    .error {

        color: #c62828;

    }


    .cargando {

        color: #1557a6;

    }

</style>

</head><body><div class="login"><h1>Panel Docente</h1>


<div class="subtitulo">

    Inicia sesión para continuar

</div>


<button
    type="button"
    id="botonHuella"
    onclick="iniciarConHuella()">

    🫆 Ingresar con huella o bloqueo del celular

</button>

<button
    type="button"
    id="botonClaveLocal"
    onclick="configurarClaveLocal()">

    🔐 Crear clave de acceso local

</button>


<label for="email">

    Correo electrónico

</label>


<input

    type="email"

    id="email"

    placeholder="docente@colegio.com"

    autocomplete="username"

>


<label for="password">

    Contraseña

</label>


<input

    type="password"

    id="password"

    placeholder="Ingresa tu contraseña"

    autocomplete="new-password"

>


<button onclick="iniciarSesion()">

    Ingresar

</button>


<div id="mensaje"></div>

</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>


    const SUPABASE_URL =

        "https://tecphbbkkmlgahjddcep.supabase.co";


    const SUPABASE_KEY =

        "sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


    const supabaseClient =

        window.supabase.createClient(

            SUPABASE_URL,

            SUPABASE_KEY,

            {

                auth: {

                    experimental: {

                        passkey: true

                    }

                }

            }

        );



    /*
     * Al abrir nuevamente esta página se elimina
     * la sesión anterior para exigir una nueva autenticación.
     */

    supabaseClient.auth.signOut();



    async function verificarDocente(userId) {

        const {

            data: docente,

            error: errorDocente

        } = await supabaseClient

            .from("docentes")

            .select("id,nombre,ci")

            .eq("user_id", userId)

            .maybeSingle();



        if (errorDocente || !docente) {

            await supabaseClient.auth.signOut();

            return false;

        }


        return true;

    }



    function soporteClaveLocal() {
        return !!(
            window.isSecureContext &&
            window.PublicKeyCredential &&
            navigator.credentials &&
            navigator.credentials.get &&
            navigator.credentials.create
        );
    }

    function obtenerClaveLocal() {
        try {
            return JSON.parse(localStorage.getItem("claveAccesoLocal") || "null");
        } catch (e) {
            return null;
        }
    }

    function guardarClaveLocal(credencial) {
        localStorage.setItem("claveAccesoLocal", JSON.stringify(credencial));
    }

    function base64url(bytes) {
        let binary = "";
        const arr = new Uint8Array(bytes);
        for (const b of arr) binary += String.fromCharCode(b);
        return btoa(binary)
            .replace(/\+/g, "-")
            .replace(/\//g, "_")
            .replace(/=+$/g, "");
    }

    function base64urlToUint8Array(value) {
        const padded = value.replace(/-/g, "+").replace(/_/g, "/")
            + "===".slice((value.length + 3) % 4);
        const binary = atob(padded);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
    }

    async function configurarClaveLocal() {
        const mensaje = document.getElementById("mensaje");

        if (!soporteClaveLocal()) {
            mensaje.textContent =
                "Este celular o navegador no permite clave de acceso local.";
            mensaje.className = "error";
            return;
        }

        mensaje.textContent =
            "Confirma con la huella, rostro, PIN, patrón o bloqueo del celular...";
        mensaje.className = "cargando";

        try {
            const existente = obtenerClaveLocal();
            if (existente) {
                mensaje.textContent =
                    "Ya existe una clave de acceso local en este dispositivo.";
                mensaje.className = "cargando";
                return;
            }

            const usuario = (document.getElementById("email").value || "").trim();

            const challenge = new Uint8Array(32);
            crypto.getRandomValues(challenge);

            const userId = new Uint8Array(16);
            crypto.getRandomValues(userId);

            const credential = await navigator.credentials.create({
                publicKey: {
                    challenge,
                    rp: {
                        name: "Acceso Docente",
                        id: location.hostname
                    },
                    user: {
                        id: userId,
                        name: usuario || "docente-local",
                        displayName: usuario || "Docente"
                    },
                    pubKeyCredParams: [
                        { type: "public-key", alg: -7 },
                        { type: "public-key", alg: -257 }
                    ],
                    authenticatorSelection: {
                        authenticatorAttachment: "platform",
                        residentKey: "required",
                        requireResidentKey: true,
                        userVerification: "required"
                    },
                    timeout: 60000,
                    attestation: "none"
                }
            });

            guardarClaveLocal({
                id: base64url(credential.rawId),
                creado: Date.now()
            });

            mensaje.textContent =
                "Clave local creada. Desde ahora puedes entrar con la huella o el bloqueo del celular.";
            mensaje.className = "cargando";

        } catch (error) {
            console.error(error);
            mensaje.textContent =
                "No se pudo crear la clave local. Verifica que el bloqueo del celular esté activo.";
            mensaje.className = "error";
        }
    }

    async function iniciarConHuella() {
        const mensaje = document.getElementById("mensaje");

        if (!soporteClaveLocal()) {
            mensaje.textContent =
                "Este celular o navegador no permite acceso con la huella o bloqueo del celular.";
            mensaje.className = "error";
            return;
        }

        mensaje.textContent =
            "Confirma con la huella, rostro, PIN, patrón o bloqueo del celular...";
        mensaje.className = "cargando";

        try {
            const clave = obtenerClaveLocal();

            if (!clave) {
                mensaje.textContent =
                    "Primero crea la clave de acceso local con el botón de abajo.";
                mensaje.className = "error";
                return;
            }

            const challenge = new Uint8Array(32);
            crypto.getRandomValues(challenge);

            const assertion = await navigator.credentials.get({
                publicKey: {
                    challenge,
                    allowCredentials: [{
                        type: "public-key",
                        id: base64urlToUint8Array(clave.id),
                        transports: ["internal"]
                    }],
                    userVerification: "required",
                    timeout: 60000
                }
            });

            if (!assertion) {
                throw new Error("No se pudo verificar la clave local.");
            }

            /*
             * La clave local ya verificó al usuario mediante el mecanismo
             * seguro del propio celular. Recuperamos la sesión de Supabase
             * guardada en este navegador. Si existe y pertenece a un docente,
             * se permite el acceso sin pedir nuevamente correo/contraseña.
             */
            const { data: sesionData } =
                await supabaseClient.auth.getSession();

            const sesion = sesionData && sesionData.session;

            if (!sesion || !sesion.user) {
                mensaje.textContent =
                    "La clave fue verificada, pero primero debes ingresar una vez con correo y contraseña en este dispositivo.";
                mensaje.className = "error";
                return;
            }

            const esDocente = await verificarDocente(sesion.user.id);

            if (!esDocente) {
                mensaje.textContent =
                    "Este usuario no está autorizado como docente.";
                mensaje.className = "error";
                return;
            }

            sessionStorage.setItem("accesoDocenteLocal", "1");
            window.location.href = "docente.html";

        } catch (error) {
            console.error(error);
            mensaje.textContent =
                "Acceso cancelado o no reconocido.";
            mensaje.className = "error";
        }
    }

    async function registrarHuella() {

        const mensaje =

            document

                .getElementById("mensaje");


        mensaje.textContent =

            "Registrando huella...";

        mensaje.className = "cargando";


        try {


            const {

                data,

                error

            } = await supabaseClient.auth.registerPasskey();


            if (error) {

                console.error(error);


                mensaje.textContent =

                    "No se pudo registrar la huella.";

                mensaje.className = "error";

                return false;

            }


            console.log(

                "Passkey registrada:",

                data

            );


            mensaje.textContent =

                "Huella registrada correctamente.";

            mensaje.className = "cargando";


            return true;


        } catch (error) {

            console.error(error);


            mensaje.textContent =

                "No se pudo registrar la huella.";

            mensaje.className = "error";


            return false;

        }

    }



    async function iniciarSesion() {


        const email =

            document

                .getElementById("email")

                .value

                .trim();


        const password =

            document

                .getElementById("password")

                .value;



        const mensaje =

            document

                .getElementById("mensaje");



        if (!email || !password) {

            mensaje.textContent =

                "Ingresa correo y contraseña.";

            mensaje.className = "error";

            return;

        }



        mensaje.textContent =

            "Ingresando...";

        mensaje.className = "cargando";



        const {

            data,

            error

        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });



        if (error) {

            console.error(error);

            mensaje.textContent =

                "Correo o contraseña incorrectos.";

            mensaje.className = "error";

            return;

        }



        // Verificar que realmente sea docente

        const esDocente =

            await verificarDocente(data.user.id);


        if (!esDocente) {

            mensaje.textContent =

                "Este usuario no está autorizado como docente.";

            mensaje.className = "error";

            return;

        }



        // Acceso correcto

        window.location.href =

            "docente.html";

    }

</script></body></html>
