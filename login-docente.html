<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Acceso Docente</title>


<style>

    * {
        box-sizing: border-box;
    }


    body {

        margin: 0;

        font-family: Arial, sans-serif;

        background: #f2f5f9;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

    }


    .login {

        width: 90%;

        max-width: 400px;

        background: white;

        padding: 30px;

        border-radius: 15px;

        box-shadow:
            0 5px 20px rgba(0,0,0,.12);

    }


    h1 {

        text-align: center;

        color: #1557a6;

        margin-top: 0;

    }


    .subtitulo {

        text-align: center;

        color: #666;

        margin-bottom: 25px;

    }


    label {

        display: block;

        font-weight: bold;

        margin-top: 15px;

        margin-bottom: 6px;

    }


    input {

        width: 100%;

        padding: 12px;

        border: 1px solid #ccc;

        border-radius: 8px;

        font-size: 16px;

    }


    button {

        width: 100%;

        margin-top: 25px;

        padding: 13px;

        border: none;

        border-radius: 8px;

        background: #1557a6;

        color: white;

        font-size: 17px;

        cursor: pointer;

    }


    button:hover {

        background: #0d4282;

    }


    #botonHuella {

        margin-top: 10px;

        background: #37474f;

    }


    #botonHuella:hover {

        background: #263238;

    }


    #mensaje {

        margin-top: 15px;

        text-align: center;

        font-weight: bold;

    }


    .error {

        color: #c62828;

    }


    .cargando {

        color: #1557a6;

    }

</style>

</head><body><div class="login"><h1>Panel Docente</h1>


<div class="subtitulo">

    Inicia sesión para continuar

</div>


<div id="opcionesHuella" style="display:none;">
<button
    type="button"
    id="botonHuella"
    onclick="iniciarConHuella()">
    🫆 Ingresar con huella
</button>
<button
    type="button"
    id="botonConfigurarHuella"
    onclick="configurarHuella()"
    style="margin-top:10px;background:#607d8b;">
    ⚙️ Configurar huella
</button>
</div>


<div id="accesoCorreo" style="display:none;">
<label for="email">

    Correo electrónico

</label>


<input

    type="email"

    id="email"

    placeholder="docente@colegio.com"

    autocomplete="username webauthn"

>


<label for="password">

    Contraseña

</label>


<input

    type="password"

    id="password"

    placeholder="Ingresa tu contraseña"

    autocomplete="current-password"

>


<button onclick="iniciarSesion()">

    Ingresar

</button>
</div>


<div id="mensaje"></div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>


    const SUPABASE_URL =

        "https://tecphbbkkmlgahjddcep.supabase.co";


    const SUPABASE_KEY =

        "sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


    const supabaseClient =

        window.supabase.createClient(

            SUPABASE_URL,

            SUPABASE_KEY,

            {

                auth: {

                    experimental: {

                        passkey: true

                    }

                }

            }

        );



    /*
     * Al abrir nuevamente esta página se elimina
     * la sesión anterior para exigir una nueva autenticación.
     */

    supabaseClient.auth.signOut();



    async function verificarDocente(userId) {

        const {

            data: docente,

            error: errorDocente

        } = await supabaseClient

            .from("docentes")

            .select("id,nombre,ci")

            .eq("user_id", userId)

            .maybeSingle();



        if (errorDocente || !docente) {

            await supabaseClient.auth.signOut();

            return false;

        }


        return true;

    }



    async function iniciarConHuella() {

        const mensaje =

            document

                .getElementById("mensaje");


        mensaje.textContent =

            "Verificando huella...";

        mensaje.className = "cargando";


        try {


            const {

                data,

                error

            } = await supabaseClient.auth.signInWithPasskey();


            if (error) {

                console.error(error);

                mensaje.textContent =

                    "No se pudo iniciar con la huella.";

                mensaje.className = "error";

                return;

            }


            if (!data || !data.user) {

                mensaje.textContent =

                    "No se pudo verificar la huella.";

                mensaje.className = "error";

                return;

            }


            const esDocente =

                await verificarDocente(data.user.id);


            if (!esDocente) {

                mensaje.textContent =

                    "Este usuario no está autorizado como docente.";

                mensaje.className = "error";

                return;

            }


            window.location.href =

                "docente.html";


        } catch (error) {

            console.error(error);


            mensaje.textContent =

                "Huella no reconocida o autenticación cancelada.";

            mensaje.className = "error";

        }

    }



    function huellaCompatible() {
        return window.isSecureContext &&
               !!window.PublicKeyCredential &&
               typeof window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable === "function";
    }

    async function actualizarOpcionesHuella() {
        const contenedor = document.getElementById("opcionesHuella");
        if (!huellaCompatible()) {
            contenedor.style.display = "none";
            return;
        }

        try {
            const disponible = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
            const configurada = localStorage.getItem("docente_passkey_configurada") === "1";
            contenedor.style.display = disponible && !configurada ? "block" : "none";
        } catch (e) {
            contenedor.style.display = "none";
        }
    }

    function mostrarAccesoCorreo() {
        document.getElementById("accesoCorreo").style.display = "block";
    }

    async function intentarHuellaAutomatica() {
        const mensaje = document.getElementById("mensaje");
        const configurada = localStorage.getItem("docente_passkey_configurada") === "1";
        if (!configurada || !huellaCompatible()) {
            mostrarAccesoCorreo();
            return;
        }

        mensaje.textContent = "Verificando huella...";
        mensaje.className = "cargando";
        try {
            const { data, error } = await supabaseClient.auth.signInWithPasskey();
            if (!error && data && data.user) {
                const esDocente = await verificarDocente(data.user.id);
                if (esDocente) {
                    window.location.href = "docente.html";
                    return;
                }
            }
            mostrarAccesoCorreo();
            mensaje.textContent = "No se pudo ingresar con la huella. Puedes ingresar con correo y contraseña.";
            mensaje.className = "error";
        } catch (e) {
            console.warn("Acceso con huella no disponible:", e);
            mostrarAccesoCorreo();
            mensaje.textContent = "Puedes ingresar con correo y contraseña.";
            mensaje.className = "error";
        }
    }

    async function registrarHuella() {
        const mensaje = document.getElementById("mensaje");
        mensaje.textContent = "Registrando huella...";
        mensaje.className = "cargando";

        try {
            const { data, error } = await supabaseClient.auth.registerPasskey();
            if (error) {
                console.error(error);
                if (error.code === "webauthn_credential_exists") {
                    localStorage.setItem("docente_passkey_configurada", "1");
                    mensaje.textContent = "La huella ya estaba configurada.";
                    mensaje.className = "cargando";
                    document.getElementById("opcionesHuella").style.display = "none";
                    return true;
                }
                const detalle = error.message || "";
                if (/RP ID|Relying Party|domain|origin|loralhost|localhost/i.test(detalle)) {
                    mensaje.textContent = "No se pudo configurar la huella. En Supabase configura Relying Party ID como javierhacosta.github.io y Relying Party Origin como https://javierhacosta.github.io.";
                } else {
                    mensaje.textContent = "No se pudo configurar la huella: " + detalle;
                }
                mensaje.className = "error";
                return false;
            }
            localStorage.setItem("docente_passkey_configurada", "1");
            mensaje.textContent = "Huella configurada correctamente.";
            mensaje.className = "cargando";
            document.getElementById("opcionesHuella").style.display = "none";
            return true;
        } catch (error) {
            console.error(error);
            mensaje.textContent = "No se pudo configurar la huella. Verifica que el sitio use HTTPS y que tu dispositivo tenga bloqueo de pantalla/huella activado.";
            mensaje.className = "error";
            return false;
        }
    }

    async function configurarHuella() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const mensaje = document.getElementById("mensaje");

        if (!email || !password) {
            mensaje.textContent = "Primero ingresa tu correo y contraseña para configurar la huella.";
            mensaje.className = "error";
            return;
        }

        mensaje.textContent = "Verificando tu cuenta...";
        mensaje.className = "cargando";

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error || !data.user) {
                mensaje.textContent = "Correo o contraseña incorrectos.";
                mensaje.className = "error";
                return;
            }

            const esDocente = await verificarDocente(data.user.id);
            if (!esDocente) {
                mensaje.textContent = "Este usuario no está autorizado como docente.";
                mensaje.className = "error";
                return;
            }

            const registrada = await registrarHuella();
            await supabaseClient.auth.signOut();
            if (registrada) {
                setTimeout(() => {
                    document.getElementById("email").value = "";
                    document.getElementById("password").value = "";
                    mensaje.textContent = "Huella configurada. Ahora puedes ingresar con ella.";
                    mensaje.className = "cargando";
                }, 300);
            }
        } catch (error) {
            console.error(error);
            await supabaseClient.auth.signOut();
            mensaje.textContent = "No se pudo configurar la huella.";
            mensaje.className = "error";
        }
    }

    async function iniciarSesion() {


        const email =

            document

                .getElementById("email")

                .value

                .trim();


        const password =

            document

                .getElementById("password")

                .value;



        const mensaje =

            document

                .getElementById("mensaje");



        if (!email || !password) {

            mensaje.textContent =

                "Ingresa correo y contraseña.";

            mensaje.className = "error";

            return;

        }



        mensaje.textContent =

            "Ingresando...";

        mensaje.className = "cargando";



        const {

            data,

            error

        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });



        if (error) {

            console.error(error);

            mensaje.textContent =

                "Correo o contraseña incorrectos.";

            mensaje.className = "error";

            return;

        }



        // Verificar que realmente sea docente

        const esDocente =

            await verificarDocente(data.user.id);


        if (!esDocente) {

            mensaje.textContent =

                "Este usuario no está autorizado como docente.";

            mensaje.className = "error";

            return;

        }

        // Después de un acceso correcto con contraseña, configurar la passkey
        // en este mismo dispositivo para poder usar la huella en los siguientes accesos.
        if (huellaCompatible()) {
            const registrada = await registrarHuella();
            if (registrada) {
                mensaje.textContent = "Acceso correcto. Huella configurada.";
                mensaje.className = "cargando";
            }
        }

        // Acceso correcto
        window.location.href =
            "docente.html";

    }

    async function prepararPagina() {
        // Mostrar primero el acceso normal mientras se comprueba si este dispositivo
        // tiene una passkey registrada.
        mostrarAccesoCorreo();
        await actualizarOpcionesHuella();

        // Si la passkey fue configurada anteriormente en este dispositivo,
        // intentar primero el ingreso con huella.
        if (localStorage.getItem("docente_passkey_configurada") === "1" && huellaCompatible()) {
            document.getElementById("accesoCorreo").style.display = "none";
            await intentarHuellaAutomatica();
        }
    }

    prepararPagina();

</script></body></html>
