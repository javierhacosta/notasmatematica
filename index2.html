<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Consulta de Notas</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}

.contenedor {
    width: 90%;
    max-width: 500px;
    margin: 35px auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}

.institucion {
    text-align: center;
    color: #1557a6;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 6px;
}

h1 {
    text-align: center;
    color: #1557a6;
    margin: 5px 0;
}

.profesor {
    text-align: center;
    color: #555;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 22px;
}

.subtitulo {
    text-align: center;
    color: #666;
    margin-bottom: 22px;
}

label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #1557a6;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #0d4282;
}

/* =========================================
   RESULTADO
========================================= */

#resultado {
    margin-top: 25px;
}

.nota-box {
    background: #f1f6ff;
    padding: 22px;
    border-radius: 16px;
    text-align: center;
}

.nombre {
    color: #1557a6;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.curso {
    color: #666;
    font-size: 15px;
    margin-bottom: 8px;
}

.titulo-nota {
    color: #555;
    font-size: 17px;
    font-weight: bold;
    margin-top: 15px;
}

.nota {
    font-size: 90px;
    font-weight: bold;
    line-height: 1;
    margin: 15px 0 20px;
}

/* =========================================
   COLORES
========================================= */

.azul {
    color: #1557a6;
}

.rojo {
    color: #c62828;
}

/* =========================================
   BOTÓN DETALLES
========================================= */

.boton-detalles {
    background: #1557a6;
    margin-top: 5px;
}

.boton-detalles:hover {
    background: #0d4282;
}

/* =========================================
   DETALLES
========================================= */

.detalles {
    margin-top: 18px;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    border: 1px solid #ddd;
    text-align: left;
}

.detalles-titulo {
    background: #1557a6;
    color: white;
    padding: 14px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}

.categoria {
    padding: 14px 16px;
    border-bottom: 1px solid #eee;
}

.categoria:last-child {
    border-bottom: none;
}

.categoria-nombre {
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 5px;
}

.categoria-descripcion {
    color: #777;
    font-size: 13px;
    margin-bottom: 8px;
}

.categoria-puntos {
    font-size: 24px;
    font-weight: bold;
}

.ser {
    color: #7b1fa2;
}

.saber {
    color: #1565c0;
}

.hacer {
    color: #ef6c00;
}

.auto {
    color: #00838f;
}

.total-3t {
    background: #f1f6ff;
    padding: 17px;
    text-align: center;
}

.total-titulo {
    font-size: 16px;
    font-weight: bold;
    color: #555;
}

.total-puntos {
    font-size: 32px;
    font-weight: bold;
    color: #1557a6;
    margin-top: 5px;
}

/* =========================================
   TRIMESTRES
========================================= */

.trimestres {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.trimestre-box {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px 5px;
    text-align: center;
}

.trimestre-titulo {
    font-size: 13px;
    color: #666;
    font-weight: bold;
}

.trimestre-nota {
    font-size: 25px;
    font-weight: bold;
    margin-top: 5px;
}

/* =========================================
   NOTA FINAL
========================================= */

.final-box {
    margin-top: 20px;
    padding: 18px;
    border-radius: 14px;
    background: #f8f8f8;
    text-align: center;
}

.final-titulo {
    font-size: 17px;
    font-weight: bold;
    color: #555;
}

.final-nota {
    font-size: 45px;
    font-weight: bold;
    margin: 5px 0;
}

.estado {
    display: inline-block;
    padding: 7px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 15px;
}

.estado-aprobado {
    color: #16803c;
    background: #e8f5e9;
}

.estado-reprobado {
    color: #c62828;
    background: #ffebee;
}

.error {
    color: #c62828;
    text-align: center;
    font-weight: bold;
}

.cargando {
    text-align: center;
    color: #1557a6;
}

.oculto {
    display: none;
}

/* =========================================
   CELULAR
========================================= */

@media (max-width: 450px) {

    .contenedor {
        width: 94%;
        padding: 18px;
        margin-top: 20px;
    }

    .nota {
        font-size: 78px;
    }

}

</style>

</head>


<body>


<div class="contenedor">


    <div class="institucion">
        U.E. GERMAN BUSCH I
    </div>


    <h1>
        Matemática 2026
    </h1>


    <div class="profesor">
        Prof. Javier Delmo Hacosta Moralez
    </div>


    <div class="subtitulo">
        Consulta tu calificación
    </div>


    <label for="ci">
        CI
    </label>


    <input
        type="text"
        id="ci"
        placeholder="Ejemplo: 1234567"
    >


    <label for="fecha_nacimiento">
        Fecha de nacimiento
    </label>


    <input
        type="date"
        id="fecha_nacimiento"
    >


    <button onclick="consultarNota()">
        Consultar mi nota
    </button>


    <div id="resultado"></div>


</div>


<script>


// =================================================
// SUPABASE
// =================================================

const SUPABASE_URL =
"https://tecphbbkkmlgahjddcep.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


// =================================================
// VARIABLES
// =================================================

let alumnoActual = null;


// =================================================
// CONSULTAR
// =================================================

async function consultarNota() {


    const ci =
    document.getElementById("ci")
    .value
    .trim();


    const fechaNacimiento =
    document.getElementById("fecha_nacimiento")
    .value;


    const resultado =
    document.getElementById("resultado");


    resultado.innerHTML = "";


    if (!ci || !fechaNacimiento) {

        resultado.innerHTML =
        '<p class="error">Ingresa tu CI y fecha de nacimiento.</p>';

        return;

    }


    resultado.innerHTML =
    '<p class="cargando">Buscando tus calificaciones...</p>';


    try {


        const respuesta =
        await fetch(

            `${SUPABASE_URL}/rest/v1/matematica?ci=eq.${encodeURIComponent(ci)}&fecha_nacimiento=eq.${encodeURIComponent(fechaNacimiento)}&select=*`,

            {

                method: "GET",

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    `Bearer ${SUPABASE_KEY}`

                }

            }

        );


        if (!respuesta.ok) {

            throw new Error(
                "Error al consultar Supabase"
            );

        }


        const datos =
        await respuesta.json();


        if (datos.length === 0) {

            resultado.innerHTML =
            '<p class="error">CI o fecha de nacimiento incorrectos.</p>';

            return;

        }


        alumnoActual =
        datos[0];


        mostrarResultado(
            alumnoActual
        );


    } catch (error) {


        console.error(error);


        resultado.innerHTML =
        '<p class="error">No se pudo conectar con el servidor.</p>';

    }

}


// =================================================
// MOSTRAR RESULTADO
// =================================================

function mostrarResultado(
    alumno
) {


    const nota3 =
    obtenerNumero(
        alumno.nota_3t
    );


    const notaFinal =
    obtenerNumero(
        alumno.final
    );


    const claseNota3 =
    nota3 < 51
    ? "rojo"
    : "azul";


    const claseFinal =
    notaFinal < 51
    ? "rojo"
    : "azul";


    let estado =
    "";


    if (notaFinal !== null) {

        if (notaFinal <= 50) {

            estado = `
                <span class="estado estado-reprobado">
                    REPROBADO
                </span>
            `;

        } else {

            estado = `
                <span class="estado estado-aprobado">
                    APROBADO
                </span>
            `;

        }

    }


    document.getElementById(
        "resultado"
    ).innerHTML = `


        <div class="nota-box">


            <div class="nombre">
                ${escapeHTML(
                    alumno.nombre
                )}
            </div>


            <div class="curso">
                Curso: ${escapeHTML(
                    alumno.curso || ""
                )}
            </div>


            <div class="titulo-nota">
                NOTA DEL 3ER TRIMESTRE
            </div>


            <div class="nota ${claseNota3}">
                ${nota3 === null ? "" : nota3}
            </div>


            <button
                class="boton-detalles"
                onclick="mostrarDetalles()">

                📊 Ver detalles del 3er trimestre

            </button>


            <div
                id="detalles3T"
                class="detalles oculto">

                <div class="detalles-titulo">
                    📊 Detalle del 3er trimestre
                </div>


                <div class="categoria">

                    <div class="categoria-nombre ser">
                        🧑‍🤝‍🧑 SER
                    </div>

                    <div class="categoria-descripcion">
                        Valores, actitudes y convivencia
                    </div>

                    <div
                        id="puntosSer"
                        class="categoria-puntos ser">

                        0 pts

                    </div>

                </div>


                <div class="categoria">

                    <div class="categoria-nombre saber">
                        🧠 SABER
                    </div>

                    <div class="categoria-descripcion">
                        Conocimientos y aprendizajes
                    </div>

                    <div
                        id="puntosSaber"
                        class="categoria-puntos saber">

                        0 pts

                    </div>

                </div>


                <div class="categoria">

                    <div class="categoria-nombre hacer">
                        🛠️ HACER
                    </div>

                    <div class="categoria-descripcion">
                        Aplicación práctica de lo aprendido
                    </div>

                    <div
                        id="puntosHacer"
                        class="categoria-puntos hacer">

                        0 pts

                    </div>

                </div>


                <div class="categoria">

                    <div class="categoria-nombre auto">
                        📝 AUTOEVALUACIÓN
                    </div>

                    <div class="categoria-descripcion">
                        Reflexión y valoración personal
                    </div>

                    <div
                        id="puntosAuto"
                        class="categoria-puntos auto">

                        0 pts

                    </div>

                </div>


                <div class="total-3t">

                    <div class="total-titulo">
                        📊 TOTAL 3ER TRIMESTRE
                    </div>

                    <div
                        id="total3T"
                        class="total-puntos">

                        0 pts

                    </div>

                </div>

            </div>


            <!-- =================================
                 TRIMESTRES
            ================================== -->

            <div class="trimestres">


                <div class="trimestre-box">

                    <div class="trimestre-titulo">
                        1er Trimestre
                    </div>

                    <div class="trimestre-nota azul">

                        ${
                            alumno.nota_1t ??
                            ""
                        }

                    </div>

                </div>


                <div class="trimestre-box">

                    <div class="trimestre-titulo">
                        2do Trimestre
                    </div>

                    <div class="trimestre-nota azul">

                        ${
                            alumno.nota_2t ??
                            ""
                        }

                    </div>

                </div>


                <div class="trimestre-box">

                    <div class="trimestre-titulo">
                        3er Trimestre
                    </div>

                    <div
                        class="trimestre-nota ${claseNota3}">

                        ${
                            nota3 ??
                            ""
                        }

                    </div>

                </div>


            </div>


            <!-- =================================
                 NOTA FINAL
            ================================== -->

            <div class="final-box">


                <div class="final-titulo">
                    NOTA FINAL
                </div>


                <div
                    class="final-nota ${claseFinal}">

                    ${
                        notaFinal ??
                        ""
                    }

                </div>


                ${estado}


            </div>


        </div>

    `;

}


// =================================================
// DETALLES 3T
// =================================================

async function mostrarDetalles() {


    const detalles =
    document.getElementById(
        "detalles3T"
    );


    if (
        !detalles.classList.contains(
            "oculto"
        )
    ) {

        detalles.classList.add(
            "oculto"
        );

        return;

    }


    detalles.classList.remove(
        "oculto"
    );


    // Mostrar cargando

    document.getElementById(
        "puntosSer"
    ).textContent =
    "Cargando...";


    document.getElementById(
        "puntosSaber"
    ).textContent =
    "Cargando...";


    document.getElementById(
        "puntosHacer"
    ).textContent =
    "Cargando...";


    document.getElementById(
        "puntosAuto"
    ).textContent =
    "Cargando...";


    document.getElementById(
        "total3T"
    ).textContent =
    "Cargando...";


    try {


        // =========================================
        // ACTIVIDADES
        // =========================================

        const respuestaActividades =
        await fetch(

            `${SUPABASE_URL}/rest/v1/actividades?curso=eq.${encodeURIComponent(alumnoActual.curso)}&trimestre=eq.3&select=id,categoria,puntaje_maximo`,

            {

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    `Bearer ${SUPABASE_KEY}`

                }

            }

        );


        if (!respuestaActividades.ok) {

            throw new Error(
                "No se pudieron cargar las actividades"
            );

        }


        const actividades =
        await respuestaActividades.json();


        // =========================================
        // CALIFICACIONES
        // =========================================

        const respuestaCalificaciones =
        await fetch(

            `${SUPABASE_URL}/rest/v1/calificaciones?estudiante_id=eq.${alumnoActual.id}&select=actividad_id,nota`,

            {

                headers: {

                    "apikey":
                    SUPABASE_KEY,

                    "Authorization":
                    `Bearer ${SUPABASE_KEY}`

                }

            }

        );


        if (!respuestaCalificaciones.ok) {

            throw new Error(
                "No se pudieron cargar las calificaciones"
            );

        }


        const calificaciones =
        await respuestaCalificaciones.json();


        const mapa = {};


        calificaciones.forEach(
        cal => {

            mapa[
                cal.actividad_id
            ] =
            Number(cal.nota);

        });


        // =========================================
        // CALCULAR CATEGORÍAS
        // =========================================

        const limites = {

            SER: 10,

            SABER: 45,

            HACER: 40,

            AUTOEVALUACION: 5

        };


        const categorias = {

            SER: [],

            SABER: [],

            HACER: [],

            AUTOEVALUACION: []

        };


        actividades.forEach(
        actividad => {


            const nota =
            mapa[
                actividad.id
            ];


            if (
                nota === undefined ||
                nota === null ||
                isNaN(nota)
            ) {

                return;

            }


            categorias[
                actividad.categoria
            ].push(
                nota
            );

        });


        const puntos = {};


        Object.keys(
            limites
        ).forEach(
        categoria => {


            const valores =
            categorias[
                categoria
            ];


            if (
                valores.length === 0
            ) {

                puntos[
                    categoria
                ] = 0;

                return;

            }


            const promedio =
            valores.reduce(
                (
                    suma,
                    valor
                ) =>
                suma +
                Number(valor),
                0
            ) /
            valores.length;


            puntos[
                categoria
            ] =
            (
                promedio /
                100
            ) *
            limites[
                categoria
            ];

        });


        const total =
        puntos.SER +
        puntos.SABER +
        puntos.HACER +
        puntos.AUTOEVALUACION;


        // =========================================
        // MOSTRAR
        // =========================================

        document.getElementById(
            "puntosSer"
        ).textContent =
        puntos.SER.toFixed(2) +
        " pts";


        document.getElementById(
            "puntosSaber"
        ).textContent =
        puntos.SABER.toFixed(2) +
        " pts";


        document.getElementById(
            "puntosHacer"
        ).textContent =
        puntos.HACER.toFixed(2) +
        " pts";


        document.getElementById(
            "puntosAuto"
        ).textContent =
        puntos.AUTOEVALUACION.toFixed(2) +
        " pts";


        document.getElementById(
            "total3T"
        ).textContent =
        total.toFixed(2) +
        " pts";


    } catch (error) {


        console.error(error);


        document.getElementById(
            "puntosSer"
        ).textContent =
        "Error";


        document.getElementById(
            "puntosSaber"
        ).textContent =
        "Error";


        document.getElementById(
            "puntosHacer"
        ).textContent =
        "Error";


        document.getElementById(
            "puntosAuto"
        ).textContent =
        "Error";


        document.getElementById(
            "total3T"
        ).textContent =
        "Error";

    }

}


// =================================================
// CONVERTIR A NÚMERO
// =================================================

function obtenerNumero(
    valor
) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return null;

    }


    const numero =
    Number(valor);


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


// =================================================
// ESCAPAR HTML
// =================================================

function escapeHTML(
    texto
) {

    return String(texto)

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>
</html>
