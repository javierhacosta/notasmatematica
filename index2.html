<body>


<div class="contenedor">


    <div class="institucion">

        U.E. GERMAN BUSCH I

    </div>


    <h1>

        Matemática 2026

    </h1>


    <div class="profesor">

        Prof. Javier Delmo Hacosta Moralez

    </div>


    <div class="subtitulo">

        Consulta tu calificación

    </div>


    <label for="ci">

        CI

    </label>


    <input
        type="text"
        id="ci"
        placeholder="Ejemplo: 1234567"
    >


    <label for="fecha_nacimiento">

        Fecha de nacimiento

    </label>

        type="date"
        id="fecha_nacimiento"
    >

        🔍 Consultar mi nota

    </button>


    <div id="resultado"></div>


</div>


<script>


// =================================================
// SUPABASE
// =================================================

const SUPABASE_URL =

"https://tecphbbkkmlgahjddcep.supabase.co";


const SUPABASE_KEY =

"sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


let alumnoActual = null;


// =================================================
// CONSULTAR
// =================================================

async function consultarNota() {

    const ci =
        document.getElementById("ci")
        .value
        .trim();

    const fecha =
        document.getElementById("fecha_nacimiento")
        .value;

    const resultado =
        document.getElementById("resultado");


    if (!ci || !fecha) {

        resultado.innerHTML =
            '<p class="error">' +
            'Ingresa tu CI y fecha de nacimiento.' +
            '</p>';

        return;
    }


    resultado.innerHTML =
        '<p class="cargando">🔎 Buscando...</p>';


    try {

        const respuesta = await fetch(

            `${SUPABASE_URL}/rest/v1/matematica?` +
            `ci=eq.${encodeURIComponent(ci)}` +
            `&fecha_nacimiento=eq.${encodeURIComponent(fecha)}` +
            `&select=id,nombre,curso,nota_1t,nota_2t,nota_3t,final`,

            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`
                }
            }

        );


        if (!respuesta.ok) {

            throw new Error(
                "Error de conexión"
            );

        }


        const datos =
            await respuesta.json();


        if (datos.length === 0) {

            resultado.innerHTML =
                '<p class="error">' +
                'CI o fecha de nacimiento incorrectos.' +
                '</p>';

            return;
        }


        alumnoActual =
            datos[0];


        mostrarResultado(
            alumnoActual
        );

    }

    catch(error) {

        console.error(error);

        resultado.innerHTML =
            '<p class="error">' +
            'No se pudo conectar con el servidor.' +
            '</p>';

    }

}


// =================================================
// MOSTRAR RESULTADO
// =================================================

function mostrarResultado(alumno) {

    const nota1 =
        convertirNota(alumno.nota_1t);

    const nota2 =
        convertirNota(alumno.nota_2t);

    const nota3 =
        convertirNota(alumno.nota_3t);

    const final =
        convertirNota(alumno.final);


    let claseFinal = "";


    if (final !== null) {

        claseFinal =
            final <= 50
            ? "reprobado"
            : "aprobado";

    }


    document.getElementById(
        "resultado"
    ).innerHTML = `


        <div class="nota-box">


            <div class="nombre">

                ${escapeHTML(
                    alumno.nombre
                )}

            </div>


            <div class="curso">

                Curso:
                ${escapeHTML(
                    alumno.curso || ""
                )}

            </div>


            <!-- =========================
                 NOTA PRINCIPAL 3T
            ========================== -->

            <div class="titulo-3t">

                📚 Nota del 3er Trimestre

            </div>


            <div class="nota">

                ${
                    nota3 === null
                    ? "—"
                    : nota3
                }

            </div>


            <!-- =========================
                 BOTÓN DETALLES
            ========================== -->

            <button
                class="boton-detalles"
                onclick="mostrarDetalles()"
            >

                📋 Ver detalles del 3er trimestre

            </button>


            <div
                id="detalle3T"
                style="display:none"
            ></div>


            <!-- =========================
                 TRIMESTRES
            ========================== -->

            <div class="trimestres">


                <div class="trimestre-card">

                    <div class="titulo">

                        1er Trimestre

                    </div>

                    <div class="numero t1">

                        ${
                            nota1 === null
                            ? "—"
                            : nota1
                        }

                    </div>

                </div>


                <div class="trimestre-card">

                    <div class="titulo">

                        2do Trimestre

                    </div>

                    <div class="numero t2">

                        ${
                            nota2 === null
                            ? "—"
                            : nota2
                        }

                    </div>

                </div>


                <div class="trimestre-card">

                    <div class="titulo">

                        3er Trimestre

                    </div>

                    <div class="numero t3">

                        ${
                            nota3 === null
                            ? "—"
                            : nota3
                        }

                    </div>

                </div>


            </div>


            <!-- =========================
                 NOTA FINAL
            ========================== -->

            <div class="final-box">


                <div class="final-titulo">

                    🏆 NOTA FINAL

                </div>


                <div class="nota-final ${claseFinal}">

                    ${
                        final === null
                        ? "—"
                        : final
                    }

                </div>


                ${
                    final !== null

                    ? `

                        <div class="estado ${claseFinal}">

                            ${
                                final <= 50
                                ? "❌ REPROBADO"
                                : "✅ APROBADO"
                            }

                        </div>

                    `

                    : ""

                }


            </div>


        </div>

    `;

}


// =================================================
// DETALLES 3T
// =================================================

async function mostrarDetalles() {

    const contenedor =
        document.getElementById(
            "detalle3T"
        );


    if (
        contenedor.style.display ===
        "block"
    ) {

        contenedor.style.display =
            "none";

        return;

    }


    contenedor.style.display =
        "block";


    contenedor.innerHTML =
        '<div class="cargando">⏳ Cargando detalles...</div>';


    try {


        // ======================================
        // ACTIVIDADES
        // ======================================

        const respuesta =
            await fetch(

                `${SUPABASE_URL}/rest/v1/actividades?` +

                `curso=eq.${encodeURIComponent(alumnoActual.curso)}` +

                `&trimestre=eq.3` +

                `&select=id,categoria,nombre,orden,puntaje_maximo` +

                `&order=orden`,

                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        if (!respuesta.ok) {

            throw new Error(
                "Error actividades"
            );

        }


        const actividades =
            await respuesta.json();


        if (
            actividades.length === 0
        ) {

            contenedor.innerHTML = `

                <div class="detalle">

                    <div class="detalle-titulo">

                        📊 Detalles del 3er trimestre

                    </div>

                    <p>

                        Todavía no hay actividades registradas.

                    </p>

                </div>

            `;

            return;

        }


        // ======================================
        // CALIFICACIONES
        // ======================================

        const ids =
            actividades.map(
                a => a.id
            );


        const respuestaNotas =
            await fetch(

                `${SUPABASE_URL}/rest/v1/calificaciones?` +

                `estudiante_id=eq.${alumnoActual.id}` +

                `&actividad_id=in.(${ids.join(",")})` +

                `&select=actividad_id,nota`,

                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        const calificaciones =
            await respuestaNotas.json();


        const mapa = {};


        calificaciones.forEach(
            c => {

                mapa[c.actividad_id] =
                    c.nota;

            }
        );


        // ======================================
        // CATEGORÍAS
        // ======================================

        const categorias = [

            {
                codigo: "SER",

                titulo: "🤝 SER",

                descripcion:
                    "Valores, responsabilidad y actitud",

                clase: "ser"
            },

            {
                codigo: "SABER",

                titulo: "🧠 SABER",

                descripcion:
                    "Conocimientos y evaluaciones",

                clase: "saber"
            },

            {
                codigo: "HACER",

                titulo: "🛠️ HACER",

                descripcion:
                    "Aplicación práctica de lo aprendido",

                clase: "hacer"
            },

            {
                codigo: "AUTOEVALUACION",

                titulo: "🎯 AUTOEVALUACIÓN",

                descripcion:
                    "Valoración del propio aprendizaje",

                clase: "auto"
            }

        ];


        let html = `

            <div class="detalle">

                <div class="detalle-titulo">

                    📊 ¿Cómo obtuviste tu nota del 3er trimestre?

                </div>

                <p style="text-align:center;color:#666;font-size:14px;">

                    Aquí puedes revisar tus actividades y
                    saber cómo se construyó tu calificación.

                </p>

        `;


        categorias.forEach(
            categoria => {


                const lista =
                    actividades.filter(
                        a =>
                        a.categoria ===
                        categoria.codigo
                    );


                if (
                    lista.length === 0
                ) {

                    return;

                }


                const limite =
                    categoria.codigo === "SER"
                    ? 10
                    : categoria.codigo === "SABER"
                    ? 45
                    : categoria.codigo === "HACER"
                    ? 40
                    : 5;


                let suma = 0;

                let cantidad = 0;


                lista.forEach(
                    actividad => {

                        const nota =
                            mapa[
                                actividad.id
                            ];


                        if (
                            nota !== null &&
                            nota !== undefined &&
                            nota !== ""
                        ) {

                            suma +=
                                Number(nota);

                            cantidad++;

                        }

                    }
                );


                let promedio = 0;


                if (
                    cantidad > 0
                ) {

                    promedio =
                        suma / cantidad;

                }


                const puntos =
                    (promedio / 100) *
                    limite;


                html += `

                    <div class="categoria">

                        <div class="categoria-titulo ${categoria.clase}">

                            ${categoria.titulo}

                        </div>

                `;


                lista.forEach(
                    actividad => {


                        const nota =
                            mapa[
                                actividad.id
                            ];


                        const valor =

                            nota === null ||
                            nota === undefined

                            ? "—"

                            : nota;


                        html += `

                            <div class="actividad-fila">

                                <div class="actividad-nombre">

                                    ${escapeHTML(
                                        actividad.nombre
                                    )}

                                </div>

                                <div class="actividad-nota">

                                    ${valor}

                                    / ${actividad.puntaje_maximo}

                                </div>

                            </div>

                        `;

                    }
                );


                html += `

                        <div class="resumen-categoria">

                            <span>

                                📌 Promedio

                            </span>

                            <span>

                                ${puntos.toFixed(2)} pts

                            </span>

                        </div>

                    </div>

                `;

            }
        );


        // ======================================
        // NOTA 3T
        // ======================================

        const nota3 =
            convertirNota(
                alumnoActual.nota_3t
            );


        html += `

                <div class="resultado-3t">

                    <div class="resultado-3t-titulo">

                        ⭐ Tu nota del 3er trimestre

                    </div>

                    <div class="resultado-3t-numero">

                        ${
                            nota3 === null
                            ? "—"
                            : nota3
                        }

                    </div>

                    <div style="color:#666;font-size:13px;">

                        SER + SABER + HACER
                        + AUTOEVALUACIÓN

                    </div>

                </div>


            </div>

        `;


        contenedor.innerHTML =
            html;

    }

    catch(error) {

        console.error(error);


        contenedor.innerHTML = `

            <div class="detalle">

                <p class="error">

                    No se pudo cargar el detalle
                    del tercer trimestre.

                </p>

            </div>

        `;

    }

}


// =================================================
// CONVERTIR NOTA
// =================================================

function convertirNota(nota) {

    if (
        nota === null ||
        nota === undefined ||
        nota === ""
    ) {

        return null;

    }


    const numero =
        Number(nota);


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


// =================================================
// ESCAPAR HTML
// =================================================

function escapeHTML(texto) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
