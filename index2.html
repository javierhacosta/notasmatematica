<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de Nota</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =================================================
   GENERAL
================================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #222;
}


/* =================================================
   CONTENEDOR
================================================= */

.contenedor {
    width: 92%;
    max-width: 520px;
    margin: 35px auto;
    background: white;
    padding: 28px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
}


/* =================================================
   ENCABEZADO
================================================= */

.institucion {
    text-align: center;
    color: #1557a6;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 8px;
}

h1 {
    text-align: center;
    color: #1557a6;
    margin: 5px 0;
}

.profesor {
    text-align: center;
    color: #555;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 25px;
}

.subtitulo {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}


/* =================================================
   FORMULARIO
================================================= */

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #1557a6;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #0d4282;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#resultado {
    margin-top: 30px;
}


/* =================================================
   RESULTADO
================================================= */

.nota-box {
    background: #f1f6ff;
    padding: 24px;
    border-radius: 18px;
    text-align: center;
}

.nombre {
    color: #1557a6;
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 5px;
}

.curso {
    color: #666;
    margin-bottom: 20px;
}


/* =================================================
   AVISO PROVISIONAL
================================================= */

.aviso-provisional {
    background: #fff8e1;
    border: 1px solid #ffca28;
    color: #795548;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 13px;
    line-height: 1.5;
}

.aviso-provisional strong {
    display: block;
    color: #e65100;
    font-size: 15px;
    margin-bottom: 4px;
}


/* =================================================
   NOTA 3ER TRIMESTRE
================================================= */

.titulo-3t {
    color: #555;
    font-size: 18px;
    font-weight: bold;
}

.nota {
    font-size: 90px;
    font-weight: bold;
    line-height: 1;
    margin: 15px 0;
    color: #1557a6;
}


/* =================================================
   BOTÓN DETALLES
================================================= */

.boton-detalles {
    margin-top: 5px;
    background: #455a64;
    font-size: 16px;
}

.boton-detalles:hover {
    background: #263238;
}


/* =================================================
   TRIMESTRES
================================================= */

.trimestres {
    margin-top: 25px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.trimestre-card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px 5px;
    text-align: center;
}

.trimestre-card .titulo {
    color: #666;
    font-size: 13px;
    font-weight: bold;
}

.trimestre-card .numero {
    font-size: 30px;
    font-weight: bold;
    margin-top: 5px;
}

.t1 {
    color: #7b1fa2;
}

.t2 {
    color: #1565c0;
}

.t3 {
    color: #ef6c00;
}


/* =================================================
   DETALLES
================================================= */

.detalle {
    margin-top: 20px;
    background: white;
    border-radius: 15px;
    border: 1px solid #ddd;
    padding: 18px;
    text-align: left;
}

.detalle-titulo {
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    color: #1557a6;
    margin-bottom: 15px;
}


/* =================================================
   CATEGORÍAS
================================================= */

.categoria {
    margin-top: 15px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #ddd;
}

.categoria-titulo {
    color: white;
    padding: 11px 12px;
    font-weight: bold;
    font-size: 16px;
}

.ser {
    background: #8e24aa;
}

.saber {
    background: #1565c0;
}

.hacer {
    background: #ef6c00;
}

.auto {
    background: #00897b;
}


/* =================================================
   ACTIVIDADES
================================================= */

.actividad-fila {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px;
    border-top: 1px solid #eee;
    background: #fff;
    gap: 10px;
}

.actividad-nombre {
    font-size: 14px;
    flex: 1;
}

.actividad-nota {
    font-weight: bold;
    white-space: nowrap;
}


/* =================================================
   PROMEDIO
================================================= */

.resumen-categoria {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    background: #f7f7f7;
    border-top: 1px solid #ddd;
    font-size: 15px;
    font-weight: bold;
}

.promedio-valor {
    color: #1557a6;
}


/* =================================================
   RESULTADO 3T
================================================= */

.resultado-3t {
    margin-top: 20px;
    padding: 18px;
    border-radius: 14px;
    background: #eef4fb;
    text-align: center;
}

.resultado-3t-titulo {
    color: #555;
    font-weight: bold;
    font-size: 16px;
}

.resultado-3t-numero {
    font-size: 45px;
    font-weight: bold;
    color: #1557a6;
    margin-top: 5px;
}


/* =================================================
   NOTA FINAL
================================================= */

.final-box {
    margin-top: 25px;
    padding: 20px;
    background: white;
    border: 2px solid #ddd;
    border-radius: 15px;
    text-align: center;
}

.final-titulo {
    font-size: 18px;
    color: #555;
    font-weight: bold;
}

.nota-final {
    font-size: 58px;
    font-weight: bold;
    margin: 8px 0;
}

.aprobado {
    color: #1565c0;
}

.reprobado {
    color: #c62828;
}

.estado {
    font-size: 21px;
    font-weight: bold;
}


/* =================================================
   MENSAJES
================================================= */

.error {
    color: #c62828;
    text-align: center;
    font-weight: bold;
}

.cargando {
    text-align: center;
    color: #1557a6;
}


/* =================================================
   AVISO DE ACTUALIZACIÓN
================================================= */

.aviso-actualizacion {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #2e7d32;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: bold;
    z-index: 99999;
    box-shadow: 0 4px 15px rgba(0,0,0,.25);
    animation: aparecerAviso .3s ease;
}

@keyframes aparecerAviso {

    from {
        opacity: 0;
        transform: translate(-50%, -15px);
    }

    to {
        opacity: 1;
        transform: translate(-50%, 0);
    }

}


/* =================================================
   ESTADO DE CONEXIÓN
================================================= */

.estado-conexion {
    margin-top: 15px;
    text-align: center;
    font-size: 12px;
    color: #777;
}

.estado-conexion.conectado {
    color: #2e7d32;
}

.estado-conexion.desconectado {
    color: #c62828;
}


/* =================================================
   CELULAR
================================================= */

@media(max-width:500px) {

    .contenedor {
        width: 94%;
        padding: 20px;
    }

    .nota {
        font-size: 75px;
    }

    .trimestres {
        gap: 6px;
    }

    .trimestre-card {
        padding: 10px 3px;
    }

}

</style>

</head>


<body>


<div class="contenedor">


    <div class="institucion">
        U.E. GERMAN BUSCH I
    </div>


    <h1>
        Matemática 2026
    </h1>


    <div class="profesor">
        Prof. Javier Delmo Hacosta Moralez
    </div>


    <div class="subtitulo">
        Consulta tu calificación
    </div>


    <label for="ci">
        CI
    </label>


    <input
        type="text"
        id="ci"
        placeholder="Ejemplo: 1234567"
    >


    <label for="fecha_nacimiento">
        Fecha de nacimiento
    </label>


    <input
        type="date"
        id="fecha_nacimiento"
    >


    <button
        id="botonConsultar"
        onclick="consultarNota()"
    >
        Consultar mi nota
    </button>


    <div id="resultado"></div>


    <div
        id="estadoConexion"
        class="estado-conexion"
    ></div>


</div>


<script>

/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =
    "https://tecphbbkkmlgahjddcep.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


/* =================================================
   CLIENTE SUPABASE
================================================= */

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =================================================
   VARIABLES
================================================= */

let alumnoActual = null;

let canalRealtime = null;

let detalleAbierto = false;

let actualizando = false;


/* =================================================
   CONSULTAR NOTA
================================================= */

async function consultarNota() {

    const ci =
        document
        .getElementById("ci")
        .value
        .trim();


    const fecha =
        document
        .getElementById("fecha_nacimiento")
        .value;


    const resultado =
        document
        .getElementById("resultado");


    const boton =
        document
        .getElementById("botonConsultar");


    if (!ci || !fecha) {

        resultado.innerHTML =
            '<p class="error">' +
            'Ingresa tu CI y fecha de nacimiento.' +
            '</p>';

        return;
    }


    boton.disabled = true;

    boton.textContent = "Consultando...";


    resultado.innerHTML =
        '<p class="cargando">Buscando...</p>';


    try {

        const respuesta = await fetch(

            `${SUPABASE_URL}/rest/v1/matematica?` +

            `ci=eq.${encodeURIComponent(ci)}` +

            `&fecha_nacimiento=eq.${encodeURIComponent(fecha)}` +

            `&select=id,nombre,curso,nota_1t,nota_2t,nota_3t,final`,

            {

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`

                }

            }

        );


        if (!respuesta.ok) {

            throw new Error(
                "Error de conexión"
            );

        }


        const datos =
            await respuesta.json();


        if (datos.length === 0) {

            resultado.innerHTML =
                '<p class="error">' +
                'CI o fecha de nacimiento incorrectos.' +
                '</p>';

            actualizarEstadoConexion(
                "desconectado"
            );

            return;
        }


        alumnoActual =
            datos[0];


        detalleAbierto = false;


        mostrarResultado(
            alumnoActual
        );


        /* =========================================
           INICIAR ACTUALIZACIÓN AUTOMÁTICA
        ========================================= */

        iniciarActualizacionTiempoReal();

    }


    catch(error) {

        console.error(error);


        resultado.innerHTML =
            '<p class="error">' +
            'No se pudo conectar con el servidor.' +
            '</p>';

    }


    finally {

        boton.disabled = false;

        boton.textContent =
            "Consultar mi nota";

    }

}


/* =================================================
   ACTUALIZACIÓN EN TIEMPO REAL
================================================= */

function iniciarActualizacionTiempoReal() {

    /* ---------------------------------------------
       Eliminar conexión anterior
    --------------------------------------------- */

    if (canalRealtime) {

        supabaseClient.removeChannel(
            canalRealtime
        );

        canalRealtime = null;

    }


    if (!alumnoActual) {
        return;
    }


    /* ---------------------------------------------
       Crear canal exclusivo para este estudiante
    --------------------------------------------- */

    canalRealtime =

        supabaseClient

        .channel(
            "notas-alumno-" +
            alumnoActual.id
        )


        /* =========================================
           CAMBIOS EN MATEMATICA
        ========================================= */

        .on(

            "postgres_changes",

            {
                event: "*",
                schema: "public",
                table: "matematica",
                filter:
                    `id=eq.${alumnoActual.id}`
            },

            async () => {

                console.log(
                    "Cambio detectado en matematica"
                );


                await actualizarAlumno(
                    true
                );

            }

        )


        /* =========================================
           CAMBIOS EN CALIFICACIONES
        ========================================= */

        .on(

            "postgres_changes",

            {
                event: "*",
                schema: "public",
                table: "calificaciones",
                filter:
                    `estudiante_id=eq.${alumnoActual.id}`
            },

            async () => {

                console.log(
                    "Cambio detectado en calificaciones"
                );


                await actualizarAlumno(
                    false
                );


                if (detalleAbierto) {

                    await cargarDetalles3T();

                }


                mostrarAvisoActualizacion();

            }

        )


        /* =========================================
           CAMBIOS EN ACTIVIDADES
        ========================================= */

        .on(

            "postgres_changes",

            {
                event: "*",
                schema: "public",
                table: "actividades"
            },

            async (payload) => {

                console.log(
                    "Cambio detectado en actividades",
                    payload
                );


                /*
                 * Solo nos interesa actualizar
                 * si el estudiante está viendo
                 * los detalles.
                 */

                if (!detalleAbierto) {
                    return;
                }


                const actividad =
                    payload.new ||
                    payload.old ||
                    {};


                /*
                 * Si tiene curso y trimestre,
                 * verificamos que corresponda.
                 */

                if (

                    actividad.curso &&
                    alumnoActual.curso &&

                    String(
                        actividad.curso
                    ) !==
                    String(
                        alumnoActual.curso
                    )

                ) {

                    return;

                }


                if (

                    actividad.trimestre &&
                    Number(
                        actividad.trimestre
                    ) !== 3

                ) {

                    return;

                }


                await cargarDetalles3T();

                mostrarAvisoActualizacion();

            }

        )


        /* =========================================
           SUSCRIBIR
        ========================================= */

        .subscribe(

            (status) => {

                console.log(
                    "Estado Realtime:",
                    status
                );


                if (
                    status ===
                    "SUBSCRIBED"
                ) {

                    actualizarEstadoConexion(
                        "conectado"
                    );

                }


                else if (

                    status ===
                    "CHANNEL_ERROR"

                ) {

                    actualizarEstadoConexion(
                        "desconectado"
                    );

                }


                else if (

                    status ===
                    "TIMED_OUT"

                ) {

                    actualizarEstadoConexion(
                        "desconectado"
                    );

                }

            }

        );

}


/* =================================================
   ACTUALIZAR ALUMNO
================================================= */

async function actualizarAlumno(
    mostrarAviso = true
) {

    if (
        !alumnoActual ||
        actualizando
    ) {

        return;

    }


    actualizando = true;


    try {

        const respuesta = await fetch(

            `${SUPABASE_URL}/rest/v1/matematica?` +

            `id=eq.${alumnoActual.id}` +

            `&select=id,nombre,curso,nota_1t,nota_2t,nota_3t,final`,

            {

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`

                }

            }

        );


        if (!respuesta.ok) {

            throw new Error(
                "No se pudo actualizar"
            );

        }


        const datos =
            await respuesta.json();


        if (
            datos.length === 0
        ) {

            return;

        }


        alumnoActual =
            datos[0];


        /*
         * Guardar si los detalles
         * estaban abiertos.
         */

        const mantenerDetalles =
            detalleAbierto;


        mostrarResultado(
            alumnoActual
        );


        /*
         * Volver a abrir automáticamente
         * los detalles si estaban abiertos.
         */

        if (
            mantenerDetalles
        ) {

            detalleAbierto = true;

            await cargarDetalles3T();

        }


        if (
            mostrarAviso
        ) {

            mostrarAvisoActualizacion();

        }

    }


    catch(error) {

        console.error(
            "Error actualizando alumno:",
            error
        );

    }


    finally {

        actualizando = false;

    }

}


/* =================================================
   MOSTRAR RESULTADO
================================================= */

function mostrarResultado(alumno) {

    const nota1 =
        redondearNota(
            alumno.nota_1t
        );


    const nota2 =
        redondearNota(
            alumno.nota_2t
        );


    const nota3 =
        redondearNota(
            alumno.nota_3t
        );


    const final =
        redondearNota(
            alumno.final
        );


    let claseFinal = "";


    if (
        final !== null
    ) {

        claseFinal =
            final <= 50
            ? "reprobado"
            : "aprobado";

    }


    document
        .getElementById("resultado")
        .innerHTML = `

        <div class="nota-box">


            <div class="nombre">

                ${escapeHTML(
                    alumno.nombre
                )}

            </div>


            <div class="curso">

                Curso:
                ${escapeHTML(
                    alumno.curso || ""
                )}

            </div>


            <div class="aviso-provisional">

                <strong>
                    📌 RESULTADOS PROVISIONALES
                </strong>

                Las calificaciones pueden modificarse
                con las próximas actividades y evaluaciones.

            </div>


            <div class="titulo-3t">

                Nota del 3er Trimestre

            </div>


            <div class="nota">

                ${
                    nota3 === null
                    ? "—"
                    : nota3
                }

            </div>


            <button
                class="boton-detalles"
                onclick="mostrarDetalles()"
            >

                📚 Ver detalles del 3er trimestre

            </button>


            <div
                id="detalle3T"
                style="display:none"
            ></div>


            <div class="trimestres">


                <div class="trimestre-card">

                    <div class="titulo">
                        1er Trimestre
                    </div>

                    <div class="numero t1">

                        ${
                            nota1 === null
                            ? "—"
                            : nota1
                        }

                    </div>

                </div>


                <div class="trimestre-card">

                    <div class="titulo">
                        2do Trimestre
                    </div>

                    <div class="numero t2">

                        ${
                            nota2 === null
                            ? "—"
                            : nota2
                        }

                    </div>

                </div>


                <div class="trimestre-card">

                    <div class="titulo">
                        3er Trimestre
                    </div>

                    <div class="numero t3">

                        ${
                            nota3 === null
                            ? "—"
                            : nota3
                        }

                    </div>

                </div>


            </div>


            <div class="final-box">


                <div class="final-titulo">

                    NOTA FINAL PROVISIONAL

                </div>


                <div class="nota-final ${claseFinal}">

                    ${
                        final === null
                        ? "—"
                        : final
                    }

                </div>


                ${
                    final !== null

                    ? `

                        <div class="estado ${claseFinal}">

                            ${
                                final <= 50
                                ? "REPROBADO"
                                : "APROBADO"
                            }

                        </div>

                    `

                    : ""

                }


            </div>


        </div>

    `;

}


/* =================================================
   MOSTRAR / OCULTAR DETALLES
================================================= */

async function mostrarDetalles() {

    const contenedor =
        document.getElementById(
            "detalle3T"
        );


    if (!contenedor) {
        return;
    }


    /*
     * Si está abierto, lo cerramos.
     */

    if (
        detalleAbierto
    ) {

        detalleAbierto = false;

        contenedor.style.display =
            "none";

        return;

    }


    /*
     * Si está cerrado, lo abrimos.
     */

    detalleAbierto = true;

    contenedor.style.display =
        "block";


    await cargarDetalles3T();

}


/* =================================================
   CARGAR DETALLES DEL 3T
================================================= */

async function cargarDetalles3T() {

    const contenedor =
        document.getElementById(
            "detalle3T"
        );


    if (
        !contenedor ||
        !alumnoActual
    ) {

        return;

    }


    contenedor.style.display =
        "block";


    contenedor.innerHTML =
        '<div class="cargando">' +
        'Cargando detalles...' +
        '</div>';


    try {


        /* =========================================
           ACTIVIDADES
        ========================================= */

        const respuesta =
            await fetch(

                `${SUPABASE_URL}/rest/v1/actividades?` +

                `curso=eq.${encodeURIComponent(
                    alumnoActual.curso
                )}` +

                `&trimestre=eq.3` +

                `&select=id,categoria,nombre,orden,puntaje_maximo` +

                `&order=orden`,

                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        if (!respuesta.ok) {

            throw new Error(
                "Error actividades"
            );

        }


        const actividades =
            await respuesta.json();


        if (
            actividades.length === 0
        ) {

            contenedor.innerHTML = `

                <div class="detalle">

                    <div class="detalle-titulo">

                        📊 Detalles del 3er trimestre

                    </div>

                    <p>

                        Todavía no hay actividades registradas.

                    </p>

                </div>

            `;

            return;

        }


        /* =========================================
           IDs DE ACTIVIDADES
        ========================================= */

        const ids =
            actividades.map(
                a => a.id
            );


        /* =========================================
           CALIFICACIONES
        ========================================= */

        const respuestaNotas =
            await fetch(

                `${SUPABASE_URL}/rest/v1/calificaciones?` +

                `estudiante_id=eq.${alumnoActual.id}` +

                `&actividad_id=in.(${ids.join(",")})` +

                `&select=actividad_id,nota`,

                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        if (!respuestaNotas.ok) {

            throw new Error(
                "Error calificaciones"
            );

        }


        const calificaciones =
            await respuestaNotas.json();


        const mapa = {};


        calificaciones.forEach(
            c => {

                mapa[
                    c.actividad_id
                ] = c.nota;

            }
        );


        /* =========================================
           CATEGORÍAS
        ========================================= */

        const categorias = [

            {
                codigo: "SER",
                titulo: "🌟 SER",
                clase: "ser"
            },

            {
                codigo: "SABER",
                titulo: "🧠 SABER",
                clase: "saber"
            },

            {
                codigo: "HACER",
                titulo: "🔧 HACER",
                clase: "hacer"
            },

            {
                codigo: "AUTOEVALUACION",
                titulo: "🎯 AUTOEVALUACIÓN",
                clase: "auto"
            }

        ];


        let html = `

            <div class="detalle">

                <div class="detalle-titulo">

                    📊 ¿Cómo obtuviste tu nota
                    del 3er trimestre?

                </div>


                <p style="
                    text-align:center;
                    color:#666;
                    font-size:14px;
                    line-height:1.5;
                ">

                    Aquí puedes revisar las
                    calificaciones registradas.

                </p>

        `;


        categorias.forEach(
            categoria => {


                const lista =
                    actividades.filter(
                        a =>
                        a.categoria ===
                        categoria.codigo
                    );


                if (
                    lista.length === 0
                ) {

                    return;

                }


                const limite =

                    categoria.codigo === "SER"

                    ? 10

                    : categoria.codigo === "SABER"

                    ? 45

                    : categoria.codigo === "HACER"

                    ? 40

                    : 5;


                /* =================================
                   CALCULAR PROMEDIO
                ================================= */


                let suma = 0;

                let cantidad = 0;


                lista.forEach(
                    actividad => {

                        const nota =
                            mapa[
                                actividad.id
                            ];


                        if (

                            nota !== null &&

                            nota !== undefined &&

                            nota !== ""

                        ) {

                            const numero =
                                Number(nota);


                            if (
                                !isNaN(numero)
                            ) {

                                suma +=
                                    numero;

                                cantidad++;

                            }

                        }

                    }
                );


                let promedio = 0;


                if (
                    cantidad > 0
                ) {

                    /*
                     * Ejemplo:
                     *
                     * 10 + 10 = 20
                     *
                     * 20 / 2 = 10
                     */

                    promedio =
                        suma / cantidad;

                }


                /*
                 * REDONDEO SOLO PARA MOSTRAR
                 */

                const promedioMostrado =

                    cantidad > 0

                    ? Math.round(
                        promedio
                    )

                    : null;


                /*
                 * PUNTOS DE LA CATEGORÍA
                 */

                const puntos =

                    cantidad > 0

                    ? (
                        promedio / 100
                    ) * limite

                    : 0;


                const puntosMostrados =

                    cantidad > 0

                    ? Math.round(
                        puntos
                    )

                    : null;


                html += `

                    <div class="categoria">

                        <div class="
                            categoria-titulo
                            ${categoria.clase}
                        ">

                            ${categoria.titulo}

                        </div>

                `;


                /* =================================
                   MOSTRAR ACTIVIDADES
                ================================= */

                lista.forEach(
                    actividad => {

                        const nota =
                            mapa[
                                actividad.id
                            ];


                        let valor = "—";


                        if (

                            nota !== null &&

                            nota !== undefined &&

                            nota !== ""

                        ) {

                            const numero =
                                Number(nota);


                            if (
                                !isNaN(numero)
                            ) {

                                valor =
                                    Math.round(
                                        numero
                                    );

                            }

                        }


                        html += `

                            <div class="actividad-fila">

                                <div class="actividad-nombre">

                                    ${escapeHTML(
                                        actividad.nombre
                                    )}

                                </div>


                                <div class="actividad-nota">

                                    ${valor}

                                    / ${actividad.puntaje_maximo}

                                </div>

                            </div>

                        `;

                    }
                );


                html += `

                        <div class="resumen-categoria">

                            <span>
                                Promedio
                            </span>


                            <span class="promedio-valor">

                                ${
                                    promedioMostrado === null

                                    ? "—"

                                    : promedioMostrado
                                }

                                pts

                            </span>

                        </div>


                    </div>

                `;

            }
        );


        /* =========================================
           NOTA 3T
        ========================================= */

        const nota3 =
            redondearNota(
                alumnoActual.nota_3t
            );


        html += `

                <div class="resultado-3t">

                    <div class="resultado-3t-titulo">

                        ⭐ Nota del 3er trimestre
                        provisional

                    </div>


                    <div class="resultado-3t-numero">

                        ${
                            nota3 === null
                            ? "—"
                            : nota3
                        }

                    </div>


                    <div style="
                        color:#666;
                        font-size:13px;
                        line-height:1.5;
                    ">

                        Resultado provisional.

                        <br>

                        Las calificaciones pueden modificarse
                        con las próximas actividades y evaluaciones.

                    </div>

                </div>


            </div>

        `;


        contenedor.innerHTML =
            html;

    }


    catch(error) {

        console.error(error);


        contenedor.innerHTML = `

            <div class="detalle">

                <p class="error">

                    No se pudo cargar el detalle
                    del tercer trimestre.

                </p>

            </div>

        `;

    }

}


/* =================================================
   AVISO DE ACTUALIZACIÓN
================================================= */

function mostrarAvisoActualizacion() {

    /*
     * Evitar varios avisos simultáneos
     */

    const anterior =
        document.querySelector(
            ".aviso-actualizacion"
        );


    if (anterior) {
        anterior.remove();
    }


    const aviso =
        document.createElement(
            "div"
        );


    aviso.className =
        "aviso-actualizacion";


    aviso.textContent =
        "✓ Calificación actualizada";


    document.body.appendChild(
        aviso
    );


    setTimeout(
        () => {

            if (
                aviso.parentNode
            ) {

                aviso.remove();

            }

        },
        3000
    );

}


/* =================================================
   ESTADO DE CONEXIÓN
================================================= */

function actualizarEstadoConexion(
    estado
) {

    const elemento =
        document.getElementById(
            "estadoConexion"
        );


    if (!elemento) {
        return;
    }


    if (
        estado ===
        "conectado"
    ) {

        elemento.className =
            "estado-conexion conectado";

        elemento.textContent =
            "● Conectado · Actualización automática activa";

    }


    else {

        elemento.className =
            "estado-conexion desconectado";

        elemento.textContent =
            "● Actualización automática no disponible";

    }

}


/* =================================================
   CONVERTIR NOTA
================================================= */

function convertirNota(nota) {

    if (

        nota === null ||

        nota === undefined ||

        nota === ""

    ) {

        return null;

    }


    const numero =
        Number(nota);


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =================================================
   REDONDEAR NOTA
================================================= */

function redondearNota(nota) {

    const numero =
        convertirNota(nota);


    if (
        numero === null
    ) {

        return null;

    }


    return Math.round(
        numero
    );

}


/* =================================================
   ESCAPAR HTML
================================================= */

function escapeHTML(texto) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =================================================
   LIMPIAR CONEXIÓN AL SALIR
================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (canalRealtime) {

            supabaseClient.removeChannel(
                canalRealtime
            );

        }

    }
);
