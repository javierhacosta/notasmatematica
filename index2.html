<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Consulta de Calificaciones</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #f2f5f9;

    color: #222;

}


.contenedor {

    width: 94%;

    max-width: 700px;

    margin: 30px auto;

}


.panel {

    background: white;

    padding: 25px;

    border-radius: 15px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.12);

}


/* =====================================================
   ENCABEZADO
===================================================== */

.institucion {

    text-align: center;

    color: #1557a6;

    font-size: 22px;

    font-weight: bold;

    margin-bottom: 8px;

}


h1 {

    text-align: center;

    color: #1557a6;

    margin: 5px 0;

}


.profesor {

    text-align: center;

    color: #555;

    font-size: 16px;

    font-weight: bold;

    margin-bottom: 8px;

}


.subtitulo {

    text-align: center;

    color: #666;

    margin-bottom: 25px;

}


/* =====================================================
   FORMULARIO
===================================================== */

label {

    display: block;

    margin-top: 15px;

    margin-bottom: 6px;

    font-weight: bold;

}


input {

    width: 100%;

    padding: 12px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 16px;

}


button {

    width: 100%;

    margin-top: 20px;

    padding: 13px;

    border: none;

    border-radius: 8px;

    background: #1557a6;

    color: white;

    font-size: 17px;

    cursor: pointer;

}


button:hover {

    background: #0d4282;

}


/* =====================================================
   RESULTADO
===================================================== */

#resultado {

    margin-top: 30px;

}


.nombre {

    text-align: center;

    color: #1557a6;

    font-size: 23px;

    font-weight: bold;

    margin-bottom: 5px;

}


.curso {

    text-align: center;

    color: #666;

    font-size: 17px;

    margin-bottom: 25px;

}


/* =====================================================
   TRIMESTRES
===================================================== */

.trimestres {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;

    margin-bottom: 15px;

}


.trimestre-box {

    background: #f1f6ff;

    border-radius: 12px;

    padding: 15px 8px;

    text-align: center;

    border: 1px solid #dbe7f7;

}


.trimestre-titulo {

    font-size: 14px;

    font-weight: bold;

    color: #555;

}


.trimestre-nota {

    font-size: 42px;

    font-weight: bold;

    color: #1557a6;

    margin-top: 8px;

}


/* =====================================================
   NOTA FINAL
===================================================== */

.final-box {

    margin-top: 15px;

    padding: 20px;

    background: #1557a6;

    color: white;

    border-radius: 14px;

    text-align: center;

}


.final-titulo {

    font-size: 18px;

    font-weight: bold;

}


.final-nota {

    font-size: 60px;

    font-weight: bold;

    line-height: 1;

    margin-top: 10px;

}


/* =====================================================
   DETALLE
===================================================== */

.boton-detalle {

    background: #16803c;

    margin-top: 20px;

}


.boton-detalle:hover {

    background: #126b32;

}


.detalle {

    margin-top: 20px;

}


.categoria {

    margin-top: 20px;

    border-radius: 10px;

    overflow: hidden;

    border: 1px solid #ddd;

}


.titulo-categoria {

    color: white;

    padding: 12px;

    font-weight: bold;

}


.ser {

    background: #7b1fa2;

}


.saber {

    background: #1565c0;

}


.hacer {

    background: #ef6c00;

}


.auto {

    background: #00838f;

}


.tabla-contenedor {

    overflow-x: auto;

}


table {

    width: 100%;

    border-collapse: collapse;

}


th,
td {

    border: 1px solid #ddd;

    padding: 9px;

}


th {

    background: #f0f0f0;

}


td:last-child,
th:last-child {

    text-align: center;

    font-weight: bold;

}


.promedio {

    background: #f5f5f5;

    font-weight: bold;

}


/* =====================================================
   MENSAJES
===================================================== */

.error {

    color: #c62828;

    text-align: center;

    font-weight: bold;

}


.cargando {

    text-align: center;

    color: #1557a6;

    font-weight: bold;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 600px) {

    .contenedor {

        width: 96%;

        margin: 15px auto;

    }


    .panel {

        padding: 18px;

    }


    .institucion {

        font-size: 19px;

    }


    h1 {

        font-size: 23px;

    }


    .profesor {

        font-size: 14px;

    }


    .trimestres {

        grid-template-columns: 1fr;

    }


    .trimestre-nota {

        font-size: 45px;

    }


    .final-nota {

        font-size: 55px;

    }

}

</style>

</head>


<body>


<div class="contenedor">

<div class="panel">


<!-- =====================================================
     ENCABEZADO
===================================================== -->

<div class="institucion">

U.E. GERMAN BUSCH I

</div>


<h1>

Matemática 2026

</h1>


<div class="profesor">

Prof. Javier Delmo Hacosta Moralez

</div>


<div class="subtitulo">

Consulta tus calificaciones

</div>


<!-- =====================================================
     CI
===================================================== -->

<label for="ci">

CI

</label>


<input

    type="text"

    id="ci"

    placeholder="Ejemplo: 1234567"

>


<!-- =====================================================
     FECHA
===================================================== -->

<label for="fecha_nacimiento">

Fecha de nacimiento

</label>


<input

    type="date"

    id="fecha_nacimiento"

>


<!-- =====================================================
     BOTÓN
===================================================== -->

<button

    onclick="consultarNota()"

>

🔎 Consultar mis calificaciones

</button>


<!-- =====================================================
     RESULTADO
===================================================== -->

<div id="resultado"></div>


</div>

</div>


<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =

"https://tecphbbkkmlgahjddcep.supabase.co";


const SUPABASE_KEY =

"sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


// =====================================================
// VARIABLE DEL ESTUDIANTE
// =====================================================

let estudianteActual = null;

let actividadesActuales = [];

let calificacionesActuales = [];


// =====================================================
// CONSULTAR ESTUDIANTE
// =====================================================

async function consultarNota() {


    const ci =

        document
        .getElementById("ci")
        .value
        .trim();


    const fechaNacimiento =

        document
        .getElementById("fecha_nacimiento")
        .value;


    const resultado =

        document
        .getElementById("resultado");


    resultado.innerHTML = "";


    // -------------------------------------------------
    // VALIDAR
    // -------------------------------------------------

    if (
        !ci ||
        !fechaNacimiento
    ) {

        resultado.innerHTML =

            '<p class="error">' +

            'Ingresa tu CI y fecha de nacimiento.' +

            '</p>';

        return;

    }


    resultado.innerHTML =

        '<p class="cargando">' +

        '🔎 Buscando tus calificaciones...' +

        '</p>';


    try {


        // =================================================
        // BUSCAR ESTUDIANTE
        // =================================================

        const urlEstudiante =

            SUPABASE_URL +

            "/rest/v1/matematica" +

            "?ci=eq." +

            encodeURIComponent(ci) +

            "&fecha_nacimiento=eq." +

            encodeURIComponent(fechaNacimiento) +

            "&select=id,ci,nombre,curso,nota_1t,nota_2t,nota_3t,final";


        const respuestaEstudiante =

            await fetch(

                urlEstudiante,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if (
            !respuestaEstudiante.ok
        ) {

            throw new Error(
                "Error al consultar estudiante"
            );

        }


        const estudiantes =

            await respuestaEstudiante.json();


        // -------------------------------------------------
        // NO ENCONTRADO
        // -------------------------------------------------

        if (
            estudiantes.length === 0
        ) {

            resultado.innerHTML =

                '<p class="error">' +

                '❌ CI o fecha de nacimiento incorrectos.' +

                '</p>';

            return;

        }


        estudianteActual =

            estudiantes[0];


        // =================================================
        // MOSTRAR DATOS BÁSICOS
        // =================================================

        resultado.innerHTML = `

            <div class="nombre">

                ${escapeHTML(
                    estudianteActual.nombre
                )}

            </div>


            <div class="curso">

                Curso:
                <strong>
                    ${escapeHTML(
                        estudianteActual.curso
                    )}
                </strong>

            </div>


            <div class="trimestres">


                <div class="trimestre-box">

                    <div class="trimestre-titulo">

                        1.er TRIMESTRE

                    </div>


                    <div class="trimestre-nota">

                        ${mostrarNota(
                            estudianteActual.nota_1t
                        )}

                    </div>

                </div>


                <div class="trimestre-box">

                    <div class="trimestre-titulo">

                        2.º TRIMESTRE

                    </div>


                    <div class="trimestre-nota">

                        ${mostrarNota(
                            estudianteActual.nota_2t
                        )}

                    </div>

                </div>


                <div class="trimestre-box">

                    <div class="trimestre-titulo">

                        3.er TRIMESTRE

                    </div>


                    <div class="trimestre-nota">

                        ${mostrarNota(
                            estudianteActual.nota_3t
                        )}

                    </div>

                </div>


            </div>


            <div class="final-box">

                <div class="final-titulo">

                    NOTA FINAL

                </div>


                <div class="final-nota">

                    ${mostrarNota(
                        estudianteActual.final
                    )}

                </div>

            </div>


            <button

                class="boton-detalle"

                onclick="mostrarDetalle()"

            >

                📋 Ver detalle del 3.er trimestre

            </button>


            <div
                id="detalle"
                class="detalle"
            >

            </div>

        `;


    }

    catch (error) {


        console.error(error);


        resultado.innerHTML =

            '<p class="error">' +

            '❌ No se pudo conectar con el servidor.' +

            '</p>';

    }

}


// =====================================================
// MOSTRAR DETALLE
// =====================================================

async function mostrarDetalle() {


    const detalle =

        document
        .getElementById("detalle");


    if (!detalle) {

        return;

    }


    detalle.innerHTML =

        '<p class="cargando">' +

        'Cargando actividades...' +

        '</p>';


    try {


        // =================================================
        // BUSCAR ACTIVIDADES DEL CURSO
        // =================================================

        const urlActividades =

            SUPABASE_URL +

            "/rest/v1/actividades" +

            "?curso=eq." +

            encodeURIComponent(
                estudianteActual.curso
            ) +

            "&trimestre=eq.3" +

            "&select=id,categoria,nombre,orden,puntaje_maximo" +

            "&order=orden";


        const respuestaActividades =

            await fetch(

                urlActividades,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if (
            !respuestaActividades.ok
        ) {

            throw new Error(
                "Error al consultar actividades"
            );

        }


        actividadesActuales =

            await respuestaActividades.json();


        // =================================================
        // BUSCAR CALIFICACIONES
        // =================================================

        const urlCalificaciones =

            SUPABASE_URL +

            "/rest/v1/calificaciones" +

            "?estudiante_id=eq." +

            encodeURIComponent(
                estudianteActual.id
            ) +

            "&select=actividad_id,nota";


        const respuestaCalificaciones =

            await fetch(

                urlCalificaciones,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if (
            !respuestaCalificaciones.ok
        ) {

            throw new Error(
                "Error al consultar calificaciones"
            );

        }


        calificacionesActuales =

            await respuestaCalificaciones.json();


        // =================================================
        // CREAR MAPA
        // =================================================

        const mapa = {};


        calificacionesActuales.forEach(

            calificacion => {

                mapa[
                    calificacion.actividad_id
                ] =
                    calificacion.nota;

            }

        );


        // =================================================
        // CATEGORÍAS
        // =================================================

        const categorias = [

            {
                codigo: "SER",
                titulo: "SER — 10 puntos",
                clase: "ser"
            },

            {
                codigo: "SABER",
                titulo: "SABER — 45 puntos",
                clase: "saber"
            },

            {
                codigo: "HACER",
                titulo: "HACER — 40 puntos",
                clase: "hacer"
            },

            {
                codigo: "AUTOEVALUACION",
                titulo: "AUTOEVALUACIÓN — 5 puntos",
                clase: "auto"
            }

        ];


        let html = "";


        categorias.forEach(

            categoria => {


                const lista =

                    actividadesActuales.filter(

                        actividad =>

                            actividad.categoria ===
                            categoria.codigo

                    );


                if (
                    lista.length === 0
                ) {

                    return;

                }


                // -------------------------------------------------
                // CALCULAR PROMEDIO
                // -------------------------------------------------

                const notas =

                    lista

                    .map(

                        actividad =>

                            mapa[
                                actividad.id
                            ]

                    )

                    .filter(

                        nota =>

                            nota !== undefined &&
                            nota !== null &&
                            nota !== ""

                    )

                    .map(

                        nota =>
                            Number(nota)

                    );


                let promedio = "";


                if (
                    notas.length > 0
                ) {

                    const suma =

                        notas.reduce(

                            (
                                total,
                                valor
                            ) =>

                                total +
                                valor,

                            0

                        );


                    promedio =

                        (suma /
                        notas.length)
                        .toFixed(2);

                }


                // -------------------------------------------------
                // TABLA
                // -------------------------------------------------

                html += `

                    <div class="categoria">


                        <div
                            class="titulo-categoria
                            ${categoria.clase}"
                        >

                            ${categoria.titulo}

                        </div>


                        <div class="tabla-contenedor">


                            <table>

                                <thead>

                                    <tr>

                                        <th>
                                            Actividad
                                        </th>

                                        <th>
                                            Máximo
                                        </th>

                                        <th>
                                            Nota
                                        </th>

                                    </tr>

                                </thead>


                                <tbody>
                `;


                lista.forEach(

                    actividad => {


                        const nota =

                            mapa[
                                actividad.id
                            ];


                        html += `

                            <tr>

                                <td>

                                    ${escapeHTML(
                                        actividad.nombre
                                    )}

                                </td>


                                <td>

                                    ${actividad.puntaje_maximo}

                                </td>


                                <td>

                                    ${
                                        nota === undefined ||
                                        nota === null
                                        ? ""
                                        : nota
                                    }

                                </td>

                            </tr>

                        `;

                    }

                );


                html += `

                                <tr class="promedio">

                                    <td colspan="2">

                                        PROMEDIO

                                    </td>

                                    <td>

                                        ${promedio}

                                    </td>

                                </tr>


                                </tbody>

                            </table>


                        </div>


                    </div>

                `;

            }

        );


        if (!html) {

            html = `

                <div class="error">

                    No hay actividades registradas
                    para el tercer trimestre.

                </div>

            `;

        }


        detalle.innerHTML = html;


        // Cambiar botón

        const boton =

            document.querySelector(
                ".boton-detalle"
            );


        if (boton) {

            boton.textContent =
                "▲ Ocultar detalle";

            boton.onclick =
                ocultarDetalle;

        }


    }

    catch (error) {


        console.error(error);


        detalle.innerHTML =

            '<p class="error">' +

            '❌ No se pudieron cargar las actividades.' +

            '</p>';

    }

}


// =====================================================
// OCULTAR DETALLE
// =====================================================

function ocultarDetalle() {


    const detalle =

        document
        .getElementById("detalle");


    if (!detalle) {

        return;

    }


    detalle.innerHTML = "";


    const boton =

        document.querySelector(
            ".boton-detalle"
        );


    if (boton) {

        boton.textContent =
            "📋 Ver detalle del 3.er trimestre";

        boton.onclick =
            mostrarDetalle;

    }

}


// =====================================================
// MOSTRAR NOTA
// =====================================================

function mostrarNota(nota) {


    if (
        nota === null ||
        nota === undefined ||
        nota === ""
    ) {

        return "—";

    }


    return nota;

}


// =====================================================
// ESCAPAR HTML
// =====================================================

function escapeHTML(texto) {


    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================================
// ENTER PARA CONSULTAR
// =====================================================

document
.getElementById("ci")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            consultarNota();

        }

    }
);


document
.getElementById("fecha_nacimiento")
.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            consultarNota();

        }

    }
);


</script>


</body>

</html>
