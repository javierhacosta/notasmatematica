<body>


<div class="contenedor">


    <div class="institucion">

        U.E. GERMAN BUSCH I

    </div>


    <h1>

        Matemática 2026

    </h1>


    <div class="profesor">

        Prof. Javier Delmo Hacosta Moralez

    </div>


    <div class="subtitulo">

        Consulta tu calificación

    </div>


    <!-- =====================================
         CI
    ====================================== -->

    <label for="ci">

        CI

    </label>


    <input
        type="text"
        id="ci"
        placeholder="Ejemplo: 1234567"
    >


    <!-- =====================================
         FECHA DE NACIMIENTO
    ====================================== -->

    <label for="fecha_nacimiento">

        Fecha de nacimiento

    </label>


    <input
        type="date"
        id="fecha_nacimiento"
    >


    <!-- =====================================
         BOTÓN
    ====================================== -->

    <button onclick="consultarNota()">

        Consultar mis notas

    </button>


    <!-- =====================================
         RESULTADO
    ====================================== -->

    <div id="resultado"></div>


</div>



<script>


    // ==========================================
    // CONEXIÓN CON SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://tecphbbkkmlgahjddcep.supabase.co";


    const SUPABASE_KEY =
        "sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


    // ==========================================
    // CONSULTAR NOTA
    // ==========================================

    async function consultarNota() {


        const ci =
            document
            .getElementById("ci")
            .value
            .trim();


        const fechaNacimiento =
            document
            .getElementById("fecha_nacimiento")
            .value;


        const resultado =
            document
            .getElementById("resultado");


        resultado.innerHTML = "";


        // ======================================
        // COMPROBAR DATOS
        // ======================================

        if (
            !ci ||
            !fechaNacimiento
        ) {

            resultado.innerHTML =

                '<p class="error">' +

                'Ingresa tu CI y fecha de nacimiento.' +

                '</p>';

            return;

        }


        resultado.innerHTML =

            '<p class="cargando">' +

            'Buscando tus calificaciones...' +

            '</p>';


        try {


            // ==================================
            // CONSULTAR SUPABASE
            // ==================================

            const respuesta = await fetch(

                `${SUPABASE_URL}/rest/v1/matematica?ci=eq.${encodeURIComponent(ci)}&fecha_nacimiento=eq.${encodeURIComponent(fechaNacimiento)}&select=*`,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


            // ==================================
            // COMPROBAR RESPUESTA
            // ==================================

            if (!respuesta.ok) {

                throw new Error(
                    "Error al consultar Supabase"
                );

            }


            const datos =
                await respuesta.json();


            // ==================================
            // NO ENCONTRADO
            // ==================================

            if (
                datos.length === 0
            ) {

                resultado.innerHTML =

                    '<p class="error">' +

                    'CI o fecha de nacimiento incorrectos.' +

                    '</p>';

                return;

            }


            // ==================================
            // ALUMNO ENCONTRADO
            // ==================================

            const alumno =
                datos[0];


            // ==================================
            // NOTAS
            // ==================================

            const nota1 =
                alumno.nota_1t;


            const nota2 =
                alumno.nota_2t;


            const nota3 =
                alumno.nota_3t;


            const notaFinal =
                alumno.final;


            // ==================================
            // ESTADO FINAL
            // ==================================

            let claseEstado =
                "sin-nota";


            let textoEstado =
                "";


            if (
                notaFinal !== null &&
                notaFinal !== undefined &&
                notaFinal !== ""
            ) {


                const finalNumero =
                    Number(notaFinal);


                if (
                    finalNumero <= 50
                ) {

                    claseEstado =
                        "reprobado";


                    textoEstado =
                        "REPROBADO";

                }


                else if (
                    finalNumero >= 51
                ) {

                    claseEstado =
                        "aprobado";


                    textoEstado =
                        "APROBADO";

                }

            }


            // ==================================
            // MOSTRAR RESULTADO
            // ==================================

            resultado.innerHTML = `


                <div class="nota-box">


                    <!-- NOMBRE -->

                    <div class="nombre">

                        ${escapeHTML(
                            alumno.nombre ?? ""
                        )}

                    </div>


                    <!-- CURSO -->

                    <div class="curso">

                        Curso:
                        ${escapeHTML(
                            alumno.curso ?? ""
                        )}

                    </div>


                    <!-- =================================
                         NOTA PRINCIPAL 3T
                    ================================== -->

                    <div class="trimestre-principal">

                        3.er Trimestre

                    </div>


                    <div class="nota">

                        ${mostrarNota(
                            nota3
                        )}

                    </div>


                    <hr class="separador">


                    <!-- =================================
                         DETALLE
                    ================================== -->

                    <div class="detalle-titulo">

                        Detalle de calificaciones

                    </div>


                    <div class="detalle">


                        <div class="detalle-item">

                            <span class="detalle-label">

                                1.er Trimestre

                            </span>

                            <span class="detalle-numero">

                                ${mostrarNota(
                                    nota1
                                )}

                            </span>

                        </div>


                        <div class="detalle-item">

                            <span class="detalle-label">

                                2.º Trimestre

                            </span>

                            <span class="detalle-numero">

                                ${mostrarNota(
                                    nota2
                                )}

                            </span>

                        </div>


                        <div class="detalle-item">

                            <span class="detalle-label">

                                3.er Trimestre

                            </span>

                            <span class="detalle-numero">

                                ${mostrarNota(
                                    nota3
                                )}

                            </span>

                        </div>


                    </div>


                    <!-- =================================
                         NOTA FINAL
                    ================================== -->

                    <div class="final-box">


                        <div class="final-titulo">

                            NOTA FINAL

                        </div>


                        <div class="final-contenido">


                            <div class="nota-final ${claseEstado}">

                                ${mostrarNota(
                                    notaFinal
                                )}

                            </div>


                            ${
                                textoEstado
                                ?
                                `<div class="estado ${claseEstado}">

                                    ${textoEstado}

                                </div>`
                                :
                                ""
                            }


                        </div>


                    </div>


                </div>

            `;

        }


        catch (error) {


            console.error(error);


            resultado.innerHTML =

                '<p class="error">' +

                'No se pudo conectar con el servidor.' +

                '</p>';

        }

    }


    // ==========================================
    // MOSTRAR NOTA
    // ==========================================

    function mostrarNota(nota) {


        if (
            nota === null ||
            nota === undefined ||
            nota === ""
        ) {

            return "—";

        }


        return nota;

    }


    // ==========================================
    // ESCAPAR HTML
    // ==========================================

    function escapeHTML(texto) {


        return String(texto)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


</script>


</body>

</html>
