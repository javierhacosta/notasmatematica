<style>

<body>


<div class="contenedor">


    <div class="institucion">

        U.E. GERMAN BUSCH I

    </div>


    <h1>

        Matemática 2026

    </h1>


    <div class="profesor">

        Prof. Javier Delmo Hacosta Moralez

    </div>


    <div class="subtitulo">

        Consulta tu calificación

    </div>


    <!-- ======================================
         DATOS DE INGRESO
    ======================================= -->

    <label for="ci">

        CI

    </label>


    <input

        type="text"

        id="ci"

        placeholder="Ejemplo: 1234567"

    >


    <label for="fecha_nacimiento">

        Fecha de nacimiento

    </label>


    <input

        type="date"

        id="fecha_nacimiento"

    >


    <button onclick="consultarNota()">

        Consultar mi nota

    </button>


    <!-- ======================================
         RESULTADO
    ======================================= -->

    <div id="resultado"></div>


</div>


<script>


// =================================================
// SUPABASE
// =================================================

const SUPABASE_URL =

"https://tecphbbkkmlgahjddcep.supabase.co";


const SUPABASE_KEY =

"sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


// =================================================
// VARIABLE GLOBAL
// =================================================

let alumnoActual = null;


// =================================================
// CONSULTAR NOTA
// =================================================

async function consultarNota() {


    const ci =

        document.getElementById("ci")
        .value
        .trim();


    const fechaNacimiento =

        document.getElementById(
            "fecha_nacimiento"
        ).value;


    const resultado =

        document.getElementById(
            "resultado"
        );


    resultado.innerHTML = "";


    // ==========================================
    // VALIDAR
    // ==========================================

    if (!ci || !fechaNacimiento) {

        resultado.innerHTML =

            '<p class="error">' +

            'Ingresa tu CI y fecha de nacimiento.' +

            '</p>';

        return;

    }


    resultado.innerHTML =

        '<p class="cargando">' +

        'Buscando...' +

        '</p>';


    try {


        // ======================================
        // CONSULTAR SUPABASE
        // ======================================

        const respuesta = await fetch(

            `${SUPABASE_URL}/rest/v1/matematica?` +

            `ci=eq.${encodeURIComponent(ci)}` +

            `&fecha_nacimiento=eq.${encodeURIComponent(fechaNacimiento)}` +

            `&select=id,nombre,curso,nota_1t,nota_2t,nota_3t,final`,

            {

                method: "GET",

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`

                }

            }

        );


        if (!respuesta.ok) {

            throw new Error(
                "Error al consultar Supabase"
            );

        }


        const datos =

            await respuesta.json();


        // ======================================
        // NO ENCONTRADO
        // ======================================

        if (datos.length === 0) {

            resultado.innerHTML =

                '<p class="error">' +

                'CI o fecha de nacimiento incorrectos.' +

                '</p>';

            return;

        }


        // ======================================
        // ALUMNO
        // ======================================

        alumnoActual = datos[0];


        mostrarResultado(alumnoActual);


    }

    catch (error) {

        console.error(error);


        resultado.innerHTML =

            '<p class="error">' +

            'No se pudo conectar con el servidor.' +

            '</p>';

    }

}


// =================================================
// MOSTRAR RESULTADO
// =================================================

function mostrarResultado(alumno) {


    const nota3T =

        convertirNota(alumno.nota_3t);


    const notaFinal =

        convertirNota(alumno.final);


    // ==========================================
    // DETERMINAR COLOR 3T
    // ==========================================

    const clase3T =

        nota3T === null

        ? ""

        : nota3T <= 50

        ? "reprobado"

        : "aprobado";


    // ==========================================
    // ESTADO 3T
    // ==========================================

    let estado3T = "";


    if (nota3T !== null) {

        estado3T =

            nota3T <= 50

            ? "REPROBADO"

            : "APROBADO";

    }


    // ==========================================
    // RESULTADO
    // ==========================================

    document.getElementById(
        "resultado"
    ).innerHTML = `


        <div class="nota-box">


            <div class="nombre">

                ${escapeHTML(
                    alumno.nombre
                )}

            </div>


            <div class="curso">

                Curso:

                ${escapeHTML(
                    alumno.curso || ""
                )}

            </div>


            <div class="trimestre">

                3er Trimestre

            </div>


            <!-- NOTA GRANDE -->

            <div class="nota ${clase3T}">

                ${
                    nota3T === null
                    ? ""
                    : nota3T
                }

            </div>


            <!-- ESTADO -->

            ${
                nota3T !== null

                ? `

                    <div class="estado ${clase3T}">

                        ${estado3T}

                    </div>

                `

                : ""

            }


            <!-- BOTÓN DETALLES -->

            <button

                class="boton-detalles"

                onclick="mostrarDetalles()"

            >

                📊 Detalles del 3er trimestre

            </button>


            <!-- CONTENEDOR DETALLE -->

            <div

                id="detalle3T"

                class="detalle"

                style="display:none;"

            ></div>


            <!-- NOTA FINAL -->

            <div class="final-box">


                <div class="final-titulo">

                    Nota Final

                </div>


                <div

                    class="nota-final ${
                        notaFinal === null
                        ? ""
                        : notaFinal <= 50
                        ? "reprobado"
                        : "aprobado"
                    }"

                >

                    ${
                        notaFinal === null
                        ? ""
                        : notaFinal
                    }

                </div>


                ${
                    notaFinal !== null

                    ? `

                        <div class="estado ${
                            notaFinal <= 50
                            ? "reprobado"
                            : "aprobado"
                        }">

                            ${
                                notaFinal <= 50
                                ? "REPROBADO"
                                : "APROBADO"
                            }

                        </div>

                    `

                    : ""

                }


            </div>


        </div>

    `;

}


// =================================================
// MOSTRAR DETALLES DEL 3ER TRIMESTRE
// =================================================

async function mostrarDetalles() {


    const contenedor =

        document.getElementById(
            "detalle3T"
        );


    if (
        !contenedor
    ) {

        return;

    }


    // ==========================================
    // OCULTAR SI YA ESTÁ MOSTRADO
    // ==========================================

    if (
        contenedor.style.display ===
        "block"
    ) {

        contenedor.style.display =
            "none";

        return;

    }


    contenedor.innerHTML =

        '<div class="cargando">Cargando detalle...</div>';


    contenedor.style.display =
        "block";


    try {


        // ======================================
        // CONSULTAR ACTIVIDADES
        // ======================================

        const respuestaActividades =

            await fetch(

                `${SUPABASE_URL}/rest/v1/actividades?` +

                `curso=eq.${encodeURIComponent(alumnoActual.curso)}` +

                `&trimestre=eq.3` +

                `&select=id,categoria,nombre,orden,puntaje_maximo` +

                `&order=orden`,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        if (
            !respuestaActividades.ok
        ) {

            throw new Error(
                "Error al cargar actividades"
            );

        }


        const actividades =

            await respuestaActividades.json();


        // ======================================
        // SI NO HAY ACTIVIDADES
        // ======================================

        if (
            actividades.length === 0
        ) {

            contenedor.innerHTML = `

                <h3>

                    Detalles del 3er trimestre

                </h3>

                <p>

                    Todavía no hay actividades registradas.

                </p>

            `;

            return;

        }


        // ======================================
        // IDS ACTIVIDADES
        // ======================================

        const ids =

            actividades.map(
                a => a.id
            );


        // ======================================
        // CALIFICACIONES
        // ======================================

        const respuestaCalificaciones =

            await fetch(

                `${SUPABASE_URL}/rest/v1/calificaciones?` +

                `estudiante_id=eq.${alumnoActual.id}` +

                `&actividad_id=in.(${ids.join(",")})` +

                `&select=actividad_id,nota`,

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        if (
            !respuestaCalificaciones.ok
        ) {

            throw new Error(
                "Error al cargar calificaciones"
            );

        }


        const calificaciones =

            await respuestaCalificaciones.json();


        // ======================================
        // MAPA
        // ======================================

        const mapa = {};


        calificaciones.forEach(
            cal => {

                mapa[
                    cal.actividad_id
                ] = cal.nota;

            }
        );


        // ======================================
        // AGRUPAR
        // ======================================

        const categorias = {

            SER: [],

            SABER: [],

            HACER: [],

            AUTOEVALUACION: []

        };


        actividades.forEach(
            actividad => {

                if (
                    categorias[
                        actividad.categoria
                    ]
                ) {

                    categorias[
                        actividad.categoria
                    ].push(
                        actividad
                    );

                }

            }
        );


        let html = `

            <h3>

                Detalles del 3er trimestre

            </h3>

        `;


        // ======================================
        // MOSTRAR CATEGORÍAS
        // ======================================

        const nombres = {

            SER:
                "SER — 10 puntos",

            SABER:
                "SABER — 45 puntos",

            HACER:
                "HACER — 40 puntos",

            AUTOEVALUACION:
                "AUTOEVALUACIÓN — 5 puntos"

        };


        Object.keys(
            categorias
        ).forEach(
            categoria => {


                const lista =

                    categorias[
                        categoria
                    ];


                if (
                    lista.length === 0
                ) {

                    return;

                }


                html += `

                    <div style="margin-top:15px;">

                        <strong>

                            ${nombres[categoria]}

                        </strong>

                    </div>

                `;


                lista.forEach(
                    actividad => {


                        const nota =

                            mapa[
                                actividad.id
                            ];


                        const valor =

                            nota === null ||
                            nota === undefined

                            ? ""

                            : nota;


                        html += `

                            <div class="detalle-fila">

                                <span>

                                    ${escapeHTML(
                                        actividad.nombre
                                    )}

                                </span>

                                <span class="detalle-nota">

                                    ${valor}

                                    / ${actividad.puntaje_maximo}

                                </span>

                            </div>

                        `;

                    }
                );

            }
        );


        // ======================================
        // MOSTRAR
        // ======================================

        contenedor.innerHTML =
            html;


    }

    catch (error) {

        console.error(error);


        contenedor.innerHTML =

            '<p class="error">' +

            'No se pudo cargar el detalle.' +

            '</p>';

    }

}


// =================================================
// CONVERTIR NOTA
// =================================================

function convertirNota(nota) {


    if (
        nota === null ||
        nota === undefined ||
        nota === ""
    ) {

        return null;

    }


    const numero =
        Number(nota);


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


// =================================================
// ESCAPAR HTML
// =================================================

function escapeHTML(texto) {


    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
