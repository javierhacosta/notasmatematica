.asistencia-licencia {

.cargando {

/* Reacciones del gatito al explorar la página */
#gatoInteractivo.gracioso #gatoCuerpo { animation: gatoBroma .75s ease-in-out; }
#gatoInteractivo.saltando #gatoCuerpo { animation: gatoSalto .65s ease-in-out; }
#gatoInteractivo.asustado #gatoCuerpo { animation: gatoTemblor .5s ease-in-out; }
@keyframes gatoBroma {
    0%,100% { transform: rotate(0) scale(1); }
    25% { transform: rotate(-15deg) scale(1.12); }
    50% { transform: rotate(15deg) scale(1.12); }
    75% { transform: rotate(-8deg) scale(1.06); }
}
@keyframes gatoSalto {
    0%,100% { transform: translateY(0) scale(1); }
    45% { transform: translateY(-18px) scale(1.12); }
    70% { transform: translateY(0) scale(.96); }
}
@keyframes gatoTemblor {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
}

    .tabla-asistencia td {

    }

}

/* =================================================
   CENTRALIZADOR DE NOTAS - SOLO 5A
================================================= */
.boton-centralizador {
    margin-top: 10px;
    background: #00897b;
    font-size: 16px;
}
.boton-centralizador:hover { background: #00695c; }

.centralizador-box {
    margin-top: 20px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 15px;
    padding: 16px;
    text-align: left;
}
.centralizador-titulo {
    text-align: center;
    color: #1557a6;
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 12px;
}
.centralizador-tabla-contenedor { width: 100%; overflow-x: auto; }
.centralizador-tabla {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
.centralizador-tabla th {
    background: #f1f4f8;
    color: #555;
    font-weight: bold;
    padding: 9px 5px;
    border-bottom: 1px solid #ddd;

.centralizador-tabla td {

}
.centralizador-tabla th:first-child,
.centralizador-tabla td:first-child {
    text-align: left;

}
.nota-centralizador { font-weight: bold; }
.sin-nota { color: #999; font-weight: normal; }

@media(max-width:500px) {
    .centralizador-tabla { font-size: 11px; }
    .centralizador-tabla th,
    .centralizador-tabla td { padding: 8px 4px; }
    .centralizador-tabla th:first-child,
    .centralizador-tabla td:first-child { min-width: 190px; }
}



.fotos-actividad-consulta { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.miniatura-foto-actividad { width:58px; height:58px; object-fit:cover; border-radius:8px; border:1px solid #d0d7de; cursor:pointer; display:block; }
.miniatura-foto-actividad:hover { opacity:.88; }
#visorFotoActividadConsulta { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.82); display:flex; align-items:center; justify-content:center; padding:20px; }
#visorFotoActividadConsulta.oculto { display:none; }
#visorFotoActividadConsulta img { max-width:95vw; max-height:90vh; object-fit:contain; border-radius:10px; }
#visorFotoActividadConsulta .cerrar-visor-foto { position:absolute; top:12px; right:14px; width:42px; height:42px; margin:0; padding:0; border-radius:50%; font-size:28px; background:#fff; color:#222; }


/* Cada actividad se presenta en dos filas: detalle y luego nota. */
.actividad-fila {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto;
    align-items: start;
    gap: 0;
}
.actividad-nombre { grid-column: 1; grid-row: 1; font-size: 14px; font-weight: 600; line-height: 1.4; }
.actividad-fecha { margin-top: 5px; }
.actividad-nota { grid-column: 1; grid-row: 2; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; text-align:left; padding-top:8px; margin-top:8px; border-top:1px dashed #e2e7ee; white-space:normal; }
.actividad-nota > div:first-child { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.actividad-observacion { max-width:none; text-align:left; width:100%; }
.resumen-categoria { gap:12px; }
.promedio-valor { white-space:nowrap; font-size:17px; }
.tabla-asistencia-contenedor, .centralizador-tabla-contenedor { max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y; }
/* En asistencia, cada registro ocupa dos filas apiladas: fecha y estado/icono. */
.tabla-asistencia { min-width:0; width:100%; }
.tabla-asistencia thead { display:none; }
.tabla-asistencia tbody tr { display:block; width:100%; padding:5px 0; border-bottom:1px solid #e5e7eb; }
.tabla-asistencia tbody td { display:block; width:100%; box-sizing:border-box; text-align:left; padding:7px 10px; }
.tabla-asistencia tbody td:first-child { font-weight:600; background:#f7f9fc; border-radius:7px 7px 0 0; }
.tabla-asistencia tbody td:nth-child(2) { min-height:38px; border-radius:0 0 7px 7px; }
.centralizador-tabla { min-width:560px; }
.icono-dia-asistencia { border:0; background:transparent; color:inherit; width:auto; margin:0; padding:3px 8px; font-size:21px; cursor:pointer; border-radius:8px; }
.icono-dia-asistencia:focus-visible { outline:2px solid #1557a6; }
@media(max-width:500px) {
 .contenedor { padding:16px; }
 .actividad-fila { padding:12px 9px; }
 .actividad-nota { font-size:14px; }
}


/* Vista horizontal tipo hoja de cálculo: detalles arriba y valores debajo */
.tabla-actividades-contenedor, .tabla-asistencia-contenedor {
  width:100%; max-width:100%; overflow-x:auto; overflow-y:hidden;
  -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;
}
.tabla-actividades, .tabla-asistencia-horizontal {
  border-collapse:collapse; table-layout:auto; width:max-content; min-width:100%;
  font-size:13px; background:#fff;
}
.tabla-actividades th, .tabla-actividades td,
.tabla-asistencia-horizontal th, .tabla-asistencia-horizontal td {
  border:1px solid #d9dee5; padding:9px 12px; text-align:center;
  vertical-align:middle; min-width:76px; max-width:210px;
}
.tabla-actividades th, .tabla-asistencia-horizontal th {
  background:#f1f4f8; color:#374151; font-weight:600; white-space:normal;
}
.tabla-actividades td { white-space:normal; }
.tabla-asistencia-horizontal th { white-space:nowrap; }
.tabla-asistencia-horizontal td { font-size:20px; }


/* Encabezados girados para reducir el ancho de las columnas, como en Excel. */
.tabla-actividades th,
.tabla-asistencia-horizontal th {
  position: relative;
  box-sizing: border-box;
  width: 52px;
  min-width: 52px;
  max-width: 52px;
  height: 190px;
  min-height: 190px;
  padding: 4px !important;
  vertical-align: bottom;
  overflow: hidden;
}
.tabla-actividades th .encabezado-rotado,
.tabla-asistencia-horizontal th .encabezado-rotado {
  position: absolute;
  left: 50%;
  top: 50%;
  display: block;
  width: 172px;
  max-width: none;
  max-height: 172px;
  box-sizing: border-box;
  padding: 4px;
  white-space: normal;
  overflow-wrap: anywhere;
  line-height: 1.25;
  text-align: left;
  transform: translate(-50%, -50%) rotate(-90deg);
  transform-origin: center center;
}
.tabla-asistencia-horizontal th .encabezado-fecha-rotado {
  width: 172px;
  white-space: nowrap;
  text-align: center;
}
.tabla-actividades td,
.tabla-asistencia-horizontal td {
  min-width: 52px;
  width: 52px;
  max-width: 90px;
  padding: 8px 5px;
}
.tabla-actividades td { overflow-wrap: anywhere; }


/* Asistencia: fechas arriba, estado/detalle en la segunda fila y hora en la tercera. */
.tabla-asistencia-horizontal tbody tr:nth-child(2) td { font-size:20px; min-height:42px; }
.tabla-asistencia-horizontal tbody tr:nth-child(3) td { font-size:12px; color:#475569; height:auto; min-height:28px; padding:5px 3px; }
.tabla-asistencia-horizontal .detalle-dia-especial { font-size:12px !important; line-height:1.35; white-space:normal; overflow-wrap:anywhere; }
.tabla-asistencia-horizontal .hora-asistencia { font-size:12px !important; font-variant-numeric:tabular-nums; }

/* Ajuste solicitado: texto compacto para días especiales y horas. */
.tabla-asistencia-horizontal .detalle-dia-especial {
  font-size: 9px !important;
  line-height: 1.2;
  padding: 3px 2px;
  white-space: normal;
  overflow-wrap: anywhere;
}
.tabla-asistencia-horizontal .hora-asistencia {
  font-size: 9px !important;
  line-height: 1.15;
  padding: 3px 2px;
  font-variant-numeric: tabular-nums;
}

let temporizadorVisita = null;

function iniciarCuentaRegresivaVisita(segundos) {

    if (temporizadorVisita) {
        clearInterval(temporizadorVisita);
        temporizadorVisita = null;
    }

    const boton = document.querySelector('button[onclick="consultarNota()"]');
    if (!boton || segundos <= 0) return;

    const textoOriginal = "Consultar mi nota";

    const actualizar = () => {

        if (segundos <= 0) {
            clearInterval(temporizadorVisita);
            temporizadorVisita = null;
            boton.disabled = false;
            boton.style.opacity = "1";
            boton.style.cursor = "pointer";
            boton.textContent = textoOriginal;
            return;
        }

        const horas = Math.floor(segundos / 3600);
        const minutos = Math.floor((segundos % 3600) / 60);
        const seg = segundos % 60;

        let tiempo;

        if (horas > 0) {
            tiempo = `${horas} h ${minutos} min ${String(seg).padStart(2, "0")} s`;
        } else {
            tiempo = `${minutos} min ${String(seg).padStart(2, "0")} s`;

        boton.disabled = true;
        boton.style.opacity = "0.65";
        boton.style.cursor = "not-allowed";
        boton.textContent = `Podrás consultar nuevamente en ${tiempo}`;
        segundos--;

        // Reintenta fallos temporales y evita quedar esperando indefinidamente.
        for (let intento = 1; intento <= 3; intento++) {
            const controlador = new AbortController();

                        "Authorization": `Bearer ${SUPABASE_KEY}`,
                        "Accept": "application/json"

                    cache: "no-store",
                    signal: controlador.signal

                if (respuesta.ok || [400, 401, 403, 404].includes(respuesta.status)) break;
                ultimoError = new Error(`HTTP ${respuesta.status}`);
            } catch (error) {
                clearTimeout(temporizador);
                ultimoError = error;
            }
            if (intento < 3) await new Promise(resolve => setTimeout(resolve, 700 * intento));
        }

        if (!respuesta) {
            if (ultimoError?.name === "AbortError") throw new Error("Tiempo de espera agotado. Intenta nuevamente.");
            throw new Error("No fue posible conectar con el servidor. Verifica tu conexión a Internet.");
        }

        if (!respuesta.ok) {
            let detalle = "";
            try { detalle = await respuesta.text(); } catch (_) {}
            console.error("Error consulta estudiante Supabase:", respuesta.status, detalle);
            if (respuesta.status === 401 || respuesta.status === 403) throw new Error("No se pudo autorizar la consulta en el servidor.");
            if (respuesta.status === 404) throw new Error("No se encontró el recurso solicitado en el servidor.");
            throw new Error(`El servidor respondió con un error (${respuesta.status}). Intenta nuevamente.`);
        }

        const datos =
            await respuesta.json();


        if (datos.length === 0) {

            resultado.innerHTML =
                '<p class="error">' +
                'CI o fecha de nacimiento incorrectos.' +
                '</p>';

            return;
        }


        alumnoActual =
            datos[0];


        /* =================================================
           EVITAR CONSULTAS REPETIDAS DURANTE 60 MINUTOS
        ================================================= */
        const CLAVE_BLOQUEO_VISITA =
            `ultima_consulta_nota_${alumnoActual.id}`;
        const DURACION_BLOQUEO_VISITA = 60 * 60 * 1000;

        // Respaldo temporal para navegadores que bloquean localStorage.
        // Cuando localStorage funciona, se conserva exactamente el comportamiento actual.
        window.__bloqueoVisitaTemporal = window.__bloqueoVisitaTemporal || {};

        function obtenerUltimaConsulta(clave) {
            try {

                console.warn("localStorage no disponible; usando respaldo temporal:", error);

        function guardarUltimaConsulta(clave, valor) {
            try {
                localStorage.setItem(clave, valor);
            } catch (error) {
                console.warn("localStorage no disponible; usando respaldo temporal:", error);
                window.__bloqueoVisitaTemporal[clave] = valor;
            }
        }

        const ultimaConsulta =
            Number(obtenerUltimaConsulta(CLAVE_BLOQUEO_VISITA) || 0);
        const tiempoTranscurrido = Date.now() - ultimaConsulta;

        if (ultimaConsulta && tiempoTranscurrido < DURACION_BLOQUEO_VISITA) {
            iniciarCuentaRegresivaVisita(
                Math.ceil((DURACION_BLOQUEO_VISITA - tiempoTranscurrido) / 1000)

            mostrarResultado(alumnoActual);
            return;

        guardarUltimaConsulta(
            CLAVE_BLOQUEO_VISITA,

        );

function formatearFechaHoraPresentacion(fechaHora) {
    if (!fechaHora) return "";

    const texto = String(fechaHora).trim();

    // Si Supabase entrega un timestamp con zona horaria (por ejemplo UTC),
    // convertirlo a la hora local de Bolivia antes de mostrarlo.
    const tieneZonaHoraria = /(?:Z|[+-]\d{2}:?\d{2})$/i.test(texto);

    if (tieneZonaHoraria) {
        const fecha = new Date(texto);
        if (isNaN(fecha.getTime())) return texto;

        const partes = new Intl.DateTimeFormat("es-BO", {
            timeZone: "America/La_Paz",
            weekday: "long",
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }).formatToParts(fecha);

        const valores = {};
        partes.forEach(parte => {
            if (parte.type !== "literal") valores[parte.type] = parte.value;
        });

        const diaSemana = valores.weekday.charAt(0).toUpperCase() + valores.weekday.slice(1);
        return `${diaSemana} ${valores.day}/${valores.month}/${valores.year} ${valores.hour}:${valores.minute}`;
    }

    // Si no trae zona horaria, conservar exactamente la hora registrada.
    const match = texto.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})/);
    if (!match) return texto;

    const fecha = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    const diasSemana = [
        "Domingo", "Lunes", "Martes", "Miércoles",
        "Jueves", "Viernes", "Sábado"
    ];
    const diaSemana = diasSemana[fecha.getDay()];

    return `${diaSemana} ${match[3]}/${match[2]}/${match[1]} ${match[4]}:${match[5]}`;
}

function obtenerFechaHoraActividad(actividad) {
    if (!actividad || !actividad.fecha) return null;
    const hora = actividad.hora_fin || actividad.hora_inicio;
    if (hora) return `${actividad.fecha}T${String(hora).slice(0, 5)}`;
    return `${actividad.fecha}T23:59`;
}

function calcularObsEntrega(actividad, fechaEntrega) {
    if (!fechaEntrega) return "";
    const fechaLimite = obtenerFechaHoraActividad(actividad);
    if (!fechaLimite) return "";
    const limite = new Date(fechaLimite);
    const entrega = new Date(String(fechaEntrega).replace(" ", "T"));
    if (isNaN(limite.getTime()) || isNaN(entrega.getTime())) return "";
    const diferencia = entrega.getTime() - limite.getTime();
    if (diferencia <= 0) return "Puntual";
    const minutos = Math.floor(diferencia / 60000);
    const dias = Math.floor(minutos / 1440);
    const horas = Math.floor((minutos % 1440) / 60);
    const mins = minutos % 60;
    if (dias > 0) return `Atrasado ${dias} día${dias !== 1 ? "s" : ""}${horas ? ` ${horas}hr` : ""}${mins ? ` ${mins}min` : ""}`;
    if (horas > 0) return `Atrasado ${horas}hr${mins ? ` ${mins}min` : ""}`;
    return `Atrasado ${mins}min`;
}

/* =================================================
   CALCULAR NOTA DEL 3ER TRIMESTRE Y ANUAL EN HTML
================================================= */

/*
 * La BD solamente identifica al estudiante y entrega 1T y 2T.
 * El 3T se obtiene de las actividades del 3er trimestre y sus
 * calificaciones. Se conserva la lógica que ya usa el detalle:
 * promedio de las notas registradas de cada categoría y suma de
 * las cuatro categorías (SER + SABER + HACER + AUTOEVALUACIÓN).
 */
async function calcularNota3T(alumno) {

    if (!alumno || !alumno.id || !alumno.curso) {
        return null;
    }

    try {
        const respuestaActividades = await fetch(
            `${SUPABASE_URL}/rest/v1/actividades?` +
            `curso=eq.${encodeURIComponent(alumno.curso)}` +
            `&trimestre=eq.3` +
            `&select=id,categoria,puntaje_maximo` +
            `&order=orden`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        if (!respuestaActividades.ok) {
            throw new Error("No se pudieron cargar las actividades del 3er trimestre");
        }

        const actividades = await respuestaActividades.json();
        if (!actividades.length) return null;

        const ids = actividades.map(a => a.id);

        const respuestaNotas = await fetch(
            `${SUPABASE_URL}/rest/v1/calificaciones?` +
            `estudiante_id=eq.${alumno.id}` +
            `&actividad_id=in.(${ids.join(",")})` +
            `&select=actividad_id,nota`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        if (!respuestaNotas.ok) {
            throw new Error("No se pudieron cargar las calificaciones del 3er trimestre");
        }

        const calificaciones = await respuestaNotas.json();
        const mapa = {};
        calificaciones.forEach(c => { mapa[c.actividad_id] = c.nota; });

        const categorias = ["SER", "SABER", "HACER", "AUTOEVALUACION"];
        let nota3 = 0;
        let hayNotas = false;

        categorias.forEach(codigo => {
            const lista = actividades.filter(a => a.categoria === codigo);
            let suma = 0;
            let cantidad = 0;

            lista.forEach(actividad => {
                const nota = mapa[actividad.id];
                if (nota !== null && nota !== undefined && nota !== "") {
                    const numero = Number(nota);
                    if (!isNaN(numero)) {
                        suma += numero;
                        cantidad++;
                    }
                }
            });

            if (cantidad > 0) {
                nota3 += suma / cantidad;
                hayNotas = true;
            }
        });

        return hayNotas ? Math.round(nota3) : null;

    } catch (error) {
        console.error("No se pudo calcular la nota del 3er trimestre en HTML:", error);
        return null;
    }
}

function calcularNotaAnual(nota1, nota2, nota3) {
    const notas = [nota1, nota2, nota3]
        .filter(n => n !== null && n !== undefined && !isNaN(Number(n)))
        .map(Number);

    if (!notas.length) return null;

    return Math.round(
        notas.reduce((suma, nota) => suma + nota, 0) / notas.length
    );
}

function mostrarValorCentralizador(valor) {
    if (valor === null || valor === undefined || valor === "") {
        return '<span class="sin-nota">—</span>';
    }
    const numero = Number(valor);
    if (isNaN(numero)) {
        return '<span class="sin-nota">' + escapeHTML(String(valor)) + '</span>';
    }
    return '<span class="nota-centralizador">' + Math.round(numero) + '</span>';
}

async function mostrarCentralizador() {

    const contenedor = document.getElementById("centralizador5A");

    if (!contenedor || !alumnoActual) return;

    const cursoCentralizador = String(alumnoActual.curso || "").trim().toUpperCase();

    if (cursoCentralizador !== "5A" && cursoCentralizador !== "1B") {
        return;
    }

    if (contenedor.innerHTML.trim() !== "") {
        contenedor.innerHTML = "";
        return;
    }

    contenedor.innerHTML =
        '<p class="cargando">Cargando notas de todas las materias...</p>';

    try {

        const respuesta = await fetch(
            `${SUPABASE_URL}/rest/v1/centralizador?` +
            `ci=eq.${encodeURIComponent(alumnoActual.ci || "")}` +
            `&select=*`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        if (!respuesta.ok) {
            const detalleError = await respuesta.text();
            console.error("Error centralizador Supabase:", detalleError);
            throw new Error("Error al consultar centralizador: " + detalleError);
        }

        const datos = await respuesta.json();

        if (!datos.length) {
            contenedor.innerHTML = `
                <div class="centralizador-box">
                    <div class="centralizador-titulo">
                        📊 NOTAS DE TODAS LAS MATERIAS
                    </div>
                    <p style="text-align:center;color:#666;line-height:1.5;">
                        No se encontraron notas en el centralizador.
                    </p>
                </div>
            `;
            return;
        }

        const centralizador = datos[0];

        let filas = "";

        // PostgreSQL convierte los nombres de columnas sin comillas a minúsculas.
        // Por eso se prueban tanto MAYÚSCULAS como minúsculas para mostrar las notas.
        const obtenerNotaCentralizador = (codigo, periodo) => {
            const nombreColumna = codigo + periodo;
            return centralizador[nombreColumna] ?? centralizador[nombreColumna.toLowerCase()];
        };

        const materiasCentralizador = cursoCentralizador === "1B"
            ? MATERIAS_CENTRALIZADOR_1B
            : MATERIAS_CENTRALIZADOR_5A;

        materiasCentralizador.forEach(([codigo, nombre]) => {

            filas += `
                <tr>
                    <td>${escapeHTML(nombre)}</td>
                    <td>${mostrarValorCentralizador(obtenerNotaCentralizador(codigo, "1"))}</td>
                    <td>${mostrarValorCentralizador(obtenerNotaCentralizador(codigo, "2"))}</td>
                    <td>${mostrarValorCentralizador(obtenerNotaCentralizador(codigo, "3"))}</td>
                    <td>${mostrarValorCentralizador(obtenerNotaCentralizador(codigo, "A"))}</td>
                </tr>
            `;
        });

        contenedor.innerHTML = `
            <div class="centralizador-box">

                <div class="centralizador-titulo">
                    📊 NOTAS DE TODAS LAS MATERIAS
                </div>

                <div style="text-align:center;color:#666;font-size:13px;margin-bottom:12px;">
                    Curso: ${escapeHTML(cursoCentralizador)}
                </div>

                <div class="centralizador-tabla-contenedor">
                    <table class="centralizador-tabla">

                        <thead>
                            <tr>
                                <th>Materia</th>
                                <th>1er Trimestre</th>
                                <th>2do Trimestre</th>
                                <th>3er Trimestre</th>
                                <th>Promedio Anual</th>
                            </tr>
                        </thead>

                        <tbody>${filas}</tbody>

                    </table>
                </div>

            </div>
        `;

    } catch (error) {

        console.error(error);

        contenedor.innerHTML = `
            <div class="centralizador-box">
                <div class="centralizador-titulo">
                    📊 NOTAS DE TODAS LAS MATERIAS
                </div>
                <p class="error">
                    No se pudo cargar el centralizador de notas.
                </p>
                <p style="font-size:12px;color:#777;text-align:center;line-height:1.4;">
                    La consulta del centralizador debe utilizar la columna <b>ci</b>.
                </p>
            </div>
        `;
    }
}

                }

        if (!respuesta.ok) {

        }


        const actividades =

        if (

        ) {

            contenedor.innerHTML = `

                <div class="detalle">

                    <div class="detalle-titulo">

                        📊 Detalles del 3er trimestre

            `;


            await mostrarAsistenciaEnDetalle();

            return;

                a => a.id

        const respuestaNotas =
            await fetch(

                `${SUPABASE_URL}/rest/v1/calificaciones?` +

                `estudiante_id=eq.${alumnoActual.id}` +

                `&actividad_id=in.(${ids.join(",")})` +

                `&select=actividad_id,nota,observacion,fecha_entrega`,

                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        const calificaciones =
            await respuestaNotas.json();

        // Fotografías de las actividades del estudiante.
        // Si no se pueden cargar, la consulta de calificaciones continúa normalmente.
        let fotosActividadesConsulta = {};
        try {
            const respuestaFotos = await fetch(
                `${SUPABASE_URL}/rest/v1/fotos_actividades?` +
                `estudiante_id=eq.${encodeURIComponent(alumnoActual.id)}` +
                `&actividad_id=in.(${ids.join(",")})` +
                `&select=id,actividad_id,ruta,nombre_archivo,created_at` +
                `&order=created_at`,
                {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                }
            );
            if (respuestaFotos.ok) {
                const fotos = await respuestaFotos.json();
                await Promise.all((fotos || []).map(async foto => {
                    if (!foto.ruta) return;
                    try {
                        const respuestaUrl = await fetch(
                            `${SUPABASE_URL}/storage/v1/object/sign/archivos_estudiantes/${foto.ruta.split("/").map(encodeURIComponent).join("/")}`,
                            {
                                method: "POST",
                                headers: {
                                    "apikey": SUPABASE_KEY,
                                    "Authorization": `Bearer ${SUPABASE_KEY}`,
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    expiresIn: 600
                                })
                            }
                        );
                        if (respuestaUrl.ok) {
                            const datosUrl = await respuestaUrl.json();
                            const firmada = datosUrl?.signedURL || datosUrl?.signedUrl;
                            if (firmada) {
                                foto.url = firmada.startsWith("http")
                                    ? firmada
                                    : `${SUPABASE_URL}/storage/v1${firmada}`;
                            }
                        }
                    } catch (_) {}
                    if (foto.url) {
                        (fotosActividadesConsulta[foto.actividad_id] ||= []).push(foto);
                    }
                }));
            }

        const mapa = {};


        calificaciones.forEach(
            c => {

                mapa[c.actividad_id] = {

                    nota: c.nota,

                    observacion:
                        c.observacion,

                    fecha_entrega:
                        c.fecha_entrega

            }

        const categorias = [

            },

                clase: "saber"
            },

                titulo: "📚 Tareas y Trabajos",
                clase: "hacer"

        let html = `

                <div class="detalle-titulo">

                    del 3er trimestre?

                </div>


                <p style="
                    text-align:center;
                    color:#666;
                    font-size:14px;
                    line-height:1.5;
                ">

                    Aquí puedes revisar las
                    calificaciones registradas.

                </p>

        `;


        categorias.forEach(
            categoria => {

                const lista =
                    actividades.filter(
                        a =>
                            a.categoria ===
                            categoria.codigo
                    );


                if (
                    lista.length === 0
                ) {

                    return;

                }


                const limite =

                    categoria.codigo === "SER"

                    ? 10

                    : categoria.codigo === "SABER"

                    ? 45

                    : categoria.codigo === "HACER"

                    ? 40

                    : 5;


                let suma = 0;

                let cantidad = 0;


                lista.forEach(
                    actividad => {

                        const registro =
                            mapa[
                                actividad.id
                            ];


                        const nota =
                            registro
                            ? registro.nota
                            : null;


                        if (
                            nota !== null &&
                            nota !== undefined &&
                            nota !== ""
                        ) {

                            const numero =
                                Number(nota);


                            if (
                                !isNaN(numero)
                            ) {

                                suma +=
                                    numero;

                                cantidad++;

                            }

                        }

                    }
                );


                let promedio = 0;


                if (
                    cantidad > 0
                ) {

                    promedio =
                        suma / cantidad;

                }


                const promedioMostrado =

                    cantidad > 0

                    ? Math.round(promedio)

                    : null;


                html += `

                        <div class="
                            categoria-titulo
                            ${categoria.clase}
                        ">

                            ${categoria.titulo}

                        </div>

                `;


                lista.forEach(
                    actividad => {

                        const registro =
                            mapa[
                                actividad.id
                            ];


                        const nota =
                            registro
                            ? registro.nota
                            : null;


                        const observacion =

                            registro &&
                            registro.observacion

                            ? escapeHTML(
                                registro.observacion
                            )

                            : "";


                        const fechaEntrega =
                            registro
                            ? registro.fecha_entrega
                            : null;

                        const presentacion =
                            fechaEntrega
                            ? formatearFechaHoraPresentacion(fechaEntrega)
                            : "";

                        const obsEntrega =
                            fechaEntrega
                            ? calcularObsEntrega(
                                actividad,
                                fechaEntrega
                            )
                            : "";


                        const notaVacia =
                            nota === null ||
                            nota === undefined ||
                            nota === "";

                        const notaCero =
                            !notaVacia &&
                            Number(nota) === 0;

                        const estadoNota =
                            notaVacia
                            ? "📝 Calificación Pendiente"
                            : notaCero
                            ? (
                                categoria.codigo === "SABER"
                                ? "❌ No realizó"
                                : "❌ No presentó"
                            )
                            : "";

                        const valor =

                                    )}

                                    <span class="actividad-fecha">

                                            ? formatearFecha(

                                            : "Sin fecha"
                                        }

                                    </span>

                                        estadoNota
                                        ? `
                                    <span class="actividad-estado-entrega actividad-estado-no-presento">
                                        ${estadoNota}
                                    </span>
                                        `
                                        : fechaEntrega

                                    <span class="actividad-fecha-entrega">
                                        📅 ${escapeHTML(presentacion)}
                                    </span>
                                        `
                                        : ""
                                    }

                                </div>


                                <div class="actividad-nota">

                                    <div>

                                        <span style="font-size:12px;color:#555;font-weight:normal;">Nota:</span>

                                    </div>

                                        `

                                        : ""

                                </div>

                            </div>

                html += `

        const asistencias = await respuesta.json();

        const respuestaTiposDia = await fetch(
            `${SUPABASE_URL}/rest/v1/asistencia_tipos_dia?` +
            `curso=eq.${encodeURIComponent(alumnoActual.curso || "")}` +
            `&fecha=gte.${INICIO_3T}&fecha=lte.${FIN_3T}` +
            `&tipo=in.(no_clases,clase_informal,observacion)` +
            `&select=fecha,tipo,motivo&order=fecha.desc`,
            { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } }
        );
        if (!respuestaTiposDia.ok) throw new Error("Error al consultar los días especiales");
        const diasNoClases = await respuestaTiposDia.json();

        let presentes = 0, atrasos = 0, licencias = 0, faltas = 0;

        asistencias.forEach(asistencia => {
            const esClaseInformal = diasNoClases.some(
                dia => String(dia.fecha) === String(asistencia.fecha) &&
                       String(dia.tipo || "").toLowerCase() === "clase_informal"
            );
            if (esClaseInformal) return;

            const estado = normalizarEstado(asistencia.estado);
            if (estado === "asistio") presentes++;
            else if (estado === "atraso") atrasos++;
            else if (estado === "licencia") licencias++;
            else if (estado === "falta") faltas++;
        });

        /*
         * UN SOLO REGISTRO POR FECHA.
         * La observación del día se integra en la misma fila que la asistencia.
         */
        const fechas = new Map();

        asistencias.forEach(asistencia => {
            const fecha = String(asistencia.fecha || "");
            if (!fechas.has(fecha)) {
                fechas.set(fecha, {
                    asistencia,
                    observaciones: [],
                    claseInformal: null,
                    noClases: null
                });
            }
        });

        diasNoClases.forEach(dia => {
            const fecha = String(dia.fecha || "");
            if (!fechas.has(fecha)) {
                fechas.set(fecha, {
                    asistencia: null,
                    observaciones: [],
                    claseInformal: null,
                    noClases: null
                });
            }

            const registro = fechas.get(fecha);
            const tipo = String(dia.tipo || "").toLowerCase();
            const motivo = dia.motivo && String(dia.motivo).trim()
                ? String(dia.motivo).trim()
                : "";

            if (tipo === "observacion") {
                if (motivo && !registro.observaciones.includes(motivo)) {
                    registro.observaciones.push(motivo);
                }
            } else if (tipo === "clase_informal") {
                registro.claseInformal = dia;
            } else if (tipo === "no_clases") {
                registro.noClases = dia;
            }
        });

        const registrosAsistencia = Array.from(fechas.entries())
            .map(([fecha, datos]) => ({ fecha, ...datos }))
            .sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));

        let filas = "";

        registrosAsistencia.forEach(registro => {
            const asistencia = registro.asistencia;

            if (asistencia) {
                const estado = normalizarEstado(asistencia.estado);
                const informacion = obtenerEstadoAsistencia(estado);
                const observaciones = [];

                if (asistencia.observacion && String(asistencia.observacion).trim()) {
                    observaciones.push(String(asistencia.observacion).trim());
                }
                registro.observaciones.forEach(obs => {
                    if (!observaciones.includes(obs)) observaciones.push(obs);
                });

                const textoObservacion = observaciones.length
                    ? observaciones.map(escapeHTML).join("<br>")
                    : "—";

                filas += `
                    <tr>
                        <td>${formatearFecha(asistencia.fecha)}</td>
                        <td>
                            <span class="icono-dia-asistencia" aria-label="${escapeHTML(informacion.nombre)}" title="${escapeHTML(informacion.nombre)}">${informacion.icono}</span>
                        </td>
                        <td class="hora-asistencia">${(estado === "asistio" || estado === "atraso") && asistencia.hora ? escapeHTML(String(asistencia.hora).slice(0,5)) : "—"}</td>
                    </tr>
                `;
                return;
            }

            if (registro.claseInformal) {
                const motivo = registro.claseInformal.motivo && String(registro.claseInformal.motivo).trim()
                    ? escapeHTML(String(registro.claseInformal.motivo).trim())
                    : "Clase informal registrada.";

                filas += `
                    <tr class="dia-clase-informal">
                        <td>${formatearFecha(registro.fecha)}</td>
                        <td class="detalle-dia-especial">${motivo}</td>
                        <td class="hora-asistencia">—</td>
                    </tr>
                `;
                return;
            }

            if (registro.noClases) {
                const motivo = registro.noClases.motivo && String(registro.noClases.motivo).trim()
                    ? `🚫 No hubo clases: ${escapeHTML(String(registro.noClases.motivo).trim())}`
                    : "🚫 No hubo clases";

                filas += `
                    <tr class="dia-no-clases">
                        <td>${formatearFecha(registro.fecha)}</td>
                        <td class="detalle-dia-especial">${motivo}</td>
                        <td class="hora-asistencia">—</td>
                    </tr>
                `;
                return;
            }

            filas += `
                <tr>
                    <td>${formatearFecha(registro.fecha)}</td>
                    <td>${registro.observaciones.length ? `<button type="button" class="icono-dia-asistencia" title="Ver observación" onclick="mostrarMotivoAsistencia('${String(registro.observaciones.join(' · ')).replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')">📝</button>` : "—"}</td>
                </tr>
            `;
        });

        const contenidoTabla = registrosAsistencia.length
            ? `
                <div class="tabla-asistencia-contenedor">
                    <table class="tabla-asistencia">
                        <thead>
                            <tr>
                                <th>📅 Fecha</th>
                                <th>Asistencia / día especial (pulsa el icono para ver el motivo)</th>
                            </tr>
                        </thead>
                        <tbody>${filas}</tbody>
                    </table>
                </div>
            `
            : `<div class="asistencia-vacia">Todavía no hay registros de asistencia.</div>`;

        const asistenciaHTML = `
            <div class="asistencia-box">
                <div class="asistencia-titulo">🗓️ Asistencia del 3er Trimestre</div>
                <div class="asistencia-descripcion">Resumen de tu asistencia durante el tercer trimestre.</div>
                <div class="asistencia-resumen">
                    <div class="asistencia-card">
                        <span class="icono">🟢</span>
                        <span class="cantidad asistencia-presente">${presentes}</span>
                        <span class="texto">ASISTENCIAS</span>
                    </div>
                    <div class="asistencia-card">
                        <span class="icono">🟡</span>
                        <span class="cantidad asistencia-atraso">${atrasos}</span>
                        <span class="texto">ATRASOS</span>
                    </div>
                    <div class="asistencia-card">
                        <span class="icono">🔵</span>
                        <span class="cantidad asistencia-licencia">${licencias}</span>
                        <span class="texto">CON LICENCIA</span>
                    </div>
                    <div class="asistencia-card">
                        <span class="icono">🔴</span>
                        <span class="cantidad asistencia-falta">${faltas}</span>
                        <span class="texto">SIN LICENCIA</span>
                    </div>
                </div>
                <button type="button" class="boton-asistencia" onclick="alternarDetalleAsistencia(this)">
                    − Ocultar detalle de asistencia
                </button>
                <div class="detalle-asistencia" id="tablaDetalleAsistencia" style="display:block">
                    ${contenidoTabla}
                </div>
            </div>
        `;

        contenedor.insertAdjacentHTML("beforeend", asistenciaHTML);
        aplicarVistaDosFilas();

    } catch(error) {
        console.error(error);
        contenedor.insertAdjacentHTML("beforeend", `
            <div class="asistencia-box">
                <div class="asistencia-titulo">🗓️ Asistencia del 3er Trimestre</div>
                <div class="asistencia-vacia">No se pudo cargar el detalle de asistencia.</div>
            </div>
        `);
    }
}


/* =================================================
   MOSTRAR / OCULTAR TABLA ASISTENCIA
================================================= */

function alternarDetalleAsistencia(boton) {

    const tabla =
        document.getElementById(
            "tablaDetalleAsistencia"
        );


    if (!tabla) {

        return;

    }


    if (
        tabla.style.display ===
        "block"
    ) {

        tabla.style.display =
            "none";


        boton.innerHTML =
            "＋ Ver detalle de asistencia";

    }

    else {

        tabla.style.display =
            "block";


        boton.innerHTML =
            "− Ocultar detalle de asistencia";

    }

}


/* =================================================
   NORMALIZAR ESTADO
================================================= */

function normalizarEstado(estado) {

    if (
        estado === null ||
        estado === undefined
    ) {

        return "";

    }


    return String(estado)

        .trim()

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =================================================
   ESTADOS DE ASISTENCIA
================================================= */

function obtenerEstadoAsistencia(estado) {

    switch (estado) {

        case "asistio":

            return {

                nombre: "Asistencia",

                icono: "🟢",

                clase: "estado-presente"

            };


        case "atraso":

            return {

                nombre: "Atraso",

                icono: "🟡",

                clase: "estado-atraso"

            };


        case "licencia":

            return {

                nombre: "Falta con licencia",

                icono: "🔵",

                clase: "estado-licencia"

            };


        case "falta":

            return {

                nombre: "Falta sin licencia",

                icono: "🔴",

                clase: "estado-falta"

            };


        default:

            return {

                nombre:
                    estado
                    ? estado
                    : "Sin registro",

                icono: "⚪",

                clase: ""

            };

    }

}


/* =================================================
   FORMATEAR FECHA
================================================= */

function formatearFecha(fecha) {

    if (!fecha) {

        return "—";

    }


    const partes =
        String(fecha)
        .split("-");


    if (
        partes.length === 3
    ) {

        const anio =
            Number(partes[0]);

        const mes =
            Number(partes[1]) - 1;

        const dia =
            Number(partes[2]);


        /*
         * Se crea la fecha usando los valores
         * locales para evitar problemas de zona horaria.
         */

        const fechaLocal =
            new Date(
                anio,
                mes,
                dia
            );


        const diasSemana = [

            "Domingo",
            "Lunes",
            "Martes",
            "Miércoles",
            "Jueves",
            "Viernes",
            "Sábado"

        ];


        const nombreDia =
            diasSemana[
                fechaLocal.getDay()
            ];


        return `${nombreDia}, ${String(dia).padStart(2, "0")}/${String(mes + 1).padStart(2, "0")}/${anio}`;

    }


    return fecha;

}


/* =================================================
   CONVERTIR NOTA
================================================= */

function convertirNota(nota) {

    if (

        nota === null ||

        nota === undefined ||

        nota === ""

    ) {

        return null;

    }


    const numero =
        Number(nota);


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =================================================
   REDONDEAR NOTA
================================================= */

function redondearNota(nota) {

    const numero =
        convertirNota(nota);


    if (
        numero === null
    ) {

        return null;

    }


    return Math.round(numero);

}


/* =================================================
   ESCAPAR HTML
================================================= */

function escapeHTML(texto) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



function abrirFotoActividadConsulta(url) {
    if (!url) return;
    let visor = document.getElementById("visorFotoActividadConsulta");
    if (!visor) {
        visor = document.createElement("div");
        visor.id = "visorFotoActividadConsulta";
        visor.className = "oculto";
        visor.innerHTML = `<button type="button" class="cerrar-visor-foto" aria-label="Cerrar fotografía" onclick="cerrarFotoActividadConsulta()">×</button><img alt="Fotografía de la actividad">`;
        visor.addEventListener("click", e => { if (e.target === visor) cerrarFotoActividadConsulta(); });
        document.body.appendChild(visor);
    }
    visor.querySelector("img").src = url;
    visor.classList.remove("oculto");
}
function cerrarFotoActividadConsulta() {
    const visor = document.getElementById("visorFotoActividadConsulta");
    if (visor) visor.classList.add("oculto");
}
