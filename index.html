/* Reacciones del gatito al explorar la página */
#gatoInteractivo.gracioso #gatoCuerpo { animation: gatoBroma .75s ease-in-out; }
#gatoInteractivo.saltando #gatoCuerpo { animation: gatoSalto .65s ease-in-out; }
#gatoInteractivo.asustado #gatoCuerpo { animation: gatoTemblor .5s ease-in-out; }
@keyframes gatoBroma {
    0%,100% { transform: rotate(0) scale(1); }
    25% { transform: rotate(-15deg) scale(1.12); }
    50% { transform: rotate(15deg) scale(1.12); }
    75% { transform: rotate(-8deg) scale(1.06); }
}
@keyframes gatoSalto {
    0%,100% { transform: translateY(0) scale(1); }
    45% { transform: translateY(-18px) scale(1.12); }
    70% { transform: translateY(0) scale(.96); }
}
@keyframes gatoTemblor {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
}

/* =================================================
   GATITO INTERACTIVO
================================================= */
#gatoInteractivo {
    position: fixed;
    left: 18px;
    bottom: 18px;

    height: 76px;

@media(max-width:500px) {

<div class="contenedor">


    <div class="institucion">

    </div>


    <h1>

    </h1>


    <div class="profesor">

        Prof. Javier Delmo Hacosta Moralez

    </div>


    <div class="subtitulo">

        Consulta tu calificación

    </div>


    <label for="ci">

        CI

    </label>


    <input
        type="text"
        id="ci"
        placeholder="Ejemplo: 1234567"
    >


    <label for="fecha_nacimiento">

        Fecha de nacimiento

    </label>


    <input
        type="date"
        id="fecha_nacimiento"
    >


    <button onclick="consultarNota()">

        Consultar mi nota

    </button>


    <div id="resultado"></div>


</div>


<script>


/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =

"https://tecphbbkkmlgahjddcep.supabase.co";


const SUPABASE_KEY =

"sb_publishable_jescZ3lb8XHHuDGuDeh82A_X8UvMinP";


let alumnoActual = null;


/* =================================================
   FECHAS DEL 3ER TRIMESTRE
================================================= */

const INICIO_3T = "2026-08-01";

const FIN_3T = "2026-12-31";


/* =================================================
   CONTROL DE CONSULTAS REPETIDAS
================================================= */
let temporizadorVisita = null;

function iniciarCuentaRegresivaVisita(segundos) {

    if (temporizadorVisita) {
        clearInterval(temporizadorVisita);
        temporizadorVisita = null;
    }

    const boton = document.querySelector('button[onclick="consultarNota()"]');
    if (!boton || segundos <= 0) return;

    const textoOriginal = "Consultar mi nota";

    const actualizar = () => {

        if (segundos <= 0) {
            clearInterval(temporizadorVisita);
            temporizadorVisita = null;
            boton.disabled = false;
            boton.style.opacity = "1";
            boton.style.cursor = "pointer";
            boton.textContent = textoOriginal;
            return;
        }

        const horas = Math.floor(segundos / 3600);
        const minutos = Math.floor((segundos % 3600) / 60);
        const seg = segundos % 60;

        let tiempo;

        if (horas > 0) {
            tiempo = `${horas} h ${minutos} min ${String(seg).padStart(2, "0")} s`;
        } else {
            tiempo = `${minutos} min ${String(seg).padStart(2, "0")} s`;
        }

        boton.disabled = true;
        boton.style.opacity = "0.65";
        boton.style.cursor = "not-allowed";
        boton.textContent = `Podrás consultar nuevamente en ${tiempo}`;
        segundos--;

    };

    actualizar();
    temporizadorVisita = setInterval(actualizar, 1000);
}

/* =================================================
   CONSULTAR
================================================= */

async function consultarNota() {

    const ci =
        document.getElementById("ci")
        .value
        .trim();

    const fecha =
        document.getElementById(
            "fecha_nacimiento"
        ).value;

    const resultado =
        document.getElementById(
            "resultado"
        );

    if (!ci || !fecha) {

        resultado.innerHTML =
            '<p class="error">' +
            'Ingresa tu CI y fecha de nacimiento.' +
            '</p>';

        return;
    }

    resultado.innerHTML =
        '<p class="cargando">Buscando...</p>';

    try {

        const respuesta = await fetch(

            `${SUPABASE_URL}/rest/v1/matematica?` +

            `ci=eq.${encodeURIComponent(ci)}` +

            `&fecha_nacimiento=eq.${encodeURIComponent(fecha)}` +

            `&select=id,nombre,curso,ci,fecha_nacimiento,nota_1t,nota_2t`,

            {

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`

                }

            }

        );


        if (!respuesta.ok) {

            throw new Error(
                "Error de conexión"
            );

        }


        const datos =
            await respuesta.json();


        if (datos.length === 0) {

            resultado.innerHTML =
                '<p class="error">' +
                'CI o fecha de nacimiento incorrectos.' +
                '</p>';

            return;
        }


        alumnoActual =
            datos[0];


        /* =================================================
           EVITAR CONSULTAS REPETIDAS DURANTE 60 MINUTOS
        ================================================= */
        const CLAVE_BLOQUEO_VISITA =
            `ultima_consulta_nota_${alumnoActual.id}`;
        const DURACION_BLOQUEO_VISITA = 60 * 60 * 1000;
        const ultimaConsulta =
            Number(localStorage.getItem(CLAVE_BLOQUEO_VISITA) || 0);
        const tiempoTranscurrido = Date.now() - ultimaConsulta;

        if (ultimaConsulta && tiempoTranscurrido < DURACION_BLOQUEO_VISITA) {
            iniciarCuentaRegresivaVisita(
                Math.ceil((DURACION_BLOQUEO_VISITA - tiempoTranscurrido) / 1000)
            );
            mostrarResultado(alumnoActual);
            return;
        }

        localStorage.setItem(
            CLAVE_BLOQUEO_VISITA,
            String(Date.now())
        );

        iniciarCuentaRegresivaVisita(60 * 60);


        /* =================================================
           REGISTRAR VISITA DEL ESTUDIANTE
        ================================================= */

        try {

            const respuestaVisita = await fetch(

                `${SUPABASE_URL}/rest/v1/rpc/registrar_visita_estudiante`,

                {

                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`,

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        p_estudiante_id:
                            alumnoActual.id

                    })

                }

            );


        }

        catch (error) {

            console.error(
                "No se pudo registrar la visita:",
                error
            );

        }


        mostrarResultado(
            alumnoActual
        );

    }


    catch(error) {

        console.error(error);

/* =================================================
   CALCULAR NOTA DEL 3ER TRIMESTRE Y ANUAL EN HTML
================================================= */

/*
 * La BD solamente identifica al estudiante y entrega 1T y 2T.
 * El 3T se obtiene de las actividades del 3er trimestre y sus
 * calificaciones. Se conserva la lógica que ya usa el detalle:
 * promedio de las notas registradas de cada categoría y suma de
 * las cuatro categorías (SER + SABER + HACER + AUTOEVALUACIÓN).
 */
async function calcularNota3T(alumno) {

    if (!alumno || !alumno.id || !alumno.curso) {
        return null;
    }

    try {
        const respuestaActividades = await fetch(
            `${SUPABASE_URL}/rest/v1/actividades?` +
            `curso=eq.${encodeURIComponent(alumno.curso)}` +
            `&trimestre=eq.3` +
            `&select=id,categoria,puntaje_maximo` +
            `&order=orden`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        if (!respuestaActividades.ok) {
            throw new Error("No se pudieron cargar las actividades del 3er trimestre");
        }

        const actividades = await respuestaActividades.json();
        if (!actividades.length) return null;

        const ids = actividades.map(a => a.id);

        const respuestaNotas = await fetch(
            `${SUPABASE_URL}/rest/v1/calificaciones?` +
            `estudiante_id=eq.${alumno.id}` +
            `&actividad_id=in.(${ids.join(",")})` +
            `&select=actividad_id,nota`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        if (!respuestaNotas.ok) {
            throw new Error("No se pudieron cargar las calificaciones del 3er trimestre");
        }

        const calificaciones = await respuestaNotas.json();
        const mapa = {};
        calificaciones.forEach(c => { mapa[c.actividad_id] = c.nota; });

        const categorias = ["SER", "SABER", "HACER", "AUTOEVALUACION"];
        let nota3 = 0;
        let hayNotas = false;

        categorias.forEach(codigo => {
            const lista = actividades.filter(a => a.categoria === codigo);
            let suma = 0;
            let cantidad = 0;

            lista.forEach(actividad => {
                const nota = mapa[actividad.id];
                if (nota !== null && nota !== undefined && nota !== "") {
                    const numero = Number(nota);
                    if (!isNaN(numero)) {
                        suma += numero;
                        cantidad++;
                    }
                }
            });

            if (cantidad > 0) {
                nota3 += suma / cantidad;
                hayNotas = true;
            }
        });

        return hayNotas ? Math.round(nota3) : null;

    } catch (error) {
        console.error("No se pudo calcular la nota del 3er trimestre en HTML:", error);
        return null;
    }
}

function calcularNotaAnual(nota1, nota2, nota3) {
    const notas = [nota1, nota2, nota3]
        .filter(n => n !== null && n !== undefined && !isNaN(Number(n)))
        .map(Number);

    if (!notas.length) return null;

    return Math.round(
        notas.reduce((suma, nota) => suma + nota, 0) / notas.length
    );
}

async function mostrarAsistenciaEnDetalle() {

    const contenedor =
        document.getElementById(
            "detalle3T"
        );


    if (!contenedor) {

        return;

    }


    try {

        const respuesta =
            await fetch(

                `${SUPABASE_URL}/rest/v1/asistencia?` +

                `estudiante_id=eq.${alumnoActual.id}` +

                `&fecha=gte.${INICIO_3T}` +

                `&fecha=lte.${FIN_3T}` +

                `&select=id,fecha,estado,observacion` +

                `&order=fecha.desc`,

                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        if (!respuesta.ok) {

            throw new Error(
                "Error asistencia"
            );

        }


        const asistencias =
            await respuesta.json();

        // También se consultan los días en los que no se pasó clases.
        // Estos registros no pertenecen a la tabla "asistencia", por eso
        // se cargan desde "asistencia_tipos_dia".
        const respuestaTiposDia = await fetch(
            `${SUPABASE_URL}/rest/v1/asistencia_tipos_dia?` +
            `curso=eq.${encodeURIComponent(alumnoActual.curso || "")}` +
            `&fecha=gte.${INICIO_3T}` +
            `&fecha=lte.${FIN_3T}` +
            `&tipo=in.(no_clases,clase_informal)` +
            `&select=fecha,tipo,motivo` +
            `&order=fecha.desc`,
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${SUPABASE_KEY}`
                }
            }
        );

        if (!respuestaTiposDia.ok) {
            throw new Error("Error al consultar los días sin clases");
        }

        const diasNoClases =
            await respuestaTiposDia.json();


        let presentes = 0;

        let atrasos = 0;

        let licencias = 0;

        let faltas = 0;


        asistencias.forEach(
            asistencia => {

                // La asistencia de una clase informal se muestra, pero no se cuenta.
                const esClaseInformal = diasNoClases.some(
                    dia => String(dia.fecha) === String(asistencia.fecha) &&
                           String(dia.tipo || '').toLowerCase() === 'clase_informal'
                );
                if (esClaseInformal) return;

                const estado =
                    normalizarEstado(
                        asistencia.estado
                    );


                if (
                    estado === "asistio"
                ) {

                    presentes++;

                }

                else if (
                    estado === "atraso"
                ) {

                    atrasos++;

                }

                else if (
                    estado === "licencia"
                ) {

                    licencias++;

                }

                else if (
                    estado === "falta"
                ) {

                    faltas++;

                }

            }
        );


        /*
         * Unir asistencia normal + días especiales y ordenar TODO por fecha.
         * Así "Clase informal" y "No se pasó clases" aparecen en su lugar
         * cronológico correspondiente.
         */
        const registrosAsistencia = [
            ...asistencias.map(asistencia => ({
                fecha: asistencia.fecha,
                tipoRegistro: "asistencia",
                datos: asistencia
            })),
            ...diasNoClases.map(dia => ({
                fecha: dia.fecha,
                tipoRegistro: String(dia.tipo || "").toLowerCase(),
                datos: dia
            }))
        ].sort((a, b) => {
            const comparacion =
                String(a.fecha || "").localeCompare(String(b.fecha || ""));

            if (comparacion !== 0) return comparacion;

            // Si dos registros tienen la misma fecha, la asistencia
            // normal aparece primero.
            if (a.tipoRegistro === "asistencia" && b.tipoRegistro !== "asistencia") return -1;
            if (a.tipoRegistro !== "asistencia" && b.tipoRegistro === "asistencia") return 1;

            return 0;
        });


        let filas = "";


        registrosAsistencia.forEach(registro => {

            if (registro.tipoRegistro === "asistencia") {

                const asistencia = registro.datos;

                const estado =
                    normalizarEstado(
                        asistencia.estado
                    );

                const informacion =
                    obtenerEstadoAsistencia(
                        estado
                    );

                const claseInformalMismaFecha = diasNoClases.find(
                    dia => String(dia.tipo || "").toLowerCase() === "clase_informal" &&
                           String(dia.fecha || "") === String(asistencia.fecha || "")
                );

                const observacion =
                    asistencia.observacion
                    ? escapeHTML(asistencia.observacion)
                    : (claseInformalMismaFecha?.motivo
                        ? `<strong>Motivo:</strong> ${escapeHTML(String(claseInformalMismaFecha.motivo).trim())}`
                        : "—");


                filas += `

                    <tr>

                        <td>

                            ${formatearFecha(
                                asistencia.fecha
                            )}

                        </td>


                        <td>

                            <span class="
                                estado-asistencia
                                ${informacion.clase}
                            ">

                                ${informacion.icono}

                                ${informacion.nombre}

                            </span>
                            ${claseInformalMismaFecha
                                ? `<div class="estado-clase-informal" style="margin-top:5px;">ℹ️ Clase informal</div>`
                                : ""}

                        </td>


                        <td class="observacion">

                            ${observacion}

                        </td>

                    </tr>

                `;

                return;
            }


            const dia = registro.datos;

            const esClaseInformal =
                registro.tipoRegistro === "clase_informal";

            const motivo =
                dia.motivo && String(dia.motivo).trim()
                ? escapeHTML(String(dia.motivo).trim())
                : "";


            if (esClaseInformal) {

                const tieneAsistenciaMismaFecha = asistencias.some(
                    asistencia => String(asistencia.fecha || "") === String(dia.fecha || "")
                );

                if (tieneAsistenciaMismaFecha) {
                    return;
                }

                filas += `

                    <tr class="dia-clase-informal">

                        <td>

                            ${formatearFecha(
                                dia.fecha
                            )}

                        </td>


                        <td>

                            <span class="estado-clase-informal">

                                ℹ️ Clase informal

                            </span>

                        </td>


                        <td class="observacion motivo-clase-informal-detalle">

                            ${motivo
                                ? `<strong>Motivo:</strong> ${motivo}`
                                : "Clase informal registrada."
                            }

                        </td>

                    </tr>

                `;

                return;
            }


            const motivoNoClases =
                motivo || "No se registró el motivo.";


            filas += `

                <tr class="dia-no-clases">

                    <td>

                        ${formatearFecha(
                            dia.fecha
                        )}

                    </td>


                    <td>

                        <span class="estado-no-clases">

                            🚫 No se pasó clases

                        </span>

                    </td>


                    <td class="observacion motivo-no-clases-detalle">

                        <strong>Motivo:</strong> ${motivoNoClases}

                    </td>

                </tr>

            `;

        });


        // Se muestra la tabla si existe asistencia normal o algún día sin clases.
        const hayRegistrosAsistencia =
            asistencias.length > 0 ||
            diasNoClases.length > 0;


        let contenidoTabla = "";


        if (!hayRegistrosAsistencia) {

            contenidoTabla = `

                <div class="asistencia-vacia">

                    Todavía no hay registros
                    de asistencia.

                </div>

            `;

        }

        else {

            contenidoTabla = `

                <div class="tabla-asistencia-contenedor">

                    <table class="tabla-asistencia">

                        <thead>

                            <tr>

                                <th>

                                    📅 Fecha

                                </th>

                                <th>

                                    Estado

                                </th>

                                <th>

                                    Observación

                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            ${filas}

                        </tbody>

                    </table>

                </div>

            `;

        }


        const asistenciaHTML = `

            <div class="asistencia-box">


                <div class="asistencia-titulo">

                    🗓️ Asistencia del 3er Trimestre

                </div>


                <div class="asistencia-descripcion">

                    Resumen de tu asistencia
                    durante el tercer trimestre.

                </div>


                <div class="asistencia-resumen">


                    <div class="asistencia-card">

                        <span class="icono">

                            🟢

                        </span>


                        <span class="
                            cantidad
                            asistencia-presente
                        ">

                            ${presentes}

                        </span>


                        <span class="texto">

                            ASISTENCIAS

                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">

                            🟡

                        </span>


                        <span class="
                            cantidad
                            asistencia-atraso
                        ">

                            ${atrasos}

                        </span>


                        <span class="texto">

                            ATRASOS

                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">

                            🔵

                        </span>


                        <span class="
                            cantidad
                            asistencia-licencia
                        ">

                            ${licencias}

                        </span>


                        <span class="texto">

                            CON LICENCIA

                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">

                            🔴

                        </span>


                        <span class="
                            cantidad
                            asistencia-falta
                        ">

                            ${faltas}

                        </span>


                        <span class="texto">

                            SIN LICENCIA

                        </span>

                    </div>


                </div>


                <button
                    type="button"
                    class="boton-asistencia"
                    onclick="alternarDetalleAsistencia(this)"
                >

                    − Ocultar detalle de asistencia

                </button>


                <div
                    class="detalle-asistencia"
                    id="tablaDetalleAsistencia"
                    style="display:block"
                >

                    ${contenidoTabla}

                </div>


            </div>

        `;


        contenedor.insertAdjacentHTML(
            "beforeend",
            asistenciaHTML
        );

    }


    catch(error) {

        console.error(error);


        const asistenciaError = `

            <div class="asistencia-box">


                <div class="asistencia-titulo">

                    🗓️ Asistencia del 3er Trimestre

                </div>


                <div class="asistencia-resumen">


                    <div class="asistencia-card">

                        <span class="icono">🟢</span>

                        <span class="
                            cantidad
                            asistencia-presente
                        ">0</span>

                        <span class="texto">
                            ASISTENCIAS
                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">🟡</span>

                        <span class="
                            cantidad
                            asistencia-atraso
                        ">0</span>

                        <span class="texto">
                            ATRASOS
                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">🔵</span>

                        <span class="
                            cantidad
                            asistencia-licencia
                        ">0</span>

                        <span class="texto">
                            CON LICENCIA
                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">🔴</span>

                        <span class="
                            cantidad
                            asistencia-falta
                        ">0</span>

                        <span class="texto">
                            SIN LICENCIA
                        </span>

                    </div>


                </div>


                <div class="asistencia-vacia">

                    No se pudo cargar el detalle
                    de asistencia.

                </div>

            </div>

        `;


        contenedor.insertAdjacentHTML(
            "beforeend",
            asistenciaError
        );

    }

}


/* =================================================
   MOSTRAR / OCULTAR TABLA ASISTENCIA
================================================= */

function alternarDetalleAsistencia(boton) {

    const tabla =
        document.getElementById(
            "tablaDetalleAsistencia"
        );


    if (!tabla) {

        return;

    }


    if (
        tabla.style.display ===
        "block"
    ) {

        tabla.style.display =
            "none";


        boton.innerHTML =
            "＋ Ver detalle de asistencia";

    }

    else {

        tabla.style.display =
            "block";


        boton.innerHTML =
            "− Ocultar detalle de asistencia";

    }

}


/* =================================================
   NORMALIZAR ESTADO
================================================= */

function normalizarEstado(estado) {

    if (
        estado === null ||
        estado === undefined
    ) {

        return "";

    }


    return String(estado)

        .trim()

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =================================================
   ESTADOS DE ASISTENCIA
================================================= */

function obtenerEstadoAsistencia(estado) {

    switch (estado) {

        case "asistio":

            return {

                nombre: "Asistencia",

                icono: "🟢",

                clase: "estado-presente"

            };


        case "atraso":

            return {

                nombre: "Atraso",

                icono: "🟡",

                clase: "estado-atraso"

            };


        case "licencia":

            return {

                nombre: "Falta con licencia",

                icono: "🔵",

                clase: "estado-licencia"

            };


        case "falta":

            return {

                nombre: "Falta sin licencia",

                icono: "🔴",

                clase: "estado-falta"

            };


        default:

            return {

                nombre:
                    estado
                    ? estado
                    : "Sin registro",

                icono: "⚪",

                clase: ""

            };

    }

}


/* =================================================
   FORMATEAR FECHA
================================================= */

function formatearFecha(fecha) {

    if (!fecha) {

        return "—";

    }


    const partes =
        String(fecha)
        .split("-");


    if (
        partes.length === 3
    ) {

        const anio =
            Number(partes[0]);

        const mes =
            Number(partes[1]) - 1;

        const dia =
            Number(partes[2]);


        /*
         * Se crea la fecha usando los valores
         * locales para evitar problemas de zona horaria.
         */

        const fechaLocal =
            new Date(
                anio,
                mes,
                dia
            );


        const diasSemana = [

            "Domingo",
            "Lunes",
            "Martes",
            "Miércoles",
            "Jueves",
            "Viernes",
            "Sábado"

        ];


        const nombreDia =
            diasSemana[
                fechaLocal.getDay()
            ];


        return `${nombreDia}, ${String(dia).padStart(2, "0")}/${String(mes + 1).padStart(2, "0")}/${anio}`;

    }


    return fecha;

}


/* =================================================
   CONVERTIR NOTA
================================================= */

function convertirNota(nota) {

    if (

        nota === null ||

        nota === undefined ||

        nota === ""

    ) {

        return null;

    }


    const numero =
        Number(nota);


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =================================================
   REDONDEAR NOTA
================================================= */

function redondearNota(nota) {

    const numero =
        convertirNota(nota);


    if (
        numero === null
    ) {

        return null;

    }


    return Math.round(numero);

}


/* =================================================
   ESCAPAR HTML
================================================= */

function escapeHTML(texto) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =================================================

const parametros =

<!-- Gatito interactivo: elemento independiente del sistema de notas -->
<div id="gatoInteractivo" aria-label="Gatito interactivo" title="Acaríciame 🐾">
    <div id="gatoMensaje"></div>
    <div id="gatoCorazones">💗</div>
    <div id="gatoCuerpo">🐱</div>
</div>

<script>
/* =================================================
   GATITO INTERACTIVO - NO INTERFIERE CON LAS NOTAS
================================================= */
(function () {
    const gato = document.getElementById('gatoInteractivo');
    const cuerpo = document.getElementById('gatoCuerpo');
    const mensaje = document.getElementById('gatoMensaje');
    if (!gato || !cuerpo) return;

    let arrastrando = false, desplazado = false, inicioX = 0, inicioY = 0, baseX = 0, baseY = 0;
    let mensajeTimer = null;

    function decir(texto, tiempo = 1800) {
        mensaje.textContent = texto;
        gato.classList.add('mensaje');
        clearTimeout(mensajeTimer);
        mensajeTimer = setTimeout(() => gato.classList.remove('mensaje'), tiempo);
    }

    function acariciar() {
        gato.classList.remove('caricia');
        void gato.offsetWidth;
        gato.classList.add('caricia');
        gato.classList.add('mirando');
        decir('¡Miau! 🐾');
        setTimeout(() => gato.classList.remove('caricia'), 1000);
    }

    gato.addEventListener('pointerdown', e => {
        arrastrando = true;
        desplazado = false;
        inicioX = e.clientX; inicioY = e.clientY;
        const r = gato.getBoundingClientRect();
        baseX = r.left; baseY = r.top;
        gato.setPointerCapture?.(e.pointerId);
    });

    gato.addEventListener('pointermove', e => {
        if (!arrastrando) return;
        const dx = e.clientX - inicioX, dy = e.clientY - inicioY;
        if (Math.abs(dx) + Math.abs(dy) > 6) desplazado = true;
        gato.style.left = Math.max(4, Math.min(window.innerWidth - gato.offsetWidth - 4, baseX + dx)) + 'px';
        gato.style.top = Math.max(4, Math.min(window.innerHeight - gato.offsetHeight - 4, baseY + dy)) + 'px';
        gato.style.bottom = 'auto';
    });

    gato.addEventListener('pointerup', e => {
        arrastrando = false;
        if (!desplazado) acariciar();
        gato.releasePointerCapture?.(e.pointerId);
    });

    gato.addEventListener('dblclick', () => {
        decir(`¡${nombreEstudiante()}! ¿Otra vez me acaricias? 😹`, 2200);
        gato.classList.add('sorprendido');
        setTimeout(() => gato.classList.remove('sorprendido'), 700);
    });

    /* Detecta qué hay debajo del gatito cuando el estudiante lo coloca encima. */
    let ultimoObjetivo = '';
    let ultimaReaccionObjetivo = 0;

    function nombreEstudiante() {
        try {
            const nombre = window.alumnoActual && window.alumnoActual.nombre
                ? String(window.alumnoActual.nombre).trim()
                : '';
            if (nombre) return nombre.split(/\s+/)[0];
        } catch (e) {}
        return 'estudiante';
    }

    function elementoDebajoDelGato() {
        const r = gato.getBoundingClientRect();
        const x = r.left + r.width / 2;
        const y = r.top + r.height / 2;
        const elementos = document.elementsFromPoint ? document.elementsFromPoint(x, y) : [];
        return elementos.find(el => el !== gato && !gato.contains(el) && el !== document.body && el !== document.documentElement);
    }

    /* El gatito identifica lo que tiene detrás y, cuando hay Internet,
       busca una curiosidad real relacionada para convertirla en un comentario divertido. */
    let ultimaConsultaInternet = '';
    let ultimaConsultaInternetTiempo = 0;

    function limpiarTema(texto) {
        return (texto || '')
            .replace(/\s+/g, ' ')
            .replace(/https?:\/\/\S+/gi, '')
            .replace(/[^\p{L}\p{N}\sÁÉÍÓÚÜÑáéíóúüñ%°.,:;()\-]/gu, ' ')
            .trim()
            .slice(0, 120);
    }

    function obtenerTemaVisible(texto) {
        const t = limpiarTema(texto);
        const lineas = (texto || '').split(/\n+/).map(l => limpiarTema(l)).filter(Boolean);
        const candidatas = lineas.filter(l =>
            l.length >= 4 && l.length <= 90 &&
            !/^(consultar tus datos|cerrar sesión|buscar|cargando|resultado|asistencia|calificaciones?)$/i.test(l)
        );
        return candidatas.sort((a,b) => {
            const pa = /examen|actividad|tema|trimestre|matemática|matemáticas|ecuaci[oó]n|fracci[oó]n|geometr[ií]a|funci[oó]n|nota|promedio|asistencia/i.test(a) ? 1 : 0;
            const pb = /examen|actividad|tema|trimestre|matemática|matemáticas|ecuaci[oó]n|fracci[oó]n|geometr[ií]a|funci[oó]n|nota|promedio|asistencia/i.test(b) ? 1 : 0;
            return pb-pa || a.length-b.length;
        })[0] || t.slice(0, 90);
    }

    async function curiosidadDeInternet(tema) {
        const ahora = Date.now();
        const clave = tema.toLowerCase();
        if (clave === ultimaConsultaInternet && ahora - ultimaConsultaInternetTiempo < 45000) return null;
        ultimaConsultaInternet = clave;
        ultimaConsultaInternetTiempo = ahora;
        try {
            const url = 'https://es.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=' +
                encodeURIComponent(tema) + '&gsrnamespace=0&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&format=json&origin=*';
            const r = await fetch(url, { method: 'GET', cache: 'no-store' });
            if (!r.ok) return null;
            const data = await r.json();
            const pages = data && data.query && data.query.pages ? Object.values(data.query.pages) : [];
            const page = pages[0];
            if (!page) return null;
            const extracto = String(page.extract || '').replace(/\s+/g, ' ').trim();
            if (!extracto) return null;
            const frase = extracto.split(/(?<=[.!?])\s+/)[0].slice(0, 180);
            return { titulo: page.title || tema, frase };
        } catch (e) {
            return null;
        }
    }

    async function reaccionarSobre(texto) {
        const t = (texto || '').replace(/\s+/g, ' ').trim();
        if (!t) return;
        const clave = t.toLowerCase().slice(0, 220);
        const ahora = Date.now();
        if (clave === ultimoObjetivo && ahora - ultimaReaccionObjetivo < 9000) return;
        ultimoObjetivo = clave;
        ultimaReaccionObjetivo = ahora;

        const nombre = nombreEstudiante();
        const tema = obtenerTemaVisible(texto);
        let respuesta = '';
        let gesto = 'mirando';

        if (/asistencia|faltas|inasistencia|presen(te|cia)/i.test(t)) {
            respuesta = `¡${nombre}, aquí hay asistencia! Yo cuento presentes… pero no me hagas contar faltas. 😹`;
            gesto = 'mirando';
        } else if (/nota|calificaci[oó]n|promedio|trimestre|anual|puntos|ser|saber|hacer|autoevaluaci[oó]n|examen|actividad/i.test(t)) {
            respuesta = `¡${nombre}! Detecté “${tema}”. 🧐 Déjame investigar una curiosidad…`;
            gesto = Math.random() < .5 ? 'mirando' : 'saltando';
        } else {
            respuesta = `¡${nombre}! Creo que detrás de mí hay “${tema}”. 🐾 ¿Qué será?`;
            gesto = 'mirando';
        }

        cuerpo.textContent = '🐱';
        gato.classList.remove('mirando', 'saltando', 'gracioso', 'sorprendido');
        void gato.offsetWidth;
        gato.classList.add(gesto);
        decir(respuesta, 3000);

        // La consulta es opcional: si no hay Internet, el gatito sigue funcionando normalmente.
        if (tema && tema.length >= 4) {
            const dato = await curiosidadDeInternet(tema);
            if (dato && !arrastrando) {
                const bromas = [
                    `¡${nombre}! Encontré algo sobre “${dato.titulo}”: ${dato.frase} 😹 ¡Yo solo quería mirar tus notas y terminé estudiando también!`,
                    `Dato curioso para ${nombre}: “${dato.titulo}” — ${dato.frase} 🐱 Ahora entiendo por qué esto merece una pausa de gatito.`,
                    `¡Atención, ${nombre}! Internet dice sobre “${dato.titulo}”: ${dato.frase} 🤓 Yo digo que eso suena a pregunta de examen. ¡Miau!`,
                    `Investigación gatuna completada, ${nombre}: ${dato.frase} 🐾 ¿Quién dijo que estudiar no podía ser divertido?`,
                    `¡${nombre}! Vine a vigilar “${dato.titulo}” y descubrí esto: ${dato.frase} 😹 Definitivamente los humanos complican mucho las cosas.`
                ];
                decir(bromas[Math.floor(Math.random() * bromas.length)], 6200);
                gato.classList.remove('mirando', 'saltando', 'gracioso');
                gato.classList.add(Math.random() < .5 ? 'gracioso' : 'saltando');
                setTimeout(() => gato.classList.remove('mirando', 'saltando', 'gracioso'), 1400);
            }
        }
    }

    function revisarDebajoDelGato() {
        if (arrastrando) return;
        const el = elementoDebajoDelGato();
        if (!el) return;
        const texto = el.innerText || el.textContent || '';
        reaccionarSobre(texto);
    }

    function hacerBroma() {
        if (arrastrando || document.hidden) return;
        const nombre = nombreEstudiante();
        const bromas = [
            `¡${nombre}! Estoy revisando… pero creo que me distraje con una mariposa. 🐾`,
            `Pss, ${nombre}… ¿estudiamos un poquito más? 😸`,
            `¡Miau, ${nombre}! Solo estaba haciendo una inspección sorpresa. 😂`,
            `${nombre}, oficialmente declaro que necesitas seguir intentándolo. ¡Yo te acompaño! 💪`,
            `¡Ey, ${nombre}! ¡Mírame! 👀🐾 …Bueno, ya puedes seguir estudiando. 😹`,
            `Zzz… ${nombre}, ¡era una mini siesta académica! 💤`,
            `${nombre}, estoy vigilando esas notas con mucha atención. 👀🐾`,
            `¡Miau! ${nombre}, recuerda: un pequeño avance sigue siendo un avance. 🌟`
        ];
        const b = bromas[Math.floor(Math.random() * bromas.length)];
        cuerpo.textContent = '🐱';
        gato.classList.remove('gracioso', 'saltando', 'sorprendido', 'mirando');
        void gato.offsetWidth;
        gato.classList.add(Math.random() < .55 ? 'gracioso' : 'saltando');
        decir(b, 2800);
        setTimeout(() => {
            gato.classList.remove('gracioso', 'saltando', 'sorprendido', 'mirando');
            cuerpo.textContent = '🐱';
        }, 1000);
    }

    function observarResultado() {
        const resultado = document.getElementById('resultado');
        if (!resultado) return;
        const texto = resultado.innerText || '';
        if (/Buscando|Cargando/i.test(texto)) {
            cuerpo.textContent = '🐱';
            gato.classList.add('mirando');
            decir('Estoy mirando las notas… 👀', 1600);
            return;
        }
        if (/error|incorrectos|Error de conexión/i.test(texto)) {
            cuerpo.textContent = '🐱';
                gato.classList.add('sorprendido');
            decir(`¡Ups, ${nombreEstudiante()}! Vamos a intentarlo de nuevo. 🐾`, 2000);
            return;
        }
        if (texto.trim()) {
            gato.classList.add('mirando');
            const notas = [...texto.matchAll(/(?:nota|calificación|promedio|final)[^0-9]{0,25}(\d{1,2})/gi)].map(m => Number(m[1])).filter(n => n >= 0 && n <= 100);
            if (notas.length && Math.max(...notas) >= 70) {
                cuerpo.textContent = '🐱';
                    decir(`¡Muy bien, ${nombreEstudiante()}! 🎉`, 2200);
            } else {
                cuerpo.textContent = '🐱';
                decir('Estoy mirando tus notas 👀', 2200);
            }
        }
    }

    gato.addEventListener('mouseenter', () => {
        gato.classList.add('mirando');
        if (!arrastrando && Math.random() < .45) {
            decir(`¡Hola, ${nombreEstudiante()}! 👀🐾`, 1800);
        }
    });

    gato.addEventListener('mouseleave', () => {
        if (!arrastrando) gato.classList.remove('mirando');
    });

    const resultado = document.getElementById('resultado');
    if (resultado) new MutationObserver(observarResultado).observe(resultado, {childList:true, subtree:true, characterData:true});

    setInterval(() => {
        revisarDebajoDelGato();
        const r = document.getElementById('resultado');
        const t = r ? (r.innerText || '') : '';
        if (/asistencia/i.test(t)) {
            gato.classList.add('mirando');
            if (Math.random() < .25) decir('También miro la asistencia 👀', 1800);
        }
    }, 1200);

    /* De vez en cuando hace alguna travesura por su cuenta. */
    let proximaBroma = Date.now() + 12000 + Math.random() * 18000;
    setInterval(() => {
        if (Date.now() >= proximaBroma) {
            hacerBroma();
            proximaBroma = Date.now() + 18000 + Math.random() * 30000;
        }
    }, 2000);

    setTimeout(() => decir(`¡Hola, ${nombreEstudiante()}! 🐾`, 2200), 900);
})();
</script>
</body>

</html>
