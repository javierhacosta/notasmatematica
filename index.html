/* =================================================
   DETECTAR DISPOSITIVO
================================================= */

function obtenerDispositivo() {

    if (
        /Mobi|Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
        )
    ) {

        if (
            /iPad|Tablet|Android(?!.*Mobile)/i.test(
                navigator.userAgent
            )
        ) {

            return "Tablet";

        }

        return "Celular";

    }

    return "Computadora";

}


function obtenerNavegador() {

    const ua =
        navigator.userAgent;


    if (
        ua.includes("Edg/")
    ) {

        return "Microsoft Edge";

    }


    if (
        ua.includes("OPR/")
    ) {

        return "Opera";

    }


    if (
        ua.includes("Chrome/")
    ) {

        return "Google Chrome";

    }


    if (
        ua.includes("Firefox/")
    ) {

        return "Mozilla Firefox";

    }


    if (
        ua.includes("Safari/")
    ) {

        return "Safari";

    }


    return "Otro";

}


function obtenerSistemaOperativo() {

    const ua =
        navigator.userAgent;


    if (
        /Windows/i.test(ua)
    ) {

        return "Windows";

    }


    if (
        /Android/i.test(ua)
    ) {

        return "Android";

    }


    if (
        /iPhone|iPad|iPod/i.test(ua)
    ) {

        return "iOS";

    }


    if (
        /Mac OS X/i.test(ua)
    ) {

        return "macOS";

    }


    if (
        /Linux/i.test(ua)
    ) {

        return "Linux";

    }


    return "Otro";

}


/* =================================================
   CONSULTAR
================================================= */

async function consultarNota() {


    const ci =

        document.getElementById("ci")
        .value
        .trim();


    const fecha =

        document.getElementById(
            "fecha_nacimiento"
        ).value;


    const resultado =

        document.getElementById(
            "resultado"
        );


    if (!ci || !fecha) {

        resultado.innerHTML =

            '<p class="error">' +

            'Ingresa tu CI y fecha de nacimiento.' +

            '</p>';

        return;
    }


    resultado.innerHTML =

        '<p class="cargando">Buscando...</p>';


    try {


        const respuesta = await fetch(

            `${SUPABASE_URL}/rest/v1/matematica?` +

            `ci=eq.${encodeURIComponent(ci)}` +

            `&fecha_nacimiento=eq.${encodeURIComponent(fecha)}` +

            `&select=id,nombre,curso,nota_1t,nota_2t,nota_3t,final`,

            {

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${SUPABASE_KEY}`

                }

            }

        );


        if (!respuesta.ok) {

            throw new Error(
                "Error de conexión"
            );

        }


        const datos =
            await respuesta.json();


        if (datos.length === 0) {

            resultado.innerHTML =

                '<p class="error">' +

                'CI o fecha de nacimiento incorrectos.' +

                '</p>';

            return;
        }


        alumnoActual =
            datos[0];


        /* =================================================
           REGISTRAR VISITA DEL ESTUDIANTE
        ================================================= */

        try {

            await fetch(

                `${SUPABASE_URL}/rest/v1/rpc/registrar_visita_estudiante`,

                {

                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`,

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        p_estudiante_id:
                            alumnoActual.id,

                        p_dispositivo:
                            obtenerDispositivo(),

                        p_navegador:
                            obtenerNavegador(),

                        p_sistema_operativo:
                            obtenerSistemaOperativo()

                    })

                }

            );

        }

        catch (error) {

            console.error(
                "No se pudo registrar la visita:",
                error
            );

        }


        mostrarResultado(
            alumnoActual
        );

    }


    catch(error) {

        console.error(error);


        resultado.innerHTML =

            '<p class="error">' +

            'No se pudo conectar con el servidor.' +

            '</p>';

    }

}

        ];


        let html = `

            <div class="detalle">

                <div class="detalle-titulo">

                    📊 ¿Cómo obtuviste tu nota
                    del 3er trimestre?

                </div>


                <p style="
                    text-align:center;
                    color:#666;
                    font-size:14px;
                    line-height:1.5;
                ">

                    Aquí puedes revisar las
                    calificaciones registradas.

                </p>

        `;


        categorias.forEach(
            categoria => {


                const lista =
                    actividades.filter(
                        a =>
                        a.categoria ===
                        categoria.codigo
                    );


                if (
                    lista.length === 0
                ) {

                    return;

                }


                const limite =

                    categoria.codigo === "SER"

                    ? 10

                    : categoria.codigo === "SABER"

                    ? 45

                    : categoria.codigo === "HACER"

                    ? 40

                    : 5;


                let suma = 0;

                let cantidad = 0;


                lista.forEach(
                    actividad => {


                        const registro =
                            mapa[
                                actividad.id
                            ];


                        const nota =
                            registro
                            ? registro.nota
                            : null;


                        if (

                            nota !== null &&

                            nota !== undefined &&

                            nota !== ""

                        ) {


                            const numero =
                                Number(nota);


                            if (
                                !isNaN(numero)
                            ) {

                                suma +=
                                    numero;

                                cantidad++;

                            }

                        }

                    }
                );


                let promedio = 0;


                if (
                    cantidad > 0
                ) {

                    promedio =
                        suma / cantidad;

                }


                const promedioMostrado =

                    cantidad > 0

                    ? Math.round(promedio)

                    : null;


                html += `

                    <div class="categoria">

                        <div class="
                            categoria-titulo
                            ${categoria.clase}
                        ">

                            ${categoria.titulo}

                        </div>

                `;


                lista.forEach(
                    actividad => {


                        const registro =
                            mapa[
                                actividad.id
                            ];


                        const nota =
                            registro
                            ? registro.nota
                            : null;


                        const observacion =

                            registro &&
                            registro.observacion

                            ? escapeHTML(
                                registro.observacion
                            )

                            : "";


                        const valor =

                            nota === null ||

                            nota === undefined ||

                            nota === ""

                            ? "—"

                            : Math.round(
                                Number(nota)
                            );


                        html += `

                            <div class="actividad-fila">

                                <div class="actividad-nombre">

                                    ${escapeHTML(
                                        actividad.nombre
                                    )}

                                    <span class="actividad-fecha">

                                        📅 ${
                                            actividad.fecha
                                            ? formatearFecha(
                                                actividad.fecha
                                            )
                                            : "Sin fecha"
                                        }

                                    </span>

                                </div>


                                <div class="actividad-nota">

                                    <div>

                                        ${valor}

                                        / ${actividad.puntaje_maximo}

                                    </div>


                                    ${
                                        observacion

                                        ? `

                                            <div class="actividad-observacion">

                                                📝 ${observacion}

                                            </div>

                                        `

                                        : ""

                                    }

                                </div>

                            </div>

                        `;

                    }
                );


                html += `

                        <div class="resumen-categoria">

                            <span>

                                Promedio

                            </span>


                            <span class="promedio-valor">

                                ${
                                    promedioMostrado === null

                                    ? "—"

                                    : promedioMostrado
                                }

                                pts

                            </span>

                        </div>


                    </div>

                `;

            }
        );


        const nota3 =
            redondearNota(
                alumnoActual.nota_3t
            );


        html += `

                <div class="resultado-3t">

                    <div class="resultado-3t-titulo">

                        ⭐ Nota del 3er trimestre
                        provisional

                    </div>


                    <div class="resultado-3t-numero">

                        ${
                            nota3 === null

                            ? "—"

                            : nota3
                        }

                    </div>


                    <div style="
                        color:#666;
                        font-size:13px;
                        line-height:1.5;
                    ">

                        Resultado provisional.

                        <br>

                        Las calificaciones pueden modificarse
                        con las próximas actividades y evaluaciones.

                    </div>

                </div>


            </div>

        `;


        contenedor.innerHTML =
            html;


        await mostrarAsistenciaEnDetalle();

    }


    catch(error) {

        console.error(error);


        contenedor.innerHTML = `

            <div class="detalle">

                <p class="error">

                    No se pudo cargar el detalle
                    del tercer trimestre.

                </p>

            </div>

        `;


        await mostrarAsistenciaEnDetalle();

    }

}


/* =================================================
   MOSTRAR ASISTENCIA
================================================= */

async function mostrarAsistenciaEnDetalle() {


    const contenedor =
        document.getElementById(
            "detalle3T"
        );


    if (!contenedor) {

        return;

    }


    try {


        const respuesta =
            await fetch(

                `${SUPABASE_URL}/rest/v1/asistencia?` +

                `estudiante_id=eq.${alumnoActual.id}` +

                `&fecha=gte.${INICIO_3T}` +

                `&fecha=lte.${FIN_3T}` +

                `&select=id,fecha,estado,observacion` +

                `&order=fecha.desc`,

                {

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${SUPABASE_KEY}`

                    }

                }

            );


        if (!respuesta.ok) {

            throw new Error(
                "Error asistencia"
            );

        }


        const asistencias =
            await respuesta.json();


        let presentes = 0;

        let atrasos = 0;

        let licencias = 0;

        let faltas = 0;


        asistencias.forEach(
            asistencia => {


                const estado =
                    normalizarEstado(
                        asistencia.estado
                    );


                if (
                    estado === "asistio"
                ) {

                    presentes++;

                }

                else if (
                    estado === "atraso"
                ) {

                    atrasos++;

                }

                else if (
                    estado === "licencia"
                ) {

                    licencias++;

                }

                else if (
                    estado === "falta"
                ) {

                    faltas++;

                }

            }
        );


        let filas = "";


        asistencias.forEach(
            asistencia => {


                const estado =
                    normalizarEstado(
                        asistencia.estado
                    );


                const informacion =
                    obtenerEstadoAsistencia(
                        estado
                    );


                const observacion =

                    asistencia.observacion

                    ? escapeHTML(
                        asistencia.observacion
                    )

                    : "—";


                filas += `

                    <tr>

                        <td>

                            ${formatearFecha(
                                asistencia.fecha
                            )}

                        </td>


                        <td>

                            <span class="
                                estado-asistencia
                                ${informacion.clase}
                            ">

                                ${informacion.icono}

                                ${informacion.nombre}

                            </span>

                        </td>


                        <td class="observacion">

                            ${observacion}

                        </td>

                    </tr>

                `;

            }
        );


        let contenidoTabla = "";


        if (
            asistencias.length === 0
        ) {

            contenidoTabla = `

                <div class="asistencia-vacia">

                    Todavía no hay registros
                    de asistencia.

                </div>

            `;

        }

        else {

            contenidoTabla = `

                <div class="tabla-asistencia-contenedor">

                    <table class="tabla-asistencia">

                        <thead>

                            <tr>

                                <th>
                                    📅 Fecha
                                </th>

                                <th>
                                    Estado
                                </th>

                                <th>
                                    Observación
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            ${filas}

                        </tbody>

                    </table>

                </div>

            `;

        }


        const asistenciaHTML = `

            <div class="asistencia-box">


                <div class="asistencia-titulo">

                    🗓️ Asistencia del 3er Trimestre

                </div>


                <div class="asistencia-descripcion">

                    Resumen de tu asistencia
                    durante el tercer trimestre.

                </div>


                <div class="asistencia-resumen">


                    <div class="asistencia-card">

                        <span class="icono">

                            🟢

                        </span>


                        <span class="
                            cantidad
                            asistencia-presente
                        ">

                            ${presentes}

                        </span>


                        <span class="texto">

                            ASISTENCIAS

                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">

                            🟡

                        </span>


                        <span class="
                            cantidad
                            asistencia-atraso
                        ">

                            ${atrasos}

                        </span>


                        <span class="texto">

                            ATRASOS

                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">

                            🔵

                        </span>


                        <span class="
                            cantidad
                            asistencia-licencia
                        ">

                            ${licencias}

                        </span>


                        <span class="texto">

                            CON LICENCIA

                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">

                            🔴

                        </span>


                        <span class="
                            cantidad
                            asistencia-falta
                        ">

                            ${faltas}

                        </span>


                        <span class="texto">

                            SIN LICENCIA

                        </span>

                    </div>


                </div>


                <button

                    type="button"

                    class="boton-asistencia"

                    onclick="alternarDetalleAsistencia(this)"

                >

                    − Ocultar detalle de asistencia

                </button>


                <div

                    class="detalle-asistencia"

                    id="tablaDetalleAsistencia"

                    style="display:block"

                >

                    ${contenidoTabla}

                </div>


            </div>

        `;


        contenedor.insertAdjacentHTML(
            "beforeend",
            asistenciaHTML
        );

    }


    catch(error) {

        console.error(error);


        const asistenciaError = `

            <div class="asistencia-box">


                <div class="asistencia-titulo">

                    🗓️ Asistencia del 3er Trimestre

                </div>


                <div class="asistencia-resumen">


                    <div class="asistencia-card">

                        <span class="icono">🟢</span>

                        <span class="
                            cantidad
                            asistencia-presente
                        ">0</span>

                        <span class="texto">
                            ASISTENCIAS
                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">🟡</span>

                        <span class="
                            cantidad
                            asistencia-atraso
                        ">0</span>

                        <span class="texto">
                            ATRASOS
                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">🔵</span>

                        <span class="
                            cantidad
                            asistencia-licencia
                        ">0</span>

                        <span class="texto">
                            CON LICENCIA
                        </span>

                    </div>


                    <div class="asistencia-card">

                        <span class="icono">🔴</span>

                        <span class="
                            cantidad
                            asistencia-falta
                        ">0</span>

                        <span class="texto">
                            SIN LICENCIA
                        </span>

                    </div>


                </div>


                <div class="asistencia-vacia">

                    No se pudo cargar el detalle
                    de asistencia.

                </div>

            </div>

        `;


        contenedor.insertAdjacentHTML(
            "beforeend",
            asistenciaError
        );

    }

}


/* =================================================
   MOSTRAR / OCULTAR TABLA ASISTENCIA
================================================= */

function alternarDetalleAsistencia(boton) {


    const tabla =
        document.getElementById(
            "tablaDetalleAsistencia"
        );


    if (!tabla) {

        return;

    }


    if (
        tabla.style.display ===
        "block"
    ) {

        tabla.style.display =
            "none";


        boton.innerHTML =
            "＋ Ver detalle de asistencia";

    }

    else {

        tabla.style.display =
            "block";


        boton.innerHTML =
            "− Ocultar detalle de asistencia";

    }

}


/* =================================================
   NORMALIZAR ESTADO
================================================= */

function normalizarEstado(estado) {


    if (
        estado === null ||
        estado === undefined
    ) {

        return "";

    }


    return String(estado)

        .trim()

        .toLowerCase()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =================================================
   ESTADOS DE ASISTENCIA
================================================= */

function obtenerEstadoAsistencia(estado) {


    switch (estado) {


        case "asistio":

            return {

                nombre: "Asistencia",

                icono: "🟢",

                clase: "estado-presente"

            };


        case "atraso":

            return {

                nombre: "Atraso",

                icono: "🟡",

                clase: "estado-atraso"

            };


        case "licencia":

            return {

                nombre: "Falta con licencia",

                icono: "🔵",

                clase: "estado-licencia"

            };


        case "falta":

            return {

                nombre: "Falta sin licencia",

                icono: "🔴",

                clase: "estado-falta"

            };


        default:

            return {

                nombre:
                    estado
                    ? estado
                    : "Sin registro",

                icono: "⚪",

                clase: ""

            };

    }

}


/* =================================================
   FORMATEAR FECHA
================================================= */

function formatearFecha(fecha) {


    if (!fecha) {

        return "—";

    }


    const partes =
        String(fecha)
        .split("-");


    if (
        partes.length === 3
    ) {

        return `${partes[2]}/${partes[1]}/${partes[0]}`;

    }


    return fecha;

}


/* =================================================
   CONVERTIR NOTA
================================================= */

function convertirNota(nota) {


    if (

        nota === null ||

        nota === undefined ||

        nota === ""

    ) {

        return null;

    }


    const numero =
        Number(nota);


    if (
        isNaN(numero)
    ) {

        return null;

    }


    return numero;

}


/* =================================================
   REDONDEAR NOTA
================================================= */

function redondearNota(nota) {


    const numero =
        convertirNota(nota);


    if (
        numero === null
    ) {

        return null;

    }


    return Math.round(numero);

}


/* =================================================
   ESCAPAR HTML
================================================= */

function escapeHTML(texto) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// Obtener el CI desde la dirección URL

const parametros =
    new URLSearchParams(
        window.location.search
    );

const ci =
    parametros.get("ci");


if (ci) {

    document.getElementById("ci").value =
        ci;

}
